<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业管理 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.ent-name b { font-weight: 600; }
.ent-name span { display: block; font-size: 12px; color: var(--stp-sub); margin-top: 2px; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.sec-title { font-size: 14px; font-weight: 600; margin: 20px 0 10px; display: flex; align-items: center; justify-content: space-between; }
.sec-title:first-child { margin-top: 0; }
.sec-title::before { content: ""; width: 3px; height: 14px; background: var(--el-color-primary); border-radius: 2px; margin-right: 8px; }
.sec-title > span:first-child { flex: 1; }
.lock-block { border: 1px dashed #c3cad5; border-radius: 6px; padding: 16px; background: repeating-linear-gradient(135deg, #f7f8fa 0 8px, #f1f3f6 8px 16px); display: flex; gap: 14px; align-items: flex-start; }
.lock-block .ic { width: 40px; height: 40px; border-radius: 8px; background: #fff; border: 1px solid var(--stp-border); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #8a94a3; flex-shrink: 0; }
.lock-block h4 { margin: 0 0 4px; font-size: 14px; }
.lock-block p { margin: 0 0 10px; font-size: 13px; color: #5b6778; line-height: 1.7; }
.prog-steps { display: flex; gap: 3px; margin-bottom: 3px; }
.prog-steps i { flex: 1; height: 5px; border-radius: 2px; background: #e4e8ee; }
.prog-steps i.on { background: #18a058; }
.anon-gen { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e0d1fb; background: #faf7ff; border-radius: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" active="enterprises" title="企业管理"
  desc="上游、下游企业的板块准入审核、身份类型认定、画像与上架审核、接入管理、关联企业维护与状态管理。平台人员默认不可查看下游企业上传明细。">
  <template #actions>
    <el-button @click="$demo('企业清单已导出（不含任何上传数据）')"><el-icon><Download /></el-icon>导出企业清单</el-button>
    <el-button type="primary" @click="tab = 'audit'"><el-icon><Stamp /></el-icon>待审核（{{ audits.length }}）</el-button>
  </template>

  <div class="grid c5">
    <stat-card label="下游入驻企业" :value="21386" unit="家" icon="OfficeBuilding"><span>已上架 <b>17,902</b></span></stat-card>
    <div class="stat">
      <div class="label">上架方式分布</div>
      <div class="value num" style="font-size:18px;line-height:1.7">实名 10,384<span class="unit">家</span></div>
      <div class="foot"><span>匿名带编号 <b>6,906</b></span><span>指定钢厂可见 <b>612</b></span><span>不上架 <b>3,484</b></span></div>
    </div>
    <stat-card label="板块状态：暂停 / 退出" :value="486" unit="家暂停" icon="SwitchButton"><span>退出流程中 <b>37</b></span><span>本月已退出 <b>12</b></span></stat-card>
    <stat-card label="上游购买主体" :value="512" unit="家" icon="Coin" tip="同一集团的关联企业归并为一个购买主体，共用一个数据池校验口径"><span>付费 <b>438</b></span><span>涉及法人 <b>1,264</b></span></stat-card>
    <stat-card label="待审核" :value="audits.length" unit="项" icon="Stamp"><span>准入 <b>{{ auditCount('准入审核') }}</b></span><span>身份 <b>{{ auditCount('身份类型认定') }}</b></span><span>画像 <b>{{ auditCount('画像审核') }}</b></span><span>上架 <b>{{ auditCount('上架审核') }}</b></span></stat-card>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- 下游企业 -->
      <el-tab-pane name="dn" label="下游企业">
        <div class="filter-bar">
          <el-input v-model="f.kw" placeholder="企业名称 / 企业编号 / 匿名编号" clearable style="width:240px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <el-select v-model="f.prov" placeholder="所在省份" clearable style="width:120px"><el-option v-for="p in provs" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.listing" placeholder="上架方式" clearable style="width:160px"><el-option v-for="p in listings" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.status" placeholder="板块状态" clearable style="width:110px"><el-option v-for="p in ['正常','暂停','退出']" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.quality" placeholder="质量评级" clearable style="width:110px"><el-option v-for="p in ['A','B','C']" :key="p" :label="p + ' 级'" :value="p" /></el-select>
          <el-select v-model="f.grain" placeholder="上传粒度" clearable style="width:120px"><el-option v-for="p in ['行级','日汇总','混用']" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.price" placeholder="价格上传" clearable style="width:120px"><el-option label="已开启" value="on" /><el-option label="未开启" value="off" /></el-select>
          <el-button @click="resetFilter">重置</el-button>
        </div>
        <el-table :data="pageRows" size="small" border>
          <el-table-column label="企业" min-width="212">
            <template #default="{row}">
              <div class="ent-name"><a href="javascript:;" @click="open(row)"><b>{{ row.name }}</b></a><span>{{ row.id }} · 编号 {{ row.anon }}</span></div>
            </template>
          </el-table-column>
          <el-table-column label="所在地" width="96"><template #default="{row}">{{ row.prov }} · {{ row.city.replace('市','') }}</template></el-table-column>
          <el-table-column label="上架方式" width="124">
            <template #default="{row}"><el-tag size="small" :type="listingType(row.listing)" effect="plain">{{ row.listing }}</el-tag></template>
          </el-table-column>
          <el-table-column label="板块状态" width="76"><template #default="{row}"><span class="dot" :class="row.status === '正常' ? 'ok' : row.status === '暂停' ? 'warn' : 'err'"></span>{{ row.status }}</template></el-table-column>
          <el-table-column label="接入进度" width="100">
            <template #default="{row}">
              <div class="prog-steps"><i v-for="n in 4" :key="n" :class="{on: n <= row.step + 1}"></i></div>
              <span class="small muted">{{ steps[row.step] }}</span>
            </template>
          </el-table-column>
          <el-table-column label="上传粒度" width="72"><template #default="{row}">{{ row.grain }}</template></el-table-column>
          <el-table-column label="价格上传" width="72"><template #default="{row}"><span v-if="priceOn(row)" style="color:#18a058">已开启</span><span v-else class="muted">未开启</span></template></el-table-column>
          <el-table-column label="质量评级" width="72" align="center"><template #default="{row}"><el-tag size="small" :type="row.quality === 'A' ? 'success' : row.quality === 'B' ? 'primary' : 'warning'">{{ row.quality }}</el-tag></template></el-table-column>
          <el-table-column label="关联集团" width="104"><template #default="{row}"><span v-if="row.group">{{ row.group }}</span><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column prop="joined" label="入驻时间" width="98" />
          <el-table-column label="操作" width="104" align="center">
            <template #default="{row}">
              <el-button link type="primary" @click="open(row)">详情</el-button>
              <el-dropdown trigger="click" @command="c => rowCmd(c, row)">
                <el-button link type="primary">更多<el-icon><ArrowDown /></el-icon></el-button>
                <template #dropdown><el-dropdown-menu>
                  <el-dropdown-item v-if="row.status === '正常'" command="暂停">暂停板块服务</el-dropdown-item>
                  <el-dropdown-item v-if="row.status === '暂停'" command="正常">恢复为正常</el-dropdown-item>
                  <el-dropdown-item command="下架" :disabled="row.listing === '不上架'">从名录下架</el-dropdown-item>
                  <el-dropdown-item command="工单" divided>发起明细访问工单</el-dropdown-item>
                </el-dropdown-menu></template>
              </el-dropdown>
            </template>
          </el-table-column>
          <template #empty><div class="empty-block">没有符合条件的企业，请调整筛选条件</div></template>
        </el-table>
        <div class="tbl-foot">
          <span>全平台下游企业 21,386 家；原型展示其中 {{ dnAll.length }} 家示例，当前筛选命中 {{ filtered.length }} 家。列表只含状态与质量评级，不含任何销量、库存、价格数值。</span>
          <el-pagination small background layout="prev, pager, next" :total="filtered.length" :page-size="10" v-model:current-page="page" />
        </div>
      </el-tab-pane>

      <!-- 上游企业 -->
      <el-tab-pane name="up" label="上游企业">
        <el-alert type="info" show-icon :closable="false" title="购买资格限定为经认证的钢铁生产企业。同一集团的关联企业归并为一个购买主体：同一时间只有一个生效数据池，名额与替换额度按购买主体合并计算。" />
        <el-table :data="ups" size="small" border>
          <el-table-column label="购买主体" min-width="230"><template #default="{row}"><div class="ent-name"><a href="javascript:;" @click="openUp(row)"><b>{{ row.name }}</b></a><span>{{ row.id }} · {{ row.kind }}</span></div></template></el-table-column>
          <el-table-column label="集团归并的关联企业数" width="160" align="right"><template #default="{row}"><a href="javascript:;" @click="openUp(row)">{{ row.rel }} 家</a></template></el-table-column>
          <el-table-column label="已购名额" width="100" align="right"><template #default="{row}"><span class="num">{{ row.quota ? $fmt(row.quota) : '—' }}</span></template></el-table-column>
          <el-table-column label="数据池家数" width="190" align="right">
            <template #default="{row}"><el-tag v-if="row.eff && row.eff < 20" size="small" type="danger">有效 {{ row.eff }} 家，低于 20</el-tag> <span class="num">{{ row.pool ? $fmt(row.pool) : '—' }}</span></template>
          </el-table-column>
          <el-table-column prop="expire" label="订阅到期" width="120" />
          <el-table-column label="状态" width="120"><template #default="{row}"><el-tag size="small" :type="upType(row.status)">{{ row.status }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="190" align="center">
            <template #default="{row}"><el-button link type="primary" @click="openUp(row)">详情</el-button><el-button link type="primary" @click="$go('pools.html')">数据池</el-button><el-button link type="primary" @click="$go('billing.html')">订单</el-button></template>
          </el-table-column>
        </el-table>
        <div class="tbl-foot"><span>全平台上游购买主体 512 家（付费 438 家）；原型展示 {{ ups.length }} 家示例。</span></div>
      </el-tab-pane>

      <!-- 待审核 -->
      <el-tab-pane name="audit">
        <template #label>待审核 <el-badge :value="audits.length" type="danger" :hidden="!audits.length" style="vertical-align:1px" /></template>
        <div class="filter-bar">
          <el-radio-group v-model="auditType">
            <el-radio-button value="" :label="'全部（' + audits.length + '）'" />
            <el-radio-button v-for="t in auditTypes" :key="t" :value="t" :label="t + '（' + auditCount(t) + '）'" />
          </el-radio-group>
        </div>
        <el-table :data="auditRows" size="small" border>
          <el-table-column label="审核类型" width="130"><template #default="{row}"><el-tag size="small" :type="auditTag(row.type)">{{ row.type }}</el-tag></template></el-table-column>
          <el-table-column label="企业" min-width="230"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
          <el-table-column label="身份" width="80"><template #default="{row}">{{ row.side }}</template></el-table-column>
          <el-table-column prop="summary" label="申请内容" min-width="300" />
          <el-table-column prop="time" label="提交时间" width="140" />
          <el-table-column label="等待时长" width="100"><template #default="{row}"><span :style="{color: row.wait > 24 ? '#e5484d' : ''}">{{ row.wait }} 小时</span></template></el-table-column>
          <el-table-column label="操作" width="90" align="center"><template #default="{row}"><el-button type="primary" size="small" plain @click="openAudit(row)">审核</el-button></template></el-table-column>
          <template #empty><div class="empty-block">当前没有待审核事项</div></template>
        </el-table>
        <div class="tbl-foot"><span>审核时限：准入与身份认定 1 个工作日，画像与上架 2 个工作日。审核结论与意见全部留痕，并通知企业。</span></div>
      </el-tab-pane>
    </el-tabs>
  </div>

  <!-- 下游企业详情抽屉 -->
  <el-drawer v-model="drawer" size="720px" :title="cur ? cur.name : ''">
    <template v-if="cur">
      <div class="row mb12">
        <el-tag :type="cur.status === '正常' ? 'success' : cur.status === '暂停' ? 'warning' : 'danger'">板块状态：{{ cur.status }}</el-tag>
        <el-tag :type="listingType(cur.listing)" effect="plain">{{ cur.listing }}</el-tag>
        <el-tag type="info">质量评级 {{ cur.quality }}</el-tag>
        <el-tag v-if="cur.group" type="warning" effect="plain">关联企业 · {{ cur.group }}</el-tag>
        <span class="muted small">当前被 <b>{{ cur.subs }}</b> 家钢厂订阅</span>
      </div>

      <div class="sec-title"><span>认证信息</span><span class="muted small" style="font-weight:400">复用货袋子平台企业认证</span></div>
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="企业编号">{{ cur.id }}</el-descriptions-item>
        <el-descriptions-item label="统一社会信用代码">9132{{ cur.id.slice(1) }}••••••{{ cur.id.slice(-2) }}X</el-descriptions-item>
        <el-descriptions-item label="所在地">{{ cur.prov }} · {{ cur.city }}</el-descriptions-item>
        <el-descriptions-item label="企业认证">已认证（货袋子平台）</el-descriptions-item>
        <el-descriptions-item label="身份类型">下游钢贸企业</el-descriptions-item>
        <el-descriptions-item label="入驻时间">{{ cur.joined }}（接入 {{ cur.months }} 个月）</el-descriptions-item>
        <el-descriptions-item label="匿名编号"><span class="anon-name">{{ cur.anon }}</span></el-descriptions-item>
        <el-descriptions-item label="企业管理员">{{ cur.admin }}（手机号已脱敏）</el-descriptions-item>
      </el-descriptions>

      <div class="sec-title"><span>协议签署记录</span></div>
      <el-table :data="cur.agreements" size="small" border>
        <el-table-column prop="name" label="协议" min-width="200" />
        <el-table-column prop="ver" label="版本" width="80" />
        <el-table-column prop="time" label="签署时间" width="150" />
        <el-table-column prop="by" label="签署人" width="110" />
        <el-table-column label="状态" width="90"><template #default="{row}"><el-tag size="small" :type="row.ok ? 'success' : 'info'">{{ row.ok ? '已签署' : '未签署' }}</el-tag></template></el-table-column>
      </el-table>

      <div class="sec-title"><span>自主申报画像</span><span class="muted small" style="font-weight:400">由企业自主申报，经画像审核后在名录展示</span></div>
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="主营大类">{{ cur.cat }}</el-descriptions-item>
        <el-descriptions-item label="规模档（申报区间）">{{ cur.scale }}</el-descriptions-item>
        <el-descriptions-item label="代理品牌">{{ cur.brands.join('、') }}</el-descriptions-item>
        <el-descriptions-item label="覆盖声明">{{ cur.cover }}</el-descriptions-item>
        <el-descriptions-item label="价格上传">{{ priceOn(cur) ? '已开启' : '未开启' }}</el-descriptions-item>
        <el-descriptions-item label="画像审核">已通过（{{ cur.joined }}）</el-descriptions-item>
      </el-descriptions>

      <div class="sec-title"><span>接入应用与密钥状态</span><el-button size="small" @click="quotaDlg = true"><el-icon><Setting /></el-icon>调整限流配额</el-button></div>
      <el-table :data="cur.apps" size="small" border>
        <el-table-column prop="src" label="来源系统" min-width="140" />
        <el-table-column prop="key" label="应用标识" width="136"><template #default="{row}"><span class="code">{{ row.key }}</span></template></el-table-column>
        <el-table-column prop="grain" label="上传粒度" width="80" />
        <el-table-column label="密钥状态" width="104"><template #default="{row}"><span class="dot" :class="row.on ? (row.exp ? 'warn' : 'ok') : 'err'"></span>{{ row.on ? (row.exp ? '30 日内到期' : '正常') : '已停用' }}</template></el-table-column>
        <el-table-column prop="last" label="最近调用" width="106" />
        <el-table-column label="操作" width="64" align="center"><template #default="{row}"><el-button link :type="row.on ? 'danger' : 'primary'" @click="toggleApp(row)">{{ row.on ? '停用' : '启用' }}</el-button></template></el-table-column>
      </el-table>
      <div class="small muted mt8">限流配额：<b>{{ cur.qps }}</b> 次/分钟，单批最多 <b>{{ $fmt(cur.batch) }}</b> 行；近 24 小时接口成功率 {{ cur.succ }}%，触发限流 {{ cur.limited }} 次。密钥明文仅企业可见，平台只能查看状态与停用。</div>

      <div class="sec-title"><span>关联企业维护</span><el-button size="small" @click="addRel"><el-icon><Plus /></el-icon>登记关联关系</el-button></div>
      <el-table v-if="cur.rels.length" :data="cur.rels" size="small" border>
        <el-table-column prop="name" label="关联企业" min-width="220" />
        <el-table-column prop="rel" label="关系" width="150" />
        <el-table-column prop="src" label="来源" width="130" />
        <el-table-column label="操作" width="76" align="center"><template #default="{$index}"><el-button link type="danger" @click="cur.rels.splice($index, 1); $demo('已解除关联关系，变更已留痕')">解除</el-button></template></el-table-column>
      </el-table>
      <div v-else class="tip-box small">未登记关联企业。钢厂关联的贸易公司在名录中标注“关联企业”；关联方订阅的名额不参与分成（示例参数，待业务方确定）。</div>

      <div class="sec-title"><span>状态管理</span></div>
      <div class="row">
        <el-button :disabled="cur.status !== '正常'" @click="setStatus(cur, '暂停')">暂停板块服务</el-button>
        <el-button :disabled="cur.status !== '暂停'" type="success" plain @click="setStatus(cur, '正常')">恢复为正常</el-button>
        <el-button :disabled="cur.status === '退出'" type="danger" plain @click="setStatus(cur, '退出')">办理退出</el-button>
        <span class="muted small">暂停或退出后，订阅该企业的名额按补偿规则冻结或释放，见 <a href="pools.html">数据池管理</a></span>
      </div>

      <div class="sec-title"><span>上传数据明细</span><el-tag size="small" type="info"><el-icon style="vertical-align:-2px"><Lock /></el-icon> 不可见</el-tag></div>
      <div class="lock-block">
        <div class="ic"><el-icon><Lock /></el-icon></div>
        <div>
          <h4>平台人员默认不可查看下游企业上传明细</h4>
          <p>销售出库明细、库存快照、价格与金额均不在后台展示。排障确需查看时，须发起明细访问工单：经<b>企业授权</b>后<b>限时</b>开放指定范围，访问全程<b>留痕</b>，并在企业侧“数据使用透明账本”中<b>对企业可见</b>。</p>
          <el-button type="primary" @click="$go('audit.html')"><el-icon><Tickets /></el-icon>发起明细访问工单</el-button>
          <span class="muted small" style="margin-left:10px">该企业近 90 天内工单 {{ cur.tickets }} 次</span>
        </div>
      </div>
    </template>
  </el-drawer>

  <!-- 限流配额 -->
  <el-dialog v-model="quotaDlg" title="调整限流配额" width="480px" append-to-body>
    <el-form v-if="cur" label-width="120px">
      <el-form-item label="企业">{{ cur.name }}</el-form-item>
      <el-form-item label="每分钟调用上限"><el-input-number v-model="quota.qps" :min="60" :max="6000" :step="60" /> <span class="muted small" style="margin-left:8px">次/分钟，默认 600</span></el-form-item>
      <el-form-item label="单批最大行数"><el-input-number v-model="quota.batch" :min="500" :max="5000" :step="500" /> <span class="muted small" style="margin-left:8px">行</span></el-form-item>

    A('上架审核', '武汉正阳钢铁贸易有限公司', '下游', '申请上架：匿名带编号', '2026-11-24 10:02', 4, { listing: '匿名带编号', q: 'B', days: 27, map: 96.8, region: '华中', abbr: '建材' }),
    A('上架审核', '宁波天润物贸有限公司', '下游', '申请上架：实名', '2026-11-24 08:55', 5, { listing: '实名', q: 'A', days: 30, map: 98.9, region: '华东', abbr: '热卷' }),
    A('上架审核', '郑州久隆实业有限公司', '下游', '申请上架：只对指定钢厂可见（指定 2 家）', '2026-11-23 17:40', 20, { listing: '只对指定钢厂可见', q: 'B', days: 24, map: 95.2, region: '华中', abbr: '型钢' }),
    A('上架审核', '佛山联众金属材料有限公司', '下游', '上架方式变更：实名 → 匿名带编号', '2026-11-23 14:18', 24, { listing: '匿名带编号', q: 'A', days: 29, map: 97.6, region: '华南', abbr: '管材' }),
    A('上架审核', '天津佳合钢铁有限公司', '下游', '申请上架：匿名带编号', '2026-11-22 15:36', 47, { listing: '匿名带编号', q: 'C', days: 21, map: 91.4, region: '华北', abbr: '冷镀' }),
  ];

  STP.mount({
    data() {
      return {
        tab: 'dn', page: 1, dnAll, ups, audits, steps: STEPS, mills: M.MILLS,
        provs: M.provinces.map((p) => p.name), listings: ['实名', '匿名带编号', '只对指定钢厂可见', '不上架'],
        f: { kw: '', prov: '', listing: '', status: '', quality: '', grain: '', price: '' },
        auditTypes: ['准入审核', '身份类型认定', '画像审核', '上架审核'], auditType: '',
        drawer: false, cur: null, quotaDlg: false, quota: { qps: 600, batch: 1000, reason: '' },
        upDlg: false, curUp: null,
        auditDlg: false, curAudit: null, rv: { checks: [], kind: '钢铁生产企业', group: '', anon: '', note: '' },
      };
    },
    computed: {
      filtered() {
        const f = this.f;
        return this.dnAll.filter((e) => (!f.kw || (e.name + e.id + e.anon).indexOf(f.kw) >= 0) && (!f.prov || e.prov === f.prov) && (!f.listing || e.listing === f.listing)
          && (!f.status || e.status === f.status) && (!f.quality || e.quality === f.quality) && (!f.grain || e.grain === f.grain) && (!f.price || (f.price === 'on') === this.priceOn(e)));
      },
      pageRows() { return this.filtered.slice((this.page - 1) * 10, this.page * 10); },
      auditRows() { return this.audits.filter((a) => !this.auditType || a.type === this.auditType); },
      canPass() {
        const a = this.curAudit; if (!a) return false;
        if (a.type === '准入审核') return this.rv.checks.length === 4;
        if (a.type === '上架审核') return !!this.rv.anon;
        return true;
      },
    },
    watch: { f: { deep: true, handler() { this.page = 1; } } },
    methods: {
      priceOn(e) { return e.id === 'E100000' ? this.$state.dnPrice === 'on' : e.priceOn; },
      listingType(l) { return l === '实名' ? 'success' : l === '匿名带编号' ? 'primary' : l === '不上架' ? 'info' : 'warning'; },
      upType(s) { return s === '订阅中' ? 'success' : s === '即将到期' ? 'warning' : 'info'; },
      auditTag(t) { return { 准入审核: 'primary', 身份类型认定: 'warning', 画像审核: 'success', 上架审核: 'danger' }[t]; },
      auditCount(t) { return this.audits.filter((a) => a.type === t).length; },
      resetFilter() { this.f = { kw: '', prov: '', listing: '', status: '', quality: '', grain: '', price: '' }; },
      open(row) { this.cur = row; this.drawer = true; },
      openUp(row) { this.curUp = row; this.upDlg = true; },
      rowCmd(c, row) {
        if (c === '工单') { this.$go('audit.html'); return; }
        if (c === '下架') {
          ElementPlus.ElMessageBox.confirm('下架后该企业不再出现在企业名录中，已订阅的名额不受影响。确认下架「' + row.name + '」？', '从名录下架', { type: 'warning', confirmButtonText: '确认下架', cancelButtonText: '取消' })
            .then(() => { row.listing = '不上架'; this.$demo('已下架，操作已留痕并通知企业'); }).catch(() => {});
          return;
        }
        this.setStatus(row, c);
      },
      setStatus(row, s) {
        const tip = { 暂停: '暂停后该企业的数据不再参与聚合，订阅其的名额将冻结，上游可免费替换或顺延。', 正常: '恢复后该企业的数据自恢复日起重新参与聚合，冻结名额解冻。', 退出: '退出后名额释放，上游可免费替换；历史聚合结果不重算。此操作需企业已完成退出流程。' }[s];
        ElementPlus.ElMessageBox.confirm(tip + '确认将「' + row.name + '」的板块状态改为“' + s + '”？', '状态变更', { type: 'warning', confirmButtonText: '确认', cancelButtonText: '取消' })
          .then(() => { row.status = s; this.$demo('状态已变更为“' + s + '”，已留痕并通知企业与相关上游'); }).catch(() => {});
      },
      toggleApp(app) { app.on = !app.on; this.$demo(app.on ? '应用已启用' : '应用已停用，该来源系统的上传将被拒绝'); },
      saveQuota() { this.cur.qps = this.quota.qps; this.cur.batch = this.quota.batch; this.quotaDlg = false; this.$demo('限流配额已调整，立即生效并留痕'); },
      addRel() {
        ElementPlus.ElMessageBox.prompt('请输入关联企业名称（同一集团或同一实际控制人）', '登记关联关系', { confirmButtonText: '登记', cancelButtonText: '取消', inputValue: '东岳钢铁集团有限公司' })
          .then(({ value }) => { if (value) { this.cur.rels.push({ name: value, rel: '钢厂关联的贸易公司', src: '运营登记' }); this.cur.group = value.replace(/有限公司$/, ''); this.$demo('关联关系已登记，名录将标注“关联企业”'); } }).catch(() => {});
      },
      openAudit(row) {
        this.curAudit = row;
        this.rv = { checks: [], kind: row.name.indexOf('物资') >= 0 ? '钢厂关联贸易公司' : row.name.indexOf('万隆') >= 0 ? '贸易企业' : '钢铁生产企业', group: row.name.indexOf('东岳') >= 0 ? '东岳钢铁' : '', anon: '', note: '' };
        this.auditDlg = true;
      },
      genAnon() { const a = this.curAudit; this.rv.anon = a.region + '·' + a.abbr + '·A' + String(1000 + Math.floor(Math.random() * 8999)).slice(-4); },
      doAudit(pass) {
        const a = this.curAudit;
        this.audits.splice(this.audits.indexOf(a), 1);
        this.auditDlg = false;
        this.$demo(pass ? a.type + '已通过：' + a.name + (this.rv.anon ? '，匿名编号 ' + this.rv.anon : '') : '已驳回并通知企业：' + a.name);
      },
    },
  });
})();
</script>
