<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>企业管理 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.ent-name b { font-weight: 600; }
.ent-name span { display: block; font-size: 12px; color: var(--stp-sub); margin-top: 2px; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.sec-title { font-size: 14px; font-weight: 600; margin: 20px 0 10px; display: flex; align-items: center; justify-content: space-between; }
.sec-title:first-child { margin-top: 0; }
.sec-title::before { content: ""; width: 3px; height: 14px; background: var(--el-color-primary); border-radius: 2px; margin-right: 8px; }
.sec-title > span:first-child { flex: 1; }
.lock-block { border: 1px dashed #c3cad5; border-radius: 6px; padding: 16px; background: repeating-linear-gradient(135deg, #f7f8fa 0 8px, #f1f3f6 8px 16px); display: flex; gap: 14px; align-items: flex-start; }
.lock-block .ic { width: 40px; height: 40px; border-radius: 8px; background: #fff; border: 1px solid var(--stp-border); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #8a94a3; flex-shrink: 0; }
.lock-block h4 { margin: 0 0 4px; font-size: 14px; }
.lock-block p { margin: 0 0 10px; font-size: 13px; color: #5b6778; line-height: 1.7; }
.prog-steps { display: flex; gap: 3px; margin-bottom: 3px; }
.prog-steps i { flex: 1; height: 5px; border-radius: 2px; background: #e4e8ee; }
.prog-steps i.on { background: #18a058; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--stp-border); border-radius: 6px; padding: 5px 12px; font-size: 12.5px; color: #5b6778; background: #fff; }
.chip b { font-size: 16px; margin-right: 6px; color: #1f2d3d; }
.anon-gen { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid #e0d1fb; background: #faf7ff; border-radius: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" active="enterprises" title="企业管理"
  desc="上游、下游企业的板块准入审核、身份类型认定、画像与上架审核、接入管理、关联企业维护与状态管理。平台人员默认不可查看下游企业上传明细。">
  <template #actions>
    <el-button @click="$demo('企业清单已导出（不含任何上传数据）')"><el-icon><Download /></el-icon>导出企业清单</el-button>
    <el-button type="primary" @click="tab = 'audit'"><el-icon><Stamp /></el-icon>待审核（{{ audits.length }}）</el-button>
  </template>

  <div class="grid c5">
    <stat-card label="下游入驻企业" :value="21386" unit="家" icon="OfficeBuilding" tip="入驻来源：钢厂带动 14,870、一级代理带动 2,316、平台运营邀请 3,120、自主注册 1,080"><span>已上架 <b>17,902</b></span><span>钢厂带动 <b>14,870</b></span></stat-card>
    <div class="stat">
      <div class="label">上架方式分布</div>
      <div class="value num" style="font-size:18px;line-height:1.7">实名 10,384<span class="unit">家</span></div>
      <div class="foot"><span>匿名带编号 <b>6,906</b></span><span>指定钢厂可见 <b>612</b></span><span>不上架 <b>3,484</b></span></div>
    </div>
    <stat-card label="板块状态：暂停 / 退出" :value="486" unit="家暂停" icon="SwitchButton"><span>退出流程中 <b>37</b></span><span>本月已退出 <b>12</b></span></stat-card>
    <stat-card label="上游购买主体" :value="512" unit="家" icon="Coin" tip="同一集团的关联企业归并为一个购买主体，共用一个数据池校验口径"><span>付费 <b>438</b></span><span>涉及法人 <b>1,264</b></span></stat-card>
    <stat-card label="待审核" :value="audits.length" unit="项" icon="Stamp"><span>准入 <b>{{ auditCount('准入审核') }}</b></span><span>身份 <b>{{ auditCount('身份类型认定') }}</b></span><span>画像 <b>{{ auditCount('画像审核') }}</b></span><span>上架 <b>{{ auditCount('上架审核') }}</b></span></stat-card>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- 下游企业 -->
      <el-tab-pane name="dn" label="下游企业">
        <div class="filter-bar">
          <el-input v-model="f.kw" placeholder="企业名称 / 企业编号 / 匿名编号" clearable style="width:240px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <el-select v-model="f.prov" placeholder="所在省份" clearable style="width:120px"><el-option v-for="p in provs" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.listing" placeholder="上架方式" clearable style="width:160px"><el-option v-for="p in listings" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.status" placeholder="板块状态" clearable style="width:110px"><el-option v-for="p in ['正常','暂停','退出']" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.quality" placeholder="质量评级" clearable style="width:110px"><el-option v-for="p in ['A','B','C']" :key="p" :label="p + ' 级'" :value="p" /></el-select>
          <el-select v-model="f.grain" placeholder="上传粒度" clearable style="width:120px"><el-option v-for="p in ['行级','日汇总','混用']" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="f.price" placeholder="价格上传" clearable style="width:120px"><el-option label="已开启" value="on" /><el-option label="未开启" value="off" /></el-select>
          <el-select v-model="f.source" placeholder="入驻来源" clearable style="width:140px"><el-option v-for="p in sources" :key="p" :label="p" :value="p" /></el-select>
          <el-button @click="resetFilter">重置</el-button>
        </div>
        <el-table :data="pageRows" size="small" border>
          <el-table-column label="企业" min-width="200">
            <template #default="{row}">
              <div class="ent-name"><a href="javascript:;" @click="open(row)"><b>{{ row.name }}</b></a><span>{{ row.id }} · 编号 {{ row.anon }}</span></div>
            </template>
          </el-table-column>
          <el-table-column label="所在地" width="96"><template #default="{row}">{{ row.prov }} · {{ row.city.replace('市','') }}</template></el-table-column>
          <el-table-column label="上架方式" width="124">
            <template #default="{row}"><el-tag size="small" :type="listingType(row.listing)" effect="plain">{{ row.listing }}</el-tag></template>
          </el-table-column>
          <el-table-column label="板块状态" width="76"><template #default="{row}"><span class="dot" :class="row.status === '正常' ? 'ok' : row.status === '暂停' ? 'warn' : 'err'"></span>{{ row.status }}</template></el-table-column>
          <el-table-column label="接入进度" width="100">
            <template #default="{row}">
              <div class="prog-steps"><i v-for="n in 4" :key="n" :class="{on: n <= row.step + 1}"></i></div>
              <span class="small muted">{{ steps[row.step] }}</span>
            </template>
          </el-table-column>
          <el-table-column label="上传粒度" width="72"><template #default="{row}">{{ row.grain }}</template></el-table-column>
          <el-table-column label="价格上传" width="72"><template #default="{row}"><span v-if="priceOn(row)" style="color:#18a058">已开启</span><span v-else class="muted">未开启</span></template></el-table-column>
          <el-table-column label="质量评级" width="72" align="center"><template #default="{row}"><el-tag size="small" :type="row.quality === 'A' ? 'success' : row.quality === 'B' ? 'primary' : 'warning'">{{ row.quality }}</el-tag></template></el-table-column>
          <el-table-column label="关联集团" width="104"><template #default="{row}"><span v-if="row.group">{{ row.group }}</span><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="入驻时间与来源" width="132"><template #default="{row}"><span class="num">{{ row.joined }}</span><div class="small" :style="{color: row.source === '钢厂带动' ? '#2b6fd6' : row.source === '一级代理带动' ? '#1b7a47' : '#8a94a3'}">{{ row.source }}<template v-if="row.refShort"> · {{ row.refShort }}</template></div></template></el-table-column>
          <el-table-column label="操作" width="104" align="center">
            <template #default="{row}">
              <el-button link type="primary" @click="open(row)">详情</el-button>
              <el-dropdown trigger="click" @command="c => rowCmd(c, row)">
                <el-button link type="primary">更多<el-icon><ArrowDown /></el-icon></el-button>
                <template #dropdown><el-dropdown-menu>
                  <el-dropdown-item v-if="row.status === '正常'" command="暂停">暂停板块服务</el-dropdown-item>
                  <el-dropdown-item v-if="row.status === '暂停'" command="正常">恢复为正常</el-dropdown-item>
                  <el-dropdown-item command="下架" :disabled="row.listing === '不上架'">从名录下架</el-dropdown-item>
                  <el-dropdown-item command="工单" divided>发起明细访问工单</el-dropdown-item>
                </el-dropdown-menu></template>
              </el-dropdown>
            </template>
          </el-table-column>
          <template #empty><div class="empty-block">没有符合条件的企业，请调整筛选条件</div></template>
        </el-table>
        <div class="tbl-foot">
          <span>全平台下游企业 21,386 家；原型展示其中 {{ dnAll.length }} 家示例，当前筛选命中 {{ filtered.length }} 家。列表只含状态、入驻来源与质量评级，不含任何销量、库存、价格数值。</span>
          <el-pagination small background layout="prev, pager, next" :total="filtered.length" :page-size="10" v-model:current-page="page" />
        </div>
      </el-tab-pane>

      <!-- 上游企业 -->
      <el-tab-pane name="up" label="上游企业">
        <el-alert type="info" show-icon :closable="false" title="购买资格限定为经认证的钢铁生产企业。同一集团的关联企业归并为一个购买主体：同一时间只有一个生效数据池，名额与替换额度按购买主体合并计算。" />
        <el-table :data="ups" size="small" border>
          <el-table-column label="购买主体" min-width="230"><template #default="{row}"><div class="ent-name"><a href="javascript:;" @click="openUp(row)"><b>{{ row.name }}</b></a><span>{{ row.id }} · {{ row.kind }}</span></div></template></el-table-column>
          <el-table-column label="集团归并的关联企业数" width="160" align="right"><template #default="{row}"><a href="javascript:;" @click="openUp(row)">{{ row.rel }} 家</a></template></el-table-column>
          <el-table-column label="已购名额" width="100" align="right"><template #default="{row}"><span class="num">{{ row.quota ? $fmt(row.quota) : '—' }}</span></template></el-table-column>
          <el-table-column label="数据池家数" width="190" align="right">
            <template #default="{row}"><el-tag v-if="row.eff && row.eff < 20" size="small" type="danger">有效 {{ row.eff }} 家，低于 20</el-tag> <span class="num">{{ row.pool ? $fmt(row.pool) : '—' }}</span></template>
          </el-table-column>
          <el-table-column prop="expire" label="订阅到期" width="120" />
          <el-table-column label="状态" width="120"><template #default="{row}"><el-tag size="small" :type="upType(row.status)">{{ row.status }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="190" align="center">
            <template #default="{row}"><el-button link type="primary" @click="openUp(row)">详情</el-button><el-button link type="primary" @click="$go('pools.html')">数据池</el-button><el-button link type="primary" @click="$go('billing.html')">订单</el-button></template>
          </el-table-column>
        </el-table>
        <div class="tbl-foot"><span>全平台上游购买主体 512 家（付费 438 家）；原型展示 {{ ups.length }} 家示例。</span></div>
      </el-tab-pane>

      <!-- 待审核 -->
      <el-tab-pane name="audit">
        <template #label>待审核 <el-badge :value="audits.length" type="danger" :hidden="!audits.length" style="vertical-align:1px" /></template>
        <div class="filter-bar">
          <el-radio-group v-model="auditType">
            <el-radio-button value="" :label="'全部（' + audits.length + '）'" />
            <el-radio-button v-for="t in auditTypes" :key="t" :value="t" :label="t + '（' + auditCount(t) + '）'" />
          </el-radio-group>
        </div>
        <el-table :data="auditRows" size="small" border>
          <el-table-column label="审核类型" width="130"><template #default="{row}"><el-tag size="small" :type="auditTag(row.type)">{{ row.type }}</el-tag></template></el-table-column>
          <el-table-column label="企业" min-width="190"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
          <el-table-column label="身份" width="80"><template #default="{row}">{{ row.side }}</template></el-table-column>
          <el-table-column prop="summary" label="申请内容" min-width="200" />
          <el-table-column label="入驻来源" width="160"><template #default="{row}"><template v-if="row.src"><el-tag size="small" :type="row.src === '钢厂带动' ? 'primary' : row.src === '一级代理带动' ? 'success' : 'info'" effect="plain">{{ row.src }}</el-tag><div v-if="row.ref" class="small muted">{{ row.ref }}</div></template><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column prop="time" label="提交时间" width="140" />
          <el-table-column label="等待时长" width="86"><template #default="{row}"><span :style="{color: row.wait > 24 ? '#e5484d' : ''}">{{ row.wait }} 小时</span></template></el-table-column>
          <el-table-column label="操作" width="80" align="center"><template #default="{row}"><el-button type="primary" size="small" plain @click="openAudit(row)">审核</el-button></template></el-table-column>
          <template #empty><div class="empty-block">当前没有待审核事项</div></template>
        </el-table>
        <div class="tbl-foot"><span>审核时限：准入与身份认定 1 个工作日，画像与上架 2 个工作日。审核结论与意见全部留痕，并通知企业；钢厂带动、一级代理带动来源的企业，准入结果不单独通知邀请它的钢厂或代理：对方确认带动关系前，钢厂看到的邀请状态一律是“已发送”。</span></div>
      </el-tab-pane>

      <!-- 无库存经营：核实与复核（N-54；OP-23、DQ-25） -->
      <el-tab-pane name="ns">
        <template #label>无库存经营 <el-badge :value="nsTodo" type="danger" :hidden="!nsTodo" style="vertical-align:1px" /></template>
        <div class="tip-box blue small" style="margin-top:0">
          <b>规则（业务方 2026-11-25 确认）。</b>常年不落库的企业由<b>企业申报、运营核实</b>后生效：不参加报送达标评定，对带动钢厂显示“不适用”并带“无库存经营”标签，不计入钢厂的汇总达标率；接入状态照常显示。企业申报时已逐项确认告知文案（{{ NS.noticeVer }}）。
          核实依据是<b>平台内的汇总信号</b>（登记的仓库数、近 {{ NS.months }} 个月收到库存快照实际数据的天数、销售记录中带本企业仓库的比例）、企业提交的说明和材料，必要时电话回访。<b>不打开明细</b>，确需查看时走<a href="audit.html">数据访问工单</a>。核实期间不向带动钢厂征询，也不告知其有此申请。运营不能替企业申报。
          <span class="ex-tag" style="margin-left:4px">时限与阈值为示例参数 N-58</span>
        </div>
        <div class="row between mb12" style="flex-wrap:wrap;gap:10px">
          <div class="chips">
            <div class="chip"><b class="num">{{ NS.platform.active }}</b>已生效（全平台）</div>
            <div class="chip" style="border-color:#f5dab1;background:#fffaf2"><b class="num" style="color:#b25e00">{{ nsCount('待核实') + nsCount('待补充') }}</b>待核实</div>
            <div class="chip" style="border-color:#f3c9ca;background:#fffafa"><b class="num" style="color:#b83a3e">{{ nsRecheckN }}</b>待复核</div>
            <div class="chip"><b class="num">{{ NS.platform.revoked }}</b>累计撤销</div>
            <div class="chip"><b class="num">{{ NS.platform.rejected }}</b>累计驳回</div>
            <div class="chip"><b class="num">{{ NS.platform.expired }}</b>已到期</div>
          </div>
          <el-radio-group v-model="nsF" size="small">
            <el-radio-button value="" label="全部" /><el-radio-button v-for="s in ['待核实', '待复核', '已生效', '已撤销', '已驳回']" :key="s" :value="s" :label="s" />
          </el-radio-group>
        </div>
        <el-table :data="nsRows" size="small" border>
          <el-table-column label="申报" width="150"><template #default="{row}"><span class="code">{{ row.id }}</span><div class="small muted" style="margin-top:2px">{{ row.applyAt }}</div></template></el-table-column>
          <el-table-column label="企业" min-width="200"><template #default="{row}"><b>{{ row.ent }}</b><div class="small muted">{{ row.loc }} · {{ row.mode }}</div><div class="small muted">带动钢厂：{{ row.mill }} · 自 {{ row.startAt }} 起不落库（申报）</div></template></el-table-column>
          <el-table-column width="216">
            <template #header>平台内汇总信号<el-tooltip placement="top" content="登记的仓库数、近 3 个月收到库存快照实际数据的天数、销售记录中带本企业仓库的比例。都是汇总信号，不含销量、库存量等数据内容，不打开明细"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template>
            <template #default="{row}">近 {{ NS.months }} 个月收到库存快照 <b :style="{color: row.invDays ? '#b83a3e' : '#18a058'}">{{ row.invDays }}</b> 天<div class="small muted">登记仓库 {{ row.wh }} 个 · 销售带本企业仓库 {{ row.whShare }}%</div></template>
          </el-table-column>
          <el-table-column label="状态" min-width="200">
            <template #default="{row}">
              <el-tag size="small" :type="nsTag(row.st)" effect="plain">{{ row.st }}</el-tag>
              <span v-if="row.st === '已生效'" class="small muted" style="margin-left:6px">{{ row.since }} 周期起 · {{ row.until }} 到期</span>
              <span v-if="row.st === '待核实' || row.st === '待补充'" class="small muted" style="margin-left:6px">核实时限 {{ row.due }}</span>
              <div v-if="row.recheck && row.st === '已生效'" class="small" style="color:#b83a3e"><b>待复核 · {{ row.recheck.src }}</b><span v-if="row.recheck.p2" class="ph-tag" style="margin-left:4px">二期</span><br>{{ row.recheck.text }}</div>
              <div v-if="row.at && row.st !== '待核实' && row.st !== '待补充'" class="small muted">{{ row.at }} · {{ row.by }}</div>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="96" align="center">
            <template #default="{row}">
              <el-button v-if="row.st === '待核实' || row.st === '待补充'" type="primary" size="small" plain @click="nsOpen(row, 'verify')">核实</el-button>
              <el-button v-else-if="row.st === '已生效' && row.recheck" type="danger" size="small" plain @click="nsOpen(row, 'recheck')">复核</el-button>
              <el-button v-else-if="row.st === '已生效'" size="small" plain @click="nsOpen(row, 'recheck')">撤销</el-button>
              <el-button v-else link type="primary" size="small" @click="nsOpen(row, 'view')">查看记录</el-button>
            </template>
          </el-table-column>
          <template #empty><div class="empty-block">没有符合条件的申报</div></template>
        </el-table>
        <div class="tbl-foot"><span>原型展示 {{ NS.list.length }} 条示例　|　核实时限 {{ NS.sla }} 个工作日。申报在周期第 {{ NS.deadlineDay }} 日及以前提交、并在该周期结果发布前核实通过的，自该周期起“不适用”，其余自下一个周期起；已发布的周期不变。复核的触发：持续核验信号（一个周期内累计 {{ NS.recheckInvDays }} 天收到库存快照、仓库新增登记等）、钢厂异议、到期抽检。标记有效期 {{ NS.validMonths }} 个月。全部操作留痕并通知企业。</span></div>

        <div class="grid c-3-2" style="margin:14px 0 0">
          <div>
            <div class="sec-title" style="margin-top:0"><span>监控：各钢厂协议户中标记企业的占比</span><span class="muted small" style="font-weight:400">只在平台内部使用，不向钢厂展示</span></div>
            <table class="plain-table" style="font-size:12.5px">

  <!-- 无库存经营：核实 / 复核与撤销 / 查看 -->

    <template v-if="curNs">
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="申报编号">{{ curNs.id }}</el-descriptions-item>
        <el-descriptions-item label="申报人">企业管理员（本人申报）</el-descriptions-item>
        <el-descriptions-item label="所在地">{{ curNs.loc }}</el-descriptions-item>
        <el-descriptions-item label="带动钢厂">{{ curNs.mill }}</el-descriptions-item>
        <el-descriptions-item label="经营模式">{{ curNs.mode }}</el-descriptions-item>
        <el-descriptions-item label="持续不落库起始">{{ curNs.startAt }}（企业申报）</el-descriptions-item>
        <el-descriptions-item label="申报时间">{{ curNs.applyAt }}</el-descriptions-item>
        <el-descriptions-item label="告知文案">{{ NS.noticeVer }}，{{ NS.notice.length }} 项均已逐项确认</el-descriptions-item>
        <el-descriptions-item label="登记的仓库数">{{ curNs.wh }} 个</el-descriptions-item>
        <el-descriptions-item :label="'近 ' + NS.months + ' 个月收到库存快照'"><b :style="{color: curNs.invDays ? '#b83a3e' : '#18a058'}">{{ curNs.invDays }} 天</b></el-descriptions-item>
        <el-descriptions-item label="销售带本企业仓库的比例">{{ curNs.whShare }}%</el-descriptions-item>
        <el-descriptions-item label="明细">未打开；确需查看时走<a href="audit.html">数据访问工单</a></el-descriptions-item>
        <el-descriptions-item v-if="curNs.note" label="说明" :span="2">{{ curNs.note }}</el-descriptions-item>
        <el-descriptions-item v-if="curNs.recheck" label="复核触发" :span="2"><span style="color:#b83a3e"><b>{{ curNs.recheck.src }}</b><span v-if="curNs.recheck.p2" class="ph-tag" style="margin-left:4px">二期</span>：{{ curNs.recheck.text }}</span></el-descriptions-item>
      </el-descriptions>

      <template v-if="nsMode === 'verify'">
        <div class="tip-box small mt12" :class="curNs.invDays ? 'orange' : 'green'">
          <template v-if="curNs.invDays">近 {{ NS.months }} 个月有 {{ curNs.invDays }} 天收到库存快照，登记仓库 {{ curNs.wh }} 个，销售记录中 {{ curNs.whShare }}% 带本企业仓库，与“常年不落库”不一致；连续不落库也未满 {{ NS.months }} 个月。建议驳回，或要求补充。</template>
          <template v-else>近 {{ NS.months }} 个月没有收到过库存快照，未登记仓库，销售记录不带本企业仓库，与申报一致。</template>
        </div>
        <div class="sec-title"><span>核实项</span><span class="muted small" style="font-weight:400">前三项都核对后才能通过；电话回访按需</span></div>
        <el-checkbox-group v-model="nsRv.checks" style="display:flex;flex-direction:column">
          <el-checkbox value="a">由企业管理员本人申报，告知文案已逐项确认，确认记录在审计日志中</el-checkbox>
          <el-checkbox value="b">平台内的汇总信号与申报一致（仓库数、库存快照天数、销售带本企业仓库的比例）</el-checkbox>
          <el-checkbox value="c">企业提交的说明和材料已核对</el-checkbox>
          <el-checkbox value="d">已电话回访（必要时）</el-checkbox>
        </el-checkbox-group>
        <el-input v-model="nsRv.note" class="mt8" type="textarea" :rows="2" placeholder="核实意见（驳回须写明理由，要求补充须写明要补什么；会通知企业）" />
        <div class="small muted mt8">通过后：自 <b>{{ nsEffect(curNs) }}</b> 周期起“不适用”（申报{{ nsLate(curNs) ? '晚于' : '不晚于' }}周期第 {{ NS.deadlineDay }} 日的申报截止日）；标签随该周期结果在发布日出现在 {{ curNs.mill }} 的协议户列表，平台不单独通知钢厂。有效期 {{ NS.validMonths }} 个月。核实期间不向钢厂征询，也不告知其有此申请。</div>
      </template>
      <template v-else-if="nsMode === 'recheck'">
        <div class="sec-title"><span>{{ curNs.recheck ? '复核结论' : '撤销' }}</span></div>
        <el-radio-group v-model="nsRv.reason" style="display:flex;flex-direction:column;align-items:flex-start">
          <el-radio v-if="curNs.recheck" value="维持">维持标记（情况与申报相符）</el-radio>
          <el-radio value="情况变化">撤销：情况变化（如开始持有库存）。自下一个达标周期起恢复评定</el-radio>
          <el-radio value="申报不实">撤销：申报不实。自当前尚未发布的周期起恢复评定，{{ NS.banCycles }} 个周期内不得再次申报</el-radio>
        </el-radio-group>
        <el-input v-model="nsRv.note" class="mt8" type="textarea" :rows="2" placeholder="依据（必填；撤销须写明依据）" />
        <el-checkbox v-if="nsRv.reason && nsRv.reason !== '维持'" v-model="nsRv.heard" class="mt8">已事先通知企业并听取申辩（申辩记录已归档）</el-checkbox>
        <div class="small muted mt8">任何情况下都不追溯改评已发布的周期。撤销后钢厂只看到标签消失、恢复评定，看不到原因。<template v-if="curNs.recheck && curNs.recheck.src === '钢厂异议'">对提出异议的钢厂只回复“维持”或“已撤销”，不提供核实依据和任何数据内容。</template></div>
      </template>
      <template v-else>
        <div class="sec-title"><span>处理记录</span></div>
        <table class="plain-table" style="font-size:12.5px"><tbody>
          <tr><td style="width:150px" class="num">{{ curNs.applyAt }}</td><td>企业管理员提交申报，已逐项确认告知文案</td></tr>
          <tr v-if="curNs.since"><td class="num">{{ curNs.since }} 周期</td><td>核实通过，标记生效</td></tr>
          <tr><td class="num">{{ curNs.at }}</td><td>{{ curNs.by }}：{{ curNs.st }}{{ curNs.log ? '（' + curNs.log + '）' : '' }}</td></tr>
        </tbody></table>
      </template>
    </template>
    <template #footer>
      <template v-if="nsMode === 'verify'">
        <el-button @click="nsDlg = false">取消</el-button>
        <el-button :disabled="!nsRv.note" @click="nsDo('待补充')">要求补充</el-button>
        <el-button type="danger" plain :disabled="!nsRv.note" @click="nsDo('已驳回')">驳回</el-button>
        <el-button type="primary" :disabled="!['a', 'b', 'c'].every((k) => nsRv.checks.indexOf(k) >= 0)" @click="nsDo('已生效')">核实通过</el-button>
      </template>
      <template v-else-if="nsMode === 'recheck'">
        <el-button @click="nsDlg = false">取消</el-button>
        <el-button v-if="nsRv.reason === '维持'" type="primary" :disabled="!nsRv.note" @click="nsDo('维持')">维持标记</el-button>
        <el-button v-else type="danger" :disabled="!(nsRv.reason && nsRv.note && nsRv.heard)" @click="nsDo('已撤销')">确认撤销</el-button>
      </template>
      <el-button v-else type="primary" @click="nsDlg = false">关闭</el-button>
    </template>
  </el-dialog>

    A('画像审核', '青岛顺通钢铁有限公司', '下游', '覆盖声明变更：全量上传 → 部分上传：仅主营大类', '2026-11-22 16:44', 46, { p: { cat: '中厚板', scale: '20–50 万吨', brands: '云岭', cover: '部分上传：仅主营大类', match: true } }),
    A('上架审核', '武汉正阳钢铁贸易有限公司', '下游', '申请上架：匿名带编号', '2026-11-24 10:02', 4, { listing: '匿名带编号', q: 'B', days: 27, map: 96.8, region: '华中', abbr: '建材' }),
    A('上架审核', '宁波天润物贸有限公司', '下游', '申请上架：实名', '2026-11-24 08:55', 5, { listing: '实名', q: 'A', days: 30, map: 98.9, region: '华东', abbr: '热卷' }),
    A('上架审核', '郑州久隆实业有限公司', '下游', '申请上架：只对指定钢厂可见（指定 2 家）', '2026-11-23 17:40', 20, { listing: '只对指定钢厂可见', q: 'B', days: 24, map: 95.2, region: '华中', abbr: '型钢' }),
    A('上架审核', '佛山联众金属材料有限公司', '下游', '上架方式变更：实名 → 匿名带编号', '2026-11-23 14:18', 24, { listing: '匿名带编号', q: 'A', days: 29, map: 97.6, region: '华南', abbr: '管材' }),
    A('上架审核', '天津佳合钢铁有限公司', '下游', '申请上架：匿名带编号', '2026-11-22 15:36', 47, { listing: '匿名带编号', q: 'C', days: 21, map: 91.4, region: '华北', abbr: '冷镀' }),
  ];

  STP.mount({
    data() {
      return {
        tab: /[?&]tab=ns\b/.test(location.search) ? 'ns' : 'dn', NS: M.REF.noStock, S: M.REF.std, nsF: '', nsDlg: false, nsMode: 'verify', curNs: null, nsRv: { checks: [], reason: '', note: '', heard: false },
        page: 1, dnAll, ups, audits, steps: STEPS, mills: M.MILLS,
        provs: M.provinces.map((p) => p.name), listings: ['实名', '匿名带编号', '只对指定钢厂可见', '不上架'],
        f: { kw: '', prov: '', listing: '', status: '', quality: '', grain: '', price: '', source: '' }, sources: ['钢厂带动', '一级代理带动', '平台运营邀请', '自主注册'],
        auditTypes: ['准入审核', '身份类型认定', '画像审核', '上架审核'], auditType: '',
        drawer: false, cur: null, quotaDlg: false, quota: { qps: 600, batch: 1000, reason: '' },
        upDlg: false, curUp: null,
        auditDlg: false, curAudit: null, rv: { checks: [], kind: '钢铁生产企业', group: '', anon: '', note: '' },
      };
    },
    computed: {
      filtered() {
        const f = this.f;
        return this.dnAll.filter((e) => (!f.kw || (e.name + e.id + e.anon).indexOf(f.kw) >= 0) && (!f.prov || e.prov === f.prov) && (!f.listing || e.listing === f.listing)
          && (!f.status || e.status === f.status) && (!f.quality || e.quality === f.quality) && (!f.grain || e.grain === f.grain) && (!f.price || (f.price === 'on') === this.priceOn(e)) && (!f.source || e.source === f.source));
      },
      pageRows() { return this.filtered.slice((this.page - 1) * 10, this.page * 10); },
      nsRows() { const f = this.nsF; return this.NS.list.filter((r) => !f || (f === '待复核' ? r.st === '已生效' && r.recheck : f === '待核实' ? r.st === '待核实' || r.st === '待补充' : r.st === f)); },
      nsRecheckN() { return this.NS.list.filter((r) => r.st === '已生效' && r.recheck).length; },
      nsTodo() { return this.nsCount('待核实') + this.nsCount('待补充') + this.nsRecheckN; },
      auditRows() { return this.audits.filter((a) => !this.auditType || a.type === this.auditType); },
      canPass() {
        const a = this.curAudit; if (!a) return false;
        if (a.type === '准入审核') return this.rv.checks.length === (a.src === '钢厂带动' || a.src === '一级代理带动' ? 5 : 4);
        if (a.type === '上架审核') return !!this.rv.anon;
        return true;
      },
    },
    watch: { f: { deep: true, handler() { this.page = 1; } } },
    methods: {
      priceOn(e) { return e.id === 'E100000' ? this.$state.dnPrice === 'on' : e.priceOn; },
      listingType(l) { return l === '实名' ? 'success' : l === '匿名带编号' ? 'primary' : l === '不上架' ? 'info' : 'warning'; },
      upType(s) { return s === '订阅中' ? 'success' : s === '即将到期' ? 'warning' : 'info'; },
      auditTag(t) { return { 准入审核: 'primary', 身份类型认定: 'warning', 画像审核: 'success', 上架审核: 'danger' }[t]; },
      nsCount(s) { return this.NS.list.filter((r) => r.st === s).length; },
      nsTag(s) { return { 待核实: 'warning', 待补充: 'warning', 已生效: 'success', 已撤销: 'info', 已驳回: 'danger', 已到期: 'info' }[s]; },
      nsLate(r) { return +r.applyAt.slice(8, 10) > this.NS.deadlineDay; },
      nsEffect(r) { const ym = r.applyAt.slice(0, 7); if (!this.nsLate(r)) return ym; const y = +ym.slice(0, 4), m = +ym.slice(5); return m === 12 ? (y + 1) + '-01' : y + '-' + (m < 9 ? '0' : '') + (m + 1); },
      nsOpen(row, mode) { this.curNs = row; this.nsMode = mode; this.nsRv = { checks: [], reason: '', note: '', heard: false }; this.nsDlg = true; },
      nsDo(act) {
        const r = this.curNs, P = this.NS.platform, now = M.TODAY + ' 14:20';
        const log = (this.nsRv.reason && this.nsRv.reason !== '维持' ? this.nsRv.reason + '：' : '') + this.nsRv.note;
        if (act === '已生效') { Object.assign(r, { st: act, since: this.nsEffect(r), until: '2027-11-30', at: now, by: '林若彤', log }); P.active++; }
        else if (act === '已驳回') { Object.assign(r, { st: act, at: now, by: '林若彤', log }); P.rejected++; }
        else if (act === '待补充') { Object.assign(r, { st: act, log }); }
        else if (act === '维持') { r.recheck = null; }
        else { Object.assign(r, { st: act, recheck: null, at: now, by: '林若彤', log }); P.active--; P.revoked++; }
        this.nsDlg = false;
        this.$demo({ 已生效: '核实通过：' + r.ent + ' 自 ' + r.since + ' 周期起不参加达标评定；已通知企业', 已驳回: '已驳回并通知企业：' + r.ent, 待补充: '已要求企业补充：' + r.ent, 维持: '复核结论：维持标记。' + r.ent, 已撤销: '已撤销标记并通知企业：' + r.ent }[act]);
      },
      auditCount(t) { return this.audits.filter((a) => a.type === t).length; },
      resetFilter() { this.f = { kw: '', prov: '', listing: '', status: '', quality: '', grain: '', price: '', source: '' }; },
      open(row) { this.cur = row; this.drawer = true; },
      openUp(row) { this.curUp = row; this.upDlg = true; },
      rowCmd(c, row) {
        if (c === '工单') { this.$go('audit.html'); return; }
        if (c === '下架') {
          ElementPlus.ElMessageBox.confirm('下架后该企业不再出现在企业名录中，已订阅的名额不受影响。确认下架「' + row.name + '」？', '从名录下架', { type: 'warning', confirmButtonText: '确认下架', cancelButtonText: '取消' })
            .then(() => { row.listing = '不上架'; this.$demo('已下架，操作已留痕并通知企业'); }).catch(() => {});
          return;
        }
        this.setStatus(row, c);
      },
      setStatus(row, s) {
        const tip = { 暂停: '暂停后该企业的数据不再参与聚合，订阅其的名额将冻结，上游可免费替换或顺延。', 正常: '恢复后该企业的数据自恢复日起重新参与聚合，冻结名额解冻。', 退出: '退出后名额释放，上游可免费替换；历史聚合结果不重算。此操作需企业已完成退出流程。' }[s];
        ElementPlus.ElMessageBox.confirm(tip + '确认将「' + row.name + '」的板块状态改为“' + s + '”？', '状态变更', { type: 'warning', confirmButtonText: '确认', cancelButtonText: '取消' })
          .then(() => { row.status = s; this.$demo('状态已变更为“' + s + '”，已留痕并通知企业与相关上游'); }).catch(() => {});
      },
      toggleApp(app) { app.on = !app.on; this.$demo(app.on ? '应用已启用' : '应用已停用，该来源系统的上传将被拒绝'); },
      saveQuota() { this.cur.qps = this.quota.qps; this.cur.batch = this.quota.batch; this.quotaDlg = false; this.$demo('限流配额已调整，立即生效并留痕'); },
      addRel() {
        ElementPlus.ElMessageBox.prompt('请输入关联企业名称（同一集团或同一实际控制人）', '登记关联关系', { confirmButtonText: '登记', cancelButtonText: '取消', inputValue: '东岳钢铁集团有限公司' })
          .then(({ value }) => { if (value) { this.cur.rels.push({ name: value, rel: '钢厂关联的贸易公司', src: '运营登记' }); this.cur.group = value.replace(/有限公司$/, ''); this.$demo('关联关系已登记，名录将标注“关联企业”'); } }).catch(() => {});
      },
      openAudit(row) {
        this.curAudit = row;
        this.rv = { checks: [], kind: row.name.indexOf('物资') >= 0 ? '钢厂关联贸易公司' : row.name.indexOf('万隆') >= 0 ? '贸易企业' : '钢铁生产企业', group: row.name.indexOf('东岳') >= 0 ? '东岳钢铁' : '', anon: '', note: '' };
        this.auditDlg = true;
      },
      genAnon() { const a = this.curAudit; this.rv.anon = a.region + '·' + a.abbr + '·A' + String(1000 + Math.floor(Math.random() * 8999)).slice(-4); },
      doAudit(pass) {
        const a = this.curAudit;
        this.audits.splice(this.audits.indexOf(a), 1);
        this.auditDlg = false;
        this.$demo(pass ? a.type + '已通过：' + a.name + (this.rv.anon ? '，匿名编号 ' + this.rv.anon : '') : '已驳回并通知企业：' + a.name);
      },
    },
  });
})();
</script>
