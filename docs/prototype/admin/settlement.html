<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分成结算 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.el-descriptions__label { white-space: nowrap; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.sec-title i { width: 4px; height: 14px; border-radius: 2px; background: var(--el-color-primary); display: inline-block; }
.sec-title small { font-weight: 400; color: var(--stp-sub); font-size: 12px; }
.sec-title.mt16 { margin-top: 18px; }
.demo-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.duty { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 8px; }
.duty > div { background: #fff; border: 1px solid #f3dfb8; border-radius: 4px; padding: 6px 10px; font-size: 12px; line-height: 1.7; color: #4a5568; }
.duty b { color: #1f2d3d; }
.duty > div.on { border-color: #9ad6b4; background: #f3fbf6; }
.duty .el-tag { margin-left: 8px; }
.flow-line { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4a5568; flex-wrap: wrap; }
.flow-line span { padding: 2px 10px; border-radius: 12px; background: #eef4fb; color: #2b5d9b; }
.neg { color: #e5484d; }
.ok-t { color: #18a058; } .bad-t { color: #e5484d; }
.stat.click { cursor: pointer; }
.stat.click:hover { border-color: #a8d2ff; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" :user="me" :role="roleOf(me)" active="settlement" title="分成结算"
  desc="按结算周期汇总每日计提，生成结算单；下游确认并开票后，平台对公付款。结算数据只引用名额、订单和企业标识，不含任何企业上传的业务明细。">
  <template #actions>
    <el-dropdown trigger="click" @command="v => me = v">
      <el-button><el-icon><UserFilled /></el-icon>原型状态 · 当前操作人：{{ me }}（{{ roleOf(me) }}）<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
      <template #dropdown><el-dropdown-menu>
        <el-dropdown-item v-for="s in staff" :key="s.n" :command="s.n" :disabled="s.n===me">{{ s.n }}（{{ s.r }}）</el-dropdown-item>
      </el-dropdown-menu></template>
    </el-dropdown>
    <el-button type="primary" @click="genDlg=true"><el-icon><DocumentAdd /></el-icon>生成结算单</el-button>
  </template>

  <div class="grid c6">
    <stat-card label="2026-10 结算单数" :value="4186" unit="张" note="每家企业每期一张" tip="只为当期有计提、冲正或结转余额的下游企业生成结算单；已上架但当期没有被订阅的企业不生成"></stat-card>
    <stat-card label="应付合计" :value="612.5" :d="1" unit="万元" tip="计提合计 6,149,236 − 冲正 18,421 + 上期结转转入 86,512 − 结转到下期 91,846 = 6,125,481 元。结算金额按月四舍五入到元。" note="6,125,481 元"></stat-card>
    <div class="stat click" @click="tab='st'; sf.st='待审核'"><div class="label">待审核</div><div class="value num">{{ auditLeft }}<span class="unit">张</span></div><div class="foot"><span>审核后发布给下游确认</span></div></div>
    <div class="stat click" @click="tab='pay'"><div class="label">待付款批次</div><div class="value num">{{ batches.filter(b => b.st==='待发起' || b.st==='待复核').length }}<span class="unit">个</span></div><div class="foot"><span>待发起 {{ batches.filter(b => b.st==='待发起').length }} · 待复核 {{ batches.filter(b => b.st==='待复核').length }}</span></div></div>
    <div class="stat click" @click="tab='dispute'"><div class="label">异议与冻结</div><div class="value num">{{ disputeOpen + 4 }}<span class="unit">家</span></div><div class="foot"><span>异议 {{ disputeOpen }} · 冻结 4</span></div></div>
    <div class="stat click" @click="tab='carry'"><div class="label">结转到下期</div><div class="value num">412<span class="unit">家</span></div><div class="foot"><span>合计 91,846 元</span></div></div>
  </div>

  <div class="tip-box orange small" style="margin-bottom:14px">
    <b><el-icon style="vertical-align:-2px"><Lock /></el-icon> 职责分离：</b>分成规则修改、结算单审核、付款操作分别由不同角色完成，并各自双人复核；付款只能付到与认证主体一致的对公账户；收款账户变更有冷静期并通知企业。
    <div class="duty">
      <div><b>分成规则修改</b>　运营主管或财务提交，另一人复核　<a href="share-rules.html">分成规则与台账</a></div>
      <div :class="{on: can('audit')}"><b>结算单审核</b>　财务（结算岗）审核，审核人记录在结算单上<el-tag v-if="can('audit')" size="small" type="success" disable-transitions>当前可审核</el-tag></div>
      <div :class="{on: can('pay') || can('payReview')}"><b>付款操作</b>　财务（出纳岗）发起，财务主管复核后才提交银行<el-tag v-if="can('pay') || can('payReview')" size="small" type="success" disable-transitions>当前可{{ can('pay') ? '发起' : '复核' }}</el-tag></div>
    </div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- ============ 结算单 ============ -->
      <el-tab-pane label="结算单" name="st">
        <div class="filter-bar">
          <el-select v-model="sf.period" style="width:130px"><el-option label="2026-10" value="2026-10" /><el-option label="2026-09" value="2026-09" /></el-select>
          <el-select v-model="sf.st" clearable placeholder="全部状态" style="width:150px"><el-option v-for="s in stStatus" :key="s" :label="s" :value="s" /></el-select>
          <el-input v-model="sf.kw" clearable placeholder="下游企业 / 结算单号" style="width:240px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <span style="flex:1"></span>
          <div class="flow-line"><span>生成</span>›<span>平台审核</span>›<span>下游确认</span>›<span>下游开票</span>›<span>平台付款</span></div>
          <el-button :disabled="!auditLeft" @click="batchAudit"><el-icon><Finished /></el-icon>批量审核通过（{{ auditLeft }}）</el-button>
        </div>
        <el-table :data="stRows" border size="small">
          <template #empty><el-empty description="没有符合条件的结算单" :image-size="70" /></template>
          <el-table-column label="结算单号" width="146"><template #default="{row}"><a href="javascript:;" class="num" @click="openSt(row)">{{ row.id }}</a></template></el-table-column>
          <el-table-column prop="period" label="期间" width="80" />
          <el-table-column label="下游企业" min-width="210"><template #default="{row}">{{ row.ent }}</template></el-table-column>
          <el-table-column label="计提合计" width="106" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.acc) }}</span></template></el-table-column>
          <el-table-column label="冲正" width="90" align="right"><template #default="{row}"><span class="num" :class="{neg: row.rev}">{{ row.rev ? $fmt(row.rev) : '0' }}</span></template></el-table-column>
          <el-table-column label="上期结转" width="90" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.carry) }}</span></template></el-table-column>
          <el-table-column label="应付金额" width="106" align="right"><template #default="{row}"><b class="num">{{ $fmt(row.pay) }}</b></template></el-table-column>
          <el-table-column label="状态" width="170">
            <template #default="{row}"><el-tag size="small" :type="stType(row.st)" disable-transitions>{{ row.st }}</el-tag><div v-if="row.sub" class="small muted">{{ row.sub }}</div></template>
          </el-table-column>
          <el-table-column label="操作" width="76" align="center"><template #default="{row}"><el-button link type="primary" @click="openSt(row)">{{ row.st==='待审核' ? '审核' : '查看' }}</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>当前显示 {{ stRows.length }} 张（原型示例数据）；金额单位：元，计提金额按月四舍五入到元。{{ sf.period }} 结算期共 {{ sf.period==='2026-10' ? '4,186' : '4,102' }} 张</span><el-pagination layout="prev, pager, next" :total="4186" :page-size="50" small background /></div>
      </el-tab-pane>

      <!-- ============ 异议处理 ============ -->
      <el-tab-pane name="dispute">
        <template #label>异议处理<el-badge v-if="disputeOpen" :value="disputeOpen" style="margin-left:6px" /></template>
        <div class="tip-box blue small mb12">下游企业对结算单有异议时，结算单进入“有异议”状态，暂停开票与付款。答复时<b>不得披露订阅钢厂的名称，也不按钢厂拆分金额</b>，只说明名额日数、系数与规则版本。</div>
        <el-table :data="disputes" border size="small">
          <el-table-column label="下游企业" min-width="200"><template #default="{row}">{{ row.ent }}<div class="small muted num">{{ row.sid }}</div></template></el-table-column>
          <el-table-column prop="period" label="期间" width="80" />
          <el-table-column prop="text" label="异议内容" min-width="300" />
          <el-table-column label="提出时间" width="140"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="处理状态" width="190"><template #default="{row}"><el-tag size="small" :type="row.st==='待处理' ? 'danger' : row.st==='处理中' ? 'warning' : 'success'" disable-transitions>{{ row.st }}</el-tag><div v-if="row.by" class="small muted">{{ row.by }}</div></template></el-table-column>
          <el-table-column label="操作" width="76" align="center"><template #default="{row}"><el-button link type="primary" @click="openDispute(row)">{{ row.st==='待处理' || row.st==='处理中' ? '处理' : '查看' }}</el-button></template></el-table-column>
        </el-table>
        <div class="small muted mt8">另有 4 家企业因涉嫌造假或反刷量命中被冻结待付金额，在<a href="share-rules.html">分成规则与台账 › 冻结与追回</a>处理。</div>
      </el-tab-pane>

      <!-- ============ 发票核对 ============ -->
      <el-tab-pane label="发票核对" name="inv">
        <div class="tip-box small mb12">下游确认结算单后上传发票。系统自动比对两项：<b>开票主体与企业认证主体是否一致</b>、<b>发票金额与应付金额是否一致</b>；两项都一致且人工核对通过后，结算单进入“待付款”。发票类型与税费承担方式待财务与法务确定（N-17）。</div>
        <el-table :data="invRows" border size="small">
          <el-table-column label="下游企业（认证主体）" min-width="200"><template #default="{row}">{{ row.ent }}<div class="small muted num">{{ row.sid }}</div></template></el-table-column>
          <el-table-column label="发票号码" width="170"><template #default="{row}"><span class="num">{{ row.no }}</span></template></el-table-column>
          <el-table-column label="开票主体" min-width="200"><template #default="{row}">{{ row.issuer }}<div class="small" :class="row.issuer===row.ent ? 'ok-t' : 'bad-t'">{{ row.issuer===row.ent ? '与认证主体一致' : '与认证主体不一致' }}</div></template></el-table-column>
          <el-table-column label="发票金额" width="100" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.amt, 2) }}</span></template></el-table-column>
          <el-table-column label="应付金额" width="100" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.pay, 2) }}</span><div class="small" :class="row.amt===row.pay ? 'ok-t' : 'bad-t'">{{ row.amt===row.pay ? '金额一致' : '相差 ' + $fmt(Math.abs(row.amt - row.pay), 2) }}</div></template></el-table-column>
          <el-table-column label="上传时间" width="136"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="核对结果" width="96"><template #default="{row}"><el-tag size="small" :type="row.st==='待核对' ? 'warning' : row.st==='通过' ? 'success' : 'danger'" disable-transitions>{{ row.st }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="126" align="center">
            <template #default="{row}">
              <template v-if="row.st==='待核对'">
                <el-tooltip :disabled="invOk(row)" content="开票主体或金额不一致，不能通过，请退回企业重开" placement="top"><span><el-button link type="success" :disabled="!invOk(row)" @click="checkInv(row, true)">通过</el-button></span></el-tooltip>
                <el-button link type="danger" @click="checkInv(row, false)">退回</el-button>
              </template>
              <el-button v-else link type="primary" @click="$info('原型演示：查看已归档的发票影像')">查看发票</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-tab-pane>

      <!-- ============ 付款批次 ============ -->
      <el-tab-pane name="pay">
        <template #label>付款批次与付款记录<el-badge v-if="batches.filter(b => b.st==='待复核').length" :value="batches.filter(b => b.st==='待复核').length" style="margin-left:6px" /></template>
        <el-alert type="warning" show-icon :closable="false">
          <template #title>付款<b>只付到与认证主体一致的对公账户</b>。付款批次每月 10 日、25 日各一批。财务（出纳岗）发起付款后，须由<b>另一人（财务主管）复核</b>才会提交银行，发起人不能复核自己发起的批次；结算单审核人不参与付款。当前操作人：{{ me }}（{{ roleOf(me) }}）。</template>
        </el-alert>
        <el-table :data="batches" border size="small">
          <el-table-column label="批次号" width="150"><template #default="{row}"><a href="javascript:;" class="num" @click="openBatch(row)">{{ row.id }}</a></template></el-table-column>
          <el-table-column prop="period" label="结算期" min-width="190" />
          <el-table-column label="笔数" width="80" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.n) }}</span></template></el-table-column>
          <el-table-column label="金额（元）" width="130" align="right"><template #default="{row}"><b class="num">{{ $fmt(row.amt, 2) }}</b></template></el-table-column>
          <el-table-column label="发起" width="136"><template #default="{row}"><template v-if="row.by">{{ row.by }}<div class="small muted num">{{ row.byT }}</div></template><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="复核" width="136"><template #default="{row}"><template v-if="row.rv">{{ row.rv }}<div class="small muted num">{{ row.rvT }}</div></template><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="状态" width="150"><template #default="{row}"><el-tag size="small" :type="payType(row.st)" disable-transitions>{{ row.st }}</el-tag><div v-if="row.fail" class="small bad-t">失败 {{ row.fail }} 笔</div></template></el-table-column>
          <el-table-column label="操作" width="170" align="center">
            <template #default="{row}">
              <el-tooltip v-if="row.st==='待发起'" :disabled="can('pay')" :content="need('pay')" placement="top"><span><el-button link type="primary" :disabled="!can('pay')" @click="startPay(row)">发起付款</el-button></span></el-tooltip>
              <template v-else-if="row.st==='待复核'">
                <el-tooltip :disabled="row.by!==me && can('payReview')" :content="row.by===me ? '发起人不能复核自己发起的批次，请切换操作人为财务主管秦海峰' : need('payReview')" placement="top"><span><el-button link type="success" :disabled="row.by===me || !can('payReview')" @click="reviewPay(row, true)">复核通过</el-button></span></el-tooltip>
                <el-button link type="danger" :disabled="row.by===me || !can('payReview')" @click="reviewPay(row, false)">退回</el-button>
              </template>
              <el-button v-else-if="row.st==='部分失败'" link type="warning" @click="retry(row)">失败重付</el-button>
              <el-button v-if="row.st==='已完成' || row.st==='部分失败'" link type="primary" @click="$info('原型演示：下载批次 ' + row.id + ' 的银行付款凭证（电子回单）')">付款凭证</el-button>
              <el-button v-if="row.st!=='已完成' && row.st!=='部分失败'" link type="primary" @click="openBatch(row)">明细</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-tab-pane>

      <!-- ============ 冲正记录 ============ -->
      <el-tab-pane label="冲正记录" name="rev">
        <div class="tip-box small mb12">上游退款、订单取消、名额补偿导致名额日台账变化时，系统自动生成分成冲正。<b>未付部分</b>在当期或下一期结算单中直接扣减；<b>已付部分</b>不向企业追款，从该企业的后续结算中扣减。<span class="demo-tag">已付部分的处理方式待确认（N-23）</span></div>
        <el-table :data="reversals" border size="small">
          <el-table-column label="冲正单号" width="146"><template #default="{row}"><span class="num">{{ row.id }}</span></template></el-table-column>
          <el-table-column label="来源" width="100"><template #default="{row}"><el-tag size="small" :type="row.src==='上游退款' ? 'danger' : row.src==='订单取消' ? 'warning' : 'primary'" disable-transitions>{{ row.src }}</el-tag></template></el-table-column>
          <el-table-column label="关联订单" width="160"><template #default="{row}"><span class="num">{{ row.no }}</span></template></el-table-column>
          <el-table-column label="下游企业" min-width="190"><template #default="{row}">{{ row.ent }}</template></el-table-column>
          <el-table-column label="原计提期间" width="190"><template #default="{row}"><span class="num">{{ row.range }}</span></template></el-table-column>
          <el-table-column label="名额日" width="70" align="right"><template #default="{row}"><span class="num">{{ row.days }}</span></template></el-table-column>
          <el-table-column label="冲正金额" width="96" align="right"><template #default="{row}"><span class="num neg">{{ $fmt(row.amt) }}</span></template></el-table-column>
          <el-table-column label="处理方式 / 状态" min-width="190"><template #default="{row}"><span class="dot" :class="row.done ? 'ok' : 'warn'"></span>{{ row.how }}</template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>2026-10 结算期冲正合计 <b class="neg num">-18,421</b> 元；当前显示 {{ reversals.length }} 条示例（首条属于 2026-11 结算期）。每条冲正可追溯到名额日台账的冲正行，见<a href="share-rules.html">分成规则与台账</a>；上游退款审核见<a href="billing.html">订单与计费</a>。</span></div>
      </el-tab-pane>

      <!-- ============ 结转管理 ============ -->
      <el-tab-pane label="结转管理" name="carry">
        <div class="filter-bar">
          <span>起付金额 <b class="num">500</b> 元<span class="demo-tag" style="margin-left:6px">示例参数，待业务方确定</span></span>
          <span class="muted small">应付金额低于起付金额的结算单不进入开票与付款，金额自动结转到下期，累计达到起付金额后一并结算。</span>
          <span style="flex:1"></span>
          <el-button @click="$demo('已向 412 家结转企业发送站内通知，说明结转金额与预计可结算期间')"><el-icon><Bell /></el-icon>通知结转企业</el-button>
        </div>
        <el-table :data="carries" border size="small">
          <el-table-column label="下游企业" min-width="220"><template #default="{row}">{{ row.ent }}</template></el-table-column>
          <el-table-column label="结转起始期间" width="120"><template #default="{row}"><span class="num">{{ row.from }}</span></template></el-table-column>
          <el-table-column label="已结转期数" width="100" align="right"><template #default="{row}"><span class="num">{{ row.n }}</span></template></el-table-column>
          <el-table-column label="2026-10 计提" width="120" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.acc) }}</span></template></el-table-column>
          <el-table-column label="累计结转金额" width="130" align="right"><template #default="{row}"><b class="num">{{ $fmt(row.total) }}</b></template></el-table-column>
          <el-table-column label="距起付金额" min-width="200"><template #default="{row}"><el-progress :percentage="Math.round(row.total / 5)" :stroke-width="8" /></template></el-table-column>
          <el-table-column label="预计可结算" width="120"><template #default="{row}">{{ row.eta }}</template></el-table-column>
        </el-table>

    },
    computed: {
      stRows() { const f = this.sf, kw = f.kw.trim(); return this.sts.filter((s) => s.period === f.period && (!f.st || s.st === f.st) && (!kw || (s.ent + s.id).indexOf(kw) >= 0)); },
      auditLeft() { return this.auditOther + this.sts.filter((s) => s.st === '待审核').length; },
      disputeOpen() { return this.disputes.filter((d) => d.st === '待处理' || d.st === '处理中').length; },
      invRows() { return this.invs; },
    },
    methods: {
      roleOf(n) { return STAFF.find((s) => s.n === n).r; },
      can(k) { return STAFF.find((s) => s.n === this.me).can.indexOf(k) >= 0; },
      need(k) { return NEED[k]; },
      deny(k) { if (this.can(k)) return false; warn(NEED[k]); return true; },
      stType(s) { return { 待审核: 'info', 待确认: 'warning', 待开票: 'warning', 待付款: 'primary', 已付款: 'success', 有异议: 'danger', 已冻结: 'danger', 结转下期: 'info' }[s]; },
      payType(s) { return { 待发起: 'info', 待复核: 'warning', 付款中: 'primary', 已完成: 'success', 部分失败: 'danger' }[s]; },
      openSt(r) { this.sd = { show: true, r, note: '' }; },
      audit(pass) {
        const r = this.sd.r;
        if (this.deny('audit')) return;
        if (!pass && !this.sd.note.trim()) return warn('退回重算时请填写审核意见');
        if (pass) {
          const sum = r.acc + r.rev + r.carry;
          Object.assign(r, { auditBy: this.me, auditT: nowStr() }, sum < 500 ? { st: '结转下期', pay: 0, sub: '低于起付金额 500 元' } : { st: '待确认', sub: '已发布给下游确认' });
          this.$demo(sum < 500 ? '审核通过。应付低于起付金额，已自动结转到下期' : '审核通过，结算单已发布给下游确认');
        } else { r.sub = '已退回重算：' + this.sd.note; this.$demo('已退回重算，重新生成后仍为“待审核”'); }
        this.sd.show = false;
      },
      batchAudit() {
        if (this.deny('audit')) return;
        ElementPlus.ElMessageBox.confirm('将对系统校验全部通过的结算单批量审核通过并发布给下游；存在校验提示的结算单会保留为“待审核”，需逐张处理。', '批量审核通过', { type: 'warning', confirmButtonText: '确认', cancelButtonText: '取消' }).then(() => {
          const t = nowStr(); let kept = 0;
          this.sts.filter((s) => s.st === '待审核').forEach((r) => {
            if (r.checks.some((c) => !c[0])) { kept++; return; }
            const sum = r.acc + r.rev + r.carry;
            Object.assign(r, { auditBy: this.me, auditT: t }, sum < 500 ? { st: '结转下期', pay: 0, sub: '低于起付金额 500 元' } : { st: '待确认', sub: '已发布给下游确认' });
          });
          this.auditOther = 0;
          this.$demo('批量审核完成' + (kept ? '；' + kept + ' 张存在校验提示，保留为待审核' : ''));
        }).catch(() => {});
      },
      doGen() { if (this.deny('audit')) return; this.genDlg = false; this.$demo('结算单生成任务已提交：2026-10，' + (this.gen.scope === 'pending' ? '重新生成待审核的 ' + this.auditLeft + ' 张' : '指定企业') + '。完成后状态为“待审核”。'); },
      openDispute(r) { this.dd = { show: true, r, concl: '已答复，维持原结算单', reply: '' }; },
      doDispute() {
        const d = this.dd, r = d.r;
        if (this.deny('dispute')) return;
        r.st = d.concl; r.by = this.me + (d.concl === '处理中' ? ' 跟进中' : ''); r.reply = d.reply;
        const s = this.sts.find((x) => x.id === r.sid);
        if (s && d.concl !== '处理中') { s.st = d.concl.indexOf('调整') >= 0 ? '待审核' : '待确认'; s.sub = d.concl.indexOf('调整') >= 0 ? '异议成立，已重新生成' : '异议已答复，待企业确认'; if (s.st === '待审核') { s.auditBy = ''; } }
        d.show = false; this.$demo(d.concl === '处理中' ? '已记录，继续核查' : '处理结果已答复企业');
      },
      invOk(r) { return r.issuer === r.ent && r.amt === r.pay; },
      checkInv(r, pass) {
        if (this.deny('invoice')) return;
        r.st = pass ? '通过' : '退回';
        const s = this.sts.find((x) => x.id === r.sid);
        if (s && pass) { s.st = '待付款'; s.sub = '发票已核对，待列入付款批次'; }
        this.$demo(pass ? '发票核对通过并归档，结算单进入“待付款”' : '已退回企业，请按认证主体与应付金额重新开票');
      },
      startPay(b) {
        if (this.deny('pay')) return;
        ElementPlus.ElMessageBox.confirm('发起批次 ' + b.id + '：' + STP.fmt(b.n) + ' 笔，合计 ' + STP.fmt(b.amt, 2) + ' 元。发起后须由财务主管复核才会提交银行。', '发起付款', { type: 'warning', confirmButtonText: '确认发起', cancelButtonText: '取消' }).then(() => {
          Object.assign(b, { st: '待复核', by: this.me, byT: nowStr() });
          this.$demo('已发起，等待财务主管复核。发起人不能复核自己发起的批次。');
        }).catch(() => {});
      },
      reviewPay(b, pass) {
        if (b.by === this.me) return this.$info('发起人不能复核自己发起的批次');
        if (this.deny('payReview')) return;
        if (!pass) { Object.assign(b, { st: '待发起', by: '', byT: '' }); return this.$demo('已退回，批次恢复为“待发起”'); }
        ElementPlus.ElMessageBox.confirm('复核通过后，批次 ' + b.id + ' 将提交银行付款：' + STP.fmt(b.n) + ' 笔，合计 ' + STP.fmt(b.amt, 2) + ' 元，全部付到与认证主体一致的对公账户。', '复核付款批次', { type: 'warning', confirmButtonText: '复核通过', cancelButtonText: '取消' }).then(() => {
          Object.assign(b, { st: '付款中', rv: this.me, rvT: nowStr() });
          this.$demo('复核通过，批次已提交银行，付款中');
          setTimeout(() => {
            b.st = '已完成';
            this.sts.forEach((s) => { if (s.sub.indexOf(b.id) >= 0) { s.st = '已付款'; s.sub = '付款成功（原型演示）'; } });
            this.$demo('批次 ' + b.id + ' 付款完成，' + STP.fmt(b.n) + ' 笔全部成功');
          }, 2500);
        }).catch(() => {});
      },
      retry(b) {
        if (this.deny('pay')) return;
        ElementPlus.ElMessageBox.confirm('将为批次 ' + b.id + ' 中失败的 ' + b.fail + ' 笔生成重付批次（企业已更正收款账户的才会进入），重付同样须另一人复核。', '失败重付', { confirmButtonText: '生成重付批次', cancelButtonText: '取消' }).then(() => {
          const fl = this.batchLines(b).filter((l) => l.st === '付款失败'), amt = r2(fl.reduce((a, l) => a + l.amt, 0));
          this.batches.unshift({ id: 'PB-20261125-03', period: '2026-09（失败重付）', n: b.fail, amt, by: this.me, byT: nowStr(), rv: '', rvT: '', st: '待复核', fail: 0, src: fl });
          b.fail = 0; b.st = '已完成';
          this.$demo('已生成重付批次 PB-20261125-03，等待财务主管复核');
        }).catch(() => {});
      },
      openBatch(b) { this.bd = { show: true, b, lines: this.batchLines(b) }; },
      batchLines(b) {
        const stOf = () => (b.st === '已完成' || b.st === '部分失败' ? '付款成功' : b.st === '付款中' ? '银行处理中' : '待付款');
        if (b.src) return b.src.map((l) => Object.assign({}, l, { st: stOf(), why: '' }));
        /* 批次明细只列与结算单状态相符的企业：有对应结算单的取结算单号与应付金额，其余为示例行 */
        const NAMES = { 'PB-20261125-01': [HY, E[4]].concat(X.slice(0, 4)), 'PB-20261125-02': [E[5]].concat(X.slice(4, 9)), 'PB-20261110-01': [E[6]].concat(X.slice(9, 14)), 'PB-20261025-02': X.slice(0, 6), 'PB-20261025-01': [E[6]].concat(X.slice(6, 11)) };
        const period = b.period.slice(0, 7);
        const lines = (NAMES[b.id] || []).slice(0, Math.min(6, b.n)).map((ent, i) => {
          const failed = i < b.fail;
          const st = this.sts.find((x) => x.ent === ent && x.period === period && x.pay > 0);
          const hy = b.id === 'PB-20261125-01' && ent === HY;
          return { ent, sid: hy ? 'ST-202606-00321' : st ? st.id : 'ST-' + period.replace('-', '') + '-' + String(1000 + (M.hash(ent + b.id) % 9000)).padStart(5, '0'), acct: ent === HY ? '6718' : String(1000 + (M.hash(ent) % 9000)), amt: hy ? 2013 : st ? st.pay : Math.round(500 + (M.hash(ent + b.id) % 250000) / 100),
            st: failed ? '付款失败' : stOf(), why: failed ? ['银行退票：收款账户已销户', '银行退票：账户状态异常', '银行退票：开户行信息有误'][i] : '' };
        });
        return lines;
      },
    },
