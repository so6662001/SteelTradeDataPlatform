<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审计日志 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.el-descriptions__label { white-space: nowrap; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.sec-title i { width: 4px; height: 14px; border-radius: 2px; background: var(--el-color-primary); display: inline-block; }
.sec-title small { font-weight: 400; color: var(--stp-sub); font-size: 12px; }
.sec-title.mt16 { margin-top: 18px; }
.demo-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.sum-bar { display: flex; gap: 22px; flex-wrap: wrap; background: #f6f8fa; border-radius: 4px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; color: #4a5568; }
.sum-bar b { color: #1f2d3d; }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.rules > div { background: #fff; border: 1px solid var(--stp-border); border-radius: 6px; padding: 10px 14px; font-size: 12px; line-height: 1.75; color: #4a5568; }
.rules b { display: block; font-size: 13px; color: #1f2d3d; margin-bottom: 2px; }
.mono { font-family: Consolas, Menlo, monospace; font-size: 12px; }
.diff { background: #fff1d6; color: #9a5a00; border-radius: 3px; padding: 0 4px; font-weight: 600; }
.lv { display: inline-block; min-width: 26px; text-align: center; padding: 0 6px; border-radius: 3px; font-size: 12px; line-height: 20px; color: #fff; }
.lv.h { background: #e5484d; } .lv.m { background: #f0a020; } .lv.l { background: #8a94a6; }
.stat.click { cursor: pointer; }
.stat.click:hover { border-color: #a8d2ff; }
.exp { padding: 4px 16px 4px 48px; font-size: 12px; line-height: 1.9; color: #4a5568; }
.exp span { color: var(--stp-sub); display: inline-block; width: 84px; }
.act-list .el-radio { display: flex; height: auto; padding: 5px 0; align-items: flex-start; white-space: normal; margin-right: 0; }
.act-list .el-radio__input { margin-top: 3px; }
.act-list small { display: block; color: var(--stp-sub); font-size: 12px; line-height: 1.5; font-weight: 400; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" :user="me" :role="roleOf(me)" active="audit" title="审计日志"
  desc="检索上游查询与导出记录，处置异常查询告警，管理平台人员明细访问工单，查看全部关键操作日志。审计只记录查询条件与单元格计数，不记录返回的数值。">
  <template #actions>
    <el-dropdown trigger="click" @command="v => me = v">
      <el-button><el-icon><UserFilled /></el-icon>原型状态 · 当前操作人：{{ me }}（{{ roleOf(me) }}）<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
      <template #dropdown><el-dropdown-menu>
        <el-dropdown-item v-for="s in staff" :key="s.n" :command="s.n" :disabled="s.n===me">{{ s.n }}（{{ s.r }}）</el-dropdown-item>
      </el-dropdown-menu></template>
    </el-dropdown>
    <el-button :loading="verify.on" @click="runVerify"><el-icon v-if="!verify.on"><CircleCheck /></el-icon>校验日志完整性</el-button>
    <el-button type="primary" @click="newTicket"><el-icon><Tickets /></el-icon>新建明细访问工单</el-button>
  </template>

  <div class="grid c6">
    <stat-card label="昨日查询次数" :value="18642" unit="次" note="涉及上游 312 家"></stat-card>
    <stat-card label="昨日屏蔽单元格占比" :value="12.4" :d="1" unit="%" tip="被屏蔽的单元格数 ÷ 命中的单元格总数，全平台口径"></stat-card>
    <stat-card label="昨日导出" :value="214" unit="次" note="全部带水印与文件指纹"></stat-card>
    <div class="stat click" @click="tab='alert'"><div class="label">待处置告警</div><div class="value num" :style="{color: alertTodo ? '#e5484d' : ''}">{{ alertTodo }}<span class="unit">条</span></div><div class="foot"><span>待复核 {{ alerts.filter(a => a.st==='终止服务待复核').length }} 条</span></div></div>
    <div class="stat click" @click="tab='ticket'"><div class="label">明细访问工单</div><div class="value num">{{ tickets.filter(t => t.st==='开放中').length }}<span class="unit">个开放中</span></div><div class="foot"><span>待企业授权 {{ tickets.filter(t => t.st==='待企业授权').length }} 个</span></div></div>
    <div class="stat"><div class="label">日志完整性</div><div class="value" style="font-size:20px;color:#18a058">校验通过</div><div class="foot"><span>最近校验 {{ verify.last }}</span></div></div>
  </div>

  <div class="rules">
    <div><b><el-icon style="vertical-align:-2px"><Lock /></el-icon> 日志不可篡改</b>日志只能追加，不提供修改与删除功能；每条日志带序号并与上一条链式校验，每日 02:00 自动做完整性校验。</div>
    <div><b><el-icon style="vertical-align:-2px"><Timer /></el-icon> 留存期限</b>网络日志保留不少于 6 个月（法定最低要求）；业务审计日志建议保留 3 年。<span class="demo-tag">3 年为建议值，待业务方确定</span></div>
    <div><b><el-icon style="vertical-align:-2px"><Switch /></el-icon> 角色互斥</b>安全审计员与运营角色互斥，同一账号不能同时持有。安全审计员处置告警但不能申请查看明细；运营角色不能处置告警。</div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- ============ 查询审计 ============ -->
      <el-tab-pane label="查询审计" name="query">
        <div class="filter-bar">
          <el-date-picker v-model="qf.range" type="daterange" value-format="YYYY-MM-DD" range-separator="至" :clearable="false" style="width:250px;flex:none" />
          <el-select v-model="qf.ent" clearable filterable placeholder="全部上游企业" style="width:220px"><el-option v-for="m in mills" :key="m" :label="m" :value="m" /></el-select>
          <el-input v-model="qf.acct" clearable placeholder="账号" style="width:140px" />
          <el-select v-model="qf.type" clearable placeholder="全部出口类型" style="width:150px"><el-option v-for="t in outTypes" :key="t" :label="t" :value="t" /></el-select>
          <el-checkbox v-model="qf.high">只看屏蔽占比 ≥ 30%</el-checkbox>
          <span style="flex:1"></span>
          <el-button @click="$demo('审计检索结果导出任务已创建。导出审计日志本身也会记入操作日志')"><el-icon><Download /></el-icon>导出检索结果</el-button>
        </div>
        <div class="sum-bar">
          <span>2026-11-23 全平台查询 <b class="num">18,642</b> 次</span>
          <span>看板 <b class="num">9,870</b></span><span>多维查询 <b class="num">7,426</b></span><span>导出 <b class="num">214</b></span><span>定时发送 <b class="num">1,132</b></span>
          <span>命中单元格 <b class="num">412.6</b> 万个</span><span>其中屏蔽 <b class="num">51.2</b> 万个（12.4%）</span>
        </div>
        <el-table :data="qRows" border size="small">
          <template #empty><el-empty description="没有符合条件的查询记录" :image-size="70" /></template>
          <el-table-column label="时间" width="136"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="上游企业" width="186"><template #default="{row}">{{ row.ent }}</template></el-table-column>
          <el-table-column label="账号" width="116"><template #default="{row}"><span class="mono">{{ row.acct }}</span></template></el-table-column>
          <el-table-column label="出口类型" width="92"><template #default="{row}"><el-tag size="small" :type="outType(row.type)" disable-transitions>{{ row.type }}</el-tag></template></el-table-column>
          <el-table-column label="查询条件摘要" min-width="270"><template #default="{row}">{{ row.cond }}<el-tag v-if="row.alert" size="small" type="danger" disable-transitions style="margin-left:6px">关联告警</el-tag></template></el-table-column>
          <el-table-column label="命中单元格" width="92" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.hit) }}</span></template></el-table-column>
          <el-table-column label="屏蔽单元格" width="92" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.mask) }}</span></template></el-table-column>
          <el-table-column label="屏蔽占比" width="80" align="right"><template #default="{row}"><span class="num" :style="{color: row.mask / row.hit >= 0.3 ? '#e5484d' : ''}">{{ (row.mask / row.hit * 100).toFixed(1) }}%</span></template></el-table-column>
          <el-table-column label="操作" width="62" align="center"><template #default="{row}"><el-button link type="primary" @click="openQuery(row)">详情</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>当前显示 {{ qRows.length }} 条（原型示例数据）。审计只记录条件与单元格计数，不保存返回给上游的聚合数值。</span><el-pagination layout="prev, pager, next" :total="18642" :page-size="50" small background /></div>
      </el-tab-pane>

      <!-- ============ 导出审计 ============ -->
      <el-tab-pane label="导出审计" name="export">
        <div class="filter-bar">
          <el-input v-model="ef.kw" clearable placeholder="导出编号 / 企业 / 账号 / 文件指纹" style="width:300px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <span class="muted small">每个导出文件带水印（企业、账号、时间、导出编号）与使用条款页；文件指纹用于泄露溯源。</span>
          <span style="flex:1"></span>
          <el-button type="primary" plain @click="trace = { show: true, q: exports[1].fp.slice(7, 13), hit: null, done: false }"><el-icon><Aim /></el-icon>泄露溯源</el-button>
        </div>
        <el-table :data="eRows" border size="small">
          <template #empty><el-empty description="没有符合条件的导出记录" :image-size="70" /></template>
          <el-table-column label="导出编号" width="150"><template #default="{row}"><span class="num">{{ row.id }}</span><div class="small muted num">{{ row.t }}</div></template></el-table-column>
          <el-table-column label="企业 / 账号" width="176"><template #default="{row}">{{ row.ent }}<div class="small muted mono">{{ row.acct }}</div></template></el-table-column>
          <el-table-column label="查询条件摘要" min-width="180"><template #default="{row}">{{ row.cond }}</template></el-table-column>
          <el-table-column label="行数" width="76" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.rows) }}</span></template></el-table-column>
          <el-table-column label="文件指纹" width="150"><template #default="{row}"><span class="mono">{{ row.fp }}</span><div class="small muted">{{ row.fmt }}</div></template></el-table-column>
          <el-table-column label="水印信息" min-width="236"><template #default="{row}"><span class="small" style="white-space:nowrap">{{ row.short }} · {{ row.acct }}<br>{{ row.t }} · {{ row.id }}</span></template></el-table-column>
          <el-table-column label="状态" width="100"><template #default="{row}"><span class="dot" :class="row.st==='已过期' ? '' : 'ok'"></span>{{ row.st }}<div class="small muted">下载 {{ row.dl }} 次</div></template></el-table-column>
          <el-table-column label="操作" width="62" align="center"><template #default="{row}"><el-button link type="primary" @click="trace = { show: true, q: row.id, hit: row, done: true }">溯源</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>当前显示 {{ eRows.length }} 条（原型示例数据）。平台不留存导出文件内容的副本，只留存条件、行数、指纹与水印参数；导出内容与页面使用同一套屏蔽结果。</span><el-pagination layout="prev, pager, next" :total="214" :page-size="50" small background /></div>
      </el-tab-pane>

      <!-- ============ 异常查询告警 ============ -->
      <el-tab-pane name="alert">
        <template #label>异常查询告警<el-badge v-if="alertTodo" :value="alertTodo" style="margin-left:6px" /></template>
        <div class="grid c2" style="margin-bottom:12px">
          <div class="tip-box orange small"><b>模式一 · 单筛选项差分序列</b><br>短时间内大量查询只相差一个筛选项（地区、规格、品牌、数据池成员或时间）。目的通常是用相邻结果相减，推算单家企业的数据。</div>
          <div class="tip-box orange small"><b>模式二 · 高比例命中屏蔽边界</b><br>查询结果中，贡献企业数刚好落在屏蔽阈值附近（5–6 家）的单元格占比异常偏高。目的通常是试探屏蔽规则的边界。</div>
        </div>
        <div class="filter-bar">
          <el-radio-group v-model="af.st"><el-radio-button value="">全部</el-radio-button><el-radio-button value="todo">待处置</el-radio-button><el-radio-button value="done">已处置</el-radio-button></el-radio-group>
          <span class="muted small">告警触发后系统先自动限流并通知安全审计员，后续处置由安全审计员完成；终止服务须另一人复核。</span>
        </div>
        <el-table :data="aRows" border size="small">
          <el-table-column label="告警编号" width="140"><template #default="{row}"><a href="javascript:;" class="num" @click="openAlert(row)">{{ row.id }}</a></template></el-table-column>
          <el-table-column label="识别模式" min-width="280"><template #default="{row}"><b>{{ row.mode }}</b><div class="small muted">{{ row.metric }}</div></template></el-table-column>
          <el-table-column label="企业 / 账号" width="186"><template #default="{row}">{{ row.ent }}<div class="small muted mono">{{ row.acct }}</div></template></el-table-column>
          <el-table-column label="触发时间" width="136"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="风险" width="64" align="center"><template #default="{row}"><span class="lv" :class="{高:'h',中:'m',低:'l'}[row.lv]">{{ row.lv }}</span></template></el-table-column>
          <el-table-column label="处置状态" width="170"><template #default="{row}"><el-tag size="small" :type="alertType(row.st)" disable-transitions>{{ row.st }}</el-tag><div v-if="row.sub" class="small muted">{{ row.sub }}</div></template></el-table-column>
          <el-table-column label="操作" width="120" align="center">
            <template #default="{row}">
              <el-button link type="primary" @click="openAlert(row)">详情</el-button>
              <el-tooltip v-if="row.st!=='已终止服务' && row.st!=='已解除' && row.st!=='终止服务待复核'" :disabled="isAuditor" content="告警处置由安全审计员完成，请切换操作人为吴靖" placement="top"><span style="margin-left:10px"><el-button link type="warning" :disabled="!isAuditor" @click="openDispose(row)">处置</el-button></span></el-tooltip>
              <el-button v-else-if="row.st==='终止服务待复核'" link type="warning" @click="openAlert(row)">复核</el-button>
            </template>
          </el-table-column>
        </el-table>
        <div class="tbl-foot"><span>近 30 日告警 {{ alerts.length }} 条。识别阈值在<a href="privacy-params.html">防反推参数</a>中维护；上游《数据服务协议》含禁止再识别条款，违约可终止服务并追责。</span></div>
      </el-tab-pane>

      <!-- ============ 明细访问工单 ============ -->
      <el-tab-pane label="平台人员明细访问工单" name="ticket">
        <el-alert type="warning" show-icon :closable="false" style="margin-bottom:12px">
          <template #title>平台人员<b>默认不可查看</b>下游企业上传的明细。排障确需查看时提交工单，<b>经企业管理员授权后限时开放</b>，到期自动回收；访问全程留痕，并在企业侧“数据使用透明账本”中可见。</template>
        </el-alert>
        <div class="filter-bar">
          <el-radio-group v-model="tf.st"><el-radio-button value="">全部</el-radio-button><el-radio-button value="待企业授权">待企业授权</el-radio-button><el-radio-button value="开放中">开放中</el-radio-button><el-radio-button value="closed">已结束</el-radio-button></el-radio-group>
          <span style="flex:1"></span>
          <el-button type="primary" @click="newTicket"><el-icon><Plus /></el-icon>新建工单</el-button>
        </div>
        <el-table :data="tRows" border size="small">
          <template #empty><el-empty description="没有符合条件的工单" :image-size="70" /></template>
          <el-table-column label="工单号" width="136"><template #default="{row}"><a href="javascript:;" class="num" @click="openTicket(row)">{{ row.id }}</a></template></el-table-column>
          <el-table-column label="申请人与角色" width="120"><template #default="{row}">{{ row.by }}<div class="small muted">{{ roleOf(row.by) }}</div></template></el-table-column>
          <el-table-column label="目标企业" width="190"><template #default="{row}">{{ row.ent }}</template></el-table-column>
          <el-table-column label="事由" min-width="220"><template #default="{row}"><el-tag size="small" type="info" disable-transitions style="margin-right:6px">{{ row.kind }}</el-tag>{{ row.why }}</template></el-table-column>
          <el-table-column label="企业授权状态" width="150"><template #default="{row}"><span class="dot" :class="{已授权:'ok',待授权:'warn',已拒绝:'err',超时未处理:''}[row.auth]"></span>{{ row.auth }}<div v-if="row.authBy" class="small muted">{{ row.authBy }}</div></template></el-table-column>
          <el-table-column label="授权时限" width="136"><template #default="{row}">{{ row.hours }} 小时<div v-if="row.until" class="small muted num">至 {{ row.until }}</div></template></el-table-column>
          <el-table-column label="状态" width="100"><template #default="{row}"><el-tag size="small" :type="ticketType(row.st)" disable-transitions>{{ row.st }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="60" align="center"><template #default="{row}"><el-button link type="primary" @click="openTicket(row)">详情</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>本月工单 {{ tickets.length }} 个。授权范围只限工单写明的批次与数据类型；访问页面带账号水印，禁止导出与复制。</span></div>
      </el-tab-pane>

      <!-- ============ 操作日志 ============ -->
      <el-tab-pane label="操作日志" name="oplog">
        <div class="filter-bar">
          <el-select v-model="of.type" clearable placeholder="全部操作类型" style="width:170px"><el-option v-for="t in opTypes" :key="t" :label="t" :value="t" /></el-select>
          <el-select v-model="of.side" clearable placeholder="全部主体" style="width:130px"><el-option label="平台人员" value="平台" /><el-option label="上游企业" value="上游" /><el-option label="下游企业" value="下游" /><el-option label="系统" value="系统" /></el-select>
          <el-input v-model="of.kw" clearable placeholder="操作人 / 操作内容 / 关联单号" style="width:260px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <span style="flex:1"></span>
          <span class="muted small">覆盖：登录、权限变更、规则变更、密钥操作、数据池变更、后台参数变更、价格闸口操作、奖励规则变更、邀请与带动</span>
        </div>
        <el-table :data="oRows" border size="small" row-key="seq">
          <template #empty><el-empty description="没有符合条件的操作日志" :image-size="70" /></template>
          <el-table-column type="expand">
            <template #default="{row}">
              <div class="exp">
                <div><span>变更前</span>{{ row.before || '—' }}</div>
                <div><span>变更后</span>{{ row.after || '—' }}</div>
                <div><span>关联单号</span>{{ row.ref || '—' }}<template v-if="row.link">　<a :href="row.link">前往对应页面</a></template></div>
                <div><span>链式校验</span><span class="mono" style="width:auto;color:#4a5568">序号 {{ row.seq }} · 本条摘要 {{ row.h }} · 上一条摘要 {{ row.ph }}</span>　<span class="dot ok" style="width:7px"></span>校验一致</div>
              </div>
            </template>
          </el-table-column>
          <el-table-column label="时间" width="136"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="操作类型" width="116"><template #default="{row}"><el-tag size="small" :type="opType(row.type)" disable-transitions>{{ row.type }}</el-tag></template></el-table-column>
          <el-table-column label="操作人" width="250"><template #default="{row}">{{ row.who }}<div class="small muted">{{ row.org }}</div></template></el-table-column>
          <el-table-column label="操作内容" min-width="330"><template #default="{row}">{{ row.text }}</template></el-table-column>

      </el-tab-pane>

  <!-- 查询详情 -->
  <el-drawer v-model="qd.show" title="查询审计详情" size="620px">
    <template v-if="qd.r">
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="查询编号"><span class="num">{{ qd.r.id }}</span></el-descriptions-item>
        <el-descriptions-item label="时间"><span class="num">{{ qd.r.t }}:{{ qd.r.sec }}</span></el-descriptions-item>
        <el-descriptions-item label="上游企业" :span="2">{{ qd.r.ent }}</el-descriptions-item>
        <el-descriptions-item label="账号"><span class="mono">{{ qd.r.acct }}</span></el-descriptions-item>
        <el-descriptions-item label="出口类型">{{ qd.r.type }}</el-descriptions-item>
        <el-descriptions-item label="数据池版本">{{ qd.r.pool }}</el-descriptions-item>

          <tr v-for="c in qd.r.detail" :key="c[0]"><td style="width:110px;color:var(--stp-sub)">{{ c[0] }}</td><td>{{ c[1] }}</td></tr>

    <template v-if="trace.done">
      <el-descriptions v-if="trace.hit" :column="2" border size="small" class="mt12">
        <el-descriptions-item label="导出编号"><span class="num">{{ trace.hit.id }}</span></el-descriptions-item>
        <el-descriptions-item label="导出时间"><span class="num">{{ trace.hit.t }}</span></el-descriptions-item>

  <!-- 告警详情 -->

    <template v-if="ad.r">
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="识别模式" :span="2"><b>{{ ad.r.mode }}</b>　{{ ad.r.metric }}</el-descriptions-item>
        <el-descriptions-item label="企业">{{ ad.r.ent }}</el-descriptions-item>
        <el-descriptions-item label="账号"><span class="mono">{{ ad.r.acct }}</span></el-descriptions-item>

        <b>终止服务申请待复核。</b>提交人：{{ ad.r.by }}。终止服务须由另一人复核后才生效，提交人不能复核自己的申请。当前操作人：{{ me }}（{{ roleOf(me) }}）。
        <div class="mt8">
          <el-tooltip :disabled="ad.r.by!==me" content="提交人不能复核自己的申请，请切换为另一位复核人" placement="top"><span><el-button type="danger" size="small" :disabled="ad.r.by===me" @click="reviewTerm(true)">复核通过，终止服务</el-button></span></el-tooltip>

        </div>

      <el-button @click="ad.show=false">关闭</el-button>

    </template>
  </el-drawer>

  <!-- 处置 -->
  <el-dialog v-model="dp.show" :title="'处置告警 ' + (dp.r ? dp.r.id : '')" width="640px">
    <template v-if="dp.r">
      <div class="small muted mb12">{{ dp.r.ent }} · <span class="mono">{{ dp.r.acct }}</span> · {{ dp.r.mode }}</div>
      <el-radio-group v-model="dp.act" class="act-list" style="display:block">
        <el-radio value="limit"><b>限流</b><small>限制该账号的查询频率。系统触发告警时已自动限流 24 小时，这里可调整上限与时长。</small></el-radio>
        <el-radio value="notify"><b>通知企业管理员</b><small>向上游企业管理员发送站内信与短信，说明账号的异常查询行为，并提示协议中的禁止再识别条款。</small></el-radio>
        <el-radio value="talk"><b>约谈</b><small>由安全审计员与法务约谈企业，要求说明查询目的并书面承诺。约谈期间保持限流。</small></el-radio>
        <el-radio value="terminate"><b>依据禁止再识别条款终止服务</b><small>依据《数据服务协议》禁止再识别条款终止该企业的数据服务并保留追责权利。须附法务意见，并由另一人复核后生效。</small></el-radio>
        <el-radio value="release"><b>解除</b><small>核实为正常业务查询（误报），解除限流并关闭告警。</small></el-radio>
      </el-radio-group>
      <el-form label-width="96px" class="mt12">
        <template v-if="dp.act==='limit'">
          <el-form-item label="查询上限"><el-select v-model="dp.rate" style="width:160px"><el-option label="每分钟 5 次" value="每分钟 5 次" /><el-option label="每分钟 10 次" value="每分钟 10 次" /><el-option label="每分钟 20 次" value="每分钟 20 次" /></el-select>
            <el-select v-model="dp.dur" style="width:160px;margin-left:10px"><el-option label="持续 24 小时" value="24 小时" /><el-option label="持续 7 天" value="7 天" /><el-option label="直至人工解除" value="直至人工解除" /></el-select></el-form-item>
          <el-form-item label="限流范围"><el-radio-group v-model="dp.scope"><el-radio value="该账号">仅该账号</el-radio><el-radio value="该企业全部账号">该企业全部账号</el-radio></el-radio-group></el-form-item>
        </template>
        <el-form-item v-if="dp.act==='talk'" label="约谈时间"><el-date-picker v-model="dp.date" type="date" value-format="YYYY-MM-DD" style="width:160px" /><span class="small muted" style="margin-left:10px">参与人：吴靖（安全审计员）、唐蕾（法务）</span></el-form-item>
        <el-form-item v-if="dp.act==='terminate'" label="法务意见" required><el-checkbox v-model="dp.legal">已取得法务书面意见（唐蕾），确认构成违反禁止再识别条款</el-checkbox></el-form-item>
        <el-form-item :label="dp.act==='release' ? '解除原因' : '处置说明'" required><el-input v-model="dp.note" type="textarea" :rows="2" :placeholder="dp.act==='release' ? '如：企业月末例行报表，已与企业管理员确认' : '写明依据与结论，将记入处置记录'" /></el-form-item>
      </el-form>
      <div v-if="dp.act==='terminate'" class="tip-box red small">终止服务影响企业全部账号。提交后进入“终止服务待复核”，由另一位平台人员复核通过才生效；已付费用按协议处理，并同步通知财务。</div>
    </template>
    <template #footer><el-button @click="dp.show=false">取消</el-button><el-button type="primary" :disabled="!dp.note.trim() || (dp.act==='terminate' && !dp.legal)" @click="doDispose">{{ dp.act==='terminate' ? '提交复核' : '确认处置' }}</el-button></template>
  </el-dialog>

  <!-- 新建工单 -->
  <el-dialog v-model="nt.show" title="新建明细访问工单" width="640px">
    <el-form label-width="96px">
      <el-form-item label="申请人">{{ me }}（{{ roleOf(me) }}）</el-form-item>
      <el-form-item label="目标企业" required><el-select v-model="nt.ent" filterable placeholder="输入企业名称搜索" style="width:100%"><el-option v-for="e in ents" :key="e" :label="e" :value="e" /></el-select></el-form-item>
      <el-form-item label="事由类别" required><el-radio-group v-model="nt.kind"><el-radio-button value="数据排障">数据排障</el-radio-button><el-radio-button value="质量申诉">质量申诉</el-radio-button><el-radio-button value="造假核查">造假核查</el-radio-button><el-radio-button value="价格隔离">价格隔离</el-radio-button></el-radio-group></el-form-item>
      <el-form-item label="事由说明" required><el-input v-model="nt.why" type="textarea" :rows="2" placeholder="写明要解决的问题，企业管理员授权时会看到这段说明" /></el-form-item>
      <el-form-item label="访问范围" required>
        <el-checkbox-group v-model="nt.scope"><el-checkbox value="校验失败行">校验失败行</el-checkbox><el-checkbox value="销售明细">销售明细</el-checkbox><el-checkbox value="库存明细">库存明细</el-checkbox><el-checkbox value="价格明细">价格明细</el-checkbox></el-checkbox-group>
        <el-input v-model="nt.batch" placeholder="关联上传批次或业务日期，如 2026-11-23 批次" style="margin-top:6px" />
      </el-form-item>
      <el-form-item label="申请时长" required><el-radio-group v-model="nt.hours"><el-radio :value="2">2 小时</el-radio><el-radio :value="4">4 小时</el-radio><el-radio :value="8">8 小时</el-radio><el-radio :value="24">24 小时</el-radio></el-radio-group></el-form-item>
    </el-form>
    <ul class="step-list" style="border:1px solid var(--stp-border);border-radius:6px;padding:2px 12px">
      <li class="doing"><span class="idx">1</span>提交工单，系统通知目标企业的企业管理员</li>
      <li><span class="idx">2</span>企业管理员同意或拒绝；48 小时未处理，工单自动失效</li>
      <li><span class="idx">3</span>同意后按申请时长限时开放，只开放工单写明的范围</li>
      <li><span class="idx">4</span>到期自动回收权限；访问记录对企业可见</li>
    </ul>
    <template #footer><el-button @click="nt.show=false">取消</el-button><el-button type="primary" @click="submitTicket">提交工单</el-button></template>
  </el-dialog>

  <!-- 工单详情 -->
  <el-drawer v-model="td.show" :title="'明细访问工单 ' + (td.r ? td.r.id : '')" size="640px">
    <template v-if="td.r">
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="申请人">{{ td.r.by }}（{{ roleOf(td.r.by) }}）</el-descriptions-item>
        <el-descriptions-item label="申请时间"><span class="num">{{ td.r.t }}</span></el-descriptions-item>
        <el-descriptions-item label="目标企业" :span="2">{{ td.r.ent }}</el-descriptions-item>
        <el-descriptions-item label="事由" :span="2"><el-tag size="small" type="info" disable-transitions style="margin-right:6px">{{ td.r.kind }}</el-tag>{{ td.r.why }}</el-descriptions-item>

        <el-descriptions-item label="授权时限">{{ td.r.hours }} 小时<span v-if="td.r.until" class="small muted num">　至 {{ td.r.until }}</span></el-descriptions-item>
        <el-descriptions-item label="状态" :span="2"><el-tag size="small" :type="ticketType(td.r.st)" disable-transitions>{{ td.r.st }}</el-tag><span v-if="td.r.note" class="small muted" style="margin-left:8px">{{ td.r.note }}</span></el-descriptions-item>
      </el-descriptions>

      <div v-if="td.r.st==='待企业授权'" class="tip-box orange small mt12">
        已通知企业管理员，等待授权。授权前平台人员看不到任何明细。
        <div class="mt8"><span class="demo-tag" style="margin-right:8px">原型演示：模拟企业侧操作</span>
          <el-button size="small" type="success" plain @click="simAuth(true)">企业管理员同意授权</el-button>
          <el-button size="small" type="danger" plain @click="simAuth(false)">企业管理员拒绝</el-button>
        </div>
      </div>

      <div class="sec-title mt16"><i></i>访问留痕<small>企业侧可见同样的记录</small></div>
      <el-table :data="td.r.trail" border size="small">
        <template #empty><span class="muted small">{{ td.r.st==='开放中' ? '授权已开放，尚无访问记录' : '没有访问记录' }}</span></template>
        <el-table-column label="时间" width="136"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
        <el-table-column prop="who" label="访问人" width="90" />
        <el-table-column prop="act" label="动作" min-width="250" />
        <el-table-column label="行数" width="70" align="right"><template #default="{row}"><span class="num">{{ row.n || '—' }}</span></template></el-table-column>
      </el-table>
      <div class="tip-box small mt12">访问留痕只记录“谁、何时、看了哪个批次的多少行”，不在审计页面展示明细内容本身。明细只能在限时开放的排障页面中查看，页面带账号水印，禁止导出与复制。</div>
    </template>
    <template #footer>
      <el-button @click="td.show=false">关闭</el-button>
      <el-button v-if="td.r && td.r.st==='待企业授权' && td.r.by===me" @click="closeTicket('已撤回', '申请人撤回')">撤回工单</el-button>
      <el-button v-if="td.r && td.r.st==='开放中'" type="primary" @click="viewDetail">模拟一次明细访问</el-button>
      <el-button v-if="td.r && td.r.st==='开放中'" type="danger" plain @click="closeTicket('已关闭', me + ' 提前关闭')">提前关闭</el-button>
    </template>
  </el-drawer>
</app-layout>

          r.st = pass ? '已终止服务' : '已约谈'; r.sub = pass ? this.me + ' ' + t + ' 复核通过' : '终止服务申请被驳回，限流保持';
          r.log.push({ t, who: this.me, text: pass ? '复核通过，依据禁止再识别条款终止服务。企业全部账号已停用，已通知企业与财务' : '驳回终止服务申请：' + note, type: pass ? 'danger' : 'info' });
          this.addLog('权限变更', (pass ? '复核通过' : '驳回') + '终止服务申请：' + r.ent, { ref: r.id, before: '终止服务（待复核）', after: pass ? '服务状态：已终止' : '服务状态：正常（限流保持）' });
          this.$demo(pass ? '复核通过，已终止该企业的数据服务' : '已驳回，告警恢复为限流状态');
        };
        if (pass) ElementPlus.ElMessageBox.confirm('复核通过后，将终止 ' + r.ent + ' 的数据服务，全部账号立即停用。', '复核终止服务', { type: 'warning', confirmButtonText: '复核通过', cancelButtonText: '取消' }).then(() => done()).catch(() => {});
        else ElementPlus.ElMessageBox.prompt('请填写驳回原因', '驳回终止服务申请', { confirmButtonText: '驳回', cancelButtonText: '取消', inputValidator: (v) => !!(v && v.trim()) || '请填写驳回原因' }).then(({ value }) => done(value)).catch(() => {});
      },
      withdrawTerm() {
        const r = this.ad.r; r.st = '已限流'; r.sub = '终止服务申请已撤回，限流保持'; r.by = '';
        r.log.push({ t: nowStr(), who: this.me, text: '撤回终止服务申请', type: 'info' });
        this.$demo('已撤回终止服务申请');
      },
      newTicket() {
        if (this.isAuditor) return warn('安全审计员与运营角色互斥，不能申请查看企业明细。请切换为运营角色后再新建工单');
        if (this.me === '唐蕾') return warn('法务角色没有明细访问工单的申请权限');
        this.tab = 'ticket';
        this.nt = { show: true, ent: '', kind: '数据排障', why: '', scope: ['校验失败行'], batch: '', hours: 4 };
      },
      submitTicket() {
        const n = this.nt;
        if (!n.ent) return warn('请选择目标企业');
        if (!n.why.trim()) return warn('请填写事由说明');
        if (!n.scope.length) return warn('请至少选择一项访问范围');
        const id = 'WO-20261124-' + String(4 + this.tickets.filter((t) => t.id > 'WO-20261124-003').length).padStart(3, '0');
        this.tickets.unshift(T({ id, by: this.me, t: nowStr(), ent: n.ent, kind: n.kind, why: n.why.trim(), scope: (n.batch.trim() ? n.batch.trim() + ' 的' : '') + n.scope.join('、'), auth: '待授权', hours: n.hours, st: '待企业授权' }));
        this.addLog('权限变更', '提交明细访问工单 ' + id + '：' + n.ent + '，申请 ' + n.hours + ' 小时', { ref: id, before: '平台人员不可查看明细', after: '待企业授权' });
        n.show = false; this.tf.st = '';
        this.$demo('工单已提交，已通知企业管理员。授权前看不到任何明细');
      },
      openTicket(r) { this.td = { show: true, r }; },
      simAuth(ok) {
        const r = this.td.r, t = nowStr();
        if (ok) { Object.assign(r, { auth: '已授权', authBy: '企业管理员 ' + t, until: plusHours(r.hours), st: '开放中' }); this.$demo('企业已授权，限时 ' + r.hours + ' 小时开放，到期自动回收'); }
        else { Object.assign(r, { auth: '已拒绝', authBy: '企业管理员 ' + t, st: '已拒绝', note: '企业拒绝授权' }); this.$demo('企业已拒绝授权，工单关闭'); }
      },
      viewDetail() {
        const r = this.td.r;
        if (r.by !== this.me) return warn('只有工单申请人 ' + r.by + ' 可以在授权时限内查看，请切换操作人');
        r.trail.push({ t: nowStr(), who: this.me, act: '查看 ' + r.scope, n: 12 + (M.hash(r.id + r.trail.length) % 40) });
        this.$demo('已记录一次访问。原型不展示明细内容；企业侧可看到同样的访问记录');
      },
      closeTicket(st, note) {
        const r = this.td.r; r.st = st; r.note = note;
        if (st === '已关闭') r.trail.push({ t: nowStr(), who: this.me, act: '提前关闭工单，访问权限已回收', n: 0 });
        this.$demo(st === '已关闭' ? '工单已关闭，访问权限已回收' : '工单已撤回');
      },
    },
  });
})();
</script>
