<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>运营工作台 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.todo-group { font-size: 12px; color: var(--stp-sub); font-weight: 600; letter-spacing: .5px; margin: 14px 0 8px; }
.todo-group:first-of-type { margin-top: 0; }
.todo-item .n.hot { color: #e5484d; }
.todo-item .n.warm { color: #d98200; }
.todo-item .go { margin-left: auto; color: #b0b9c6; }
.pub-steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
.pub-step { position: relative; padding: 0 10px 0 0; }
.pub-step .bar { height: 4px; border-radius: 2px; background: #18a058; margin: 8px 0 8px; }
.pub-step .tm { font-size: 12px; color: var(--stp-sub); }
.pub-step b { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.pub-step b .el-icon { color: #18a058; }
.pub-step p { margin: 4px 0 0; font-size: 12px; color: var(--stp-sub); line-height: 1.6; }
.ann-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--stp-border); font-size: 13px; align-items: flex-start; }
.ann-item:last-child { border-bottom: none; }
.ann-item .bd { flex: 1; min-width: 0; line-height: 1.6; }
.ann-item .bd span { display: block; color: var(--stp-sub); font-size: 12px; }
.rate-bar { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: #eef1f5; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.rate-bar i { display: block; height: 100%; border-radius: 4px; }
.src-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 4px 0 10px; }
.src-bar i { display: block; height: 100%; }
.src-leg { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: #4a5568; }
.src-leg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.src-kpi { display: block; border: 1px solid var(--stp-border); border-radius: 6px; padding: 8px 12px; color: inherit; text-decoration: none; }
.src-kpi:hover { border-color: var(--el-color-primary); }
.src-kpi b { display: block; font-size: 20px; }
.src-kpi span { font-size: 12px; color: var(--stp-sub); line-height: 1.5; display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" active="workbench" title="运营工作台"
  desc="聚合平台规模、今日 T+1 发布状态与各模块待办。平台人员默认不可查看下游企业上传明细，工作台只展示状态、计数与质量指标。">
  <template #actions>
    <span class="muted small">今天 {{ today }}（周二）　最新数据日期 {{ dataDate }}</span>
    <el-button @click="$demo('已刷新，各模块待办计数为最新')"><el-icon><Refresh /></el-icon>刷新</el-button>
    <el-button type="primary" @click="annDlg = true"><el-icon><Promotion /></el-icon>发布公告</el-button>
  </template>

  <!-- 平台规模 -->
  <div class="grid c6">
    <stat-card label="下游入驻企业" :value="21386" unit="家" icon="OfficeBuilding" tip="已完成板块准入并签署数据授权协议的下游钢贸企业"><span>已上架 <b>17,902</b></span><span>本月新增 <b class="up">+412</b></span></stat-card>
    <stat-card label="近 30 日稳定上传" :value="15240" unit="家" icon="Upload" tip="近 30 日有效上传天数不少于 20 天的企业"><span>占入驻 <b>71.3%</b></span><span>较上月 <b class="up">+386</b></span></stat-card>
    <div class="stat">
      <div class="label">上游付费 / 入驻<el-tooltip content="按购买主体统计，同一集团的关联企业归并为一个购买主体" placement="top"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
      <div class="value num">438<span class="unit">/ 512 家</span></div>
      <div class="foot"><span>付费率 <b>85.5%</b></span><span>30 日内到期 <b style="color:#d98200">17</b></span></div>
      <div class="ico"><el-icon><Coin /></el-icon></div>
    </div>
    <stat-card label="在订名额" :value="86400" unit="个" icon="Tickets" tip="生效中订阅的名额总数；1 个名额 = 1 家下游企业 × 1 个计费周期"><span>已分配 <b>81,960</b></span><span>冻结 <b>1,128</b></span></stat-card>
    <stat-card label="昨日入库明细" :value="1912" unit="万行" icon="DataLine" tip="2026-11-23 业务日期入库的销售与库存记录，含行级明细与日汇总记录"><span>行级 <b>1,688</b> 万</span><span>日汇总 <b>224</b> 万</span></stat-card>
    <stat-card label="标准品类映射率" :value="96.3" :d="1" unit="%" icon="Files" tip="能映射到平台标准品名的入库行数占比；未映射数据进入待映射队列，不参与聚合"><span>较上周 <b class="up">+0.4%</b></span><span>积压 <b>1,246</b> 项</span></stat-card>
  </div>

  <!-- 入驻来源与带动 -->
  <div class="card">
    <div class="card-title"><span>下游入驻来源<small>截至 {{ today }}，共 {{ $fmt(srcTotal) }} 家；钢厂带动是主要的推广方式</small></span><span class="right"><a href="referral-rewards.html">带动奖励规则 ›</a></span></div>
    <div class="grid c-3-2" style="margin-bottom:0">
      <div>
        <div class="src-bar"><i v-for="(s, i) in SRC" :key="s.k" :style="{ width: s.n / srcTotal * 100 + '%', background: srcColor[i] }"></i></div>
        <div class="src-leg"><span v-for="(s, i) in SRC" :key="s.k"><i :style="{ background: srcColor[i] }"></i>{{ s.k }} <b class="num">{{ $fmt(s.n) }}</b> 家（{{ (s.n / srcTotal * 100).toFixed(1) }}%）</span></div>
        <div class="small muted mt8">本月新增 412 家：钢厂带动 318、一级代理带动 52、平台运营邀请 27、自主注册 15。钢厂带动的企业由钢厂通过名单导入、邀请链接或邀请码邀请，带动关系须由对方的企业管理员确认后才成立。平台运营只做支持和审核：不逐家邀请，不代下游确认带动关系；准入审核标准不因来源不同而放宽。</div>
      </div>
      <div class="grid c3" style="margin-bottom:0;gap:10px">
        <a class="src-kpi" href="referral-rewards.html"><b class="num">312</b><span>参与带动的钢厂（订阅钢厂 438 家）</span></a>
        <a class="src-kpi" href="referral-rewards.html"><b class="num">12,640</b><span>有效带动户：已确认、已接入且考核期内 2 个周期达标</span></a>
        <a class="src-kpi" href="enterprises.html"><b class="num">3</b><span>准入待审核中来自带动的企业</span></a>
      </div>
    </div>
  </div>

  <!-- 今日 T+1 发布任务 -->
  <div class="card">
    <div class="card-title">
      <span>今日 T+1 发布任务<small>数据日期 {{ dataDate }}，承诺每日 8:00 前发布</small></span>
      <span class="right">
        <el-tag type="success" effect="dark"><el-icon style="vertical-align:-2px"><CircleCheck /></el-icon> 07:42 发布完成，早于 8:00 承诺 18 分钟</el-tag>
        <el-button size="small" @click="pubDlg = true">近 7 日发布记录</el-button>
      </span>
    </div>
    <div class="pub-steps">
      <div class="pub-step" v-for="s in pubSteps" :key="s.t">
        <div class="tm num">{{ s.time }}</div>
        <div class="bar"></div>
        <b><el-icon><CircleCheck /></el-icon>{{ s.t }}</b>
        <p>{{ s.d }}</p>
      </div>
    </div>
    <div class="tip-box small mt12">两种上传粒度（行级、日汇总）的数据在企业日粒度事实层合并后再做披露判定；隔离区与待映射数据不参与本次发布。今日发布后回归抽检的 48 条防反推用例全部通过。</div>
  </div>

  <!-- 待办 -->
  <div class="card">
    <div class="card-title"><span>待办事项<small>共 {{ todoTotal }} 类待办，点击进入对应页面处理</small></span><span class="right muted small"><span class="dot err"></span>需当日处理　<span class="dot warn"></span>有时限　<span class="dot"></span>常规</span></div>
    <template v-for="g in todos" :key="g.group">
      <div class="todo-group">{{ g.group }}</div>
      <div class="grid c4" style="margin-bottom:0">
        <a class="todo-item" v-for="t in g.items" :key="t.t" :href="t.href">
          <div class="n num" :class="t.lv">{{ $fmt(t.n) }}</div>
          <div class="t">{{ t.t }}<span>{{ t.d }}</span></div>
          <el-icon class="go"><ArrowRight /></el-icon>
        </a>
      </div>
    </template>
  </div>

  <!-- 趋势 -->
  <div class="grid c-3-2">
    <div class="card">
      <div class="card-title"><span>接入与活跃趋势<small>供给侧，近 12 个月</small></span></div>
      <ve-chart :option="supplyOption" height="290px"></ve-chart>
    </div>
    <div class="card">
      <div class="card-title"><span>付费上游与在订名额<small>需求侧，近 12 个月</small></span></div>
      <ve-chart :option="demandOption" height="290px"></ve-chart>
    </div>
  </div>

  <!-- 供需匹配 -->
  <div class="card">
    <div class="card-title">
      <span>供需匹配<small>哪些地区 × 品类样本不足，导致上游查询屏蔽率高（近 30 日）</small></span>
      <span class="right">
        <el-radio-group v-model="matchView" size="small"><el-radio-button value="high" label="屏蔽率偏高" /><el-radio-button value="all" label="全部示例" /></el-radio-group>
        <el-button size="small" @click="$demo('供需匹配清单已导出（仅含计数与比率）')"><el-icon><Download /></el-icon>导出</el-button>
      </span>
    </div>
    <el-table :data="matchRows" size="small" border>
      <el-table-column label="地区 · 品类" min-width="170"><template #default="{row}"><b>{{ row.region }} · {{ row.cat }}</b></template></el-table-column>
      <el-table-column label="关注的上游数" align="right" width="116"><template #default="{row}"><span class="num">{{ row.up }}</span> 家</template></el-table-column>
      <el-table-column label="已上架下游企业数" align="right" width="136"><template #default="{row}"><span class="num">{{ $fmt(row.dn) }}</span> 家</template></el-table-column>
      <el-table-column label="稳定上传占比" align="right" width="110"><template #default="{row}"><span class="num">{{ row.act }}%</span></template></el-table-column>
      <el-table-column label="屏蔽率" width="190">
        <template #default="{row}"><span class="rate-bar"><i :style="{width: row.mask + '%', background: row.mask >= 60 ? '#e5484d' : row.mask >= 40 ? '#f0a020' : '#18a058'}"></i></span><b class="num" :style="{color: row.mask >= 60 ? '#e5484d' : row.mask >= 40 ? '#b26a00' : '#18a058'}">{{ row.mask }}%</b></template>
      </el-table-column>
      <el-table-column label="建议动作" min-width="280"><template #default="{row}">{{ row.act2 }}</template></el-table-column>
      <el-table-column label="操作" width="150" align="center">
        <template #default="{row}">
          <el-button v-if="row.mask >= 40 && !row.task" link type="primary" @click="invite(row)">创建邀约任务</el-button>
          <el-tag v-else-if="row.task" type="success" size="small">邀约任务已创建</el-tag>
          <span v-else class="muted">无需处理</span>
        </template>
      </el-table-column>
    </el-table>
    <div class="tbl-foot">
      <span>屏蔽率 = 上游在该地区 × 品类下查询命中的单元格中，被屏蔽的单元格占比。此处只统计计数与比率，不涉及任何单家企业的销量、库存、价格。</span>
      <span>披露粒度可在 <a href="master-category.html">全品类主数据工作台</a> 按品类调整</span>
    </div>
  </div>

  <!-- 公告与通知 -->
  <div class="grid c2">
    <div class="card">
      <div class="card-title"><span>平台公告<small>面向上游、下游企业发布</small></span><span class="right"><el-button size="small" type="primary" plain @click="annDlg = true"><el-icon><Plus /></el-icon>发布公告</el-button></span></div>
      <div class="ann-item" v-for="a in anns" :key="a.title">
        <el-tag size="small" :type="a.to === '上游' ? 'primary' : a.to === '下游' ? 'success' : 'warning'">{{ a.to }}</el-tag>
        <div class="bd">{{ a.title }}<span>{{ a.time }} · {{ a.by }} · {{ a.status }}</span></div>
        <el-button link type="primary" @click="$info('原型演示：查看公告全文与送达统计')">查看</el-button>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span>通知<small>系统与流程通知</small></span><span class="right"><el-button size="small" link type="primary" @click="readAll">全部标为已读</el-button></span></div>
      <div class="ann-item" v-for="n in notices" :key="n.title">
        <span class="dot" :class="n.read ? '' : n.lv" style="margin-top:7px"></span>
        <div class="bd" :class="{muted: n.read}">{{ n.title }}<span>{{ n.time }} · {{ n.src }}</span></div>
        <a :href="n.href">去处理</a>
      </div>
    </div>
  </div>

  <!-- 发布公告 -->
  <el-dialog v-model="annDlg" title="发布平台公告" width="560px">
    <el-form label-width="96px">
      <el-form-item label="公告对象">
        <el-radio-group v-model="ann.to"><el-radio value="全部">全部企业</el-radio><el-radio value="上游">上游钢厂</el-radio><el-radio value="下游">下游钢贸</el-radio></el-radio-group>
      </el-form-item>
      <el-form-item label="公告类型">
        <el-select v-model="ann.type" style="width:100%"><el-option v-for="t in ['规则与参数变更','功能上线','维护与发布延迟','主数据变更','带动奖励通知']" :key="t" :label="t" :value="t" /></el-select>
      </el-form-item>
      <el-form-item label="标题"><el-input v-model="ann.title" maxlength="40" show-word-limit placeholder="请输入公告标题" /></el-form-item>
      <el-form-item label="正文"><el-input v-model="ann.body" type="textarea" :rows="4" placeholder="请输入公告正文" /></el-form-item>
      <el-form-item label="送达方式"><el-checkbox-group v-model="ann.ch"><el-checkbox value="站内信">站内信</el-checkbox><el-checkbox value="短信">短信</el-checkbox><el-checkbox value="邮件">邮件</el-checkbox></el-checkbox-group></el-form-item>
    </el-form>
    <div class="tip-box orange small">防反推参数、披露粒度等规则变更的公告，须在变更生效前发布，并同步到下游“数据安全中心”的披露规则公示。</div>
    <template #footer><el-button @click="annDlg = false">取消</el-button><el-button type="primary" :disabled="!ann.title" @click="publish">发布</el-button></template>
  </el-dialog>

  <!-- 近 7 日发布记录 -->
  <el-dialog v-model="pubDlg" title="近 7 日 T+1 发布记录" width="640px">
    <el-table :data="pubHistory" size="small" border>
      <el-table-column prop="date" label="数据日期" width="120" />
      <el-table-column prop="rows" label="入库明细（万行）" align="right" width="140" />
      <el-table-column prop="done" label="发布完成时间" width="120" />
      <el-table-column label="是否准时" width="110"><template #default="{row}"><el-tag size="small" :type="row.ok ? 'success' : 'danger'">{{ row.ok ? '8:00 前完成' : '延迟' }}</el-tag></template></el-table-column>
      <el-table-column prop="note" label="备注" min-width="140" />
    </el-table>
    <div class="small muted mt12">近 30 日准时发布率 96.7%（29 / 30），延迟 1 次。</div>
  </el-dialog>
</app-layout>
</script>
