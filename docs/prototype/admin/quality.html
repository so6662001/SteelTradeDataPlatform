<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据质量监控 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.ent-name b { font-weight: 600; }
.ent-name span { display: block; font-size: 12px; color: var(--stp-sub); margin-top: 2px; }
.opt-rate { display: grid; gap: 5px; margin-top: 8px; font-size: 12px; }
.opt-rate div { display: grid; grid-template-columns: 56px 1fr 44px; align-items: center; gap: 6px; color: var(--stp-sub); }
.opt-rate i { display: block; height: 6px; border-radius: 3px; background: #eef1f5; overflow: hidden; }
.opt-rate i em { display: block; height: 100%; background: #409eff; border-radius: 3px; }
.opt-rate b { text-align: right; color: var(--stp-text); }
.grade-list { display: grid; gap: 10px; margin-top: 6px; }
.grade-list .g { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
.grade-list .g .lv { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; }
.grade-list .g span { color: var(--stp-sub); font-size: 12px; display: block; }
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.cat-over td .el-input-number { width: 120px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" active="quality" title="数据质量监控"
  desc="全平台与分品类的质量指标、断传跟进、隔离数据处置、补传审批与校验规则配置。本页只展示状态、计数与比率；平台人员默认不可查看企业上传明细，确需查看须发起明细访问工单。">
  <template #actions>
    <span class="muted small">数据日期 {{ dataDate }}</span>
    <el-button @click="$demo('质量日报已导出（仅含指标、计数与比率）')"><el-icon><Download /></el-icon>导出质量日报</el-button>
    <el-button type="primary" @click="tab = 'rules'"><el-icon><Setting /></el-icon>校验规则配置</el-button>
  </template>

  <!-- 平台质量指标 -->
  <div class="grid c6">
    <stat-card label="上传及时率" :value="94.8" :d="1" unit="%" tip="稳定上传企业中，在次日 2:00 前完成当日数据上传的占比"><span>较上周 <b class="up">+0.3%</b></span></stat-card>
    <stat-card label="连续性" :value="92.6" :d="1" unit="%" tip="近 30 日无断档（每个应上传日都有有效上传）的企业占比"><span>较上周 <b class="down">-0.2%</b></span></stat-card>
    <stat-card label="标准映射率" :value="96.3" :d="1" unit="%" tip="能映射到平台标准品名的入库行数占比；未映射数据不参与聚合"><span>待映射 <b>1,246</b> 项</span></stat-card>
    <stat-card label="校验通过率" :value="98.7" :d="1" unit="%" tip="字段校验与分品类规则校验通过的行数占比"><span>失败率 <b>1.3%</b></span></stat-card>
    <stat-card label="可疑率" :value="0.42" :d="2" unit="%" tip="被业务校验标记可疑并进入隔离区的记录占比；隔离区数据不参与聚合"><span>隔离待处置 <b>312</b> 项</span></stat-card>
    <div class="stat">
      <div class="label">选填字段填报率<el-tooltip content="流向地、客户类型、下游行业为选填，填报率计入企业质量评分；价格为自愿上传，不计入质量评分" placement="top"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
      <div class="opt-rate">
        <div v-for="o in optional" :key="o.t"><span>{{ o.t }}</span><i><em :style="{width: o.v + '%'}"></em></i><b class="num">{{ o.v }}%</b></div>
      </div>
    </div>
  </div>

  <div class="grid c-2-1">
    <div class="card">
      <div class="card-title"><span>质量趋势<small>近 30 日，全平台</small></span></div>
      <ve-chart :option="trendOption" height="280px"></ve-chart>
    </div>
    <div class="card">
      <div class="card-title"><span>企业质量评级分布<small>已上架 17,902 家</small></span></div>
      <ve-chart :option="gradeOption" height="150px"></ve-chart>
      <div class="grade-list">
        <div class="g" v-for="g in grades" :key="g.k">
          <div class="lv" :style="{background: g.c}">{{ g.k }}</div>
          <div>{{ g.t }}<span>{{ g.d }}</span></div>
          <b class="num">{{ $fmt(g.n) }} 家</b>
        </div>
      </div>
    </div>
  </div>

  <!-- 分品类质量看板 -->
  <div class="card">
    <div class="card-title"><span>分品类质量看板<small>按大类展示，用于判断某品类能否提升标准化深度</small></span><span class="right"><a href="master-category.html">前往全品类主数据工作台 ›</a></span></div>
    <el-table :data="catRows" size="small" border>
      <el-table-column label="大类" width="110"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
      <el-table-column label="映射率" min-width="170"><template #default="{row}"><el-progress :percentage="row.map" :stroke-width="6" :color="row.map >= row.th ? '#18a058' : '#e5484d'" :format="p => p.toFixed(1) + '%'" /></template></el-table-column>
      <el-table-column label="映射率门槛" width="100" align="right"><template #default="{row}"><span class="num">{{ row.th }}%</span></template></el-table-column>
      <el-table-column label="失败率" width="90" align="right"><template #default="{row}"><span class="num" :style="{color: row.fail >= 3 ? '#e5484d' : ''}">{{ row.fail.toFixed(1) }}%</span></template></el-table-column>
      <el-table-column label="隔离率" width="90" align="right"><template #default="{row}"><span class="num" :style="{color: row.qr >= 0.8 ? '#e5484d' : ''}">{{ row.qr.toFixed(2) }}%</span></template></el-table-column>
      <el-table-column label="待映射积压" width="110" align="right"><template #default="{row}"><span class="num" :style="{color: row.backlog > 200 ? '#e5484d' : ''}">{{ row.backlog }}</span> 项</template></el-table-column>
      <el-table-column width="150" align="right">
        <template #header>维度缺失率<el-tooltip placement="top" content="按品类统计维度模板：第一维度（规格、厚度）缺失的行进入待映射；第二维度（宽度、壁厚、公斤段或负差段）缺失的行照常入库，归入“未分段”，只参与更粗层级的聚合"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template>
        <template #default="{row}"><span class="num">{{ row.dim[1].toFixed(1) }}%</span><div class="small muted">{{ row.dim[0] }}<template v-if="row.dim[2] !== null"> · 未分段 <b :style="{color: row.dim[2] >= 8 ? '#b26a00' : ''}">{{ row.dim[2].toFixed(1) }}%</b></template></div></template>
      </el-table-column>
      <el-table-column label="当前深度 → 目标" width="140" align="center"><template #default="{row}"><span class="level-tag" style="margin:0">{{ row.depth }}</span> → <span class="level-tag" :class="{lock: row.depth !== row.target}" style="margin:0">{{ row.target }}</span></template></el-table-column>
      <el-table-column label="能否提升标准化深度" min-width="260">
        <template #default="{row}"><el-tag size="small" :type="row.can === 'yes' ? 'success' : row.can === 'done' ? 'info' : 'warning'">{{ row.can === 'yes' ? '具备条件' : row.can === 'done' ? '已达目标深度' : '暂不具备' }}</el-tag> <span class="muted small">{{ row.why }}</span></template>
      </el-table-column>
    </el-table>
    <div class="tbl-foot"><span>映射率门槛为<b>示例参数，待业务方确定</b>；未达标的品类只开放到品名级。失败率 = 字段与分品类规则校验失败行数占比；隔离率 = 进入隔离区的记录占比。维度缺失率 = 第一维度缺失且无法从规格原文解析的行数占比，“未分段”为第二维度缺失的占比（全平台约 6%，示例值）；各模板的格子达标与上卷率见 <a href="grain-monitor.html">上传粒度监控 › 统计维度格子达标与上卷率</a>。非钢材（配套辅材，按数量）单独统计：映射率 90.3%，单位不一致拒收率 1.2%。</span></div>
  </div>

  <!-- 处置标签页 -->
  <div class="card">
    <el-tabs v-model="tab">
      <!-- 断传监控 -->
      <el-tab-pane name="break">
        <template #label>断传监控 <el-badge :value="137" :max="999" type="danger" style="vertical-align:1px" /></template>
        <div class="status-line">
          <span>当前断传 <b>137</b> 家</span>
          <span>其中已触发名额冻结 <b style="color:#e5484d">52</b> 家</span>
          <span>未跟进 <b>{{ breakTodo }}</b> 家（示例范围内）</span>
          <span class="muted">规则：连续 3 天无有效上传预警企业与运营；连续 10 天自动冻结名额，上游可免费替换或顺延</span>
          <span class="flex1"></span>
          <a href="pools.html">补偿处理 ›</a>
        </div>
        <el-table :data="breaks" size="small" border>
          <el-table-column label="企业" min-width="220"><template #default="{row}"><div class="ent-name"><b>{{ row.name }}</b><span>{{ row.loc }} · 质量评级 {{ row.q }}</span></div></template></el-table-column>
          <el-table-column label="断传天数" width="96" align="right"><template #default="{row}"><b class="num" :style="{color: row.days >= 10 ? '#e5484d' : row.days >= 7 ? '#b26a00' : ''}">{{ row.days }}</b> 天</template></el-table-column>
          <el-table-column prop="last" label="最近有效上传日" width="124" />
          <el-table-column label="被订阅家数" width="96" align="right"><template #default="{row}"><span class="num">{{ row.subs }}</span> 家</template></el-table-column>
          <el-table-column label="名额冻结" width="156"><template #default="{row}"><el-tag v-if="row.days >= 10" size="small" type="danger">已触发冻结</el-tag><span v-else class="muted">未触发（还差 {{ 10 - row.days }} 天）</span></template></el-table-column>
          <el-table-column label="跟进人" width="84"><template #default="{row}">{{ row.owner || '—' }}</template></el-table-column>
          <el-table-column label="跟进状态" min-width="190"><template #default="{row}"><span class="dot" :class="stDot(row.st)"></span>{{ row.st }}<div v-if="row.reason" class="small muted">{{ row.reason }}</div></template></el-table-column>
          <el-table-column label="操作" width="80" align="center"><template #default="{row}"><el-button type="primary" size="small" plain @click="openFollow(row)">跟进</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>原型展示 {{ breaks.length }} 家示例。断传企业的数据自断传日起不参与聚合；只对下游提示“有钢厂订阅受影响”，不告知订阅钢厂名称。</span></div>
      </el-tab-pane>

      <!-- 隔离数据处置 -->
      <el-tab-pane name="quar">
        <template #label>隔离数据处置 <el-badge :value="312" :max="999" type="warning" style="vertical-align:1px" /></template>
        <el-alert type="warning" show-icon :closable="false">
          <template #title>隔离区数据<b>不参与聚合</b>，企业确认“属实”或“更正”后释放。平台人员在此只能看到隔离类型、条数与状态；<b>查看明细需发起明细访问工单</b>，经企业授权后限时查看，全程留痕并对企业可见。</template>
        </el-alert>
        <div class="filter-bar">
          <el-radio-group v-model="qType" size="small">
            <el-radio-button value="" label="全部类型" />
            <el-radio-button v-for="t in qTypes" :key="t" :value="t" :label="t" />
          </el-radio-group>
        </div>
        <el-table :data="quarRows" size="small" border>
          <el-table-column prop="id" label="编号" width="108" />
          <el-table-column label="企业" min-width="190"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
          <el-table-column label="隔离类型" width="136"><template #default="{row}"><el-tag size="small" :type="qTag(row.type)">{{ row.type }}</el-tag></template></el-table-column>
          <el-table-column prop="date" label="业务日期" width="136" />
          <el-table-column label="条数" width="64" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.n) }}</span></template></el-table-column>
          <el-table-column prop="rule" label="命中规则" min-width="170" />
          <el-table-column label="状态" width="112"><template #default="{row}"><span class="dot" :class="row.st === '已释放' ? 'ok' : row.st === '人工核查中' ? 'err' : 'warn'"></span>{{ row.st }}</template></el-table-column>
          <el-table-column label="操作" width="176" align="center">
            <template #default="{row}">
              <template v-if="row.st !== '已释放'">
                <el-button v-if="row.type === '反刷量命中'" link type="danger" @click="row.st = '人工核查中'; $demo('已转人工核查；核查期间该企业不计入带动奖励的有效带动户')">转人工核查</el-button>
                <el-button v-else link type="primary" @click="row.urged = true; $demo('已催办企业确认，通知已发送给企业管理员与数据管理员')">{{ row.urged ? '再次催办' : '催办企业' }}</el-button>
                <el-button link type="primary" @click="ticket(row)">发起工单</el-button>
              </template>
              <span v-else class="muted">企业已处理</span>
            </template>
          </el-table-column>
        </el-table>
        <div class="tbl-foot"><span>全平台隔离待处置 312 项，原型展示 {{ quars.length }} 项示例。价格字段的隔离只影响价格，该行销量照常入库，见 <a href="price-control.html">价格数据管控</a>；日汇总批次问题见 <a href="grain-monitor.html">上传粒度监控</a>。</span></div>
      </el-tab-pane>

      <!-- 补传审批 -->
      <el-tab-pane name="back">
        <template #label>补传审批 <el-badge :value="backTodo" type="primary" :hidden="!backTodo" style="vertical-align:1px" /></template>
        <div class="tip-box small mb12">企业可自行补传或更正最近 <b>90</b> 天的数据；超过 90 天补传窗口的需在此审批。审批通过后，受影响业务日期的聚合自动重算。</div>
        <el-table :data="backs" size="small" border>
          <el-table-column prop="id" label="申请编号" width="108" />
          <el-table-column label="企业" min-width="180"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
          <el-table-column prop="range" label="申请补传的业务日期" width="178" />
          <el-table-column label="超出窗口" width="96" align="right"><template #header>超出窗口<el-tooltip placement="top" content="补传区间最早一天早于“申请日往前 90 天”的天数"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template><template #default="{row}"><span class="num">{{ row.over }}</span> 天</template></el-table-column>
          <el-table-column prop="src" label="来源系统" width="86" />
          <el-table-column prop="reason" label="申请原因" min-width="180" />
          <el-table-column prop="time" label="申请时间" width="124" />
          <el-table-column label="状态" width="78"><template #default="{row}"><el-tag size="small" :type="row.st === '待审批' ? 'warning' : row.st === '已通过' ? 'success' : 'info'">{{ row.st }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="72" align="center"><template #default="{row}"><el-button v-if="row.st === '待审批'" type="primary" size="small" plain @click="openBack(row)">审批</el-button><span v-else class="muted">—</span></template></el-table-column>
        </el-table>
      </el-tab-pane>

      <!-- 校验规则配置 -->
      <el-tab-pane name="rules" label="校验规则配置">
        <div class="filter-bar">
          <el-radio-group v-model="ruleLayer" size="small">
            <el-radio-button value="" label="全部" />
            <el-radio-button v-for="l in layers" :key="l" :value="l" :label="l" />
          </el-radio-group>
          <span class="muted small">阈值、启停、严重级别可配置，并可按品类差异化；未单独配置的品名继承大类规则。</span>
        </div>
        <el-table :data="ruleRows" size="small" border>
          <el-table-column label="规则" min-width="210"><template #default="{row}"><b>{{ row.name }}</b><div class="small muted">{{ row.code }}</div></template></el-table-column>
          <el-table-column prop="layer" label="校验层" width="100" />
          <el-table-column label="适用范围" width="130"><template #default="{row}">{{ row.byCat ? '按品类差异化' : row.scope }}</template></el-table-column>
          <el-table-column label="阈值" min-width="260">
            <template #default="{row}">{{ row.pre }}<b class="num" v-if="row.val !== undefined" style="margin:0 4px">{{ row.val }}</b>{{ row.unit }}<span v-if="row.byCat" class="muted small">（{{ overCount(row) }} 个大类单独设置）</span></template>
          </el-table-column>
          <el-table-column label="严重级别" width="130"><template #default="{row}"><el-tag size="small" :type="lvTag(row.lv)">{{ row.lv }}</el-tag></template></el-table-column>
          <el-table-column label="启用" width="70" align="center"><template #default="{row}"><el-switch v-model="row.on" size="small" @change="v => $demo(row.name + (v ? ' 已启用' : ' 已停用') + '，变更已留痕')" /></template></el-table-column>
          <el-table-column label="操作" width="70" align="center"><template #default="{row}"><el-button link type="primary" @click="openRule(row)">编辑</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>阈值为建议默认值。规格取值范围、品名与材质兼容性在 <a href="master-category.html">全品类主数据工作台</a> 维护；分品名的合理价格区间在 <a href="price-control.html">价格数据管控</a> 维护。</span></div>
      </el-tab-pane>
    </el-tabs>
  </div>

  <!-- 跟进弹窗 -->
  <el-dialog v-model="followDlg" :title="'断传跟进 · ' + (cur ? cur.name : '')" width="620px">
    <template v-if="cur">
      <el-descriptions :column="3" border size="small">
        <el-descriptions-item label="断传天数">{{ cur.days }} 天</el-descriptions-item>
        <el-descriptions-item label="被订阅家数">{{ cur.subs }} 家</el-descriptions-item>
        <el-descriptions-item label="名额冻结">{{ cur.days >= 10 ? '已触发' : '未触发' }}</el-descriptions-item>
        <el-descriptions-item label="最近接口调用" :span="3">{{ cur.api }}</el-descriptions-item>
      </el-descriptions>
      <el-form label-width="96px" class="mt16">
        <el-form-item label="跟进方式"><el-radio-group v-model="ff.way"><el-radio value="电话">电话</el-radio><el-radio value="站内信">站内信</el-radio><el-radio value="企业微信">企业微信</el-radio><el-radio value="请钢厂协助">请带动入驻的钢厂协助</el-radio></el-radio-group></el-form-item>
        <el-form-item label="断传原因"><el-select v-model="ff.reason" style="width:100%" placeholder="请选择"><el-option v-for="r in reasons" :key="r" :label="r" :value="r" /></el-select></el-form-item>
        <el-form-item label="跟进状态"><el-radio-group v-model="ff.st"><el-radio-button value="已联系" label="已联系" /><el-radio-button value="企业处理中" label="企业处理中" /><el-radio-button value="已恢复上传" label="已恢复上传" /><el-radio-button value="企业无意恢复" label="企业无意恢复" /></el-radio-group></el-form-item>
        <el-form-item label="预计恢复"><el-date-picker v-model="ff.date" type="date" value-format="YYYY-MM-DD" placeholder="选择日期" style="width:180px" /></el-form-item>
        <el-form-item label="跟进记录"><el-input v-model="ff.note" type="textarea" :rows="2" placeholder="沟通情况" /></el-form-item>
      </el-form>
      <el-timeline v-if="cur.hist.length" style="padding-left:98px;margin-top:4px">
        <el-timeline-item v-for="h in cur.hist" :key="h.time" :timestamp="h.time" placement="top">{{ h.txt }}</el-timeline-item>
      </el-timeline>
    </template>

      openFollow(row) { this.cur = row; this.ff = { way: '电话', reason: this.reasons.find((x) => row.reason && row.reason.indexOf(x.slice(0, 2)) >= 0) || '', st: row.st === '未跟进' ? '已联系' : row.st, date: '', note: '' }; this.followDlg = true; },
      saveFollow() {
        const c = this.cur, f = this.ff;
        c.owner = '林若彤'; c.st = f.st; c.reason = f.reason + (f.date ? '，预计 ' + f.date.slice(5) + ' 恢复' : '');
        c.hist.unshift({ time: '2026-11-24 14:20', txt: '林若彤（' + f.way + '）：' + f.reason + (f.note ? '。' + f.note : '') });
        this.followDlg = false;
        this.$demo('跟进记录已保存');
      },
      ticket(row) {
        ElementPlus.ElMessageBox.confirm('将为「' + row.name + '」的隔离数据（' + row.id + '）发起明细访问工单。工单须经企业授权后限时查看，访问全程留痕，并在企业侧“数据使用透明账本”中可见。', '发起明细访问工单', { confirmButtonText: '前往审计日志发起', cancelButtonText: '取消', type: 'warning' })
          .then(() => { this.$go('audit.html'); }).catch(() => {});
      },
      openBack(row) { this.curBack = row; this.backNote = ''; this.backDlg = true; },
      doBack(pass) { this.curBack.st = pass ? '已通过' : '已驳回'; this.backDlg = false; this.$demo(pass ? '已通过，企业获得 7 天临时补传许可' : '已驳回并通知企业'); },
      openRule(row) { this.curRule = row; this.rf = JSON.parse(JSON.stringify(row)); if (row.val === undefined) this.rf.val = undefined; this.ruleDlg = true; },
      saveRule() {
        const r = this.curRule, f = this.rf;
        r.val = f.val; r.lv = f.lv; r.on = f.on; if (f.byCat) r.cats = f.cats.map((c) => ({ name: c.name, own: c.own, val: c.own ? c.val : f.val }));
        this.ruleDlg = false;
        this.$demo('规则已保存，自下一个业务日期起生效，变更已留痕');
      },
    },
  });
})();
</script>
