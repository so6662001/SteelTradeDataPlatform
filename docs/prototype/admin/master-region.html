<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地区与仓库 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.rg-wrap { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 16px; align-items: start; }
.rg-tree { border: 1px solid var(--stp-border); border-radius: 6px; padding: 8px 6px; height: 640px; overflow: auto; }
.rg-tree .el-tree-node__content { height: 30px; }
.rg-tree .node { display: flex; align-items: center; justify-content: space-between; flex: 1; min-width: 0; font-size: 13px; padding-right: 6px; }
.rg-tree .node .cd { color: var(--stp-sub); font-size: 12px; font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
.sec-title { font-size: 14px; font-weight: 600; margin: 18px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sec-title::before { content: ""; width: 3px; height: 14px; background: var(--el-color-primary); border-radius: 2px; margin-right: 8px; }
.sec-title > span:first-child { flex: 1; }
.wh-name b { font-weight: 600; }
.wh-name span { display: block; font-size: 12px; color: var(--stp-sub); margin-top: 2px; }
.impact { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
.impact div { border: 1px solid var(--stp-border); border-radius: 6px; padding: 10px 12px; }
.impact span { font-size: 12px; color: var(--stp-sub); }
.impact b { display: block; font-size: 17px; margin-top: 4px; }
.cal-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 2; color: #4a5568; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" active="master-region" title="地区与仓库"
  desc="地区采用国家行政区划代码（省 → 市 → 区县）；钢贸多用第三方仓库，多家企业共用同一仓库，因此维护平台级标准仓库库，并把企业上传的仓库原文映射到标准仓库。">
  <template #actions>
    <el-button @click="$demo('行政区划已与国家标准最新版本比对，无差异')"><el-icon><Refresh /></el-icon>同步行政区划</el-button>
    <el-button type="primary" @click="openWh(null)"><el-icon><Plus /></el-icon>新增标准仓库</el-button>
  </template>

  <div class="grid c5">
    <div class="stat">
      <div class="label">行政区划（国家标准代码）</div>
      <div class="value num">34<span class="unit">省级</span></div>
      <div class="foot"><span>地级 <b>333</b></span><span>县级 <b>2,844</b></span><span>版本 2025</span></div>
    </div>
    <stat-card label="标准仓库" :value="3862" unit="个" icon="House" tip="平台级标准仓库库：名称、地址、所在市"><span>启用 <b>3,790</b></span><span>疑似重复 <b>46</b></span><span>停用 <b>26</b></span></stat-card>
    <stat-card label="仓库别名" :value="14920" unit="个" icon="CollectionTag" tip="每个标准仓库可维护多个别名，用于自动匹配企业上传的仓库原文"><span>仓库映射率 <b>98.1%</b></span></stat-card>
    <stat-card label="仓库映射待确认" :value="164" unit="项" icon="List"><span>原型展示 <b>{{ queue.length }}</b> 项示例</span></stat-card>
    <stat-card label="上游自定义销售大区" :value="1286" unit="个" icon="MapLocation" tip="各钢厂自定义的省市分组，由上游维护，平台只读"><span>涉及购买主体 <b>297</b></span><span>不可用 <b>38</b></span></stat-card>
  </div>

  <div class="card">
    <div class="rg-wrap">
      <!-- 左：行政区划树 -->
      <div>
        <div class="card-title" style="margin-bottom:8px"><span>行政区划<small>省 → 市 → 区县</small></span></div>
        <el-input v-model="treeKw" size="small" placeholder="搜索名称或代码" clearable class="mb8"><template #prefix><el-icon><Search /></el-icon></template></el-input>
        <div class="rg-tree">
          <el-tree ref="tree" :data="tree" node-key="code" :default-expanded-keys="['320000', '320500']" :current-node-key="'320500'" highlight-current :filter-node-method="filterNode" @node-click="n => sel = n">
            <template #default="{ data }"><span class="node"><span>{{ data.name }}</span><span class="cd">{{ data.code }}</span></span></template>
          </el-tree>
        </div>
        <div class="small muted mt8">原型展示 18 个省级行政区；区县只展开部分城市。</div>
      </div>

      <!-- 右：地区详情 + 标准仓库库 -->
      <div>
        <div class="card-title" style="margin-bottom:10px">
          <span>{{ sel.full }}<small>所选地区详情</small></span>
          <span class="right"><el-tag size="small" type="success">启用</el-tag><el-button size="small" @click="$info('原型演示：行政区划调整（撤并、更名）按国家标准同步，历史代码保留映射关系')">区划变更记录</el-button></span>
        </div>
        <el-descriptions :column="3" border size="small">
          <el-descriptions-item label="行政区划代码"><span class="code">{{ sel.code }}</span></el-descriptions-item>
          <el-descriptions-item label="层级">{{ sel.levelName }}</el-descriptions-item>
          <el-descriptions-item label="上级">{{ sel.parent || '—' }}</el-descriptions-item>
          <el-descriptions-item label="在该地区有仓库的企业数"><b class="num">{{ $fmt(sel.ents) }}</b> 家</el-descriptions-item>
          <el-descriptions-item label="标准仓库数"><b class="num">{{ $fmt(sel.whs) }}</b> 个</el-descriptions-item>
          <el-descriptions-item label="对上游披露">{{ sel.level === 3 ? '不披露，仅用于仓库地址归属' : sel.level === 2 ? '可披露（最细地区粒度）' : '可披露' }}</el-descriptions-item>
        </el-descriptions>

        <div class="sec-title">
          <span>标准仓库库<small class="muted" style="font-weight:400;margin-left:8px">{{ onlySel ? sel.name + '范围内' : '全部示例' }} {{ whRows.length }} 个</small></span>
          <el-checkbox v-model="onlySel" size="small">只看所选地区</el-checkbox>
          <el-input v-model="whKw" size="small" placeholder="仓库名称 / 编码 / 别名" clearable style="width:200px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <el-button size="small" type="primary" plain @click="openWh(null)"><el-icon><Plus /></el-icon>新增</el-button>
        </div>
        <el-table :data="whRows" size="small" border max-height="420">
          <el-table-column label="仓库名称" min-width="190"><template #default="{row}"><div class="wh-name"><b>{{ row.name }}</b><span>{{ row.code }}</span></div></template></el-table-column>
          <el-table-column prop="addr" label="地址" min-width="200" />
          <el-table-column prop="city" label="所在市" width="84" />
          <el-table-column label="别名数" width="74" align="right"><template #default="{row}"><el-tooltip :content="row.alias.join('、')" placement="top"><span class="num" style="cursor:help;border-bottom:1px dashed #b0b9c6">{{ row.alias.length }}</span></el-tooltip></template></el-table-column>
          <el-table-column label="使用企业数" width="96" align="right"><template #default="{row}"><span class="num">{{ row.ents }}</span> 家</template></el-table-column>
          <el-table-column label="状态" width="96"><template #default="{row}"><el-tag size="small" :type="row.status === '启用' ? 'success' : row.status === '疑似重复' ? 'warning' : 'info'">{{ row.status }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="112" align="center">
            <template #default="{row}"><el-button link type="primary" @click="openWh(row)">编辑</el-button><el-button link type="primary" @click="openMerge(row)">合并</el-button></template>
          </el-table-column>
          <template #empty><div class="empty-block">所选地区暂无标准仓库示例数据<br><el-button class="mt8" size="small" @click="onlySel = false">查看全部示例</el-button></div></template>
        </el-table>
        <div class="small muted mt8">“使用企业数”为在该仓库有库存或出库记录的企业计数。后台不展示任何企业在各仓库的库存量、出库量。</div>
      </div>
    </div>
  </div>

  <!-- 仓库映射待确认 -->
  <div class="card">
    <div class="card-title">
      <span>仓库映射待确认队列<small>企业上传的仓库原文无法高置信度匹配到标准仓库；待确认期间该仓库的数据不参与聚合</small></span>
      <span class="right"><el-button size="small" type="primary" :disabled="!qSel.length" @click="confirmQ(qSel)"><el-icon><Check /></el-icon>批量确认（{{ qSel.length }}）</el-button></span>
    </div>
    <el-table :data="queue" size="small" border @selection-change="s => qSel = s">
      <el-table-column type="selection" width="42" :selectable="r => !!r.rec" />
      <el-table-column label="企业上传的仓库原文" min-width="200"><template #default="{row}"><span class="code">{{ row.raw }}</span></template></el-table-column>
      <el-table-column prop="city" label="企业填报的所在市" width="140" />
      <el-table-column label="出现企业数" width="100" align="right"><template #default="{row}"><span class="num">{{ row.ents }}</span> 家</template></el-table-column>
      <el-table-column label="推荐标准仓库" min-width="230"><template #default="{row}"><b v-if="row.rec">{{ row.rec }}</b><span v-else class="muted">无合适的标准仓库，建议新建</span></template></el-table-column>
      <el-table-column label="置信度" width="90" align="right"><template #default="{row}"><b class="num" :style="{color: row.conf >= 0.9 ? '#18a058' : row.conf >= 0.75 ? '#b26a00' : '#e5484d'}">{{ Math.round(row.conf * 100) }}%</b></template></el-table-column>
      <el-table-column label="操作" width="200" align="center">
        <template #default="{row}">
          <el-button v-if="row.rec" link type="primary" @click="confirmQ([row])">确认</el-button>
          <el-button link type="primary" @click="openWh(null, row)">新建标准仓库</el-button>
          <el-button link type="primary" @click="$info('原型演示：改选其他标准仓库，或退回企业确认')">改选</el-button>
        </template>
      </el-table-column>
      <template #empty><div class="empty-block">待确认队列已清空</div></template>
    </el-table>
    <div class="tbl-foot"><span>确认后原文写入该标准仓库的别名库，相关数据自动回补并参与聚合。日汇总模式的企业可只报仓库所在市、不报仓库名称，这类数据直接按行政区划代码归属，不进入本队列。</span></div>
  </div>

  <div class="grid c-3-2">
    <!-- 上游自定义销售大区 -->
    <div class="card">
      <div class="card-title"><span>上游自定义销售大区<small>由各上游维护，平台只读</small></span><span class="right"><el-tag size="small" type="info"><el-icon style="vertical-align:-2px"><View /></el-icon> 只读</el-tag></span></div>
      <el-table :data="zones" size="small" border>
        <el-table-column prop="up" label="购买主体" width="110" />
        <el-table-column prop="name" label="大区名称" width="150" />
        <el-table-column prop="members" label="包含的省、市" min-width="190" />
        <el-table-column label="状态" min-width="150"><template #default="{row}"><el-tag size="small" :type="row.ok ? 'success' : 'danger'">{{ row.ok ? '可用' : '不可用' }}</el-tag><div v-if="!row.ok" class="small muted" style="margin-top:2px">{{ row.why }}</div></template></el-table-column>
      </el-table>
      <div class="tip-box blue small mt12">各钢厂的大区划分不同，自定义销售大区（省、市的分组）由上游自行创建和维护，平台不代为修改。大区视为新的层级成员，<b>按分组整体做披露判定</b>：大区内贡献企业数仍受 k = {{ $PV.k }} 门槛与优势度约束；同一上游的两个大区若只相差少量成员，差集须同样满足门槛，否则后创建的大区不可用。</div>
    </div>
    <!-- 地区口径 -->
    <div class="card">
      <div class="card-title"><span>地区口径说明</span></div>
      <ul class="cal-list">
        <li><b>销量</b>：默认按<b>出库仓库所在地</b>统计（必填、最可靠），上游可切换为按<b>流向地</b>统计（选填，填报率计入质量评分）。</li>
        <li><b>库存</b>：按<b>仓库所在地</b>统计。</li>
        <li><b>最细粒度</b>：对上游最细到<b>地级市</b>；区县只用于仓库地址归属。样本稀疏的品类可配置为到省，见 <a href="master-category.html">全品类主数据工作台</a>。</li>
        <li>企业注册地不作为统计口径，仅用于名录展示。</li>
        <li>行政区划采用国家标准代码；直辖市按“省级 + 市辖区”处理。</li>
      </ul>
      <div class="tip-box small mt12">仓库所在地反映渠道库存分布，流向地反映终端需求分布。钢材跨市、跨省销售普遍，两种口径的结果差异可能很大，上游页面固定显示当前口径。</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><span>变更日志<small>地区与仓库主数据的增删改、合并、启停全部留痕</small></span></div>
    <el-table :data="logs" size="small" border>
      <el-table-column prop="time" label="时间" width="140" />
      <el-table-column prop="by" label="操作人" width="90" />
      <el-table-column prop="obj" label="对象" width="200" />
      <el-table-column prop="what" label="变更内容" min-width="320" />
      <el-table-column prop="impact" label="影响评估" min-width="220" />
    </el-table>
  </div>

  <!-- 新增 / 编辑仓库 -->
  <el-dialog v-model="whDlg" :title="wf.code ? '编辑标准仓库 · ' + wf.code : '新增标准仓库'" width="560px">
    <el-form label-width="96px">
      <el-form-item label="仓库名称"><el-input v-model="wf.name" placeholder="如：苏州望亭库" /></el-form-item>
      <el-form-item label="所在地区"><el-cascader v-model="wf.region" :options="regionOpts" style="width:100%" placeholder="省 / 市 / 区县" :disabled="!!wf.code" /></el-form-item>
      <el-form-item label="详细地址"><el-input v-model="wf.addr" placeholder="街道、门牌" /></el-form-item>
      <el-form-item label="别名">
        <el-tag v-for="a in wf.alias" :key="a" closable type="info" style="margin:0 6px 6px 0" @close="wf.alias.splice(wf.alias.indexOf(a), 1)">{{ a }}</el-tag>
        <el-input v-model="wf.newAlias" size="small" style="width:150px" placeholder="输入后回车添加" @keyup.enter="addAlias" />
      </el-form-item>
      <el-form-item label="状态"><el-radio-group v-model="wf.status"><el-radio value="启用">启用</el-radio><el-radio value="停用">停用</el-radio></el-radio-group></el-form-item>
    </el-form>
    <div class="tip-box small">{{ wf.code ? '已有数据的仓库不可修改所在市（会改变历史地区口径）；确需调整请走“合并”或新建。' : '新增前请先搜索是否已存在同一仓库，避免重复建档。' }}</div>
    <template #footer><el-button @click="whDlg = false">取消</el-button><el-button type="primary" :disabled="!wf.name || wf.region.length < 2" @click="saveWh">保存</el-button></template>
  </el-dialog>

  <!-- 合并重复仓库 -->
  <el-dialog v-model="mergeDlg" title="合并重复仓库" width="640px">
    <template v-if="mg.src">
      <el-form label-width="110px">
        <el-form-item label="被合并仓库"><b>{{ mg.src.name }}</b><span class="muted small" style="margin-left:8px">{{ mg.src.code }} · {{ mg.src.addr }}</span></el-form-item>
        <el-form-item label="合并到">
          <el-select v-model="mg.target" placeholder="选择同一地级市内的标准仓库" style="width:100%">
            <el-option v-for="w in mergeTargets" :key="w.code" :label="w.name + '（' + w.code + '）'" :value="w.code" />
          </el-select>
        </el-form-item>
      </el-form>
      <template v-if="mg.target">
        <div class="small muted">合并前影响评估</div>
        <div class="impact">
          <div><span>受影响企业数</span><b class="num">{{ mg.src.ents }} 家</b></div>
          <div><span>企业侧映射</span><b class="num">{{ mg.src.ents + mg.src.alias.length }} 条</b></div>
          <div><span>历史数据量</span><b class="num">{{ $fmt(mg.src.ents * 46) }} 万行</b></div>
          <div><span>别名迁移</span><b class="num">{{ mg.src.alias.length + 1 }} 个</b></div>
        </div>
        <table class="plain-table">
          <tbody>
            <tr><td style="width:170px">地区口径是否变化</td><td><el-tag size="small" type="success">不变</el-tag>　两个仓库同属{{ mg.src.city }}，省、市层级聚合结果不受影响</td></tr>
            <tr><td>是否触发重算</td><td>仓库级自查汇总重算；对上游的省、市层级聚合无需重算</td></tr>
            <tr><td>企业侧可见变化</td><td>企业自查页中仓库标准名称变更，已通知相关企业</td></tr>
          </tbody>
        </table>
      </template>
      <div class="tip-box orange small mt12">仅允许同一地级市内的仓库合并。跨市合并会改变历史数据的地区归属，不提供此操作。合并后被合并仓库的名称与别名全部迁入目标仓库的别名库，操作留痕且不可撤销。</div>
    </template>
    <template #footer><el-button @click="mergeDlg = false">取消</el-button><el-button type="primary" :disabled="!mg.target" @click="doMerge">确认合并</el-button></template>
  </el-dialog>
</app-layout>
</script>
<script src="../assets/lib/vue.global.prod.js"></script>
<script src="../assets/lib/element-plus.full.min.js"></script>
<script src="../assets/lib/element-plus-zh-cn.min.js"></script>
<script src="../assets/lib/element-plus-icons.iife.min.js"></script>
<script src="../assets/lib/echarts.min.js"></script>
<script src="../assets/js/mock.js"></script>
<script src="../assets/js/app.js"></script>
<script>
