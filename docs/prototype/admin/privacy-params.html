<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>防反推参数 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.grp-title { display: flex; align-items: center; gap: 10px; margin: 18px 0 10px; font-size: 14px; font-weight: 600; }
.grp-title:first-child { margin-top: 0; }
.grp-title i { width: 4px; height: 14px; border-radius: 2px; background: var(--el-color-primary); display: inline-block; }
.grp-title small { font-weight: 400; color: var(--stp-sub); font-size: 12px; }
.p-name b { display: block; font-weight: 600; }
.p-name span { font-size: 12px; color: var(--stp-sub); }
.p-val { font-weight: 600; font-size: 14px; }
.flow-mini { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4a5568; flex-wrap: wrap; }
.flow-mini span { padding: 2px 10px; border-radius: 12px; background: #eef4fb; color: #2b5d9b; }
.notice-paper { border: 1px solid var(--stp-border); border-radius: 6px; padding: 18px 22px; background: #fcfcfd; line-height: 1.9; font-size: 13px; }
.notice-paper h3 { margin: 0 0 10px; text-align: center; font-size: 16px; }
.notice-paper p { margin: 6px 0; text-indent: 2em; }
.notice-paper .sign { text-align: right; margin-top: 12px; color: #4a5568; }
.el-descriptions__label { white-space: nowrap; }
.run-bar { display: flex; align-items: center; gap: 14px; padding: 10px 14px; border: 1px solid var(--stp-border); border-radius: 6px; background: #fafbfc; margin-bottom: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" :user="me" :role="roleOf(me)" active="privacy-params" title="防反推参数"
  desc="面向上游的全部数据出口（看板、多维查询、导出、定时发送、拉取接口）都经过同一个聚合引擎，引擎按本页参数做披露判定。参数修改须经“提交 → 另一人复核 → 生效”，并在调整前通知全部下游企业。">
  <template #actions>
    <el-dropdown trigger="click" @command="v => me = v">
      <el-button><el-icon><UserFilled /></el-icon>原型状态 · 当前操作人：{{ me }}（{{ roleOf(me) }}）<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
      <template #dropdown><el-dropdown-menu>
        <el-dropdown-item v-for="s in staff" :key="s.n" :command="s.n" :disabled="s.n===me">{{ s.n }}（{{ s.r }}）</el-dropdown-item>
      </el-dropdown-menu></template>
    </el-dropdown>
    <el-button @click="openNotice(null)"><el-icon><Bell /></el-icon>参数变更公告预览</el-button>
    <el-button type="primary" :loading="run.on" @click="tab='tests'; runAll()"><el-icon><VideoPlay /></el-icon>执行全部用例</el-button>
  </template>

  <div class="grid c4">
    <div class="stat">
      <div class="label">当前生效参数版本</div>
      <div class="value num">V1.{{ ver }}</div>
      <div class="foot"><span>共 {{ params.length }} 项参数</span><span v-if="offDefault">其中 <b style="color:#b26a00">{{ offDefault }}</b> 项偏离建议值</span><span v-else>全部等于建议默认值</span></div>
      <div class="ico"><el-icon><Lock /></el-icon></div>
    </div>
    <div class="stat" style="cursor:pointer" @click="tab='pending'">
      <div class="label">待复核变更</div>
      <div class="value num">{{ pending.length }}<span class="unit">项</span></div>
      <div class="foot"><span>提交人不能复核自己的申请</span></div>
      <div class="ico"><el-icon><Stamp /></el-icon></div>
    </div>
    <div class="stat" style="cursor:pointer" @click="tab='tests'">
      <div class="label">反推测试用例集</div>
      <div class="value num">{{ passTotal }} / {{ caseTotal }}<span class="unit">通过</span></div>
      <div class="foot"><span>上次执行 {{ lastRun }}</span><b v-if="needRegress" style="color:#e5484d">参数已变更，须回归</b></div>
      <div class="ico"><el-icon><CircleCheck /></el-icon></div>
    </div>
    <div class="stat" style="cursor:pointer" @click="tab='mask'">
      <div class="label">全平台屏蔽率（近 30 日，量指标）<el-tooltip content="全部上游的查询命中单元格中，被屏蔽单元格所占比例。只统计单元格数，不涉及任何企业数值" placement="top"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
      <div class="value num">12.4<span class="unit">%</span></div>
      <div class="foot"><span>较上月 <b class="down">-0.9 个百分点</b></span><span>最高：不锈钢 41.2%</span></div>
      <div class="ico"><el-icon><Hide /></el-icon></div>
    </div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- ============ 参数配置 ============ -->
      <el-tab-pane label="参数配置" name="params">
        <div class="tip-box orange small mb12">
          以下取值均为需求文档建议默认值，<b>示例参数，待业务方确定</b>（量指标参数对应待拍板事项 D-09、D-16，价格类参数对应 N-03）。放宽类变更（降低门槛、细化粒度）必须提前公告全部下游；已披露的历史聚合结果不因参数调整而回溯修改。
        </div>
        <template v-for="g in groups" :key="g.k">
          <div class="grp-title"><i></i>{{ g.t }}<small>{{ g.d }}</small></div>
          <el-table :data="paramsOf(g.k)" border size="small">
            <el-table-column label="参数" width="200">
              <template #default="{row}"><div class="p-name"><b>{{ row.name }}</b><span>{{ row.code }}</span></div></template>
            </el-table-column>
            <el-table-column label="当前值" width="210">
              <template #default="{row}">
                <span class="p-val">{{ disp(row, row.v) }}</span>
                <el-tag v-if="row.v !== row.def" size="small" type="warning" style="margin-left:6px">偏离建议值</el-tag>
                <el-tag v-if="row.legal" size="small" type="info" style="margin-left:6px">待法务意见</el-tag>
                <div v-if="row.next" class="small" style="color:#b26a00">{{ row.next.eff }} 起改为 {{ disp(row, row.next.v) }}</div>
                <div v-if="pendingOf(row)" class="small" style="color:#409eff">有 1 项变更待复核</div>
              </template>
            </el-table-column>
            <el-table-column label="建议默认值" width="150"><template #default="{row}">{{ disp(row, row.def) }}</template></el-table-column>
            <el-table-column label="说明" min-width="300"><template #default="{row}"><span style="color:#4a5568">{{ row.desc }}</span></template></el-table-column>
            <el-table-column label="最近修改" width="176">
              <template #default="{row}">
                <template v-if="row.last"><div class="num">{{ row.last.t }}</div><div class="small muted">{{ row.last.by }} 提交 · {{ row.last.rv }} 复核</div></template>
                <span v-else class="muted">初始配置（{{ row.g==='vol' ? '2025-07-01' : '2026-06-01' }}）</span>
              </template>
            </el-table-column>
            <el-table-column label="操作" width="76" align="center">
              <template #default="{row}"><el-button link type="primary" :disabled="!!pendingOf(row)" @click="openEdit(row)">修改</el-button></template>
            </el-table-column>
          </el-table>
        </template>

        <div class="grp-title"><i></i>分品类披露粒度<small>各品类最细可查的地区、时间、规格层级可单独配置，样本稀疏的品类默认更粗（PV-61）；规格层级的开放与标准化深度挂钩（PV-63）</small>
          <span style="flex:1"></span><a href="master-category.html" style="font-weight:400;font-size:13px">去全品类主数据工作台配置 ›</a></div>
        <el-table :data="catGrain" border size="small">
          <el-table-column prop="name" label="大类" min-width="120" />
          <el-table-column label="标准化深度" width="150"><template #default="{row}"><el-tag size="small" :type="row.depth==='L4' ? 'success' : row.depth==='L3' ? 'primary' : 'info'">{{ row.depth }} · {{ row.depthName }}</el-tag></template></el-table-column>
          <el-table-column label="最细地区粒度" width="130"><template #default="{row}">{{ row.geo==='市' ? '地级市' : '省' }}</template></el-table-column>
          <el-table-column label="最细时间粒度" width="130"><template #default="{row}">{{ row.time }}<span v-if="row.time==='日'">（T+1）</span></template></el-table-column>
          <el-table-column label="规格段下钻" width="130"><template #default="{row}"><span v-if="row.depth==='L4'"><span class="dot ok"></span>已开放</span><span v-else class="muted"><span class="dot"></span>未开放</span></template></el-table-column>
          <el-table-column label="上游下钻到未开放层级时" min-width="260"><template #default="{row}"><span class="muted">{{ row.geo==='市' && row.time==='日' && row.depth==='L4' ? '—' : '提示“该品类暂不提供此粒度”，不返回任何数值' }}</span></template></el-table-column>
          <el-table-column label="近 30 日量指标屏蔽率" width="170" align="right"><template #default="{row}"><span class="num">{{ row.mask.toFixed(1) }}%</span></template></el-table-column>
        </el-table>
        <div class="small muted mt8">上传粒度（单据行级 / 按日汇总）不是披露参数，也不作为上游可见的维度或筛选条件（PV-60）；两种粒度的数据在企业日粒度事实层合并后统一判定（PV-62）。</div>
      </el-tab-pane>

      <!-- ============ 待复核变更 ============ -->
      <el-tab-pane name="pending">
        <template #label>待复核变更<el-badge v-if="pending.length" :value="pending.length" style="margin-left:6px" /></template>
        <div class="row between mb12">
          <div class="flow-mini"><span>1 提交变更</span><el-icon><ArrowRight /></el-icon><span>2 另一人复核</span><el-icon><ArrowRight /></el-icon><span>3 按生效时间生效</span><el-icon><ArrowRight /></el-icon><span>4 写入变更历史并触发用例回归</span></div>
          <span class="small muted">当前操作人：<b style="color:#1f2d3d">{{ me }}</b>（{{ roleOf(me) }}）。可在页面右上角切换为另一位复核人。</span>
        </div>
        <el-table :data="pending" border size="small">
          <template #empty><el-empty description="暂无待复核的参数变更" :image-size="70" /></template>
          <el-table-column prop="id" label="申请编号" width="150" />
          <el-table-column label="变更内容" min-width="220">
            <template #default="{row}">
              <b>{{ row.name }}</b><el-tag size="small" :type="row.dir==='放宽' ? 'danger' : row.dir==='收紧' ? 'success' : 'info'" style="margin-left:6px">{{ row.dir }}</el-tag>
              <div class="mt8"><span class="code">{{ row.from }}</span> <el-icon style="vertical-align:-2px"><Right /></el-icon> <span class="code" style="color:#2b5d9b;background:#eef4fb">{{ row.to }}</span></div>
            </template>
          </el-table-column>
          <el-table-column prop="reason" label="变更原因" min-width="200" />
          <el-table-column label="生效时间" width="130"><template #default="{row}">{{ row.effMode==='now' ? '复核后下一发布批次' : row.eff }}</template></el-table-column>
          <el-table-column label="提前公告" width="110"><template #default="{row}"><span v-if="row.notice">全部下游<br><span class="small muted">提前 {{ row.days }} 天</span></span><span v-else class="muted">不提前公告</span></template></el-table-column>
          <el-table-column label="提交人" width="130"><template #default="{row}">{{ row.by }}<div class="small muted num">{{ row.t }}</div></template></el-table-column>
          <el-table-column label="操作" width="200" align="center">
            <template #default="{row}">
              <el-button link type="primary" @click="openNotice(row)">公告预览</el-button>
              <template v-if="row.by===me">
                <el-tooltip content="提交人不能复核自己的申请，请切换为另一位复核人" placement="top"><span><el-button link type="primary" disabled>通过</el-button></span></el-tooltip>
                <el-button link type="info" @click="withdraw(row)">撤回</el-button>
              </template>
              <template v-else>
                <el-button link type="success" @click="approve(row)">通过</el-button>
                <el-button link type="danger" @click="reject(row)">驳回</el-button>
              </template>
            </template>
          </el-table-column>
        </el-table>
        <div class="tip-box blue small mt12">复核通过后，变更按设定的生效时间进入聚合引擎的下一发布批次；需要提前公告的变更，系统在生效日前按提前天数向全部下游企业发送通知，并更新下游端“披露规则公示”。复核通过即视为参数发生变更，<b>须重新执行反推测试用例集并全部通过</b>。</div>
      </el-tab-pane>

      <!-- ============ 变更历史 ============ -->
      <el-tab-pane label="变更历史" name="history">
        <el-table :data="history" border size="small">
          <el-table-column prop="id" label="申请编号" width="146" />
          <el-table-column label="变更内容" min-width="210">
            <template #default="{row}"><b>{{ row.name }}</b><div class="small" v-if="row.from"><span class="muted">{{ row.from }}</span> → {{ row.to }}</div><div class="small muted" v-else>{{ row.to }}</div></template>
          </el-table-column>
          <el-table-column prop="reason" label="原因 / 复核意见" min-width="220"><template #default="{row}">{{ row.reason }}<div v-if="row.rejectReason" class="small" style="color:#e5484d">驳回意见：{{ row.rejectReason }}</div></template></el-table-column>
          <el-table-column label="提交" width="126"><template #default="{row}">{{ row.by }}<div class="small muted num">{{ row.t }}</div></template></el-table-column>
          <el-table-column label="复核" width="126"><template #default="{row}"><template v-if="row.rv">{{ row.rv }}<div class="small muted num">{{ row.rvT }}</div></template><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="生效时间" width="110"><template #default="{row}">{{ row.status==='已驳回' || row.status==='已撤回' ? '—' : (row.effMode==='now' ? '下一发布批次' : row.eff) }}</template></el-table-column>
          <el-table-column label="公告" width="86"><template #default="{row}"><span v-if="row.notice && row.rv && row.status!=='已驳回'">提前 {{ row.days }} 天</span><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="状态" width="110" align="center">
            <template #default="{row}"><el-tag size="small" :type="row.status==='已生效' ? 'success' : row.status==='已驳回' ? 'danger' : row.status==='已撤回' ? 'info' : 'warning'">{{ row.status }}</el-tag></template>
          </el-table-column>
        </el-table>
        <div class="small muted mt8"><el-icon style="vertical-align:-2px"><Lock /></el-icon> 变更记录不可修改、不可删除，同步写入<a href="audit.html">审计日志</a>“后台参数变更”分类。</div>
      </el-tab-pane>

      <!-- ============ 反推测试用例集 ============ -->
      <el-tab-pane label="反推测试用例集" name="tests">
        <el-alert v-if="needRegress" type="error" show-icon :closable="false" title="参数自上次执行后已发生变更，须回归全部用例。回归通过前，该变更不得进入发布批次。" />
        <div class="run-bar">
          <el-button type="primary" :loading="run.on" @click="runAll"><el-icon><VideoPlay /></el-icon>执行全部用例</el-button>
          <div style="flex:1">
            <el-progress v-if="run.on || run.done" :percentage="run.pct" :status="run.done ? 'success' : ''" :stroke-width="10" />
            <span v-else class="small muted">共 {{ tests.length }} 类 {{ caseTotal }} 条用例。全部通过方可上线；参数或聚合引擎变更后须回归（PV-43、PV-59）。</span>
          </div>
          <span class="small muted" v-if="run.on">正在执行：{{ run.cur }}</span>
          <span class="small" v-else>上次执行 <b class="num">{{ lastRun }}</b> · 引擎版本 v1.8.2 · 参数版本 V1.{{ runVer }}</span>
        </div>
        <el-table :data="tests" border size="small">
          <el-table-column type="index" label="#" width="46" align="center" />
          <el-table-column label="类别" width="150"><template #default="{row}"><b>{{ row.cat }}</b><span v-if="row.v2" class="level-tag">V0.2</span></template></el-table-column>
          <el-table-column prop="ex" label="典型用例" min-width="290" />
          <el-table-column prop="exp" label="期望结果" min-width="270" />
          <el-table-column label="用例数" width="76" align="right"><template #default="{row}"><span class="num">{{ row.n }}</span></template></el-table-column>
          <el-table-column label="上次执行时间" width="150"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="结果" width="130" align="center">
            <template #default="{row}">
              <el-tag v-if="row.st==='run'" size="small" type="primary" disable-transitions>执行中…</el-tag>
              <el-tag v-else-if="row.st==='wait'" size="small" type="info" disable-transitions>排队中</el-tag>
              <el-tag v-else size="small" type="success" disable-transitions>通过 {{ row.n }} / {{ row.n }}</el-tag>
            </template>
          </el-table-column>
        </el-table>
        <div class="grid c2 mt12" style="margin-bottom:0">
          <div>
            <div class="grp-title"><i></i>执行记录</div>
            <table class="plain-table">
              <thead><tr><th>执行时间</th><th>触发原因</th><th>执行人</th><th class="r">用例数</th><th class="c">结果</th></tr></thead>
              <tbody><tr v-for="r in runLog" :key="r.t"><td class="num">{{ r.t }}</td><td>{{ r.why }}</td><td>{{ r.by }}</td><td class="r num">{{ r.n }}</td><td class="c"><span class="dot ok"></span>全部通过</td></tr></tbody>
            </table>
          </div>
          <div>
            <div class="grp-title"><i></i>验收规则</div>
            <div class="tip-box small">
              1. 用例集是上线验收项：<b>全部通过方可上线</b>，任一类失败则阻断发布。<br>
              2. 参数变更复核通过、聚合引擎版本变更、分品类披露粒度调整后，必须回归全部用例。<br>
              3. 用例在隔离的测试数据集上执行，使用构造的虚拟企业数据，不读取任何真实企业的上传明细。<br>
              4. “出口一致”类用例同时校验页面、导出、定时发送、拉取接口四个出口的结果、屏蔽与修约完全一致。<br>
              5. “闸口”类用例校验价格闸口关闭时，上游侧四个出口均不出现任何价格内容。当前闸口状态：<b>{{ $state.gate==='open' ? '已开放' : '未开放' }}</b>，见<a href="price-control.html">价格数据管控</a>。
            </div>
          </div>
        </div>
      </el-tab-pane>

      <!-- ============ 屏蔽率监控 ============ -->
      <el-tab-pane label="屏蔽率监控" name="mask" lazy>
        <div class="grid c-3-2" style="margin-bottom:0">
          <div>
            <div class="grp-title"><i></i>按大类的屏蔽单元格比例<small>近 30 日，全部上游的查询命中单元格</small></div>
            <ve-chart :option="maskOption" height="300px"></ve-chart>
          </div>
          <div>
            <div class="grp-title"><i></i>全平台屏蔽率趋势<small>近 12 周，量指标</small></div>
            <ve-chart :option="trendOption" height="300px"></ve-chart>
          </div>
        </div>
        <div class="grid c-3-2 mt12" style="margin-bottom:0">
          <div>
            <div class="grp-title"><i></i>屏蔽率最高的“地区 × 大类”组合<small>供需匹配：样本不足导致上游“买了看不到”的位置</small></div>
            <el-table :data="maskTop" border size="small">
              <el-table-column prop="geo" label="地区" width="70" />
              <el-table-column prop="cat" label="大类" width="100" />
              <el-table-column label="屏蔽率" min-width="130"><template #default="{row}"><el-progress :percentage="row.r" :stroke-width="8" :color="row.r > 60 ? '#e5484d' : '#f0a020'" /></template></el-table-column>
              <el-table-column label="命中单元格" width="96" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.cells) }}</span></template></el-table-column>
              <el-table-column label="已上架企业数" width="104" align="center"><template #default="{row}">{{ row.band }} 家</template></el-table-column>
              <el-table-column prop="act" label="建议动作" min-width="150" />
            </el-table>
          </div>
          <div>
            <div class="grp-title"><i></i>说明</div>
            <div class="tip-box blue small">
              屏蔽率 = 被屏蔽单元格数 ÷ 查询命中单元格数，只统计单元格个数，<b>不含任何企业的销量、库存、价格数值</b>。<br>

          { id: 'CHG-20261013-01', name: '价格单元格最小有价企业数（k_价）', from: '6 家', to: '8 家', reason: '与待确认事项 N-03 的建议值对齐，在价格功能联调前收紧。', by: '吴靖', t: '2026-10-13 15:20', rv: '林若彤', rvT: '2026-10-13 17:05', effMode: 'date', eff: '2026-10-21', notice: true, days: 7, status: '已生效' },
          { id: 'CHG-20260922-01', name: '替换比例上限', from: '25%', to: '20%', reason: '按 D-16 建议值执行，降低通过轮换遍历企业的可行性。', by: '林若彤', t: '2026-09-22 14:10', rv: '吴靖', rvT: '2026-09-22 16:40', effMode: 'date', eff: '2026-10-01', notice: true, days: 7, status: '已生效' },
          { id: 'CHG-20260918-02', name: '优势度 2', from: '80%', to: '85%', reason: '部分上游反馈管材品类屏蔽率偏高，申请放宽。', rejectReason: '放宽优势度会降低对头部企业的保护；屏蔽率应通过扩大样本或调粗披露粒度解决。', by: '林若彤', t: '2026-09-18 10:26', rv: '吴靖', rvT: '2026-09-18 11:52', effMode: 'date', eff: '—', notice: true, days: 7, status: '已驳回' },
          { id: 'CHG-20260520-01', name: '价格类参数首次配置', from: '', to: '新增 8 项价格类参数，按待确认事项 N-03 的建议值配置（其中 k_价初始为 6 家）', reason: '下游价格上传功能上线前配置；上游价格功能闸口保持关闭。', by: '吴靖', t: '2026-05-20 10:00', rv: '唐蕾', rvT: '2026-05-21 15:30', effMode: 'date', eff: '2026-06-01', notice: true, days: 7, status: '已生效' },
          { id: 'CHG-20250620-01', name: '初始参数集上线', from: '', to: '12 项量指标参数按需求文档建议默认值配置（其中替换比例上限初始为 25%）', reason: '板块一期上线初始配置。', by: '吴靖', t: '2025-06-20 10:00', rv: '林若彤', rvT: '2025-06-20 16:10', effMode: 'date', eff: '2025-07-01', notice: false, days: 0, status: '已生效' }],
        dlg: { show: false, p: null }, form: { v: null, reason: '', notice: true, days: 7, effMode: 'date', eff: '2026-12-01' },
        notice: { show: false, row: null },
        tests: TESTS, run: { on: false, done: false, pct: 0, cur: '' },
        runLog: [
          { t: '2026-11-20 02:14', why: '聚合引擎 v1.8.2 发布前回归', by: '系统（发布流水线）', n: 212 },
          { t: '2026-10-13 17:20', why: '参数变更 CHG-20261013-01 复核通过后、生效前回归', by: '吴靖', n: 212 },
          { t: '2026-09-22 16:55', why: '参数变更 CHG-20260922-01 复核通过后、生效前回归', by: '吴靖', n: 204 }],
        catGrain: M.categories.map((c) => ({ name: c.name, depth: c.depth, depthName: DEPTH[c.depth], geo: c.geo, time: c.time, mask: MASK[c.name][0] })),
        maskTop: [
          { geo: '甘肃', cat: '不锈钢', r: 92, cells: 1260, band: '低于 5', act: '定向招募；披露粒度已调到省、旬' },
          { geo: '重庆', cat: '优特钢', r: 84, cells: 2140, band: '5–9', act: '定向招募' },
          { geo: '江西', cat: '管材', r: 71, cells: 3380, band: '5–9', act: '定向招募；购买前预估中提示' },
          { geo: '辽宁', cat: '冷轧及涂镀', r: 66, cells: 2950, band: '10–19', act: '购买前预估中提示' },
          { geo: '陕西', cat: '型钢', r: 58, cells: 4120, band: '10–19', act: '观察' },
          { geo: '湖南', cat: '中厚板', r: 52, cells: 5270, band: '10–19', act: '观察' }],
      };
    },
    computed: {
      offDefault() { return this.params.filter((p) => p.v !== p.def).length; },
      caseTotal() { return this.tests.reduce((a, t) => a + t.n, 0); },
      passTotal() { return this.tests.filter((t) => t.st === 'pass').reduce((a, t) => a + t.n, 0); },
      formDir() { return this.dlg.p ? this.dirOf(this.dlg.p, this.form.v) : ''; },
      maskOption() {
        const open = this.$state.gate === 'open';
        const o = STP.chart.bar({ x: Object.keys(MASK), unit: '%', series: [{ name: '量指标（销量、库存）', data: Object.values(MASK).map((v) => v[0]) }, { name: open ? '价格指标' : '价格指标（引擎预演，闸口未开放）', data: Object.values(MASK).map((v) => v[1]), color: '#f7b500' }] });
        o.yAxis.axisLabel = { color: '#6b7787', formatter: '{value}%' }; o.yAxis.max = 80; o.xAxis.axisLabel = { color: '#6b7787', interval: 0 };
        return o;
      },
      trendOption() {
        const x = STP.dayList('2026-11-22', 78).filter((d, i) => i % 7 === 0).map((d) => d.slice(5) + ' 周');
        const o = STP.chart.line({ x: x.concat(['11-16 周']), unit: '%', area: true, legend: false, series: [{ name: '全平台屏蔽率', data: [15.8, 15.5, 15.1, 14.6, 14.4, 13.9, 13.6, 13.3, 13.1, 12.8, 12.6, 12.4] }] });
        o.yAxis[0].axisLabel = { color: '#6b7787', formatter: '{value}%' }; o.yAxis[0].min = 10; o.yAxis[0].max = 18;
        return o;
      },
    },
    methods: {
      roleOf(n) { return STAFF.find((s) => s.n === n).r; },
      paramsOf(g) { return this.params.filter((p) => p.g === g); },
      pendingOf(p) { return this.pending.find((x) => x.pid === p.id); },
      disp(p, v) { return p.type === 'num' ? v + p.unit : v; },
      valOf(id) { const p = this.params.find((x) => x.id === id); return this.disp(p, p.v); },
      dirOf(p, v) {
        if (v === p.v || v === null || v === '') return '';
        if (p.type === 'num') return (v < p.v) === (p.loose === 'down') ? '放宽' : '收紧';
        if (p.type === 'select') return p.opts.indexOf(v) < p.opts.indexOf(p.v) ? '放宽' : '收紧';
        return '调整';
      },
      noticeDate(r) { return r.effMode === 'now' ? '2026-11-24' : STP.addDays(r.eff, -r.days); },
      openEdit(p) {
        this.dlg = { show: true, p };
        this.form = { v: p.v, reason: '', notice: true, days: 7, effMode: 'date', eff: '2026-12-01' };
      },
      draft() {
        const p = this.dlg.p, f = this.form;
        return { pid: p.id, name: p.name + (p.code.length < 5 ? '（' + p.code + '）' : ''), from: this.disp(p, p.v), to: this.disp(p, f.v), raw: f.v, dir: this.formDir || '调整', reason: f.reason || '（未填写）', effMode: f.effMode, eff: f.eff, notice: f.notice, days: f.days };
      },
      submit() {
        const p = this.dlg.p, f = this.form, val = (id) => this.params.find((x) => x.id === id).v;
        const warn = (m) => ElementPlus.ElMessage({ message: m, type: 'warning' });
        if (f.v === p.v || f.v === '' || f.v === null) return warn('新值与当前值相同，无需提交');
        if (!f.reason.trim()) return warn('请填写变更原因');
        if (p.id === 'kPrice' && f.v < val('k')) return warn('k_价不得低于 k（当前 ' + val('k') + ' 家）');
        if (p.id === 'k' && f.v > val('kPrice')) return warn('k 不得高于 k_价（当前 ' + val('kPrice') + ' 家），请先调高 k_价');
        if (p.id === 'k' && f.v > val('nMin')) return warn('k 不得高于最小数据池企业数（当前 ' + val('nMin') + ' 家）');
        if ((p.id === 'dom1' && f.v > val('dom2')) || (p.id === 'dom2' && f.v < val('dom1'))) return warn('优势度 1 不得高于优势度 2');
        if ((p.id === 'pDom1' && f.v > val('pDom2')) || (p.id === 'pDom2' && f.v < val('pDom1'))) return warn('价格优势度 1 不得高于价格优势度 2');
        if (f.notice && f.effMode === 'now') f.effMode = 'date';
        if (f.effMode === 'date' && f.eff < STP.addDays(M.TODAY, f.notice ? f.days : 1)) return warn(f.notice ? '生效日期须不早于 ' + STP.addDays(M.TODAY, f.days) + '（今天起满 ' + f.days + ' 天公告期）' : '生效日期须晚于今天');
        const row = Object.assign(this.draft(), { id: 'CHG-20261124-0' + (this.pending.length + this.history.filter((h) => h.id.indexOf('20261124') > 0).length + 1), by: this.me, t: nowStr() });
        this.pending.unshift(row);
        this.dlg.show = false; this.tab = 'pending';
        this.$demo('已提交，等待另一位平台人员复核。提交人不能复核自己的申请。');
      },
      approve(row) {
        if (row.by === this.me) return this.$info('提交人不能复核自己的申请，请切换为另一位复核人');
        ElementPlus.ElMessageBox.confirm('确认通过“' + row.name + '：' + row.from + ' → ' + row.to + '”？通过后将按生效时间进入聚合引擎，并须回归全部反推测试用例。', '复核参数变更', { type: 'warning', confirmButtonText: '确认通过', cancelButtonText: '取消' }).then(() => {
          const p = this.params.find((x) => x.id === row.pid), t = nowStr();
          p.last = { t, by: row.by, rv: this.me };
          if (row.effMode === 'now') { p.v = row.raw; p.next = null; } else p.next = { v: row.raw, eff: row.eff };
          this.pending = this.pending.filter((x) => x !== row);
          this.history.unshift(Object.assign({}, row, { rv: this.me, rvT: t, status: row.effMode === 'now' ? '已生效' : '已复核，待生效' }));
          this.ver++; this.needRegress = true;
          this.$demo('复核通过。' + (row.effMode === 'now' ? '参数已更新，下一发布批次起适用。' : '将于 ' + row.eff + ' 生效' + (row.notice ? '，系统按期向全部下游发送公告。' : '。')) + '请回归反推测试用例集。');
        }).catch(() => {});
      },
      reject(row) {
        ElementPlus.ElMessageBox.prompt('请填写驳回意见（提交人可见，写入变更历史）', '驳回参数变更', { confirmButtonText: '确认驳回', cancelButtonText: '取消', inputPlaceholder: '驳回意见', inputValidator: (v) => !!(v && v.trim()) || '请填写驳回意见' }).then(({ value }) => {
          this.pending = this.pending.filter((x) => x !== row);
          this.history.unshift(Object.assign({}, row, { rv: this.me, rvT: nowStr(), status: '已驳回', rejectReason: value }));
          this.$demo('已驳回，参数保持不变');
        }).catch(() => {});
      },
      withdraw(row) {
        this.pending = this.pending.filter((x) => x !== row);
        this.history.unshift(Object.assign({}, row, { rv: '', rvT: '', status: '已撤回' }));
        this.$demo('已撤回申请');
      },
      openNotice(row) {
        const r = row || this.pending[0] || this.history.find((h) => h.from);
        this.notice = { show: true, row: r };
      },
      runAll() {
        if (this.run.on) return;
        this.run = { on: true, done: false, pct: 0, cur: this.tests[0].cat };
        this.tests.forEach((t) => { t.st = 'wait'; });
        let i = 0; const t0 = nowStr();
        const step = () => {
          if (i > 0) { this.tests[i - 1].st = 'pass'; this.tests[i - 1].t = t0; }
          this.run.pct = Math.round(i / this.tests.length * 100);
          if (i >= this.tests.length) {
            this.run.on = false; this.run.done = true; this.lastRun = t0; this.runVer = this.ver;
            this.runLog.unshift({ t: t0, why: this.needRegress ? '参数变更回归' : '手动执行', by: this.me, n: this.caseTotal });
            this.needRegress = false;
            return this.$demo('全部 ' + this.caseTotal + ' 条用例执行通过');
          }
          this.tests[i].st = 'run'; this.run.cur = this.tests[i].cat + '（' + this.tests[i].n + ' 条）'; i++;
          setTimeout(step, 180);
        };
        step();
      },
    },
  });
})();
</script>
