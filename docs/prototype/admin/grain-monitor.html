<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>上传粒度监控 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.src b { font-family: Consolas, Menlo, monospace; font-weight: 600; }
.src span { display: block; font-size: 12px; color: var(--stp-sub); }
.rule-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.rule-item { border: 1px solid var(--stp-border); border-radius: 8px; padding: 14px 16px; background: #fafbfd; }
.rule-item .no { font-size: 12px; color: var(--stp-sub); }
.rule-item h4 { margin: 4px 0 6px; font-size: 14px; line-height: 1.5; }
.rule-item p { margin: 0; font-size: 12.5px; color: var(--stp-sub); line-height: 1.7; }
.sub-title { display: flex; align-items: center; gap: 10px; font-weight: 600; margin: 4px 0 10px; }
.sub-title small { font-weight: 400; color: var(--stp-sub); }
.sub-title .flex1 { flex: 1; }
.side-kv { display: grid; gap: 12px; }
.side-kv .it { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13px; }
.side-kv .it i { grid-column: 1 / 3; display: block; height: 6px; border-radius: 3px; background: #eef1f5; overflow: hidden; }
.side-kv .it i em { display: block; height: 100%; border-radius: 3px; background: #409eff; }
.side-kv h5 { margin: 0; font-size: 12px; color: var(--stp-sub); font-weight: 400; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" active="grain-monitor" title="上传粒度监控"
  desc="下游企业可按“企业 + 来源系统”选择单据行级或按日汇总上传。本页监控粒度分布、切换、粒度冲突拒收，以及日汇总企业的对账差异与批次完整性；只展示状态、计数与比率。“统计维度格子达标与上卷率”页签监控披露侧各品类维度格子的达标情况。">
  <template #actions>
    <span class="muted small">数据日期 {{ dataDate }}</span>
    <el-button @click="$demo('粒度监控日报已导出（仅含状态、计数与比率）')"><el-icon><Download /></el-icon>导出监控日报</el-button>
    <el-button @click="$go('quality.html')">数据质量监控</el-button>
  </template>

  <div class="grid c4">
    <stat-card label="行级模式企业" :value="14120" unit="家" icon="Tickets" tip="按主来源系统归类；逐条上传单据行，平台可做单据级去重与校验"><span>占 <b>66.0%</b></span><span>较上月 <b class="up">+212</b></span></stat-card>
    <stat-card label="日汇总模式企业" :value="7266" unit="家" icon="Calendar" tip="按主来源系统归类；按业务日期整批上传当日汇总记录，整批替换生效"><span>占 <b>34.0%</b></span><span>较上月 <b class="up">+148</b></span></stat-card>
    <stat-card label="多来源系统混用企业" :value="412" unit="家" icon="Connection" tip="同一企业的不同来源系统分别使用行级与日汇总两种粒度；已按主来源系统计入前两项"><span>平均 <b>2.3</b> 个来源系统</span></stat-card>
    <stat-card label="本月粒度切换" :value="186" unit="次" icon="Switch" tip="2026 年 11 月已提交的粒度切换次数，含待生效"><span>行级转日汇总 <b>121</b></span><span>日汇总转行级 <b>65</b></span></stat-card>
    <stat-card label="近 7 日粒度冲突拒收" :value="41" unit="批次" icon="CircleClose" tip="同一来源系统、同一业务日期出现两种粒度时，与当前设置不符的一方被拒收（错误码 3004）"><span>涉及 <b>9</b> 家企业</span><span>拒收数据未入库</span></stat-card>
    <stat-card label="日汇总批次不完整告警" :value="23" unit="项" icon="Warning" tip="分片缺末片标记，整批不生效，沿用上一个完整批次"><span>待补传 <b>17</b></span><span>已补齐 <b>6</b></span></stat-card>
    <stat-card label="对账差异企业" :value="58" unit="家" icon="DataAnalysis" tip="日汇总企业申报的控制总数与实际入库数的条数或吨位差异超过 0.5%"><span>占日汇总企业 <b>0.8%</b></span></stat-card>
    <stat-card label="同一来源系统切换上限" :value="1" unit="次 / 月" icon="Timer" tip="同一来源系统每月最多切换一次，按业务日期生效，生效日不早于次日"><span>示例参数，待业务方确定</span></stat-card>
  </div>

  <div class="grid c-2-1">
    <div class="card">
      <div class="card-title"><span>粒度趋势<small>近 12 个月，企业数与月切换次数</small></span></div>
      <ve-chart :option="trendOption" height="280px"></ve-chart>
    </div>
    <div class="card">
      <div class="card-title"><span>粒度分布<small>共 21,386 家</small></span></div>
      <ve-chart :option="pieOption" height="150px"></ve-chart>
      <table class="plain-table mt8">
        <thead><tr><th>规模档</th><th style="text-align:right">行级模式</th><th style="text-align:right">日汇总模式</th><th style="text-align:right">日汇总占比</th></tr></thead>
        <tbody>
          <tr v-for="s in scales" :key="s.t"><td>{{ s.t }}</td><td class="num" style="text-align:right">{{ $fmt(s.a) }}</td><td class="num" style="text-align:right">{{ $fmt(s.b) }}</td><td class="num" style="text-align:right">{{ (s.b / (s.a + s.b) * 100).toFixed(1) }}%</td></tr>
        </tbody>
      </table>
      <div class="small muted mt8">规模档为企业自行申报的年销量区间，此处只做家数统计。</div>
    </div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- 各企业粒度与切换记录 -->
      <el-tab-pane name="ent" label="各企业当前粒度与切换记录">
        <div class="tip-box blue small mb12">粒度按“企业 + 来源系统”设置，切换须指定生效业务日期（不早于次日），生效日之前的数据保持原粒度。<b>同一来源系统每月最多切换一次</b>（示例参数，待业务方确定）。切换由企业自行发起，平台只监控、不代为切换。</div>
        <div class="filter-bar">
          <el-input v-model="f.kw" placeholder="企业名称 / 来源系统" clearable style="width:220px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <el-select v-model="f.grain" placeholder="当前粒度" clearable style="width:140px"><el-option label="行级模式" value="行级模式" /><el-option label="日汇总模式" value="日汇总模式" /></el-select>
          <el-checkbox v-model="f.mixed">只看多来源混用</el-checkbox>
          <el-checkbox v-model="f.switched">只看本月有切换</el-checkbox>
          <span class="flex1"></span>
          <span class="muted small">原型展示 {{ entRows.length }} 条示例（按来源系统一行）</span>
        </div>
        <el-table :data="entRows" size="small" border>
          <el-table-column label="企业" min-width="210"><template #default="{row}"><b>{{ row.name }}</b> <el-tag v-if="row.mixed" size="small" type="warning">多来源混用</el-tag></template></el-table-column>
          <el-table-column label="来源系统" width="150"><template #default="{row}"><div class="src"><b>{{ row.src }}</b><span>{{ row.srcName }}</span></div></template></el-table-column>
          <el-table-column label="当前粒度" width="104"><template #default="{row}"><el-tag size="small" :type="row.grain === '行级模式' ? 'primary' : 'success'">{{ row.grain }}</el-tag></template></el-table-column>
          <el-table-column label="粒度生效业务日期" width="140"><template #default="{row}">自 {{ row.since }} 起</template></el-table-column>
          <el-table-column label="待生效的切换" min-width="170"><template #default="{row}"><span v-if="row.pending" style="color:#b26a00">{{ row.pending }}</span><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="本月切换次数" width="110" align="center"><template #default="{row}"><b class="num" :style="{color: row.n >= 1 ? '#b26a00' : ''}">{{ row.n }}</b> <span class="muted">/ 1</span><div v-if="row.n >= 1" class="small muted">下月可再切换</div></template></el-table-column>
          <el-table-column label="最近切换时间" width="140"><template #default="{row}">{{ row.last || '未切换过' }}</template></el-table-column>
          <el-table-column label="操作" width="90" align="center"><template #default="{row}"><el-button link type="primary" @click="openHist(row)">切换记录</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>企业侧的粒度设置与切换入口在下游“上传设置”页；切换记录写入审计日志。</span></div>
      </el-tab-pane>

      <!-- 粒度冲突拒收统计 -->
      <el-tab-pane name="reject">
        <template #label>粒度冲突拒收统计 <el-badge :value="41" type="danger" style="vertical-align:1px" /></template>
        <div class="grid c-2-1" style="margin-bottom:14px">
          <div>
            <div class="sub-title">每日拒收批次数<small>近 14 日，按接收日；近 7 日合计 41 批次</small></div>
            <ve-chart v-if="tab === 'reject'" :option="rejectOption" height="230px"></ve-chart>
          </div>
          <div>
            <div class="sub-title">近 7 日拒收构成<small>共 41 批次</small></div>
            <div class="side-kv">
              <h5>按被拒收的粒度</h5>
              <div class="it" v-for="k in rejGrain" :key="k.t"><span>{{ k.t }}</span><b class="num">{{ k.n }} 批次</b><i><em :style="{width: k.n / 41 * 100 + '%'}"></em></i></div>
              <h5>按可能原因（运营标注）</h5>
              <div class="it" v-for="k in rejCause" :key="k.t"><span>{{ k.t }}</span><b class="num">{{ k.n }} 批次</b><i><em :style="{width: k.n / 41 * 100 + '%', background: '#f0a020'}"></em></i></div>
            </div>
          </div>
        </div>
        <el-table :data="rejects" size="small" border>
          <el-table-column label="企业" min-width="200"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
          <el-table-column label="来源系统" width="92"><template #default="{row}"><span class="code">{{ row.src }}</span></template></el-table-column>
          <el-table-column prop="date" label="业务日期" width="146" />
          <el-table-column label="被拒收的粒度" width="110"><template #default="{row}"><el-tag size="small" type="danger">{{ row.rej }}</el-tag></template></el-table-column>
          <el-table-column label="当前设置" width="104"><template #default="{row}">{{ row.cur }}</template></el-table-column>
          <el-table-column label="错误码" width="76" align="center"><template #default><el-tooltip content="3004：上传粒度与当前设置不符（HTTP 409）" placement="top"><span class="code">3004</span></el-tooltip></template></el-table-column>
          <el-table-column label="次数" width="76" align="right"><template #default="{row}"><b class="num">{{ row.n }}</b> 批次</template></el-table-column>
          <el-table-column prop="cause" label="可能原因" min-width="200" />
          <el-table-column label="操作" width="96" align="center"><template #default="{row}"><el-button link type="primary" @click="row.noticed = true; $demo('已通知「' + row.name + '」的企业管理员与接口对接员')">{{ row.noticed ? '再次通知' : '通知企业' }}</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>被拒收的数据<b>未入库、不参与聚合</b>，企业按当前设置的粒度重传即可。拒收次数只统计批次数，不涉及批内数据内容。</span></div>
      </el-tab-pane>

      <!-- 对账差异与批次不完整 -->
      <el-tab-pane name="recon" label="对账差异与批次不完整告警">
        <div class="sub-title">日汇总企业的对账差异<small>58 家企业，原型展示 {{ recons.length }} 条示例</small><span class="flex1"></span>
          <el-radio-group v-model="reconType" size="small"><el-radio-button value="" label="全部" /><el-radio-button value="条数" label="条数差异" /><el-radio-button value="吨位" label="吨位差异" /></el-radio-group>
        </div>
        <el-table :data="reconRows" size="small" border>
          <el-table-column label="企业" min-width="200"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
          <el-table-column label="来源系统" width="92"><template #default="{row}"><span class="code">{{ row.src }}</span></template></el-table-column>
          <el-table-column prop="date" label="业务日期" width="110" />
          <el-table-column label="差异类型" width="96"><template #default="{row}"><el-tag size="small" :type="row.type === '条数' ? 'info' : 'warning'">{{ row.type }}</el-tag></template></el-table-column>
          <el-table-column label="差异比例" width="150"><template #default="{row}"><b class="num" :style="{color: Math.abs(row.diff) >= 5 ? '#e5484d' : '#b26a00'}">{{ row.diff > 0 ? '+' : '' }}{{ row.diff.toFixed(1) }}%</b> <span class="muted small">{{ row.diff > 0 ? '入库多于申报' : '入库少于申报' }}</span></template></el-table-column>
          <el-table-column label="连续差异" width="88" align="right"><template #default="{row}"><span class="num">{{ row.days }}</span> 天</template></el-table-column>
          <el-table-column label="状态" min-width="170"><template #default="{row}"><span class="dot" :class="row.st === '已更正' ? 'ok' : row.st === '待企业核对' ? 'err' : 'warn'"></span>{{ row.st }}<div v-if="row.note" class="small muted">{{ row.note }}</div></template></el-table-column>
          <el-table-column label="操作" width="110" align="center"><template #default="{row}"><el-button v-if="row.st === '待企业核对'" link type="primary" @click="row.st = '已催办，待企业核对'; $demo('已催办企业核对对账差异')">催办核对</el-button><span v-else class="muted">—</span></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>差异比例 =（实际入库数 − 企业申报的控制总数）÷ 申报数，超过 0.5% 记为差异。<b>此处只给差异比例，不给条数与吨位</b>；日汇总模式没有单据级校验，对账是主要的完整性保障。</span></div>

        <div class="sub-title" style="margin-top:22px">日汇总批次不完整告警<small>共 23 项，原型展示 {{ batches.length }} 项示例</small></div>
        <el-table :data="batches" size="small" border>
          <el-table-column label="企业" min-width="200"><template #default="{row}"><b>{{ row.name }}</b></template></el-table-column>
          <el-table-column label="来源系统" width="92"><template #default="{row}"><span class="code">{{ row.src }}</span></template></el-table-column>
          <el-table-column prop="date" label="业务日期" width="110" />
          <el-table-column label="问题" width="190"><template #default="{row}"><el-tag size="small" type="danger">缺末片标记</el-tag> <span class="muted small">已收 {{ row.got }} 片</span></template></el-table-column>
          <el-table-column label="当前生效的数据" min-width="230"><template #default="{row}"><span v-if="row.prev">沿用上一个完整批次<div class="small muted">{{ row.prev }} 接收的批次</div></span><span v-else style="color:#b26a00">该业务日期暂无完整批次<div class="small muted">当日数据不参与聚合</div></span></template></el-table-column>
          <el-table-column label="已持续" width="90" align="right"><template #default="{row}">{{ row.hours }} 小时</template></el-table-column>
          <el-table-column label="状态" width="110"><template #default="{row}"><span class="dot" :class="row.st === '已补齐' ? 'ok' : 'warn'"></span>{{ row.st }}</template></el-table-column>
          <el-table-column label="操作" width="96" align="center"><template #default="{row}"><el-button v-if="row.st !== '已补齐'" link type="primary" @click="row.st = '已催办'; $demo('已催办企业补传完整批次')">催办补传</el-button><span v-else class="muted">—</span></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>日汇总按业务日期<b>整批替换</b>：新批次只有收到末片标记（isLast）才生效；不完整的批次整批不生效，沿用上一个完整批次。相关隔离记录见 <a href="quality.html">数据质量监控</a>。</span></div>
      </el-tab-pane>

      <!-- 统计维度的格子达标与上卷 -->
      <el-tab-pane name="dim">
        <template #label>统计维度格子达标与上卷率<span class="ex-tag" style="margin-left:6px">V0.4</span></template>
        <div class="tip-box blue small mb12">这一页看的是<b>披露侧的颗粒度</b>：各品类按统计维度模板（规格、厚度、宽度、壁厚、公斤段或负差段）切出的格子，有多少达到披露阈值（企业数 ≥ {{ $PV.k }}），有多少被自动上卷。它与上面几个页签的“上传粒度”（行级或日汇总）是两回事。数据按一个数据池估算，用于判断分段是否切得太细；<b>监控只有格子计数，不含任何格子的数量</b>。</div>
        <div class="row between mb12">
          <div class="row">
            <span class="small muted">数据池规模</span>
            <el-radio-group v-model="dimScale" size="small"><el-radio-button v-for="s in dimScales" :key="s.k" :value="s.k">{{ s.t }}</el-radio-button></el-radio-group>
            <span class="small muted">模板</span>
            <el-select v-model="dimTpl" size="small" clearable placeholder="全部模板" style="width:150px"><el-option v-for="t in dimSum" :key="t.k" :label="t.k" :value="t.k" /></el-select>
          </div>
          <span class="small muted">分段字典 {{ bandVer.ver }}（{{ bandVer.eff }} 生效）<span class="ex-tag" style="margin-left:6px">分段数值为示例参数</span>　<a href="master-category.html">维度模板与分段字典 ›</a></span>
        </div>
        <div class="grid c6" style="margin-bottom:12px">
          <div v-for="t in dimSum" :key="t.k" class="stat" style="cursor:pointer" :style="dimTpl === t.k ? 'border-color:#2f6bff' : ''" @click="dimTpl = dimTpl === t.k ? '' : t.k">
            <div class="label">{{ t.k }}<span class="unit-pill" :class="{ns: t.ns}" style="margin-left:6px">{{ t.ns ? '数量' : '吨' }}</span></div>
            <div class="value" :style="{color: t.rate === null ? '#8a94a3' : t.rate >= 85 ? '#18a058' : t.rate >= 65 ? '#d48806' : '#e5484d'}">{{ t.rate === null ? '—' : t.rate + '%' }}</div>
            <div class="sub"><span>{{ t.cell ? '第二维度格子达标率' : '最细层格子达标率' }}</span></div>
            <div class="sub"><span>上卷率 <b>{{ t.roll === null ? '—' : t.roll + '%' }}</b></span></div>
            <div class="sub"><span>维度：{{ t.dims }}</span></div>
          </div>
        </div>
        <el-table :data="dimShown" size="small" border>
          <el-table-column label="模板" width="92"><template #default="{row}"><b>{{ row.tpl }}</b></template></el-table-column>
          <el-table-column label="品名" min-width="130"><template #default="{row}">{{ row.name }}<div class="small muted">{{ row.cat }} · {{ row.depth }}</div></template></el-table-column>
          <el-table-column label="计量" width="70" align="center"><template #default="{row}"><span class="unit-pill" :class="{ns: row.unit !== '吨'}">{{ row.unit }}</span></template></el-table-column>
          <el-table-column label="最细披露层级" min-width="150"><template #default="{row}"><span v-if="row.open">{{ row.finest }}</span><span v-else class="muted">未达 L4：维度已采集，暂不披露</span></template></el-table-column>
          <el-table-column label="池内报送企业" width="96" align="right"><template #default="{row}"><span class="num">{{ row.n }}</span> 家</template></el-table-column>
          <el-table-column label="第一维度格子（达标 / 全部）" width="168">
            <template #default="{row}"><template v-if="row.open"><span class="num">{{ row.a1Ok }} / {{ row.a1 }}</span><span class="small muted">　{{ row.a1Name }}</span></template><span v-else class="muted">—</span></template>
          </el-table-column>
          <el-table-column label="第二维度格子（达标 / 全部）" width="200">
            <template #default="{row}">

        const o = STP.chart.bar({ x, unit: '批次', series: [{ name: '拒收批次数', data: v.map((n, i) => ({ value: n, itemStyle: { color: i >= 7 ? '#e5484d' : '#f3b6b8', borderRadius: [3, 3, 0, 0] } })), label: { show: true, position: 'top', color: '#6b7787', fontSize: 11 } }] });
        o.grid = Object.assign({}, o.grid, { top: 24 });
        return o;
      },
    },
    methods: {
      openHist(row) { this.cur = row; this.histDlg = true; },
    },
  });
})();
</script>
