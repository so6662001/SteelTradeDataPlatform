<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>带动奖励规则 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.el-descriptions__label { white-space: nowrap; }
.demo-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
.rule-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rule-item { border: 1px solid var(--stp-border); border-radius: 6px; padding: 10px 12px; background: #fff; }
.rule-item .k { font-size: 12px; color: var(--stp-sub); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rule-item .tbd { margin-left: auto; padding: 0 5px; border-radius: 3px; font-size: 11px; line-height: 16px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; }
.rule-item .ph, .ph-tag { padding: 0 5px; border-radius: 3px; font-size: 11px; line-height: 16px; background: #f4ecff; color: #7044c4; border: 1px solid #e0d1fb; font-weight: 400; }
.rule-item .v { font-size: 17px; font-weight: 600; margin: 4px 0 2px; }
.rule-item .v small { font-size: 12px; font-weight: 400; color: var(--stp-sub); margin-left: 4px; }
.rule-item .d { font-size: 12px; color: #5b6778; line-height: 1.6; }
.no-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.9; color: #4a5568; }
.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.mini-stats { display: flex; gap: 22px; flex-wrap: wrap; padding: 8px 12px; background: #f6f8fa; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
.mini-stats b { font-size: 15px; margin: 0 2px; }
.src-bar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; margin: 8px 0 10px; }
.src-bar i { display: block; height: 100%; }
.src-leg { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: #4a5568; }
.src-leg i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" :user="me" :role="roleOf(me)" active="referral-rewards" title="带动奖励规则"
  desc="平台不向下游贸易商发放现金分成，原分成预算改为奖励带动协议户入驻的钢厂：一期发放奖励名额，奖励折扣为二期。规则带生效日期并保留版本，修改须经双人复核；奖励按考核期由系统生成建议，运营审核后发放并通知钢厂。">
  <template #actions>
    <el-dropdown trigger="click" @command="v => me = v">
      <el-button><el-icon><UserFilled /></el-icon>原型状态 · 当前操作人：{{ me }}（{{ roleOf(me) }}）<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
      <template #dropdown><el-dropdown-menu>
        <el-dropdown-item v-for="s in staff" :key="s.n" :command="s.n" :disabled="s.n===me">{{ s.n }}（{{ s.r }}）</el-dropdown-item>
      </el-dropdown-menu></template>
    </el-dropdown>
    <el-button type="primary" @click="openEdit"><el-icon><Edit /></el-icon>修改奖励规则</el-button>
  </template>

  <div class="grid c4">
    <stat-card label="参与带动的钢厂" :value="312" unit="家" icon="OfficeBuilding"><span>占订阅钢厂 438 家的 71%</span></stat-card>
    <stat-card label="累计带动入驻的下游" :value="srcN('钢厂带动') + srcN('一级代理带动')" unit="家" icon="Promotion"><span>钢厂带动 {{ $fmt(srcN('钢厂带动')) }}</span><span>一级代理带动 {{ $fmt(srcN('一级代理带动')) }}</span></stat-card>
    <stat-card label="其中有效带动户" :value="12640" unit="户" icon="CircleCheck"><span>确认带动关系、完成首次有效报送，且考核期内达到 {{ rule.needCycles }} 个达标周期</span></stat-card>
    <stat-card label="2026 Q3 已发放奖励名额" :value="386" unit="个" icon="Present"><span>在用 1,204 个 · 累计发放 1,512 个</span><span class="warn">待审核 {{ pendN }} 笔</span></stat-card>
  </div>

  <!-- 当前生效规则 -->
  <div class="card">
    <div class="card-title">
      <span>当前生效规则<el-tag size="small" type="success" style="margin-left:8px">{{ cur.v }}</el-tag><small>生效日期 {{ cur.eff }}</small><span class="demo-tag" style="margin-left:8px">全部为示例参数，待业务方确定</span></span>
      <span class="right"><a href="billing.html">订单与计费 ›</a></span>
    </div>
    <el-alert v-if="nextVer" type="warning" show-icon :closable="false">
      <template #title>下一版本 <b>{{ nextVer.v }}</b> 已复核通过，将于 <b>{{ nextVer.eff }}</b> 生效：{{ nextVer.changes.join('；') }}。生效日之前的考核期仍按 {{ cur.v }} 计算。</template>
    </el-alert>
    <div class="rule-grid">
      <div class="rule-item"><div class="k">有效带动户的认定<span class="tbd">N-31 待定</span></div><div class="v" style="font-size:14px">确认 + 首次有效报送 + <span class="num">{{ rule.needCycles }}</span> 个达标周期</div><div class="d">经钢厂邀请并确认带动关系、完成首次有效报送，且在考核期内达到 {{ rule.needCycles }} 个达标周期的协议户，计为 1 户有效带动</div></div>
      <div class="rule-item"><div class="k">奖励名额的数量<span class="tbd">N-30 待定</span></div><div class="v">每满 <span class="num">{{ rule.quotaPer }}</span> 户奖 <span class="num">1</span> 个</div><div class="d">按考核期内计入奖励的带动户数计算，向下取整，不足部分不结转</div></div>
      <div class="rule-item"><div class="k">奖励名额的有效期与属性<span class="tbd">N-33 待定</span></div><div class="v"><span class="num">{{ rule.quotaMonths }}</span> 个月<small>不计费</small></div><div class="d">来源标识为“奖励”，在名额总览中单独列示；不可转让、不可折现；分配后同样按数据池调整周期生效，受替换规则和防反推规则约束</div></div>
      <div class="rule-item"><div class="k">奖励上限<span class="tbd">N-30 待定</span></div><div class="v">单厂 <span class="num">{{ rule.capPerMill }}</span> 个<small>每考核期</small></div><div class="d">平台每个考核期的奖励名额预算 {{ $fmt(R.budget) }} 个；超出预算时按规则版本约定的顺序发放</div></div>
      <div class="rule-item"><div class="k">考核期与发放流程<span class="tbd">N-30、N-43 待定</span></div><div class="v">{{ rule.period }}</div><div class="d">系统按规则生成发放建议 → 平台运营审核 → 发放 → 通知钢厂。钢厂对结果有异议的可申请复核，留痕</div></div>
      <div class="rule-item"><div class="k">奖励折扣<span class="ph">二期</span><span class="tbd">N-30 待定</span></div><div class="v num" style="color:#8b95a3">98 / 95 / 92 折</div><div class="d">以订阅费的折扣率或抵扣额发放，在续费、加购下单时使用；与数量阶梯、合同价能否叠加待定。一期不提供，分档仅为示意</div></div>
      <div class="rule-item"><div class="k">多家钢厂邀请同一协议户<span class="tbd">N-32 待定</span></div><div class="v" style="font-size:14px">只计给最先建立带动关系的钢厂</div><div class="d">协议户可以同时确认与多家钢厂的带动关系，各钢厂都能看到接入状态和达标结果，但奖励只计一次</div></div>
      <div class="rule-item"><div class="k">反套取<span class="tbd">N-31、N-42 待定</span></div><div class="v" style="font-size:14px">须有实质数据；关联贸易公司不计入</div><div class="d">达标只看有没有按时报送实际数据，只报库存快照也能达标。为防空壳协议户，平台内部核对有效带动户在考核期内是否有实质经营数据；该判断不向钢厂逐户披露，钢厂只看到计入奖励的汇总户数</div></div>
      <div class="rule-item"><div class="k">协议户占用名额<span class="tbd" style="background:#e8f7ef;color:#18794e;border-color:#cfe9da">N-29 已确认</span></div><div class="v" style="font-size:14px">照常占用付费名额，带动奖励可抵用</div><div class="d">协议户选入钢厂数据池时与其他企业一样占 1 个名额；钢厂有奖励名额时先用奖励名额抵用，不够的部分用已购名额或加购。奖励名额能否用于协议户以外的企业待定（N-33）</div></div>
    </div>
    <div class="grid c2 mt12" style="margin-bottom:0">
      <div class="tip-box blue small">
        <b>带动关系怎么成立</b>
        <ul class="no-list">
          <li>钢厂导入协议户名单并发送邀请（专属链接、邀请码或二维码）。对已入驻的企业，在其账号内生成“带动关系确认请求”</li>
          <li>带动关系须由被邀请企业的企业管理员在邀请落地页上主动确认；平台人员和钢厂都不能代为确认。确认之前钢厂只看到“已发送”，平台不回显对方是否已入驻</li>
          <li>平台运营负责钢厂发起资格审核、名单抽检、带动关系争议处理和达标异议复核</li>
        </ul>
      </div>
      <div class="tip-box orange small">
        <b>规则不做的事</b>
        <ul class="no-list">
          <li>不向下游贸易商发放任何现金、分成或返利；下游的权益是免费的行业对标数据</li>
          <li>不按上传的数据量、销量或被选购次数奖励；达标评定也不使用任何与业务量相关的数</li>
          <li>不因带动关系向钢厂开放任何单家数据：钢厂只能看到接入状态和各达标周期的结果</li>
          <li>已发放的奖励在协议户此后不达标、解除带动关系或退出时如何处理，待业务方确定</li>
        </ul>
      </div>
    </div>
  </div>

  <!-- 待复核与版本 -->
  <div class="card">
    <div class="card-title"><span>规则变更复核与版本历史<small>奖励规则与报送达标参数的修改都须双人复核：提交 → 另一人复核 → 按生效日期生效。当前操作人：{{ me }}（{{ roleOf(me) }}）</small></span></div>
    <el-table v-if="pending.length" :data="pending" border size="small" class="mb16">
      <el-table-column prop="id" label="申请编号" width="140" />
      <el-table-column label="变更内容" min-width="280"><template #default="{row}"><div v-for="c in row.changes" :key="c">{{ c }}</div></template></el-table-column>
      <el-table-column prop="reason" label="变更原因" min-width="240" />
      <el-table-column prop="eff" label="生效日期" width="110" />
      <el-table-column label="提交人" width="140"><template #default="{row}">{{ row.by }}<div class="small muted num">{{ row.t }}</div></template></el-table-column>
      <el-table-column label="状态" width="90" align="center"><template #default><el-tag size="small" type="warning" disable-transitions>待复核</el-tag></template></el-table-column>
      <el-table-column label="操作" width="140" align="center">
        <template #default="{row}">
          <template v-if="row.by===me">
            <el-tooltip content="提交人不能复核自己的申请，请切换为另一位复核人" placement="top"><span><el-button link type="primary" disabled>通过</el-button></span></el-tooltip>
            <el-button link type="info" @click="finish(row, '已撤回')">撤回</el-button>
          </template>
          <template v-else>
            <el-button link type="success" @click="finish(row, '通过')">通过</el-button>
            <el-button link type="danger" @click="finish(row, '已驳回')">驳回</el-button>
          </template>
        </template>
      </el-table-column>
    </el-table>
    <el-table :data="versions" border size="small">
      <el-table-column label="版本" width="100"><template #default="{row}"><b>{{ row.v }}</b></template></el-table-column>
      <el-table-column label="适用期间" width="210"><template #default="{row}"><span class="num">{{ row.eff }} 起{{ row.end ? '，至 ' + row.end : '' }}</span></template></el-table-column>
      <el-table-column label="主要内容 / 变更" min-width="330"><template #default="{row}"><div v-for="c in row.changes" :key="c">{{ c }}</div><div v-if="row.reason" class="small muted">原因：{{ row.reason }}</div></template></el-table-column>
      <el-table-column label="提交" width="130"><template #default="{row}">{{ row.by }}<div class="small muted num">{{ row.t }}</div></template></el-table-column>
      <el-table-column label="复核" width="130"><template #default="{row}"><template v-if="row.rv">{{ row.rv }}<div class="small muted num">{{ row.rvT }}</div></template><span v-else class="muted">—</span></template></el-table-column>
      <el-table-column label="状态" width="110" align="center"><template #default="{row}"><el-tag size="small" :type="row.st==='当前生效' ? 'success' : row.st==='待生效' ? 'warning' : row.st==='已驳回' ? 'danger' : 'info'" disable-transitions>{{ row.st }}</el-tag></template></el-table-column>
    </el-table>
    <div class="small muted mt8">历史考核期按当时生效的规则版本计算；规则变更不影响已发放的奖励。每笔发放记录都写明所用的规则版本。</div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <el-tab-pane name="grant"><template #label>发放记录 <el-badge v-if="pendN" :value="pendN" type="warning" style="margin-left:2px" /></template></el-tab-pane>
      <el-tab-pane name="rel"><template #label>带动关系与有效带动户 <el-badge v-if="relPendN" :value="relPendN" type="warning" style="margin-left:2px" /></template></el-tab-pane>
      <el-tab-pane name="std" label="报送达标参数"></el-tab-pane>
      <el-tab-pane name="src" label="入驻来源"></el-tab-pane>
    </el-tabs>

    <!-- 发放记录 -->
    <template v-if="tab === 'grant'">
      <div class="filter-bar">
        <el-select v-model="gf.period" style="width:130px"><el-option v-for="p in ['2026 Q3','2026 Q2']" :key="p" :label="p" :value="p" /></el-select>
        <el-select v-model="gf.st" clearable placeholder="全部状态" style="width:140px"><el-option v-for="s in ['待审核','已发放','未达起奖','已驳回']" :key="s" :label="s" :value="s" /></el-select>
        <el-input v-model="gf.kw" placeholder="钢厂名称" clearable style="width:200px" />
        <span class="flex1"></span>
        <el-button @click="$demo('已导出本期发放明细')"><el-icon><Download /></el-icon>导出</el-button>
      </div>
      <div class="mini-stats">
        <span>考核期 <b>{{ gf.period }}</b></span><span>参与核算钢厂 <b class="num">{{ gf.period === '2026 Q3' ? 312 : 287 }}</b> 家</span>
        <span>发放奖励名额 <b class="num">{{ gf.period === '2026 Q3' ? 386 : 228 }}</b> 个</span><span>预算 <b class="num">{{ $fmt(R.budget) }}</b> 个</span>
        <span>原型展示 <b class="num">{{ grantRows.length }}</b> 条示例</span><span class="demo-tag">示例数据</span>
      </div>
      <el-table :data="grantRows" size="default">
        <el-table-column label="钢厂" min-width="210"><template #default="{row}"><b style="font-weight:500">{{ row.mill }}</b><div class="small muted num">{{ row.id }} · 规则 {{ row.ver }}</div></template></el-table-column>
        <el-table-column label="考核期" width="86" prop="period" />
        <el-table-column label="有效带动户" width="110" align="right"><template #default="{row}"><span class="num">{{ row.valid }}</span> 户</template></el-table-column>
        <el-table-column label="计入奖励" width="100" align="right"><template #default="{row}"><span class="num">{{ row.n }}</span> 户</template></el-table-column>
        <el-table-column label="系统建议" min-width="240"><template #default="{row}">{{ row.text }}<div v-if="row.note" class="small" style="color:#b25e00">{{ row.note }}</div></template></el-table-column>
        <el-table-column label="状态" width="104"><template #default="{row}"><el-tag size="small" :type="row.st==='已发放' ? 'success' : row.st==='待审核' ? 'warning' : row.st==='已驳回' ? 'danger' : 'info'" effect="plain" disable-transitions>{{ row.st }}</el-tag></template></el-table-column>
        <el-table-column label="审核与发放" width="136"><template #default="{row}"><template v-if="row.by">{{ row.by }}<div class="small muted num">{{ row.at }}</div></template><span v-else class="muted">—</span></template></el-table-column>
        <el-table-column label="操作" width="90">
          <template #default="{row}">
            <template v-if="row.st === '待审核'"><el-button link type="primary" @click="openGrant(row)">审核发放</el-button></template>
            <el-button v-else link type="primary" @click="openGrant(row)">查看</el-button>
          </template>
        </el-table-column>
      </el-table>
      <div class="small muted mt8">审核通过后，奖励名额直接入账到该钢厂的名额账户（来源标识为“奖励”，单独列示，不产生订单和应收），并通知钢厂。钢厂端只显示“计入奖励的带动户数”这一个汇总数，不逐户标注。</div>
    </template>

    <!-- 带动关系 -->
    <template v-else-if="tab === 'rel'">
      <div class="filter-bar">
        <el-select v-model="rf.type" clearable placeholder="全部带动类型" style="width:150px"><el-option label="钢厂带动" value="钢厂带动" /><el-option label="一级代理带动" value="一级代理带动" /></el-select>
        <el-select v-model="rf.st" clearable placeholder="全部状态" style="width:170px"><el-option v-for="s in relSts" :key="s" :label="s" :value="s" /></el-select>
        <el-input v-model="rf.kw" placeholder="被带动企业或带动方" clearable style="width:220px" />
        <span class="flex1"></span>
        <span class="small muted">全平台带动关系 {{ $fmt(srcN('钢厂带动') + srcN('一级代理带动')) }} 条；原型展示 {{ rels.length }} 条示例</span>
      </div>
      <el-table :data="relRows" size="default">
        <el-table-column label="被带动企业" min-width="220"><template #default="{row}"><b style="font-weight:500">{{ row.ent }}</b><div class="small muted">{{ row.loc }}</div></template></el-table-column>
        <el-table-column label="带动类型" width="150"><template #default="{row}"><el-tag size="small" :type="row.type === '钢厂带动' ? 'primary' : 'success'" effect="plain" disable-transitions>{{ row.type }}</el-tag><span v-if="row.type !== '钢厂带动'" class="ph-tag" style="margin-left:4px">二期</span></template></el-table-column>
        <el-table-column label="带动方" min-width="200"><template #default="{row}">{{ row.by }}<div v-if="row.mill" class="small muted">上级协议户所属钢厂：{{ row.mill }}</div></template></el-table-column>
        <el-table-column label="确认方式与时间" width="160"><template #default="{row}">{{ row.way }}<div class="small muted num">{{ row.at }}</div></template></el-table-column>
        <el-table-column label="接入状态与最近周期" width="170"><template #default="{row}">{{ row.stage }}</template></el-table-column>
        <el-table-column label="是否计入奖励" min-width="230"><template #default="{row}"><span :class="'dot ' + (row.st === '计入' ? 'ok' : row.st === '待核实' ? 'warn' : 'info')"></span>{{ row.st }}<div v-if="row.why" class="small muted">{{ row.why }}</div></template></el-table-column>
        <el-table-column label="操作" width="110">
          <template #default="{row}"><el-button v-if="row.st === '待核实'" link type="primary" @click="verify(row)">核实</el-button><span v-else class="muted">—</span></template>
        </el-table-column>
      </el-table>
