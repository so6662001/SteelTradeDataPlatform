<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>价格数据管控 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.gate-head { display: flex; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 8px; margin-bottom: 14px; }
.gate-head.closed { background: #f4f5f7; border: 1px solid #dfe3ea; }
.gate-head.open { background: #f0faf4; border: 1px solid #cfe9da; }
.gate-head .big-ico { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #fff; flex-shrink: 0; }
.gate-head.closed .big-ico { background: #8a94a3; }
.gate-head.open .big-ico { background: #18a058; }
.gate-head h2 { margin: 0 0 4px; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.gate-head p { margin: 0; font-size: 13px; color: #4a5568; line-height: 1.7; }
.outlets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.outlets > div { border: 1px solid var(--stp-border); border-radius: 6px; padding: 10px 12px; font-size: 12px; color: var(--stp-sub); line-height: 1.6; }
.outlets b { display: block; font-size: 13px; color: var(--stp-text); margin-bottom: 2px; }
.step-panel { border: 1px dashed #c8d0db; border-radius: 6px; padding: 14px 16px; margin-top: 16px; background: #fafbfc; }
.step-panel h4 { margin: 0 0 10px; font-size: 14px; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid #d5e4f5; background: #f1f7ff; border-radius: 4px; font-size: 13px; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.sec-title i { width: 4px; height: 14px; border-radius: 2px; background: var(--el-color-primary); display: inline-block; }
.sec-title small { font-weight: 400; color: var(--stp-sub); font-size: 12px; }
.el-descriptions__label { white-space: nowrap; }
.hidden-val { display: inline-flex; align-items: center; gap: 4px; color: #8a94a3; font-size: 12px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" :user="me" :role="roleOf(me)" active="price-control" title="价格数据管控"
  desc="价格与金额由下游自愿上传。上游能否看到价格聚合指标由本页的统一闸口控制，默认关闭；取得法务书面意见并经双人复核后才能开启，监管要求变化时可立即关闭。">
  <template #actions>
    <el-dropdown trigger="click" @command="v => me = v">
      <el-button><el-icon><UserFilled /></el-icon>原型状态 · 当前操作人：{{ me }}（{{ roleOf(me) }}）<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
      <template #dropdown><el-dropdown-menu>
        <el-dropdown-item v-for="s in staff" :key="s.n" :command="s.n" :disabled="s.n===me">{{ s.n }}（{{ s.r }}）</el-dropdown-item>
      </el-dropdown-menu></template>
    </el-dropdown>
    <el-button type="primary" @click="$go('../upstream/dashboard.html')"><el-icon><View /></el-icon>到上游厂家端查看效果</el-button>
  </template>

  <div class="grid c4">
    <div class="stat">
      <div class="label">上游价格功能闸口</div>
      <div class="value" :style="{color: open ? '#18a058' : '#5b6778'}">{{ open ? '已开放' : '未开放' }}</div>
      <div class="foot"><span v-if="open">{{ openInfo.t }} 开启</span><span v-else-if="flow.step===2" style="color:#409eff">开启申请待复核</span><span v-else>默认关闭，上游侧无任何价格内容</span></div>
      <div class="ico"><el-icon><component :is="open ? 'Unlock' : 'Lock'" /></el-icon></div>
    </div>
    <stat-card label="已开启价格上传的下游企业" :value="6480" unit="家" icon="OfficeBuilding" tip="价格上传为企业级开关，默认关闭，仅企业管理员可开启"><span>占入驻企业 21,386 家的 <b>30.3%</b></span></stat-card>
    <div class="stat">
      <div class="label">平台级价格覆盖率<el-tooltip content="有价销量 ÷ 全部销量，全平台合计口径。后台只展示平台与大类级的比例，不展示单家企业的价格与销量" placement="top"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
      <div class="value num">27.6<span class="unit">%</span></div>
      <div class="foot"><span>较上月 <b class="up">+1.5 个百分点</b></span></div>
      <div class="ico"><el-icon><PieChart /></el-icon></div>
    </div>
    <stat-card label="价格隔离待处置" :value="todoCount" unit="批" icon="Warning"><span>涉及 {{ todoEnt }} 家企业；销量照常入库</span></stat-card>
  </div>

  <!-- ① 闸口 -->
  <div class="grid c-2-1">
    <div class="card">
      <div class="card-title"><span>上游价格功能闸口<small>全部上游价格功能的统一开关，开启与关闭均留痕</small></span>
        <span class="right"><a href="../upstream/dashboard.html">到上游厂家端查看效果 ›</a></span></div>

      <div class="gate-head" :class="open ? 'open' : 'closed'">
        <div class="big-ico"><el-icon><component :is="open ? 'Unlock' : 'Lock'" /></el-icon></div>
        <div style="flex:1">
          <h2>{{ open ? '已开放' : '未开放' }}<el-tag v-if="!open" type="info" size="small">默认关闭</el-tag><el-tag v-else type="success" size="small">受价格披露规则约束</el-tag></h2>
          <p v-if="!open">关闭时，上游侧的<b>页面、导出、定时发送、数据拉取接口均不出现任何价格内容</b>：没有价格入口、没有价格指标、没有价格导出列。下游企业的价格上传与自查不受闸口影响。</p>
          <p v-else>上游可在量价视图、看板、多维查询、导出、定时发送、数据拉取接口中看到价格聚合指标：加权均价、涨跌额与涨跌幅、价格覆盖率区间、有价企业数区间。不提供金额合计、最高最低价、价格分布。</p>
        </div>
        <el-button v-if="open" type="danger" @click="closeGate"><el-icon><SwitchButton /></el-icon>立即关闭</el-button>
      </div>

      <div class="outlets">
        <div v-for="o in outlets" :key="o.t"><b><span class="dot" :class="open ? 'ok' : ''"></span>{{ o.t }}</b>{{ open ? o.on : o.off }}</div>
      </div>

      <el-descriptions v-if="open" :column="2" border size="small" class="mb16">
        <el-descriptions-item label="开启时间"><span class="num">{{ openInfo.t }}</span></el-descriptions-item>
        <el-descriptions-item label="法务意见文号">{{ openInfo.docNo }}</el-descriptions-item>
        <el-descriptions-item label="申请人">{{ openInfo.applicant }}（{{ roleOf(openInfo.applicant) }}）</el-descriptions-item>
        <el-descriptions-item label="批准人（复核人）">{{ openInfo.approver }}（{{ roleOf(openInfo.approver) }}）</el-descriptions-item>
        <el-descriptions-item label="适用范围" :span="2">全部已付费上游企业（438 家）。上游成员首次进入价格视图须确认使用条款：不得用于与其他经营者协同定价，不得用于对经销商实施转售价格限制，不得对外传播。</el-descriptions-item>
      </el-descriptions>

      <el-steps :active="open ? 4 : flow.step" finish-status="success" align-center>
        <el-step title="上传法务书面意见" :description="open ? openInfo.docNo : (flow.step > 0 ? flow.docNo : '由法务出具')" />
        <el-step title="提交开启申请" :description="open ? openInfo.applicant + ' 提交' : (flow.step > 1 ? flow.applicant + ' 提交' : '填写说明并确认前置条件')" />
        <el-step title="另一人复核" :description="open ? openInfo.approver + ' 复核通过' : (flow.step===2 ? '待复核' : '提交人不能复核自己的申请')" />
        <el-step title="生效" :description="open ? '上游侧已开放' : '复核通过即时生效'" />
      </el-steps>

      <template v-if="!open">
        <!-- 第 1 步 -->
        <div v-if="flow.step===0" class="step-panel">
          <h4>第 1 步：上传法务书面意见</h4>
          <el-form label-width="96px" size="default">
            <el-form-item label="书面意见" required>
              <span v-if="flow.doc" class="file-chip"><el-icon><Document /></el-icon>{{ flow.doc }}<span class="muted small">2.4 MB</span><el-icon style="cursor:pointer" @click="flow.doc=''"><Close /></el-icon></span>
              <el-button v-else @click="flow.doc='关于开放上游价格聚合指标的法律意见书.pdf'; $demo('原型演示：已模拟上传文件')"><el-icon><Upload /></el-icon>选择文件（PDF，须有签章）</el-button>
            </el-form-item>
            <el-form-item label="意见文号" required><el-input v-model="flow.docNo" style="width:260px" /></el-form-item>
            <el-form-item label="出具人 / 日期">
              <el-select v-model="flow.docBy" style="width:150px"><el-option label="唐蕾（法务）" value="唐蕾" /></el-select>
              <el-date-picker v-model="flow.docDate" type="date" value-format="YYYY-MM-DD" :clearable="false" style="width:150px;margin-left:10px" />
            </el-form-item>
            <el-form-item label="意见结论">
              <el-radio-group v-model="flow.concl"><el-radio value="同意开放">同意开放</el-radio><el-radio value="附条件同意">附条件同意</el-radio><el-radio value="不同意开放">不同意开放</el-radio></el-radio-group>
            </el-form-item>
            <el-form-item v-if="flow.concl==='附条件同意'" label="附带条件"><el-input v-model="flow.cond" type="textarea" :rows="2" /></el-form-item>
          </el-form>
          <div class="row" style="justify-content:flex-end">
            <span v-if="flow.concl==='不同意开放'" class="small" style="color:#e5484d">法务意见为“不同意开放”时不能提交开启申请</span>
            <el-button type="primary" :disabled="!flow.doc || !flow.docNo || flow.concl==='不同意开放'" @click="stepDoc">下一步：填写开启申请</el-button>
          </div>
        </div>
        <!-- 第 2 步 -->
        <div v-else-if="flow.step===1" class="step-panel">
          <h4>第 2 步：提交开启申请</h4>
          <el-alert v-if="flow.rejected" type="error" :closable="false" show-icon :title="'上一次申请被 ' + flow.rejected.by + ' 驳回：' + flow.rejected.why" />
          <div class="small muted mb8">已上传：<span class="file-chip"><el-icon><Document /></el-icon>{{ flow.doc }}</span>　{{ flow.docNo }} · {{ flow.docBy }} · {{ flow.docDate }} · {{ flow.concl }}</div>
          <el-form label-width="96px">
            <el-form-item label="申请说明" required><el-input v-model="flow.note" type="textarea" :rows="2" placeholder="说明开启范围、时间与依据" /></el-form-item>
            <el-form-item label="前置条件" required>
              <el-checkbox-group v-model="flow.checks" style="display:flex;flex-direction:column;align-items:flex-start">
                <el-checkbox v-for="(c,i) in checkList" :key="i" :value="i">{{ c }}</el-checkbox>
              </el-checkbox-group>
            </el-form-item>
          </el-form>
          <div class="row" style="justify-content:flex-end">
            <el-button @click="flow.step=0">上一步</el-button>
            <el-button type="primary" :disabled="!flow.note.trim() || flow.checks.length < checkList.length" @click="submitApply">提交开启申请</el-button>
          </div>
        </div>
        <!-- 第 3 步 -->
        <div v-else class="step-panel">
          <h4>第 3 步：另一人复核<el-tag size="small" type="warning" style="margin-left:8px">待复核</el-tag></h4>
          <el-descriptions :column="2" border size="small">
            <el-descriptions-item label="申请人">{{ flow.applicant }}（{{ roleOf(flow.applicant) }}）</el-descriptions-item>
            <el-descriptions-item label="申请时间"><span class="num">{{ flow.applyT }}</span></el-descriptions-item>
            <el-descriptions-item label="法务意见">{{ flow.docNo }}（{{ flow.docBy }}，{{ flow.docDate }}）</el-descriptions-item>
            <el-descriptions-item label="意见结论">{{ flow.concl }}</el-descriptions-item>
            <el-descriptions-item v-if="flow.concl==='附条件同意'" label="附带条件" :span="2">{{ flow.cond }}</el-descriptions-item>
            <el-descriptions-item label="申请说明" :span="2">{{ flow.note }}</el-descriptions-item>
            <el-descriptions-item label="前置条件" :span="2">{{ checkList.length }} 项均已确认</el-descriptions-item>
          </el-descriptions>
          <div class="row between mt12">
            <span class="small" v-if="flow.applicant===me" style="color:#b26a00"><el-icon style="vertical-align:-2px"><WarningFilled /></el-icon> 你是本申请的提交人，不能复核自己的申请。请在页面右上角切换为另一位复核人。</span>
            <span class="small muted" v-else>当前复核人：{{ me }}（{{ roleOf(me) }}）。复核通过后闸口即时开启。</span>
            <span>
              <el-button v-if="flow.applicant===me" @click="withdraw">撤回申请</el-button>
              <el-button type="danger" plain :disabled="flow.applicant===me" @click="rejectApply">驳回</el-button>
              <el-button type="success" :disabled="flow.applicant===me" @click="approveApply"><el-icon><Check /></el-icon>复核通过并开启</el-button>
            </span>
          </div>
        </div>
      </template>
      <div v-else class="tip-box green small mt16">
        监管要求变化、法务复核结论变化或发现合规风险时，可点击右上方“立即关闭”。关闭属于收紧操作，<b>单人确认后即时生效</b>并通知法务与安全审计员；上游侧四个出口同步下线价格内容。再次开启须重新走完整流程。
      </div>

      <div class="tip-box orange small mt12">
        <b>开放条件待确认（N-02）：</b>由谁出具法务书面意见、由谁批准开启尚未确定。原型暂按“法务出具书面意见 → 任一平台人员提交申请 → 另一人复核批准”演示。价格数据是否单独计价（N-04）同样待业务方确定。
      </div>
    </div>

    <div class="card">
      <div class="card-title"><span>闸口操作记录<small>不可修改</small></span><span class="right"><a href="audit.html">审计日志 ›</a></span></div>
      <el-timeline style="padding-left:2px;margin:0">
        <el-timeline-item v-for="(l,i) in logs" :key="i" :timestamp="l.t" placement="top" :type="l.type" :hollow="!l.type">
          <b>{{ l.who }}</b><span class="muted small" v-if="l.role">（{{ l.role }}）</span>
          <div class="small" style="color:#4a5568;line-height:1.6;margin-top:2px">{{ l.act }}</div>
        </el-timeline-item>
      </el-timeline>
    </div>
  </div>

  <div class="grid c2">
    <div class="card">
      <div class="card-title"><span>价格披露参数摘要</span><span class="right"><a href="privacy-params.html">防反推参数 ›</a></span></div>
      <dl class="kv" style="grid-template-columns:120px 1fr">
        <dt>最小有价企业数</dt><dd><b>k_价 = {{ $PV.kPrice }} 家</b>，不得低于 k（{{ $PV.k }} 家）</dd>
        <dt>价格优势度</dt><dd>{{ $PV.dom1 }}% / {{ $PV.dom2 }}%，按有价销量计算</dd>
        <dt>其他品牌构成</dt><dd>至少 {{ $PV.otherBrands }} 个品牌，单一品牌不超过 50%</dd>
        <dt>时间粒度与延迟</dt><dd>日，T+1 <el-tag size="small" type="info">待法务意见</el-tag></dd>
        <dt>均价取整</dt><dd>取整到 {{ $PV.roundPrice }} 元/吨，涨跌幅保留一位小数</dd>
        <dt>覆盖率展示</dt><dd>只给区间：{{ $PV.coverBands.join('、') }}</dd>
      </dl>
      <div class="small muted mt8">建议默认值，示例参数，待业务方确定（N-03）。修改须在“防反推参数”页走双人复核。</div>
    </div>
    <div class="card">
      <div class="card-title"><span>定期复核提醒</span><el-tag size="small" type="warning">距下次复核 {{ review.left }} 天</el-tag></div>
      <dl class="kv" style="grid-template-columns:88px 1fr">
        <dt>复核内容</dt><dd>价格披露参数；闸口状态；上游使用情况（价格视图访问、价格列导出、异常查询告警、使用条款确认记录）</dd>
        <dt>复核人</dt><dd>法务（唐蕾）</dd>
        <dt>复核周期</dt><dd>每季度 <span class="muted small">示例参数，待业务方确定</span></dd>
        <dt>上次复核</dt><dd><span class="num">{{ review.last }}</span>　{{ review.concl }}</dd>
        <dt>下次复核</dt><dd><b class="num">{{ review.next }}</b></dd>
      </dl>
      <div class="row mt12"><el-button size="small" @click="reviewDlg=true">登记复核结果</el-button><el-button size="small" @click="$demo('已向法务（唐蕾）发送复核提醒')">提醒法务</el-button></div>
    </div>
  </div>

  <!-- ⑤ 监控 -->
  <div class="card">
    <div class="card-title"><span>价格上传企业数与覆盖率监控<small>只统计企业数与平台、大类级的覆盖比例，不含任何企业的价格与销量数值</small></span></div>
    <div class="grid c-3-2" style="margin-bottom:0">
      <div>
        <div class="sec-title"><i></i>按大类：有价企业数与平台级价格覆盖率<small>按企业主营大类统计</small></div>
        <ve-chart :option="catOption" height="280px"></ve-chart>
      </div>
      <div>
        <div class="sec-title"><i></i>趋势<small>下游价格上传功能自 2026-06-01 上线</small></div>
        <ve-chart :option="trendOption" height="280px"></ve-chart>
      </div>
    </div>
    <el-table :data="catStats" border size="small" class="mt12" show-summary :summary-method="catSummary">
      <el-table-column prop="name" label="主营大类" min-width="130" />
      <el-table-column label="入驻企业数" width="120" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.all) }}</span></template></el-table-column>
      <el-table-column label="已开启价格上传" width="130" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.on) }}</span></template></el-table-column>
      <el-table-column label="开启比例" width="110" align="right"><template #default="{row}"><span class="num">{{ (row.on / row.all * 100).toFixed(1) }}%</span></template></el-table-column>
      <el-table-column label="同意参与对上游披露" width="160" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.share) }}</span></template></el-table-column>
      <el-table-column label="平台级价格覆盖率（有价销量 ÷ 全部销量）" min-width="280"><template #default="{row}"><el-progress v-if="row.cover" :percentage="row.cover" :stroke-width="8" :format="p => p.toFixed(1) + '%'" /><span v-else class="muted">不适用（跨大类）</span></template></el-table-column>
      <el-table-column label="较上月" width="110" align="right"><template #default="{row}"><span v-if="row.d" class="num up">+{{ row.d.toFixed(1) }} 个百分点</span><span v-else class="muted">—</span></template></el-table-column>
    </el-table>
    <div class="small muted mt8">企业可选择价格“参与对上游的聚合披露”或“仅用于本企业自查与行业对标”（N-06，待确认）；只有前者计入上游价格聚合。价格为自愿上传，不计入质量评分。</div>
  </div>

  <!-- ④ 隔离处置 -->
  <div class="card">
    <div class="card-title"><span>价格隔离数据处置<small>价格校验未通过的记录，按“企业 + 品名 + 原因”成批处置</small></span>
      <span class="right">
        <el-select v-model="qf.reason" clearable placeholder="全部隔离原因" style="width:260px"><el-option v-for="r in reasons" :key="r" :label="r" :value="r" /></el-select>
        <el-select v-model="qf.st" clearable placeholder="全部状态" style="width:170px"><el-option v-for="s in qStatus" :key="s" :label="s" :value="s" /></el-select>
      </span></div>
    <el-alert type="info" show-icon :closable="false">

  <el-dialog v-model="wo.show" title="发起明细访问工单" width="560px">
    <template v-if="wo.row">

      <el-form label-width="96px">
        <el-form-item label="目标企业">{{ wo.row.ent }}</el-form-item>
        <el-form-item label="查看范围">{{ wo.row.date }} · {{ wo.row.prod }} · 被隔离的 {{ wo.row.n }} 条记录的价格相关字段</el-form-item>
        <el-form-item label="申请人">{{ me }}（{{ roleOf(me) }}）</el-form-item>
        <el-form-item label="事由" required><el-input v-model="wo.why" type="textarea" :rows="2" /></el-form-item>
        <el-form-item label="申请时限"><el-radio-group v-model="wo.hours"><el-radio :value="2">2 小时</el-radio><el-radio :value="4">4 小时</el-radio><el-radio :value="8">8 小时</el-radio><el-radio :value="24">24 小时</el-radio></el-radio-group></el-form-item>
      </el-form>
    </template>
    <template #footer><el-button @click="wo.show=false">取消</el-button><el-button type="primary" :disabled="!wo.why.trim()" @click="submitWo">提交工单</el-button></template>
  </el-dialog>

  <!-- 弹窗：登记复核 -->
  <el-dialog v-model="reviewDlg" title="登记定期复核结果" width="520px">
    <el-form label-width="96px">

      <el-form-item label="复核结论"><el-radio-group v-model="reviewForm.concl"><el-radio value="维持现状">维持现状</el-radio><el-radio value="建议调整披露参数">建议调整披露参数</el-radio><el-radio value="建议关闭闸口">建议关闭闸口</el-radio></el-radio-group></el-form-item>
      <el-form-item label="说明"><el-input v-model="reviewForm.note" type="textarea" :rows="2" /></el-form-item>
    </el-form>
    <template #footer><el-button @click="reviewDlg=false">取消</el-button><el-button type="primary" :disabled="me!=='唐蕾'" @click="saveReview">登记</el-button></template>
  </el-dialog>
</app-layout>
</script>

<script>
(function () {

    [5, 'H 型钢', 0, '2026-11-21', 23, 1], [6, '盘螺', 2, '2026-11-20', 31, 2], [7, '不锈钢冷轧卷板', 1, '2026-11-20', 4, 3], [8, '普碳中厚板', 3, '2026-11-19', 58, 4]];
  const CAT_STATS = [
    { name: '建筑钢材', all: 7340, on: 2410, share: 2230, cover: 34.2, d: 1.8 }, { name: '热轧板卷', all: 3920, on: 1280, share: 1180, cover: 31.5, d: 1.6 }, { name: '中厚板', all: 2060, on: 620, share: 566, cover: 26.8, d: 1.4 },
    { name: '冷轧及涂镀', all: 1880, on: 540, share: 490, cover: 24.1, d: 1.2 }, { name: '管材', all: 1790, on: 470, share: 424, cover: 19.6, d: 1.1 }, { name: '型钢', all: 1640, on: 430, share: 392, cover: 21.3, d: 0.9 },

    data() {
      const logs = [
        { t: '2026-11-10 15:30', who: '唐蕾', role: '法务', act: '完成季度定期复核：披露参数与闸口状态无需调整；开放上游价格功能的书面意见出具中。', type: 'primary' },

        logs.unshift({ t: '2026-11-24 10:05', who: '林若彤', role: '运营主管', act: '上传法务书面意见（' + OPEN_DEFAULT.docNo + '），提交开启申请。', type: 'primary' });
        logs.unshift({ t: OPEN_DEFAULT.t, who: '吴靖', role: '安全审计员', act: '复核通过，闸口开启。上游侧价格功能对全部已付费上游开放。', type: 'success' });

          '反推测试用例集中的价格类与闸口类用例全部通过',

          { t: '数据拉取接口', off: '接口不返回任何价格字段', on: '接口返回价格字段，同样经聚合引擎判定' }],

        const o = STP.chart.line({ x: rows.map((c) => c.name), yName: '企业数（家）', y2: '覆盖率', grid: { top: 58 }, series: [
          { name: '已开启价格上传企业数', type: 'bar', data: rows.map((c) => c.on), unit: '家', barMaxWidth: 26, itemStyle: { borderRadius: [3, 3, 0, 0] } },
          { name: '平台级价格覆盖率', data: rows.map((c) => c.cover), yAxisIndex: 1, unit: '%', color: '#f7b500', showSymbol: true, smooth: false }] });
        o.xAxis.axisLabel = { color: '#6b7787', interval: 0 };
        o.yAxis.forEach((y) => { y.scale = false; }); o.yAxis[1].max = 50; o.yAxis[1].axisLabel = { color: '#6b7787', formatter: '{value}%' };
        return o;
      },
      trendOption() {
        const o = STP.chart.line({ x: ['2026-06', '2026-07', '2026-08', '2026-09', '2026-10', '2026-11'], yName: '企业数（家）', y2: '覆盖率', grid: { top: 58 }, series: [
          { name: '已开启价格上传企业数', data: [1860, 2940, 3910, 4850, 5730, 6480], unit: '家', areaStyle: { opacity: 0.08 } },
          { name: '平台级价格覆盖率', data: [9.6, 14.8, 19.3, 23.2, 26.1, 27.6], yAxisIndex: 1, unit: '%', color: '#f7b500' }] });
        o.yAxis.forEach((y) => { y.scale = false; }); o.yAxis[1].max = 40; o.yAxis[1].axisLabel = { color: '#6b7787', formatter: '{value}%' };
        return o;
      },
    },
    methods: {
      roleOf(n) { const s = STAFF.find((x) => x.n === n); return s ? s.r : ''; },
      log(act, type) { this.logs.unshift({ t: nowStr(), who: this.me, role: this.roleOf(this.me), act, type }); },
      stepDoc() { this.flow.step = 1; this.log('上传法务书面意见：' + this.flow.docNo + '（' + this.flow.docBy + '出具，结论：' + this.flow.concl + '）。', 'primary'); },
      submitApply() {
        Object.assign(this.flow, { step: 2, applicant: this.me, applyT: nowStr(), rejected: null });
        this.logs.unshift({ t: this.flow.applyT, who: this.me, role: this.roleOf(this.me), act: '提交开启申请，等待另一人复核。', type: 'primary' });
        this.$demo('开启申请已提交。须由另一位平台人员复核，提交人不能复核自己的申请。');
      },
      withdraw() { this.flow.step = 1; this.log('撤回开启申请。'); this.$demo('已撤回申请'); },
      rejectApply() {
        if (this.flow.applicant === this.me) return;
        ElementPlus.ElMessageBox.prompt('请填写驳回意见（写入闸口操作记录）', '驳回开启申请', { confirmButtonText: '确认驳回', cancelButtonText: '取消', inputValidator: (v) => !!(v && v.trim()) || '请填写驳回意见' }).then(({ value }) => {
          this.flow.step = 1; this.flow.rejected = { by: this.me, why: value };
          this.log('驳回开启申请：' + value, 'danger');
          this.$demo('已驳回，闸口保持关闭');
        }).catch(() => {});
      },
      approveApply() {
        if (this.flow.applicant === this.me) return this.$info('提交人不能复核自己的申请');
        ElementPlus.ElMessageBox.confirm('复核通过后，上游价格功能将立即对全部已付费上游开放（页面、导出、定时发送、数据拉取接口）。确认开启？', '复核通过并开启闸口', { type: 'warning', confirmButtonText: '确认开启', cancelButtonText: '取消' }).then(() => {
          const t = nowStr();
          this.openInfo = { t, docNo: this.flow.docNo, applicant: this.flow.applicant, approver: this.me };
          this.logs.unshift({ t, who: this.me, role: this.roleOf(this.me), act: '复核通过，闸口开启。上游侧价格功能对全部已付费上游开放。', type: 'success' });
          this.selfChange = true; this.$setState('gate', 'open');
          this.$demo('闸口已开启。可到上游厂家端查看量价视图与价格指标。');
        }).catch(() => {});
      },
      closeGate() {
        ElementPlus.ElMessageBox.prompt('关闭后即时生效：上游侧页面、导出、定时发送、数据拉取接口均不再出现任何价格内容。请填写关闭原因。', '立即关闭上游价格功能', { type: 'warning', confirmButtonText: '立即关闭', cancelButtonText: '取消', inputPlaceholder: '如：监管要求变化 / 法务复核建议关闭', inputValidator: (v) => !!(v && v.trim()) || '请填写关闭原因' }).then(({ value }) => {
          this.log('立即关闭闸口，原因：' + value + '。已通知法务与安全审计员。', 'danger');
          this.selfChange = true; this.$setState('gate', 'closed');
          Object.assign(this.flow, { step: 0, doc: '', note: '', checks: [], applicant: '', applyT: '', rejected: null });
          this.$demo('闸口已关闭，上游侧不再出现任何价格内容');
        }).catch(() => {});
      },
      saveReview() {
        this.review = { last: M.TODAY, concl: this.reviewForm.concl, next: '2027-02-24', left: 92 };
        this.log('登记定期复核结果：' + this.reviewForm.concl + (this.reviewForm.note ? '。' + this.reviewForm.note : '。'), 'primary');
        this.reviewDlg = false; this.$demo('复核结果已登记');
      },
      stType(s) { return { 待企业确认: 'warning', '企业已更正，待释放': 'primary', '企业确认属实，待复核': 'primary', 已释放: 'success', 已丢弃价格字段: 'info' }[s]; },
      openDispose(row) { this.disp = { show: true, row, act: row.st === '待企业确认' ? '通知企业确认' : '释放', note: '' }; },
      doDispose() {
        const r = this.disp.row, a = this.disp.act;
        if (a === '释放') r.st = '已释放'; else if (a === '丢弃') r.st = '已丢弃价格字段'; else r.st = '待企业确认';
        this.disp.show = false;
        this.$demo(a === '通知企业确认' ? '已通知企业管理员与数据管理员在自查页确认' : a === '释放' ? '价格字段已释放，将在下一批次进入价格聚合' : '价格字段已丢弃，销量保留');
      },
      openWo(row) { this.wo = { show: true, row, why: '核查“' + row.reason + '”是否由接口字段映射错误导致', hours: 4 }; },
      submitWo() { this.wo.row.wo = '明细访问工单待企业授权'; this.wo.show = false; this.$demo('工单已提交，待企业管理员授权。可在“审计日志 → 平台人员明细访问工单”跟踪。'); },
      openRange(row) { this.rangeDlg = { show: true, row, name: row.name, lo: row.lo, hi: row.hi, why: '' }; },
      saveRange() {
        const d = this.rangeDlg;
        if (!(d.lo < d.hi)) return ElementPlus.ElMessage({ message: '下限须小于上限', type: 'warning' });
        Object.assign(d.row, { lo: d.lo, hi: d.hi, t: nowStr(), by: this.me });
        d.show = false; this.$demo('价格区间已更新，对之后入库的数据生效');
      },
      doShift() {
        const t = nowStr();
        this.ranges.filter((r) => r.cat === this.shift.cat).forEach((r) => { r.lo += this.shift.d; r.hi += this.shift.d; r.t = t; r.by = this.me; });
        this.shiftDlg = false; this.rf = this.shift.cat;
        this.$demo(this.shift.cat + '下全部品名的价格区间已平移 ' + (this.shift.d > 0 ? '+' : '') + this.shift.d + ' 元/吨');
      },
      catSummary({ columns }) {
        const sum = (k) => CAT_STATS.reduce((a, c) => a + c[k], 0);
        return columns.map((c, i) => (i === 0 ? '合计' : i === 1 ? STP.fmt(sum('all')) : i === 2 ? STP.fmt(sum('on')) : i === 3 ? (sum('on') / sum('all') * 100).toFixed(1) + '%' : i === 4 ? STP.fmt(sum('share')) : i === 5 ? '全平台 27.6%' : i === 6 ? '+1.5 个百分点' : ''));
      },
    },
  });
})();
</script>
