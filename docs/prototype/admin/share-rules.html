<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分成规则与台账 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.el-descriptions__label { white-space: nowrap; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.sec-title i { width: 4px; height: 14px; border-radius: 2px; background: var(--el-color-primary); display: inline-block; }
.sec-title small { font-weight: 400; color: var(--stp-sub); font-size: 12px; }
.sec-title .sp { flex: 1; }
.sec-title.mt16 { margin-top: 18px; }
.demo-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
.rule-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rule-item { border: 1px solid var(--stp-border); border-radius: 6px; padding: 10px 12px; background: #fff; }
.rule-item .k { font-size: 12px; color: var(--stp-sub); }
.rule-item .v { font-size: 18px; font-weight: 600; margin: 4px 0 2px; }
.rule-item .v small { font-size: 12px; font-weight: 400; color: var(--stp-sub); margin-left: 4px; }
.rule-item .d { font-size: 12px; color: #5b6778; line-height: 1.6; }
.formula { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; background: #f4f6f8; border: 1px solid var(--stp-border); border-radius: 4px; padding: 8px 10px; color: #3d4b5c; line-height: 1.7; }
.no-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.9; color: #4a5568; }
.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.mini-stats { display: flex; gap: 22px; flex-wrap: wrap; padding: 8px 12px; background: #f6f8fa; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
.mini-stats b { font-size: 15px; margin: 0 2px; }
.rev-row td { background: #fff7f7 !important; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" :user="me" :role="roleOf(me)" active="share-rules" title="分成规则与台账"
  desc="平台按规则把部分收入分给被订阅的下游企业。名额日台账是收入确认和分成计提的唯一依据；规则带生效日期并保留版本，历史期间按当时生效的规则计算；规则修改须经双人复核。">
  <template #actions>
    <el-dropdown trigger="click" @command="v => me = v">
      <el-button><el-icon><UserFilled /></el-icon>原型状态 · 当前操作人：{{ me }}（{{ roleOf(me) }}）<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
      <template #dropdown><el-dropdown-menu>
        <el-dropdown-item v-for="s in staff" :key="s.n" :command="s.n" :disabled="s.n===me">{{ s.n }}（{{ s.r }}）</el-dropdown-item>
      </el-dropdown-menu></template>
    </el-dropdown>
    <el-button type="primary" @click="openEdit"><el-icon><Edit /></el-icon>修改分成规则</el-button>
  </template>

  <!-- 当前生效规则 -->
  <div class="card">
    <div class="card-title">
      <span>当前生效规则<el-tag size="small" type="success" style="margin-left:8px">{{ cur.v }}</el-tag><small>生效日期 {{ cur.eff }}</small><span class="demo-tag" style="margin-left:8px">全部为示例参数，待业务方确定（N-14 至 N-19）</span></span>
      <span class="right"><a href="settlement.html">分成结算 ›</a></span>
    </div>
    <el-alert v-if="nextVer" type="warning" show-icon :closable="false">
      <template #title>下一版本 <b>{{ nextVer.v }}</b> 已复核通过，将于 <b>{{ nextVer.eff }}</b> 生效：{{ nextVer.changes.join('；') }}。生效日之前的期间仍按 {{ cur.v }} 计算。</template>
    </el-alert>
    <div class="rule-grid">
      <div class="rule-item"><div class="k">分成基数</div><div class="v">{{ rule.base==='B' ? '目录价' : '实收摊分' }}<small>方案 {{ rule.base }}</small></div><div class="d">{{ rule.base==='B' ? '400 元/名额·月；日分成基数按 400 ÷ 30 计算（约 13.33 元），不先取整；与上游实际折扣无关' : '订单实收 ÷ 名额数 ÷ 服务天数' }}</div></div>
      <div class="rule-item"><div class="k">分成比例</div><div class="v num">{{ rule.rate }}%</div><div class="d">分成基数中分给下游的比例</div></div>
      <div class="rule-item"><div class="k">质量系数</div><div class="v num">A {{ rule.qA.toFixed(2) }} · B {{ rule.qB.toFixed(2) }} · C {{ rule.qC.toFixed(2) }}</div><div class="d">按企业质量评级分档，按上月末的评级适用</div></div>
      <div class="rule-item"><div class="k">丰富度系数</div><div class="v num">1.00–{{ rule.richMax.toFixed(2) }}</div><div class="d">选填字段填报率最高 +0.07；全量上传 +0.03；按上月末的评定结果适用</div></div>
      <div class="rule-item"><div class="k">资格门槛</div><div class="v" style="font-size:15px">评级不低于 {{ rule.minGrade }}，且当月有效上传不少于 {{ rule.minDays }} 天</div><div class="d">不满足的期间不计提</div></div>
      <div class="rule-item"><div class="k">结算周期</div><div class="v">{{ rule.cycle }}</div><div class="d">次月 5 日出结算单；下游确认并开票后，平台对公付款（每月 10 日、25 日各一批）</div></div>
      <div class="rule-item"><div class="k">起付金额</div><div class="v num">{{ rule.minPay }}<small>元</small></div><div class="d">应付低于起付金额的，结转到下期</div></div>
      <div class="rule-item"><div class="k">关联方订阅</div><div class="v">{{ rule.related }}</div><div class="d">钢厂订阅自己关联贸易公司的名额</div></div>
    </div>
    <div class="grid c-2-1 mt16" style="margin-bottom:0">
      <div>
        <div class="sec-title"><i></i>计算公式</div>
        <div class="formula">
          某下游企业当期分成 = Σ 当期每一天、当天订阅该企业且处于生效状态的每个名额（日分成基数 × 分成比例 × 质量系数 × 丰富度系数）<br>
          示例：评级 A、丰富度 1.05 的企业，每个生效名额日计提 (400 ÷ 30) × {{ rule.rate }}% × {{ rule.qA.toFixed(2) }} × 1.05 ≈ {{ (400 / 30 * rule.rate / 100 * rule.qA * 1.05).toFixed(2) }} 元<br>
          日分成基数按 400 ÷ 30 计算，不先取整；结算单按当月名额天数合计计算，计提金额四舍五入到元。每日计提保留到分，仅用于追溯
        </div>
        <div class="sec-title mt16"><i></i>分成基数的两种方案<span class="demo-tag">待拍板 N-14</span></div>
        <div class="grid c2" style="margin-bottom:0">
          <div class="option-card" :class="{on: rule.base==='A'}" style="cursor:default">
            <h4>方案 A　实收摊分</h4>
            <p>日分成基数 = 订单实收金额 ÷ 订单名额数 ÷ 服务天数（即订单的计费天数；加购订单为生效日至到期日）。</p>
            <ul><li>下游收益随上游的折扣变动，折扣越大分得越少</li><li>下游可能从收益反推上游的折扣档位</li><li>平台毛利率稳定</li><li>示例：实收 693,600 元、200 名额、365 天，基数约 9.50 元/名额·日</li></ul>
            <el-icon v-if="rule.base==='A'" class="check"><CircleCheckFilled /></el-icon>
          </div>
          <div class="option-card" :class="{on: rule.base==='B'}" style="cursor:default">
            <h4>方案 B　目录价<el-tag size="small" type="success">当前示例采用</el-tag></h4>
            <p>日分成基数 = 基础单价折算到日，与上游的实际折扣无关。</p>
            <ul><li>下游收益稳定、可预期</li><li>下游无法从收益反推上游的折扣档位</li><li>折扣全部由平台承担，折扣越深平台毛利越低</li><li>示例：400 元/名额·月，日分成基数 400 ÷ 30 ≈ 13.33 元/名额·日</li></ul>
            <el-icon v-if="rule.base==='B'" class="check"><CircleCheckFilled /></el-icon>
          </div>
        </div>
      </div>
      <div>
        <div class="sec-title"><i></i>不计提的情形</div>
        <div class="tip-box" style="padding:10px 12px">
          <ul class="no-list">
            <li>名额未分配（对应收入全部归平台）</li>
            <li>名额已分配但尚未生效（待生效）</li>
            <li>名额处于冻结状态（对应企业断传或暂停）</li>
            <li>下游已退出平台</li>
            <li>订单未实收</li>
            <li>模拟数据演示</li>
            <li>企业不满足资格门槛的期间</li>
            <li>关联方订阅<span class="demo-tag" style="margin-left:6px">示例规则，N-19</span></li>
            <li>不上架、只用于自身对标的企业</li>
          </ul>
        </div>
        <div class="tip-box blue small mt12">免费替换后计提对象随名额变更；顺延的天数继续计提。上游退款、订单取消、名额补偿导致台账变化时，自动生成冲正。<br>周期内加购的名额：计费起始日、台账起始日、计提起始日都是新增企业的生效日；下单日至生效日之间没有台账行，不向上游收费，也不计提。台账行数 = 计费天数，作为每日勾稽校验项。</div>
      </div>
    </div>
  </div>

  <!-- 待复核与版本 -->
  <div class="card">
    <div class="card-title"><span>规则变更复核与版本历史<small>提交 → 另一人复核 → 按生效日期生效。当前操作人：{{ me }}（{{ roleOf(me) }}）</small></span></div>
    <el-table v-if="pending.length" :data="pending" border size="small" class="mb16">
      <el-table-column prop="id" label="申请编号" width="130" />
      <el-table-column label="变更内容" min-width="280"><template #default="{row}"><div v-for="c in row.changes" :key="c">{{ c }}</div></template></el-table-column>
      <el-table-column prop="reason" label="变更原因" min-width="220" />
      <el-table-column prop="eff" label="生效日期" width="110" />
      <el-table-column label="提交人" width="140"><template #default="{row}">{{ row.by }}<div class="small muted num">{{ row.t }}</div></template></el-table-column>
      <el-table-column label="状态" width="90" align="center"><template #default><el-tag size="small" type="warning" disable-transitions>待复核</el-tag></template></el-table-column>
      <el-table-column label="操作" width="140" align="center">
        <template #default="{row}">
          <template v-if="row.by===me">
            <el-tooltip content="提交人不能复核自己的申请，请切换为另一位复核人" placement="top"><span><el-button link type="primary" disabled>通过</el-button></span></el-tooltip>
            <el-button link type="info" @click="finish(row, '已撤回')">撤回</el-button>
          </template>
          <template v-else>
            <el-button link type="success" @click="finish(row, '通过')">通过</el-button>
            <el-button link type="danger" @click="finish(row, '已驳回')">驳回</el-button>
          </template>
        </template>
      </el-table-column>
    </el-table>
    <el-table :data="versions" border size="small">
      <el-table-column label="版本" width="100"><template #default="{row}"><b>{{ row.v }}</b></template></el-table-column>
      <el-table-column label="适用期间" width="210"><template #default="{row}"><span class="num">{{ row.eff }} 起{{ row.end ? '，至 ' + row.end : '' }}</span></template></el-table-column>
      <el-table-column label="主要内容 / 变更" min-width="330"><template #default="{row}"><div v-for="c in row.changes" :key="c">{{ c }}</div><div v-if="row.reason" class="small muted">原因：{{ row.reason }}</div></template></el-table-column>
      <el-table-column label="提交" width="130"><template #default="{row}">{{ row.by }}<div class="small muted num">{{ row.t }}</div></template></el-table-column>
      <el-table-column label="复核" width="130"><template #default="{row}"><template v-if="row.rv">{{ row.rv }}<div class="small muted num">{{ row.rvT }}</div></template><span v-else class="muted">—</span></template></el-table-column>
      <el-table-column label="状态" width="110" align="center"><template #default="{row}"><el-tag size="small" :type="row.st==='当前生效' ? 'success' : row.st==='待生效' ? 'warning' : row.st==='已驳回' ? 'danger' : 'info'" disable-transitions>{{ row.st }}</el-tag></template></el-table-column>
    </el-table>
    <div class="small muted mt8">历史期间按当时生效的规则版本计算；规则变更不影响已结算期间（NFR-16）。每笔计提都记录所用的规则版本。</div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- ============ 名额日台账 ============ -->
      <el-tab-pane label="名额日台账查询" name="ledger">
        <el-alert type="info" show-icon :closable="false" title="台账每日生成，每个名额每个自然日一行，是收入确认和分成计提的唯一依据。台账不可修改，只能冲正：冲正以追加一行负数记录的方式体现，原记录保留。" />
        <div class="filter-bar">
          <el-date-picker v-model="lf.date" type="date" value-format="YYYY-MM-DD" :clearable="false" style="width:150px" />
          <el-select v-model="lf.up" clearable placeholder="全部上游购买主体" style="width:230px"><el-option v-for="u in ups" :key="u" :label="u" :value="u" /></el-select>
          <el-select v-model="lf.st" clearable placeholder="全部状态" style="width:130px"><el-option v-for="s in ['生效','冻结','待生效','未分配']" :key="s" :label="s" :value="s" /></el-select>
          <el-input v-model="lf.kw" clearable placeholder="名额编号 / 订单号 / 下游企业" style="width:250px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <span style="flex:1"></span>
          <el-button @click="$demo('台账导出任务已提交（含文件指纹，写入审计日志）')"><el-icon><Download /></el-icon>导出</el-button>
        </div>
        <div class="mini-stats">
          <span>{{ lf.date }} 台账行数 <b class="num">86,400</b></span>
          <span><span class="dot ok"></span>生效 <b class="num">79,640</b></span>
          <span><span class="dot warn"></span>冻结 <b class="num">1,128</b></span>
          <span><span class="dot info"></span>已分配待生效 <b class="num">1,192</b></span>
          <span><span class="dot"></span>未分配 <b class="num">4,440</b></span>
          <span>当日分成基数合计 <b class="num">1,061,866.67</b> 元</span>
          <span>当日确认收入 <b class="num">823,652.17</b> 元</span>
        </div>
        <el-table :data="ledgerRows" border size="small" :row-class-name="({row}) => row.rev ? 'rev-row' : ''">
          <template #empty><el-empty description="没有符合条件的台账记录" :image-size="70" /></template>
          <el-table-column label="日期" width="100"><template #default="{row}"><span class="num">{{ lf.date }}</span></template></el-table-column>
          <el-table-column label="名额编号" width="116"><template #default="{row}"><span class="num">{{ row.q }}</span></template></el-table-column>
          <el-table-column label="所属订单" width="160"><template #default="{row}"><span class="num">{{ row.no }}</span></template></el-table-column>
          <el-table-column prop="up" label="上游购买主体" min-width="180" />
          <el-table-column label="当日对应的下游企业" min-width="210"><template #default="{row}"><span v-if="row.dn">{{ row.dn }}</span><span v-else class="muted">—</span><el-tag v-if="row.rel" size="small" type="info" style="margin-left:6px" disable-transitions>关联方</el-tag></template></el-table-column>
          <el-table-column label="状态" width="170"><template #default="{row}"><span class="dot" :class="row.st==='生效' ? 'ok' : row.st==='冻结' ? 'warn' : ''"></span>{{ row.st }}<span v-if="row.note" class="small muted">（{{ row.note }}）</span></template></el-table-column>
          <el-table-column label="日分成基数（元）" width="130" align="right"><template #default="{row}"><span v-if="row.base" class="num" :style="{color: row.base < 0 ? '#e5484d' : ''}">{{ row.base.toFixed(2) }}</span><span v-else class="muted">不计提</span></template></el-table-column>
          <el-table-column label="操作" width="80" align="center">
            <template #default="{row}"><el-tag v-if="row.rev" size="small" type="danger" disable-transitions>冲正</el-tag><el-button v-else link type="primary" :disabled="row.st!=='生效' || row.done" @click="openRev(row)">{{ row.done ? '已冲正' : '冲正' }}</el-button></template>
          </el-table-column>
        </el-table>
        <div class="tbl-foot"><span>当前显示 {{ ledgerRows.length }} 行（原型示例数据）。日分成基数显示为 13.33，计算按 400 ÷ 30，不先取整。台账合计与订单实收可勾稽：某订单各日基数之和 × 实收折扣 = 该订单已确认收入。“待生效”行来自已购名额包内的名额，基数为 0；加购名额自生效日起才有台账行，目前 5 笔加购订单均待支付，不在台账内。</span><el-pagination layout="prev, pager, next" :total="86400" :page-size="50" small background /></div>
      </el-tab-pane>

      <!-- ============ 每日计提 ============ -->
      <el-tab-pane label="每日计提查询" name="accrual">
        <div class="filter-bar">
          <el-date-picker v-model="af.date" type="date" value-format="YYYY-MM-DD" :clearable="false" style="width:150px" />
          <el-input v-model="af.kw" clearable placeholder="下游企业名称" style="width:250px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <el-checkbox v-model="af.only">只看不计提或有冲正的</el-checkbox>
          <span style="flex:1"></span><span class="small muted">点击行可追溯到对应的名额日台账行</span>
        </div>
        <div class="mini-stats">
          <span>{{ af.date }} 计提企业数 <b class="num">11,902</b> 家</span>
          <span>生效名额日 <b class="num">79,640</b></span>
          <span>其中不计提 <b class="num">3,610</b>（资格门槛、关联方）</span>
          <span>当日计提合计 <b class="num">208,830.42</b> 元</span>
          <span>本月累计 <b class="num">480.3</b> 万元</span>
        </div>
        <el-table :data="accrualRows" border size="small" @row-click="openAcc" style="cursor:pointer">
          <el-table-column label="下游企业" min-width="200"><template #default="{row}">{{ row.ent }}</template></el-table-column>
          <el-table-column label="日期" width="96"><template #default><span class="num">{{ af.date }}</span></template></el-table-column>
          <el-table-column label="名额日数" width="80" align="right"><template #default="{row}"><span class="num">{{ row.n }}</span></template></el-table-column>
          <el-table-column label="适用系数" width="190"><template #default="{row}"><span v-if="row.q">质量 {{ row.grade }} <b class="num">{{ row.q.toFixed(2) }}</b> × 丰富度 <b class="num">{{ row.r.toFixed(2) }}</b></span><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="计提金额（元）" width="110" align="right"><template #default="{row}"><b class="num">{{ row.amt.toFixed(2) }}</b></template></el-table-column>
          <el-table-column prop="ver" label="规则版本" width="80" />
          <el-table-column label="说明 / 冲正标记" min-width="310"><template #default="{row}"><span v-if="row.tag"><span class="dot" :class="row.tagType"></span>{{ row.tag }}</span><span v-else class="muted">—</span></template></el-table-column>
          <el-table-column label="追溯" width="60" align="center"><template #default="{row}"><el-button link type="primary" @click.stop="openAcc(row)">台账</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>当前显示 {{ accrualRows.length }} 家（原型示例数据）。计提只引用名额、订单和企业标识，不涉及企业上传的任何业务明细。</span><el-pagination layout="prev, pager, next" :total="11902" :page-size="50" small background /></div>
      </el-tab-pane>

      <!-- ============ 冻结与追回 ============ -->
      <el-tab-pane name="freeze">
        <template #label>冻结与追回<span class="level-tag">二期</span></template>

          { v: 'SR-V1', eff: '2025-07-01', end: '2025-11-30', changes: ['初始规则：目录价方案 B、分成比例 20%、质量系数 A 1.10 / B 1.00 / C 0.90、月结、起付 500 元、关联方订阅不分成'], reason: '', by: '林若彤', t: '2025-06-18 11:00', rv: '何志远', rvT: '2025-06-19 10:25', st: '已失效' }],
        ed: { show: false, f: Object.assign({}, RULE), eff: '2027-01-01', reason: '' },
        lf: { date: M.DATA_DATE, up: '', st: '', kw: '' }, ledger: LEDGER, ups: Object.values(U),
        rv: { show: false, row: null, src: '名额补偿', note: '' },
        af: { date: M.DATA_DATE, kw: '', only: false }, accruals: ACC, acc: { show: false, row: null, lines: [] },
        freezes: [
          { ent: FZ, why: '反刷量命中：整数吨位占比异常', t: '2026-11-18', frozen: 1649, paid: 3920, st: '已冻结，核查中' },
          { ent: HY, why: '季度复核命中：2026-07 下旬日销量异常波动，数据真实性核查中（企业已申诉）', t: '2026-11-10', frozen: 2081, paid: 0, st: '已冻结，核查中' },
          { ent: E[9], why: '反刷量命中：同一实际控制人多主体重复上传相同数据', t: '2026-11-05', frozen: 2104, paid: 6378, st: '已冻结，核查中' },
          { ent: E[3], why: '涉嫌造假：上游举报并经初步核查', t: '2026-10-22', frozen: 1531, paid: 4109, st: '已查实，追回中' },
          { ent: E[2], why: '反刷量命中：整数吨位占比异常', t: '2026-10-09', frozen: 0, paid: 0, st: '已解除' },
          { ent: E[8], why: '涉嫌造假：同一批次重复上传', t: '2026-08-14', frozen: 0, paid: 0, st: '已追回' }],
        fz: { show: false, row: null, act: '已解除', note: '' }, dim: 'period',
      };
    },
    computed: {
      cur() { return this.versions.find((v) => v.st === '当前生效'); },
      nextVer() { return this.versions.find((v) => v.st === '待生效'); },
      edChanges() { return Object.keys(FIELD).filter((k) => this.ed.f[k] !== this.rule[k]).map((k) => FIELD[k] + '：' + fv(k, this.rule[k]) + ' → ' + fv(k, this.ed.f[k])); },
      ledgerRows() { const f = this.lf, kw = f.kw.trim(); return this.ledger.filter((r) => (!f.up || r.up === f.up) && (!f.st || r.st === f.st) && (!kw || (r.q + r.no + r.dn).indexOf(kw) >= 0)); },
      accrualRows() { const f = this.af, kw = f.kw.trim(); return this.accruals.filter((r) => (!kw || r.ent.indexOf(kw) >= 0) && (!f.only || r.tag)); },
      reportTable() {
        if (this.dim === 'period') return { head: '期间', rows: MONTHS.slice(-6).map((m, i) => [m + (i === 5 ? '（截至 23 日）' : ''), REV[i + 6], SHARE[i + 6]]), note: '收入与分成成本均按名额日确认与计提。' };
        if (this.dim === 'up') return { head: '上游购买主体', rows: [[U.jj, 13.6, 3.94], [U.dy, 5.78, 1.51], [U.kl, 5.78, 1.57], [U.ny, 3.06, 0.79], [U.hc, 1.94, 0.49], ['其他 433 家', 2395.14, 606.6], ['合计', 2425.3, 614.9, 0, 1]], note: '示例 5 家上游与其他合计。分成基数按目录价，折扣越深的上游，分成成本占其收入的比例越高。' };
        if (this.dim === 'dn') return { head: '下游企业质量评级', rows: [['A 级（1,768 家）', null, 318.6], ['B 级（1,848 家）', null, 243.2], ['C 级（570 家）', null, 53.1], ['合计（4,186 家）', null, 614.9, 0, 1]], note: '分成成本按下游企业归集；平台收入来自上游，不按下游拆分。单家企业的结算金额见分成结算。' };
        return { head: '商品', rows: [['名额包', 1746.2, 428.6], ['单选订阅', 412.3, 112.4], ['周期内加购', 266.8, 73.9], ['合计', 2425.3, 614.9, 0, 1]], note: '名额包含未分配名额，未分配部分不计提，分成成本占比低于单选订阅。周期内加购从新增企业生效日起计费，收入与计提同日起算，没有“已收费但不计提”的期间。' };
      },
      reportOption() {
        const C = STP.chart;
        if (this.dim === 'period') {
          const o = C.line({ x: MONTHS, unit: '万元', smooth: false, series: [
            { name: '平台收入', type: 'bar', data: REV, barMaxWidth: 22, itemStyle: { borderRadius: [3, 3, 0, 0] } }, { name: '分成成本', type: 'bar', data: SHARE, barMaxWidth: 22, color: '#f7b500', itemStyle: { borderRadius: [3, 3, 0, 0] } },
            { name: '净收入', data: REV.map((v, i) => +(v - SHARE[i]).toFixed(1)), color: '#18a058', showSymbol: true }] });
          o.yAxis[0].scale = false; o.xAxis.axisLabel = { color: '#6b7787', interval: 0, fontSize: 11, rotate: 30 };
          return o;
        }
        const rows = this.reportTable.rows.filter((r) => !r[4] && r[0].indexOf('其他') < 0);
        if (this.dim === 'dn') return C.pie({ unit: '万元', name: '分成成本', data: rows.map((r) => ({ name: r[0], value: r[2] })) });
        return C.bar({ x: rows.map((r) => r[0].replace(/(集团|股份)?有限(责任)?公司/, '')), unit: '万元', series: [{ name: '平台收入', data: rows.map((r) => r[1]) }, { name: '分成成本', data: rows.map((r) => r[2]), color: '#f7b500' }, { name: '净收入', data: rows.map((r) => +(r[1] - r[2]).toFixed(2)), color: '#18a058' }] });
      },
    },
    methods: {
      roleOf(n) { return STAFF.find((s) => s.n === n).r; },
      openEdit() { this.ed = { show: true, f: Object.assign({}, this.rule), eff: '2027-01-01', reason: '' }; },
      submitEdit() {
        const e = this.ed;
        if (!this.edChanges.length) return warn('没有任何变更，无需提交');
        if (!e.reason.trim()) return warn('请填写变更原因');
        if (!(e.f.qA >= e.f.qB && e.f.qB >= e.f.qC)) return warn('质量系数应满足 A ≥ B ≥ C');
        if (this.pending.length || this.nextVer) return warn('已有待复核或待生效的规则变更，请先处理完毕再提交新的变更');
        const patch = {}; Object.keys(FIELD).forEach((k) => { if (e.f[k] !== this.rule[k]) patch[k] = e.f[k]; });
        this.pending.unshift({ id: 'SRC-20261124-0' + (this.versions.filter((v) => v.t.indexOf('2026-11-24') === 0).length + 1), changes: this.edChanges.slice(), patch, reason: e.reason, eff: e.eff, by: this.me, t: nowStr() });
        e.show = false; this.$demo('已提交，等待另一位平台人员复核。提交人不能复核自己的申请。');
      },
      finish(row, st) {
        const drop = () => { this.pending = this.pending.filter((x) => x !== row); };
        if (st === '已撤回') { drop(); return this.$demo('已撤回申请'); }
        if (row.by === this.me) return this.$info('提交人不能复核自己的申请');
        if (st === '已驳回') {
          return ElementPlus.ElMessageBox.prompt('请填写驳回意见', '驳回规则变更', { confirmButtonText: '确认驳回', cancelButtonText: '取消', inputValidator: (v) => !!(v && v.trim()) || '请填写驳回意见' }).then(({ value }) => {
            drop(); this.versions.unshift({ v: '—', eff: row.eff, end: '', changes: row.changes, reason: row.reason + '（驳回意见：' + value + '）', by: row.by, t: row.t, rv: this.me, rvT: nowStr(), st: '已驳回' });
            this.$demo('已驳回，分成规则保持不变');
          }).catch(() => {});
        }
        ElementPlus.ElMessageBox.confirm('确认通过该规则变更？新版本将于 ' + row.eff + ' 生效，此前的期间仍按当前版本计算。', '复核分成规则变更', { type: 'warning', confirmButtonText: '确认通过', cancelButtonText: '取消' }).then(() => {
          drop();
          const n = this.versions.filter((v) => /^SR-V\d/.test(v.v)).length + 1;
          this.versions.unshift({ v: 'SR-V' + n, eff: row.eff, end: '', changes: row.changes, reason: row.reason, by: row.by, t: row.t, rv: this.me, rvT: nowStr(), st: '待生效' });
          this.cur.end = STP.addDays(row.eff, -1);
          this.$demo('复核通过。SR-V' + n + ' 将于 ' + row.eff + ' 生效，系统将提前通知全部下游企业。');
        }).catch(() => {});
      },
      openRev(row) { this.rv = { show: true, row, src: '名额补偿', note: '' }; },
      doRev() {
        const r = this.rv.row, i = this.ledger.indexOf(r);
        r.done = true;
        this.ledger.splice(i + 1, 0, Object.assign({}, r, { base: -BASE, rev: true, note: '冲正：' + this.rv.src }));
        this.rv.show = false; this.$demo('已追加冲正记录，并同步冲正该企业当日计提');
      },
      openAcc(row) {
        const ks = Object.keys(U);
        /* 名额序号不超过该订单的名额数；中洲的数据池成员不含苏州恒运 */
        const lines = ks.filter((k) => !(row.ent === HY && k === 'zz')).slice(0, Math.min(8, row.n)).map((k, i) => ({ q: 'Q' + ON[k].slice(-4) + '-' + String(row.ent === HY && i < 2 ? 1 : 1 + (M.hash(row.ent + k) % (QN[k] - 2))).padStart(3, '0'), no: ON[k], up: U[k] }));
        this.acc = { show: true, row, lines };
      },
      openFreeze(row) { this.fz = { show: true, row, act: row.st === '已查实，追回中' ? '已查实，追回中' : '已解除', note: '' }; },
      doFreeze() {
        const r = this.fz.row; r.st = this.fz.act; if (r.st === '已解除') r.frozen = 0;
        this.fz.show = false; this.$demo('处理结果已保存，并通知企业管理员与财务');
      },
    },
  });
})();
</script>
