<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单与计费 · 平台运营后台 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.el-descriptions__label { white-space: nowrap; }
.sec-title { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.sec-title i { width: 4px; height: 14px; border-radius: 2px; background: var(--el-color-primary); display: inline-block; }
.sec-title small { font-weight: 400; color: var(--stp-sub); font-size: 12px; }
.sec-title .sp { flex: 1; }
.sec-title.mt16 { margin-top: 18px; }
.demo-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
.filter-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.calc { border: 1px solid var(--stp-border); border-radius: 6px; padding: 14px 16px; background: #fafbfc; }
.calc .line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
.calc .line.sum { border-top: 1px dashed #c8d0db; margin-top: 6px; padding-top: 10px; font-weight: 600; }
.formula { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 12px; background: #f4f6f8; border: 1px solid var(--stp-border); border-radius: 4px; padding: 8px 10px; color: #3d4b5c; line-height: 1.7; }
.match-ok { color: #18a058; } .match-bad { color: #e5484d; } .match-wait { color: #b26a00; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="admin" :user="me" :role="roleOf(me)" active="billing" title="订单与计费"
  desc="只向上游收费，按数据池内下游企业数（名额）计费，订阅制、年付为主。本页处理订单查询、对公到账核销、退款审核、发票，并维护商品与定价；定价修改须经双人复核。">
  <template #actions>
    <el-dropdown trigger="click" @command="v => me = v">
      <el-button><el-icon><UserFilled /></el-icon>原型状态 · 当前操作人：{{ me }}（{{ roleOf(me) }}）<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
      <template #dropdown><el-dropdown-menu>
        <el-dropdown-item v-for="s in staff" :key="s.n" :command="s.n" :disabled="s.n===me">{{ s.n }}（{{ s.r }}）</el-dropdown-item>
      </el-dropdown-menu></template>
    </el-dropdown>
    <el-button @click="$demo('2026-11 月账单导出任务已提交')"><el-icon><Download /></el-icon>导出月账单</el-button>
  </template>

  <div class="grid c5">
    <stat-card label="本月新签订单金额" :value="1267.4" :d="1" unit="万元" icon="Tickets" :mom="8.5"><span>58 笔（含待支付）</span></stat-card>
    <stat-card label="在订名额" :value="86400" unit="个" icon="Coin"><span>付费上游 438 家</span></stat-card>
    <div class="stat" style="cursor:pointer" @click="tab='recon'">
      <div class="label">对公转账待核销</div><div class="value num">{{ recons.length }}<span class="unit">笔</span></div>
      <div class="foot"><span>合计 {{ $fmt(recons.reduce((a, r) => a + r.amount, 0)) }} 元</span></div>
      <div class="ico"><el-icon><Stamp /></el-icon></div>
    </div>
    <div class="stat" style="cursor:pointer" @click="tab='refund'">
      <div class="label">待处理退款</div><div class="value num">{{ refunds.filter(r => r.st==='待审核').length }}<span class="unit">笔</span></div>
      <div class="foot"><span>未生效全额退，已生效按合同规则退</span></div>
      <div class="ico"><el-icon><RefreshLeft /></el-icon></div>
    </div>
    <div class="stat" style="cursor:pointer" @click="tab='invoice'">
      <div class="label">待开发票</div><div class="value num">{{ invoices.filter(r => r.st==='待开具').length }}<span class="unit">张</span></div>
      <div class="foot"><span>增值税专用发票为主</span></div>
      <div class="ico"><el-icon><Document /></el-icon></div>
    </div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- ============ 订单查询 ============ -->
      <el-tab-pane label="订单查询" name="orders">
        <div class="filter-bar">
          <el-input v-model="of.kw" placeholder="订单号 / 购买主体" clearable style="width:240px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <el-select v-model="of.prod" clearable placeholder="全部商品" style="width:150px"><el-option v-for="p in ['单选订阅','名额包','周期内加购']" :key="p" :label="p" :value="p" /></el-select>
          <el-select v-model="of.st" clearable placeholder="全部状态" style="width:160px"><el-option v-for="s in orderStatus" :key="s" :label="s" :value="s" /></el-select>
          <el-select v-model="of.pay" clearable placeholder="全部支付方式" style="width:150px"><el-option label="对公转账" value="对公转账" /><el-option label="在线支付" value="在线支付" /></el-select>
          <el-button @click="of = { kw: '', prod: '', st: '', pay: '' }">重置</el-button>
          <span style="flex:1"></span>
          <span class="small muted">购买主体按集团归并；每个购买主体同一时间只有一个生效数据池</span>
        </div>
        <el-table :data="orderRows" border size="small">
          <template #empty><el-empty description="没有符合条件的订单" :image-size="70" /></template>
          <el-table-column label="订单号" width="162"><template #default="{row}"><a href="javascript:;" @click="openOrder(row)" class="num">{{ row.no }}</a></template></el-table-column>
          <el-table-column prop="buyer" label="购买主体" min-width="190" />
          <el-table-column prop="prod" label="商品" width="100" />
          <el-table-column label="名额数" width="72" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.qty) }}</span></template></el-table-column>
          <el-table-column label="周期" width="196"><template #default="{row}"><span class="num">{{ row.from }} 至 {{ row.to }}</span><div class="small muted">{{ row.cycle }}</div></template></el-table-column>
          <el-table-column label="金额（元）" width="112" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.amount) }}</span></template></el-table-column>
          <el-table-column prop="pay" label="支付方式" width="86" />
          <el-table-column label="状态" width="150"><template #default="{row}"><el-tag size="small" :type="stType(row.st)" disable-transitions>{{ row.st }}</el-tag><div v-if="row.sub" class="small muted">{{ row.sub }}</div></template></el-table-column>
          <el-table-column label="操作" width="70" align="center"><template #default="{row}"><el-button link type="primary" @click="openOrder(row)">详情</el-button></template></el-table-column>
        </el-table>
        <div class="tbl-foot"><span>当前显示 {{ orderRows.length }} 条（原型示例数据）；全部订单共 742 条。订单号 = DO-下单日期-当月流水号</span><el-pagination layout="prev, pager, next" :total="742" :page-size="20" small background /></div>
      </el-tab-pane>

      <!-- ============ 对公到账核销 ============ -->
      <el-tab-pane name="recon">
        <template #label>对公到账核销<el-badge v-if="recons.length" :value="recons.length" style="margin-left:6px" /></template>
        <div class="tip-box blue small mb12">钢厂采购以对公转账和合同付款为主。上游上传转账凭证后，系统按“金额 + 付款户名”自动匹配银行到账流水；财务核销后订单才生效。金额或户名不一致的不能直接核销。</div>
        <el-table :data="recons" border size="small">
          <template #empty><el-empty description="暂无待核销的对公转账" :image-size="70" /></template>
          <el-table-column label="订单号" width="162"><template #default="{row}"><a href="javascript:;" class="num" @click="openOrderNo(row.no)">{{ row.no }}</a></template></el-table-column>
          <el-table-column label="付款方" min-width="200"><template #default="{row}">{{ row.payer }}<div class="small muted">{{ row.prod }} · {{ row.qty }} 个名额</div></template></el-table-column>
          <el-table-column label="应收金额（元）" width="126" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.amount) }}</span></template></el-table-column>
          <el-table-column label="转账凭证" width="170"><template #default="{row}"><a href="javascript:;" @click="$info('原型演示：打开转账凭证图片预览')"><el-icon style="vertical-align:-2px"><Picture /></el-icon> 查看凭证</a><div class="small muted num">上传于 {{ row.upT }}</div></template></el-table-column>
          <el-table-column label="到账流水匹配情况" min-width="280">
            <template #default="{row}">
              <span :class="row.m==='ok' ? 'match-ok' : row.m==='wait' ? 'match-wait' : 'match-bad'"><el-icon style="vertical-align:-2px"><component :is="row.m==='ok' ? 'CircleCheck' : row.m==='wait' ? 'Clock' : 'CircleClose'" /></el-icon> {{ row.mt }}</span>
              <div class="small muted">{{ row.md }}</div>
            </template>
          </el-table-column>
          <el-table-column label="操作" width="150" align="center">
            <template #default="{row}">
              <el-button link type="primary" @click="openRecon(row)">核销</el-button>
              <el-button link type="info" @click="$demo('已通知购买主体补充或更正转账凭证')">退回补充</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-tab-pane>

      <!-- ============ 退款审核 ============ -->
      <el-tab-pane label="退款审核" name="refund">
        <div class="grid c2 mb12" style="margin-bottom:12px">
          <div class="tip-box small"><b>退款规则：</b>未生效订单可全额退；已生效订单按合同约定的规则退款。<span class="demo-tag">示例规则，待业务方确定（D-18）</span><br>原型示例：已生效订单按剩余服务天数比例退还实付金额。</div>
          <div class="tip-box orange small"><b>退款与带动奖励：</b>奖励名额不产生订单，不能退款、转让或折现；奖励折扣为二期，届时使用折扣下单的订单按实付金额退款。平台不向下游发放现金，退款不涉及下游。<a href="referral-rewards.html">带动奖励规则 ›</a></div>
        </div>
        <el-table :data="refunds" border size="small">
          <el-table-column label="退款单号" width="146"><template #default="{row}"><span class="num">{{ row.id }}</span></template></el-table-column>
          <el-table-column label="订单 / 购买主体" min-width="190"><template #default="{row}"><a href="javascript:;" class="num" @click="openOrderNo(row.no)">{{ row.no }}</a><div class="small muted">{{ row.buyer }}</div></template></el-table-column>
          <el-table-column label="订单情况" width="90"><template #default="{row}"><el-tag size="small" :type="row.eff ? 'warning' : 'info'" disable-transitions>{{ row.eff ? '已生效' : '未生效' }}</el-tag></template></el-table-column>
          <el-table-column label="实付金额（元）" width="114" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.paid) }}</span></template></el-table-column>
          <el-table-column label="可退金额（元）" width="114" align="right"><template #default="{row}"><b class="num">{{ $fmt(row.refund) }}</b></template></el-table-column>
          <el-table-column label="申请时间" width="136"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="状态" width="116"><template #default="{row}"><el-tag size="small" :type="row.st==='待审核' ? 'warning' : row.st==='已驳回' ? 'danger' : row.st==='已退款' ? 'info' : 'success'" disable-transitions>{{ row.st }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="76" align="center"><template #default="{row}"><el-button link type="primary" @click="openRefund(row)">{{ row.st==='待审核' ? '审核' : '查看' }}</el-button></template></el-table-column>
        </el-table>
      </el-tab-pane>

      <!-- ============ 发票处理 ============ -->
      <el-tab-pane label="发票处理" name="invoice">
        <div class="filter-bar">
          <el-radio-group v-model="invF"><el-radio-button value="">全部</el-radio-button><el-radio-button value="待开具">待开具</el-radio-button><el-radio-button value="已开具">已开具</el-radio-button></el-radio-group>
          <span style="flex:1"></span><span class="small muted">开票能力复用货袋子平台；发票抬头须与购买主体的认证主体一致</span>
        </div>
        <el-table :data="invoices.filter(r => !invF || r.st===invF)" border size="small">
          <el-table-column label="申请编号" width="150"><template #default="{row}"><span class="num">{{ row.id }}</span></template></el-table-column>
          <el-table-column label="订单号" width="162"><template #default="{row}"><a href="javascript:;" class="num" @click="openOrderNo(row.no)">{{ row.no }}</a></template></el-table-column>
          <el-table-column prop="buyer" label="发票抬头（购买主体）" min-width="190" />
          <el-table-column prop="type" label="发票类型" width="130" />
          <el-table-column label="开票金额（元）" width="126" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.amount) }}</span></template></el-table-column>
          <el-table-column label="申请时间" width="140"><template #default="{row}"><span class="num">{{ row.t }}</span></template></el-table-column>
          <el-table-column label="状态" width="100"><template #default="{row}"><el-tag size="small" :type="row.st==='待开具' ? 'warning' : 'success'" disable-transitions>{{ row.st }}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="120" align="center">
            <template #default="{row}">
              <el-button v-if="row.st==='待开具'" link type="primary" @click="issue(row)">开具</el-button>
              <el-button v-else link type="primary" @click="$info('原型演示：下载电子发票 ' + row.invNo)">下载</el-button>
              <el-button v-if="row.st==='待开具'" link type="info" @click="$demo('已退回，请购买主体更正开票信息')">退回</el-button>
            </template>
          </el-table-column>
        </el-table>
      </el-tab-pane>

      <!-- ============ 商品与定价 ============ -->
      <el-tab-pane name="pricing">
        <template #label>商品与定价<el-badge v-if="pp.length" :value="pp.length" style="margin-left:6px" /></template>
        <el-alert type="warning" show-icon :closable="false">
          <template #title>本页全部价格参数均为<b>示例参数，待业务方确定</b>（D-15）。定价修改须经“提交 → 另一人复核 → 生效”，只影响生效日之后新下的订单。带动奖励一期以奖励名额发放，不影响本页定价；奖励折扣为二期，与数量阶梯、合同价能否叠加待定，规则见<a href="referral-rewards.html">带动奖励规则</a>。</template>
        </el-alert>

        <div v-if="pp.length" class="mb16">
          <div class="sec-title"><i></i>待复核的定价变更<small>当前操作人：{{ me }}（{{ roleOf(me) }}）。提交人不能复核自己的申请</small></div>
          <el-table :data="pp" border size="small">
            <el-table-column prop="id" label="申请编号" width="140" />
            <el-table-column label="变更内容" min-width="300"><template #default="{row}"><b>{{ row.title }}</b><div class="small"><span v-if="row.from" class="muted">{{ row.from }} → </span>{{ row.to }}</div></template></el-table-column>
            <el-table-column prop="reason" label="原因" min-width="200" />
            <el-table-column prop="eff" label="生效日期" width="110" />
            <el-table-column label="提交人" width="140"><template #default="{row}">{{ row.by }}<div class="small muted num">{{ row.t }}</div></template></el-table-column>
            <el-table-column label="操作" width="150" align="center">
              <template #default="{row}">
                <template v-if="row.by===me">
                  <el-tooltip content="提交人不能复核自己的申请，请切换为另一位复核人" placement="top"><span><el-button link type="primary" disabled>通过</el-button></span></el-tooltip>
                  <el-button link type="info" @click="ppDone(row, '已撤回')">撤回</el-button>
                </template>
                <template v-else>
                  <el-button link type="success" @click="ppDone(row, '已生效')">通过</el-button>
                  <el-button link type="danger" @click="ppDone(row, '已驳回')">驳回</el-button>
                </template>
              </template>
            </el-table-column>
          </el-table>
        </div>

        <div class="grid c-3-2" style="margin-bottom:0">
          <div>
            <div class="sec-title"><i></i>价格结构<span class="demo-tag">示例参数，待业务方确定</span><span class="sp"></span><el-button size="small" type="primary" @click="openPrice()"><el-icon><Edit /></el-icon>修改定价参数</el-button></div>
            <div class="formula mb12">应付金额 = Σ（名额数 × 周期数 × 基础单价 × 周期折扣 × 数量阶梯折扣 × 企业等级系数）− 优惠</div>
            <table class="plain-table">
              <thead><tr><th style="width:150px">参数</th><th>当前值</th><th>说明</th></tr></thead>
              <tbody>
                <tr><td>基础单价</td><td><b class="num">{{ pr.base }}</b> 元/名额·月</td><td class="muted">1 个名额 = 1 家下游企业 × 1 个计费周期</td></tr>
                <tr><td>周期折扣</td><td>月付 原价；季付 <b>{{ offText(pr.quarter) }}</b>；年付 <b>{{ offText(pr.year) }}</b></td><td class="muted">年付为主</td></tr>
                <tr><td>最小购买量</td><td><b class="num">{{ pr.minQty }}</b> 个名额</td><td class="muted">等于最小数据池规模，不得低于防反推参数 N_min</td></tr>
                <tr><td>赠送历史深度</td><td><b class="num">{{ pr.hist }}</b> 个月</td><td class="muted">随订阅赠送，更长的历史另计</td></tr>
                <tr><td>企业等级系数</td><td>统一为 <b>1</b></td><td class="muted">一期不启用，保留字段</td></tr>
                <tr><td>价格数据加价</td><td><el-tag size="small" type="info">待确认</el-tag></td><td class="muted">包含在名额价格内还是作为加价项，待业务方确定（N-04）</td></tr>
              </tbody>
            </table>

            <div class="sec-title mt16"><i></i>数量阶梯<span class="demo-tag">示例参数，待业务方确定</span><small>按订单生效后的在订名额总数取档</small></div>
            <table class="plain-table">
              <thead><tr><th>名额数</th><th v-for="t in tiers" :key="t.label" class="c">{{ t.label }}</th></tr></thead>
              <tbody>
                <tr><td>折扣</td><td v-for="t in tiers" :key="t.label" class="c"><b>{{ offText(t.off) }}</b></td></tr>
                <tr><td>年付折后单价（元/名额·月）</td><td v-for="t in tiers" :key="t.label" class="c num">{{ (pr.base * pr.year * t.off / 10000).toFixed(1) }}</td></tr>
              </tbody>
            </table>

            <div class="sec-title mt16"><i></i>商品形态</div>
            <el-table :data="products" border size="small">
              <el-table-column prop="n" label="商品" width="130" />
              <el-table-column prop="d" label="说明" min-width="260" />
              <el-table-column label="状态" width="110"><template #default="{row}"><span class="dot" :class="row.s==='在售' ? 'ok' : row.s==='免费' ? 'info' : ''"></span>{{ row.s }}</template></el-table-column>
            </el-table>
          </div>

          <div>
            <div class="sec-title"><i></i>价格试算</div>
            <div class="calc">
              <el-form label-width="76px" size="default">
                <el-form-item label="名额数" style="margin-bottom:10px"><el-input-number v-model="calc.qty" :min="pr.minQty" :max="5000" :step="10" style="width:160px" /></el-form-item>
                <el-form-item label="付款周期" style="margin-bottom:6px"><el-radio-group v-model="calc.cycle"><el-radio-button value="月付">月付</el-radio-button><el-radio-button value="季付">季付</el-radio-button><el-radio-button value="年付">年付</el-radio-button></el-radio-group></el-form-item>
              </el-form>
              <div class="line"><span class="muted">目录金额（{{ calc.qty }} × {{ pr.base }} × {{ calcR.months }} 个月）</span><span class="num">{{ $fmt(calcR.list) }} 元</span></div>
              <div class="line"><span class="muted">周期折扣</span><span>{{ offText(calcR.cOff) }}</span></div>
              <div class="line"><span class="muted">数量阶梯（{{ calcR.tier.label }}）</span><span>{{ offText(calcR.tier.off) }}</span></div>
              <div class="line sum"><span>应付金额</span><span class="price-big num" style="font-size:20px">{{ $fmt(calcR.amount) }} 元</span></div>

      doRefund(pass) {
        const r = this.rf.r, o = this.orders.find((x) => x.no === r.no), t = nowStr();
        if (!pass && !this.rf.note.trim()) return warn('驳回时请填写审核意见');
        if (pass) { r.st = '已通过，待打款'; o.logs.unshift([t, '退款审核通过（' + this.me + '），退款 ' + STP.fmt(r.refund) + ' 元']); }
        else { r.st = '已驳回'; o.st = r.eff ? '生效中' : '已支付待生效'; o.logs.unshift([t, '退款申请被驳回（' + this.me + '）：' + this.rf.note]); }
        this.rf.show = false;
        this.$demo(pass ? '退款审核通过' : '已驳回退款申请');
      },
      issue(row) { row.st = '已开具'; row.invNo = '2611200000005' + String(M.hash(row.id) % 10000000).padStart(7, '0'); this.$demo('发票已开具，已通知购买主体下载'); },
      getP(k) { return k.indexOf('tier:') === 0 ? this.tiers[+k.slice(5)].off : this.pr[k]; },
      unitOf(k) { return k === 'base' ? '元/名额·月' : k === 'minQty' ? '个名额' : k === 'hist' ? '个月' : '%（85 即 85 折）'; },
      pText(k, v) { return k === 'base' ? v + ' 元/名额·月' : k === 'minQty' ? v + ' 个名额' : k === 'hist' ? v + ' 个月' : this.offText(v); },
      openPrice() { this.pd = { show: true, k: 'base', v: this.pr.base, eff: '2026-12-01', reason: '' }; },
      nextId() { return 'PRC-20261124-0' + (this.pp.concat(this.ph).filter((x) => x.id.indexOf('20261124') > 0).length + 1); },
      submitPrice() {
        const d = this.pd, cur = this.getP(d.k);
        if (d.v === cur || d.v == null) return warn('新值与当前值相同，无需提交');
        if (!d.reason.trim()) return warn('请填写变更原因');
        if (d.k === 'minQty' && d.v < this.$PV.nMin) return warn('最小购买量不得低于最小数据池规模（' + this.$PV.nMin + ' 家）');
        if (d.eff <= M.TODAY) return warn('生效日期须晚于今天');
        this.pp.unshift({ id: this.nextId(), kind: 'param', title: this.priceOpts.find((o) => o.k === d.k).n, from: this.pText(d.k, cur), to: this.pText(d.k, d.v), reason: d.reason, eff: d.eff, by: this.me, t: nowStr(), payload: { k: d.k, v: d.v } });
        d.show = false; this.$demo('已提交，等待另一位平台人员复核');
      },
      openCc() { this.cc.show = true; this.cc.reason = ''; },
      submitCc() {
        const c = this.cc;
        if (!c.reason.trim()) return warn('请填写原因');
        if (c.kind === '折扣码' && !c.code.trim()) return warn('请填写折扣码');
        const payload = c.kind === '合同价' ? { kind: '合同价', target: c.target, rule: '按 ' + c.price + ' 元/名额·月', exp: c.exp } : { kind: '折扣码', target: c.code, rule: this.offText(c.off) + '，已用 0 / ' + c.limit + ' 次', exp: c.exp };
        this.pp.unshift({ id: this.nextId(), kind: 'deal', title: '新增' + c.kind + (c.kind === '合同价' ? '：' + c.target : ' ' + c.code), from: '', to: payload.rule + '，有效期至 ' + c.exp, reason: c.reason, eff: STP.addDays(M.TODAY, 1), by: this.me, t: nowStr(), payload });
        c.show = false; this.$demo('已提交，等待另一位平台人员复核');
      },
      ppDone(row, st) {
        const done = (extra) => {
          this.pp = this.pp.filter((x) => x !== row);
          this.ph.unshift(Object.assign({}, row, { st, rv: st === '已撤回' ? '' : this.me, rvT: st === '已撤回' ? '' : nowStr() }, extra));
        };
        if (st === '已撤回') { done(); return this.$demo('已撤回申请'); }
        if (row.by === this.me) return this.$info('提交人不能复核自己的申请');
        if (st === '已驳回') {
          return ElementPlus.ElMessageBox.prompt('请填写驳回意见', '驳回定价变更', { confirmButtonText: '确认驳回', cancelButtonText: '取消', inputValidator: (v) => !!(v && v.trim()) || '请填写驳回意见' })
            .then(({ value }) => { done({ reason: row.reason + '（驳回意见：' + value + '）' }); this.$demo('已驳回，定价保持不变'); }).catch(() => {});
        }
        ElementPlus.ElMessageBox.confirm('确认通过“' + row.title + '”？将于 ' + row.eff + ' 起对新订单生效。', '复核定价变更', { type: 'warning', confirmButtonText: '确认通过', cancelButtonText: '取消' }).then(() => {
          if (row.kind === 'param') { const k = row.payload.k; if (k.indexOf('tier:') === 0) this.tiers[+k.slice(5)].off = row.payload.v; else this.pr[k] = row.payload.v; } else this.deals.push(row.payload);
          done(); this.$demo('复核通过，定价变更已生效并写入变更历史');
        }).catch(() => {});
      },
    },
  });
})();
</script>
