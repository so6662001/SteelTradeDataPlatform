<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接口文档中心 · 下游钢贸端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.doc-wrap { display: grid; grid-template-columns: 256px minmax(0, 1fr); gap: 14px; align-items: start; }
.doc-nav { position: sticky; top: 72px; padding: 10px 0; margin-bottom: 0; max-height: calc(100vh - 90px); overflow-y: auto; }
.doc-nav .g { padding: 10px 16px 4px; font-size: 12px; color: var(--stp-sub); font-weight: 600; letter-spacing: .5px; }
.doc-nav a { display: flex; align-items: center; gap: 6px; padding: 7px 16px; font-size: 13px; color: #3d4b5c; text-decoration: none !important; border-left: 3px solid transparent; cursor: pointer; }
.doc-nav a:hover { background: #f6f8fa; }
.doc-nav a.on { background: var(--el-color-primary-light-9); color: var(--el-color-primary); border-left-color: var(--el-color-primary); font-weight: 500; }
.doc-nav .m { font-size: 10px; font-weight: 700; width: 34px; flex-shrink: 0; font-family: Consolas, Menlo, monospace; }
.doc-nav .m.GET { color: #18a058; } .doc-nav .m.POST { color: #2b6fd6; }
.doc-nav .p { font-family: Consolas, Menlo, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-nav .new { margin-left: auto; font-size: 10px; color: #d46b08; background: #fff3e6; border-radius: 3px; padding: 0 4px; line-height: 16px; flex-shrink: 0; }
.doc-body { margin-bottom: 0; padding: 20px 24px 26px; min-height: 640px; }
.doc-body h2 { margin: 0 0 8px; font-size: 19px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.doc-body h3 { margin: 22px 0 10px; font-size: 15px; padding-left: 9px; border-left: 3px solid var(--el-color-primary); line-height: 1.2; }
.doc-body p { margin: 0 0 10px; line-height: 1.8; font-size: 13.5px; color: #3d4b5c; }
.doc-body ul { margin: 0 0 10px; padding-left: 20px; line-height: 1.9; font-size: 13.5px; color: #3d4b5c; }
.doc-body .plain-table td { line-height: 1.6; vertical-align: top; }
.doc-body .plain-table td.f { font-family: Consolas, Menlo, monospace; font-size: 12.5px; white-space: nowrap; color: #2b5d9b; }
.doc-body .path { font-family: Consolas, Menlo, monospace; font-size: 16px; }
.method { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 13px; font-weight: 700; color: #fff; font-family: Consolas, Menlo, monospace; }
.method.GET { background: #18a058; } .method.POST { background: #2b6fd6; }
.req-y { color: #e5484d; font-weight: 600; } .req-n { color: var(--stp-sub); } .req-c { color: #d48806; font-weight: 600; }
.doc-foot { display: flex; justify-content: space-between; margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--stp-border); font-size: 13px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="downstream" active="api-docs" title="接口文档中心"
  desc="面向 ERP 开发人员的开放接口文档：通用约定、鉴权签名、各接口字段、错误码与示例代码。接口只设业务必需的字段，客户名称、成本、毛利等一律不采集。">
  <template #actions>
    <el-tag effect="plain">当前版本 v1.1</el-tag>
    <el-button @click="$demo('离线文档（PDF）已开始下载')"><el-icon><Download /></el-icon>下载离线文档</el-button>
    <el-button type="primary" @click="$go('api-access.html')"><el-icon><Promotion /></el-icon>去沙箱在线调试</el-button>
  </template>

  <div class="doc-wrap">
    <div class="card doc-nav">
      <template v-for="g in nav" :key="g.g">
        <div class="g">{{ g.g }}</div>
        <a v-for="n in g.items" :key="n.k" :class="{on: cur===n.k}" @click="go(n.k)">
          <template v-if="n.m"><span class="m" :class="n.m">{{ n.m }}</span><span class="p">{{ n.short }}</span></template>
          <template v-else>{{ n.t }}</template>
          <span v-if="n.isNew" class="new">v1.1</span>
        </a>
      </template>
    </div>

    <div class="card doc-body">
      <!-- 概述 -->
      <template v-if="cur==='overview'">
        <h2>概述与通用约定</h2>
        <p>下游钢贸企业的 ERP 通过本组接口上传销售与库存数据。平台对上游钢厂只提供聚合结果，不提供任何单家企业的数据。接入流程：创建应用 → 沙箱联调 → 拉取生效规则并在 ERP 端源头过滤 → 每日上传 → 对账申报。</p>
        <h3>环境与地址</h3>
        <table class="plain-table">
          <thead><tr><th style="width:120px">环境</th><th>地址</th><th>说明</th></tr></thead>
          <tbody>
            <tr><td>正式环境</td><td class="f">https://openapi.huodaizi-data.example/openapi/v1</td><td>数据经规则过滤与质量校验后入库</td></tr>
            <tr><td>沙箱环境</td><td class="f">https://sandbox-openapi.huodaizi-data.example/openapi/v1</td><td>地址与密钥独立，数据不进入正式库</td></tr>
          </tbody>
        </table>
        <h3>通用约定</h3>
        <table class="plain-table">
          <thead><tr><th style="width:120px">项</th><th>约定</th></tr></thead>
          <tbody><tr v-for="r in conventions" :key="r[0]"><td>{{ r[0] }}</td><td>{{ r[1] }}</td></tr></tbody>
        </table>
        <h3>两种上传粒度</h3>
        <p>销售数据支持<b>行级模式</b>（<span class="code">POST /sales/batch</span>）与<b>日汇总模式</b>（<span class="code">POST /sales/daily-summary</span>），由企业按“企业 + 来源系统”选择。ERP 可通过 <span class="code">GET /settings</span> 查询当前来源系统的粒度。</p>
        <div class="tip-box orange mb12"><b>同一来源系统、同一业务日期只接受一种粒度的销售数据。</b>与当前设置不符的另一种粒度会被拒收，返回 3004“上传粒度与当前设置不符”。粒度切换按业务日期生效，生效日之前的数据保持原粒度。</div>
        <table class="plain-table">
          <thead><tr><th style="width:150px">方面</th><th>行级模式</th><th>日汇总模式</th></tr></thead>
          <tbody><tr v-for="r in grainDiff" :key="r[0]"><td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td></tr></tbody>
        </table>
        <h3>字段最小化</h3>
        <div class="tip-box red"><b>禁止字段：</b>客户名称、客户联系方式、业务员姓名、成本价、毛利、报价（未成交价格）。接口收到禁止字段和未定义字段<b>一律丢弃且不落盘</b>，并在批次结果中提示。企业未开启价格上传时，价格与金额字段按同样方式处理。</div>
      </template>

      <!-- 鉴权与签名 -->
      <template v-else-if="cur==='auth'">
        <h2>鉴权与签名</h2>
        <p>每个请求都需要携带应用标识与签名。密钥只保存在 ERP 端，不随请求发送；平台用同一算法重算签名并比对。</p>
        <h3>请求头</h3>
        <table class="plain-table">
          <thead><tr><th style="width:170px">请求头</th><th style="width:70px">必填</th><th>说明</th></tr></thead>
          <tbody><tr v-for="h in headers" :key="h.n"><td class="f">{{ h.n }}</td><td :class="h.req==='是' ? 'req-y' : 'req-c'">{{ h.req }}</td><td>{{ h.d }}</td></tr></tbody>
        </table>
        <h3>签名算法</h3>
        <ul>
          <li>请求体摘要 = SHA-256(请求体原始字节)，十六进制小写；GET 请求按空串计算。</li>
          <li>签名串 = 请求方法 + 换行 + 路径（含 <span class="code">/openapi/v1</span> 前缀与查询串） + 换行 + 时间戳 + 换行 + 随机串 + 换行 + 请求体摘要。</li>
          <li>X-Signature = HMAC-SHA256(密钥, 签名串)，十六进制小写。</li>
        </ul>
        <pre class="codeblock">{{ signSample }}</pre>
        <h3>防重放与幂等</h3>
        <ul>
          <li>时间戳与平台时间偏差超过 5 分钟拒绝（1003）；随机串在有效期内不可重复（1004）。</li>
          <li>批量接口带 <span class="code">X-Idempotency-Key</span>（批次号），同一批次号重复提交返回首次结果，不会重复入库。</li>
          <li>已开启 IP 白名单时，非白名单来源返回 1005。</li>
        </ul>
        <div class="tip-box blue">签名对不上时，可用“ERP 接口接入”页面的 <a href="api-access.html">签名校验工具</a> 逐行比对签名串。Java 与 .NET 的完整示例见 <a href="javascript:;" @click="go('code')">示例代码</a>。</div>
      </template>

      <!-- 接口 -->
      <template v-else-if="api">
        <h2><span class="method" :class="api.m">{{ api.m }}</span><span class="path">{{ api.path }}</span><el-tag v-if="api.isNew" type="warning" size="small" effect="plain">v1.1 新增</el-tag><el-tag v-if="api.changed" type="warning" size="small" effect="plain">v1.1 有变更</el-tag></h2>
        <p><b>{{ api.t }}</b>　{{ api.desc }}</p>
        <div v-for="(n, i) in api.notes" :key="i" class="tip-box mb12" :class="n[0]">{{ n[1] }}</div>

        <h3>请求头</h3>
        <table class="plain-table">
          <thead><tr><th style="width:170px">请求头</th><th style="width:70px">必填</th><th>说明</th></tr></thead>
          <tbody><tr v-for="h in apiHeaders" :key="h.n"><td class="f">{{ h.n }}</td><td class="req-y">是</td><td>{{ h.d }}</td></tr></tbody>
        </table>

        <template v-for="g in api.groups" :key="g.title">
          <h3>{{ g.title }}</h3>
          <p v-if="g.note">{{ g.note }}</p>
          <table class="plain-table">
            <thead><tr><th style="width:250px">名称</th><th style="width:70px">必填</th><th>说明</th></tr></thead>
            <tbody><tr v-for="f in g.fields" :key="f[0]"><td class="f">{{ f[0] }}</td><td :class="f[1]==='是' ? 'req-y' : f[1]==='否' ? 'req-n' : 'req-c'">{{ f[1] }}</td><td>{{ f[2] }}</td></tr></tbody>
          </table>
        </template>

        <template v-if="api.k==='sales' || api.k==='daily'">
          <div class="tip-box red mt12"><b>禁止字段：</b>客户名称、客户联系方式、业务员姓名、成本价、毛利、报价（未成交价格）。收到即丢弃，<b>不落盘</b>，并在批次结果中提示。</div>
          <div class="tip-box orange mt8"><b>价格与金额字段全部选填。</b>仅在企业已开启价格上传、且该行在企业设定的上传范围内时接收；否则丢弃不落盘，并在批次结果中给出 PRICE_DROPPED 提示，销量照常入库。当前企业的价格上传状态：<b>{{ $state.dnPrice==='on' ? '已开启' : '未开启（默认）' }}</b>，可在 <a href="upload-settings.html">上传设置</a> 查看。</div>
        </template>
        <template v-if="api.k==='daily'">
          <h3>与行级接口的差异</h3>
          <table class="plain-table">
            <thead><tr><th style="width:150px">方面</th><th>行级模式</th><th>日汇总模式</th></tr></thead>
            <tbody><tr v-for="r in grainDiff" :key="r[0]"><td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td></tr></tbody>
          </table>
        </template>

        <h3>示例请求</h3>
        <pre class="codeblock">{{ api.req }}</pre>
        <h3>示例返回</h3>
        <pre class="codeblock">{{ api.res }}</pre>
        <p v-if="api.resNote" class="small muted mt8">{{ api.resNote }}</p>

        <h3>常见错误码</h3>
        <table class="plain-table">
          <thead><tr><th style="width:90px">错误码</th><th style="width:100px">HTTP 状态</th><th>含义</th><th>处理建议</th></tr></thead>
          <tbody><tr v-for="c in api.errs" :key="c"><td class="f">{{ c }}</td><td>{{ errMap[c].http }}</td><td>{{ errMap[c].t }}</td><td>{{ errMap[c].fix }}</td></tr></tbody>
        </table>
      </template>

      <!-- 字段字典 -->
      <template v-else-if="cur==='fields'">
        <h2>字段字典</h2>
        <p>各接口共用的字段含义与枚举取值。品类、材质、钢厂、地区等标准字典通过 <span class="code">GET /dicts/{{ '{' }}type{{ '}' }}</span> 同步；ERP 上传原文即可，由平台映射为标准值，映射结果可在“已上传数据自查”中与原始值并列查看。</p>
        <h3>禁止字段</h3>
        <div class="tip-box red">客户名称、客户联系方式、业务员姓名、成本价、毛利、报价（未成交价格）。接口不设这些字段；ERP 如果传了，以及任何未定义字段，平台<b>收到即丢弃、不落盘</b>，并在批次结果中提示。</div>
        <h3>统计维度字段（specAttrs）<el-tag size="small" type="warning" effect="plain" style="margin-left:6px">v1.2 计划</el-tag></h3>
        <p>销量和库存按品类使用不同的统计维度。三个上传接口的 <span class="code">specAttrs</span> 按品名所属模板条件必填；键名为建议，联调前定稿。“必备”的判定：结构化字段已传，或平台能从规格原文 <span class="code">spec</span> 解析得到，满足其一即可。</p>
        <table class="plain-table">
          <thead><tr><th style="width:90px">模板</th><th style="width:150px">统计维度</th><th style="width:300px">必备的键</th><th>示例</th></tr></thead>
          <tbody><tr v-for="f in dimFields" :key="f[0]"><td><b>{{ f[0] }}</b></td><td>{{ f[1] }}</td><td class="f">{{ f[2] }}</td><td class="f" style="font-size:12px">{{ f[3] }}</td></tr></tbody>
        </table>
        <div class="tip-box small mt8">第一维度（规格、厚度、型号）缺失且无法解析：该行为 PENDING_MAPPING，原因码 DIM_REQUIRED_MISSING，补齐后回补。第二维度（壁厚、宽度、公斤数或负差率）缺失：该行仍为 ACCEPTED，带提示 DIM_UNBANDED，在第二维度上归入“未分段”，只能参与更粗层级的聚合。型材的第二维度按品名固定：每个品名用公斤段还是负差段由平台在品类主数据里配置，通过 <span class="code">GET /dicts/dimension-templates</span> 下发（字段 <span class="code">secondDim</span>）。只传了另一种时，平台按理论重量表换算成该品名配置的那一种并提示 DIM_CONVERTED；换算不了的按第二维度缺失处理，归入“未分段”。两项可以都传，以配置的那一项为准；品名尚未映射时两项至少传一项，映射后再按配置校验。ERP 归段后上传的，只能按配置的那一种分段归段。</div>
        <h3>计量字段<el-tag size="small" type="warning" effect="plain" style="margin-left:6px">v1.2 计划</el-tag></h3>
        <table class="plain-table">
          <thead><tr><th style="width:130px">计量类型</th><th>行级销售、库存快照</th><th>销售日汇总</th></tr></thead>
          <tbody>
            <tr><td>吨位（钢材）</td><td><span class="f">weight</span> 必填；<span class="f">quantity</span>、<span class="f">quantityUnit</span> 选填</td><td><span class="f">netWeight</span> 必填</td></tr>
            <tr><td>数量（非钢材）</td><td><span class="f">quantity</span>、<span class="f">quantityUnit</span> 必填；<span class="f">weight</span> 选填，不参与吨位聚合</td><td><span class="f">netQuantity</span>、<span class="f">quantityUnit</span> 必填；可分列 <span class="f">outQuantity</span>、<span class="f">returnQuantity</span></td></tr>
          </tbody>
        </table>
        <div class="tip-box small mt8">计量类型由品名映射后的主数据决定，不由上传方选择。品名尚未映射时，重量与数量至少传一项，映射后再校验。数量单位须与该品名的标准数量单位一致，或属于平台维护了固定换算关系的单位，否则拒收（UNIT_MISMATCH）。吨位和数量是两个独立的度量，平台不互相换算、不合并相加。非钢材暂不接收价格和金额字段，收到按 PRICE_DROPPED 处理。</div>
        <h3>价格与金额字段</h3>
        <p>全部选填。<b>仅在企业开启价格上传且该行在其设定范围内时接收</b>；只采集销售成交的单价与金额，不采集成本、毛利、库存金额、报价。库存快照不设任何价格、金额字段。</p>
        <table class="plain-table">
          <thead><tr><th style="width:150px">字段</th><th style="width:150px">适用接口</th><th>说明</th></tr></thead>
          <tbody><tr v-for="f in priceFields" :key="f[0]"><td class="f">{{ f[0] }}</td><td>{{ f[1] }}</td><td>{{ f[2] }}</td></tr></tbody>
        </table>
        <h3>枚举取值</h3>
        <table class="plain-table">
          <thead><tr><th style="width:150px">字段</th><th>取值</th></tr></thead>
          <tbody><tr v-for="f in enums" :key="f[0]"><td class="f">{{ f[0] }}</td><td>{{ f[1] }}</td></tr></tbody>
        </table>
        <h3>格式约定</h3>
        <table class="plain-table">
          <thead><tr><th style="width:150px">类型</th><th>约定</th></tr></thead>
          <tbody>
            <tr><td>日期与时间</td><td>日期用 yyyy-MM-dd；时间用 ISO 8601 带时区，如 2026-11-23T16:42:10+08:00</td></tr>
            <tr><td>重量</td><td>单位吨，最多 3 位小数</td></tr>
            <tr><td>数量</td><td>整数或最多 3 位小数；必须同时传 quantityUnit</td></tr>
            <tr><td>维度数值</td><td>直径、厚度、宽度、壁厚、外径、边长单位毫米；公斤数单位千克并注明口径（每米或单支）；负差率为百分数，如 4.5 表示 4.5%</td></tr>
            <tr><td>价格与金额</td><td>单价单位元/吨，金额单位元，最多 2 位小数</td></tr>
            <tr><td>行政区划代码</td><td>6 位国家标准代码，到地级市，如 320500（苏州市）</td></tr>
            <tr><td>单据号</td><td>仅用于幂等与自查，可传脱敏后的值，只要稳定唯一</td></tr>
          </tbody>
        </table>
      </template>

      <!-- 错误码 -->
      <template v-else-if="cur==='errors'">
        <h2>错误码</h2>
        <p>统一返回结构：<span class="code">code</span>、<span class="code">message</span>、<span class="code">requestId</span>、<span class="code">data</span>。接入校验（签名、时间戳、格式、批量大小、必填项）不通过时整批拒绝并返回错误码；通过后返回 202 与批次号，逐行结果通过批次查询接口获取。</p>
        <h3>接口级错误码</h3>
        <table class="plain-table">
          <thead><tr><th style="width:80px">错误码</th><th style="width:120px">类别</th><th style="width:90px">HTTP 状态</th><th>含义</th><th>处理建议</th></tr></thead>
          <tbody><tr v-for="c in errList" :key="c.code"><td class="f">{{ c.code }}</td><td>{{ c.cat }}</td><td>{{ c.http }}</td><td>{{ c.t }}<el-tag v-if="c.isNew" size="small" type="warning" effect="plain" style="margin-left:6px">v1.1</el-tag></td><td>{{ c.fix }}</td></tr></tbody>
        </table>
        <h3>逐行结果状态</h3>
        <table class="plain-table">
          <thead><tr><th style="width:170px">状态</th><th style="width:130px">含义</th><th>说明</th></tr></thead>

  const JAVA = String.raw`import javax.crypto.Mac;
import javax.crypto.spec.SecretKeySpec;
import java.net.URI;
import java.net.http.HttpClient;
import java.net.http.HttpRequest;
import java.net.http.HttpResponse;
import java.nio.charset.StandardCharsets;
import java.security.MessageDigest;
import java.util.UUID;

public class StpOpenApiDemo {
    static final String BASE = "https://sandbox-openapi.huodaizi-data.example";
    static final String APP_KEY = System.getenv("STP_APP_KEY");
    static final String APP_SECRET = System.getenv("STP_APP_SECRET");

    static String hex(byte[] bytes) {
        StringBuilder sb = new StringBuilder();
        for (byte b : bytes) sb.append(String.format("%02x", b));
        return sb.toString();
    }

    static String sha256Hex(String s) throws Exception {
        MessageDigest md = MessageDigest.getInstance("SHA-256");
        return hex(md.digest(s.getBytes(StandardCharsets.UTF_8)));
    }

    static String hmacSha256Hex(String secret, String data) throws Exception {
        Mac mac = Mac.getInstance("HmacSHA256");
        mac.init(new SecretKeySpec(secret.getBytes(StandardCharsets.UTF_8), "HmacSHA256"));
        return hex(mac.doFinal(data.getBytes(StandardCharsets.UTF_8)));
    }

    public static void main(String[] args) throws Exception {
        String method = "POST";
        String path = "/openapi/v1/sales/batch";
        String body = "{\"items\":[]}";   // 示意：items 中为明细行。先序列化，再用同一个字符串签名并发送
        String timestamp = String.valueOf(System.currentTimeMillis());
        String nonce = UUID.randomUUID().toString().replace("-", "");
        String batchNo = "B-HQ-20261123-001";

        // 签名串 = 方法 + \n + 路径 + \n + 时间戳 + \n + 随机串 + \n + 请求体摘要
        String stringToSign = String.join("\n", method, path, timestamp, nonce, sha256Hex(body));
        String signature = hmacSha256Hex(APP_SECRET, stringToSign);

        HttpRequest request = HttpRequest.newBuilder(URI.create(BASE + path))
                .header("Content-Type", "application/json; charset=utf-8")
                .header("X-App-Key", APP_KEY)
                .header("X-Timestamp", timestamp)
                .header("X-Nonce", nonce)
                .header("X-Signature", signature)
                .header("X-Idempotency-Key", batchNo)
                .POST(HttpRequest.BodyPublishers.ofString(body, StandardCharsets.UTF_8))
                .build();

        HttpResponse<String> response = HttpClient.newHttpClient()
                .send(request, HttpResponse.BodyHandlers.ofString(StandardCharsets.UTF_8));
        // 202：已受理，随后用 GET /openapi/v1/batches/{batchId} 查询逐行结果
        // 429：按响应头 Retry-After 等待后重试；5xxx：指数退避重试
        System.out.println(response.statusCode() + " " + response.body());
    }
}`;

    static string Hex(byte[] bytes) => BitConverter.ToString(bytes).Replace("-", "").ToLowerInvariant();

    static string Sha256Hex(string s)
    {
        using var sha = SHA256.Create();
        return Hex(sha.ComputeHash(Encoding.UTF8.GetBytes(s)));
    }

    static string HmacSha256Hex(string secret, string data)
    {
        using var hmac = new HMACSHA256(Encoding.UTF8.GetBytes(secret));
        return Hex(hmac.ComputeHash(Encoding.UTF8.GetBytes(data)));
    }

    public static async Task Main()
    {
        var method = "POST";
        var path = "/openapi/v1/sales/batch";
        var body = "{\"items\":[]}";   // 示意：items 中为明细行。先序列化，再用同一个字符串签名并发送
        var timestamp = DateTimeOffset.UtcNow.ToUnixTimeMilliseconds().ToString();
        var nonce = Guid.NewGuid().ToString("N");
        var batchNo = "B-HQ-20261123-001";

        // 签名串 = 方法 + \n + 路径 + \n + 时间戳 + \n + 随机串 + \n + 请求体摘要
        var stringToSign = string.Join("\n", method, path, timestamp, nonce, Sha256Hex(body));
        var signature = HmacSha256Hex(AppSecret, stringToSign);

        using var client = new HttpClient();
        using var request = new HttpRequestMessage(HttpMethod.Post, Base + path);
        request.Content = new StringContent(body, Encoding.UTF8, "application/json");
        request.Headers.Add("X-App-Key", AppKey);
        request.Headers.Add("X-Timestamp", timestamp);
        request.Headers.Add("X-Nonce", nonce);
        request.Headers.Add("X-Signature", signature);
        request.Headers.Add("X-Idempotency-Key", batchNo);

        var response = await client.SendAsync(request);
        // 202：已受理，随后用 GET /openapi/v1/batches/{batchId} 查询逐行结果
        // 429：按响应头 Retry-After 等待后重试；5xxx：指数退避重试
        Console.WriteLine((int)response.StatusCode + " " + await response.Content.ReadAsStringAsync());
    }
}`;
