<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP 接口接入 · 下游钢贸端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.env-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.env-bar .addr { font-size: 13px; }
.mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; }
.mono-input textarea, .mono-input input { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; line-height: 1.6; }
.secret-box { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px dashed #f0a020; border-radius: 6px; background: #fffaf0; }
.secret-box .mono { font-size: 13px; word-break: break-all; flex: 1; color: #1f2d3d; }
.resp-head { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font-size: 13px; }
.hdr-table td, .hdr-table th { padding: 5px 8px !important; font-size: 12px; }
.res-stat { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.res-stat > div { border: 1px solid var(--stp-border); border-radius: 6px; padding: 8px; background: #fafbfc; min-width: 0; }
.res-stat .k { font-size: 11px; color: var(--stp-sub); }
.res-stat .k b { display: block; font-size: 10.5px; color: #4a5568; font-weight: 600; }
.res-stat .v { font-size: 20px; font-weight: 600; margin-top: 4px; }
.doc-card { display: flex; gap: 12px; align-items: flex-start; }
.doc-card .ic { width: 40px; height: 40px; border-radius: 8px; background: var(--el-color-primary-light-9); color: var(--el-color-primary); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.ip-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1px solid var(--stp-border); border-radius: 4px; min-height: 40px; background: #fafbfc; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="downstream" active="api-access" title="ERP 接口接入"
  desc="管理应用密钥与 IP 白名单，在沙箱环境完成联调，查看接口调用日志。本页面向接口对接员，只涉及接入技术信息，不展示销量、库存等业务数值。">
  <template #actions>
    <el-button @click="handDlg = true"><el-icon><UserFilled /></el-icon>转交给接口对接员</el-button>
    <el-button type="primary" @click="openCreate"><el-icon><Plus /></el-icon>创建应用</el-button>
  </template>

  <div class="card tight">
    <div class="env-bar">
      <el-radio-group v-model="env">
        <el-radio-button value="prod">正式环境</el-radio-button>
        <el-radio-button value="sandbox">沙箱环境</el-radio-button>
      </el-radio-group>
      <span class="addr">接口地址 <span class="code">{{ E.base }}</span></span>
      <el-button size="small" link type="primary" @click="copy(E.base)"><el-icon><CopyDocument /></el-icon>复制</el-button>
      <span class="muted small" style="margin-left:auto">TLS 1.2 及以上 · REST · JSON · UTF-8 · 当前接口版本 v1.1</span>
    </div>
    <div class="tip-box small mt8" :class="env==='sandbox' ? 'orange' : 'blue'">
      <template v-if="env==='sandbox'"><b>沙箱环境</b>：地址与密钥独立于正式环境，上传的数据<b>不进入正式库</b>、不参与任何聚合，可放心用任意样例数据调试。沙箱密钥不能调用正式地址。</template>
      <template v-else><b>正式环境</b>：上传的数据经规则过滤与质量校验后入库。正式环境与沙箱环境的地址、密钥相互独立；调试请切换到沙箱环境。</template>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>应用管理<small>{{ E.name }} · 一个应用对应一个来源系统，按来源系统区分幂等键</small></span>
      <span class="right"><el-button size="small" @click="openCreate"><el-icon><Plus /></el-icon>创建应用</el-button></span>
    </div>
    <el-table :data="apps[env]" border>
      <el-table-column label="应用 / 来源系统" min-width="180">
        <template #default="{row}"><b>{{ row.name }}</b><div class="small muted"><span class="code">{{ row.src }}</span> {{ row.srcName }} · {{ row.grain }}</div></template>
      </el-table-column>
      <el-table-column label="应用标识 AppKey" width="150"><template #default="{row}"><span class="mono">{{ row.appKey }}</span></template></el-table-column>
      <el-table-column min-width="190">
        <template #header>密钥 <el-tooltip content="密钥只在创建或轮换时完整展示一次，平台不保存明文，之后只显示掩码" placement="top"><el-icon style="vertical-align:-2px"><QuestionFilled /></el-icon></el-tooltip></template>
        <template #default="{row}">
          <span class="mono">{{ E.prefix }}••••••••{{ row.tail }}</span>
          <div class="small muted">到期 {{ row.expire }}<el-tag v-if="row.rotating" size="small" type="warning" effect="plain" style="margin-left:6px">新旧并行至 {{ row.rotating }}</el-tag></div>
        </template>
      </el-table-column>
      <el-table-column label="状态" width="72" align="center"><template #default="{row}"><el-tag :type="row.status==='启用' ? 'success' : 'info'" size="small">{{ row.status }}</el-tag></template></el-table-column>
      <el-table-column label="IP 白名单" width="122"><template #default="{row}"><template v-if="row.ipOn"><span class="dot ok"></span>已开启 · {{ row.ips.length }} 个</template><template v-else><span class="dot"></span>未开启</template></template></el-table-column>
      <el-table-column label="限流" width="82" align="center"><template #default="{row}">{{ row.qps }} 次/秒</template></el-table-column>
      <el-table-column label="最近调用时间" width="156"><template #default="{row}"><span class="num">{{ row.last || '尚未调用' }}</span></template></el-table-column>
      <el-table-column label="操作" width="180">
        <template #default="{row}">
          <el-button link type="primary" size="small" :disabled="row.status!=='启用'" @click="openRotate(row)">轮换密钥</el-button>
          <el-button link type="primary" size="small" @click="openIp(row)">白名单</el-button>
          <el-button link :type="row.status==='启用' ? 'danger' : 'success'" size="small" @click="toggle(row)">{{ row.status==='启用' ? '停用' : '启用' }}</el-button>
        </template>
      </el-table-column>
    </el-table>
    <div class="tbl-foot"><span><el-icon style="vertical-align:-2px"><Lock /></el-icon> 密钥<b>只在创建或轮换时完整展示一次</b>，之后仅以掩码显示；遗失请轮换。轮换后新旧密钥并行 7 天（可配置），期间两个密钥都可用。</span><span>超限返回 429 并带 Retry-After；限流可联系平台按企业调整</span></div>
  </div>

  <div class="grid c-2-1">
    <div class="card">
      <div class="card-title"><span>联调状态清单<small>在沙箱环境逐项验证，全部通过后再切换到正式环境</small></span><span class="right small muted">已通过 {{ passCount }} / {{ needCount }} 项</span></div>
      <el-table :data="checks" border size="small">
        <el-table-column label="联调项" min-width="150"><template #default="{row}">{{ row.name }}</template></el-table-column>
        <el-table-column label="接口" min-width="210"><template #default="{row}"><span class="mono">{{ row.path }}</span></template></el-table-column>
        <el-table-column v-for="s in ['hq','wx']" :key="s" :label="s==='hq' ? 'SRC-HQ（行级模式）' : 'SRC-WX（日汇总模式）'" min-width="186">
          <template #default="{row}">
            <template v-if="row[s].st==='ok'"><span class="dot ok"></span>通过 <span class="muted small num">{{ row[s].at }}</span></template>
            <template v-else-if="row[s].st==='na'"><span class="muted">不适用（{{ row[s].why }}）</span></template>
            <template v-else><span class="dot warn"></span><b style="color:#d48806">未联调</b>　<a href="javascript:;" @click="toDebug(row, s)">去调试</a></template>
          </template>
        </el-table-column>
      </el-table>
      <div class="tip-box orange small mt12" v-if="needCount > passCount">“上传设置查询”在 SRC-HQ 上尚未联调。该接口返回来源系统当前的上传粒度与价格上传开关，ERP 端据此组织报文；切换粒度或开启价格上传前建议补齐，未联调不影响按当前设置的日常上传。</div>
      <div class="tip-box green small mt12" v-else>两个来源系统的联调项已全部通过。</div>
    </div>
    <div>
      <div class="card">
        <div class="doc-card">
          <div class="ic"><el-icon><Document /></el-icon></div>
          <div>
            <div class="card-title" style="margin-bottom:6px"><span>接口文档中心</span></div>
            <div class="small muted" style="line-height:1.7">在线文档、字段字典、错误码、变更日志，以及 Java 与 .NET 的签名示例代码。</div>
            <div class="row mt8"><el-button type="primary" size="small" @click="$go('api-docs.html')">打开接口文档<el-icon class="el-icon--right"><ArrowRight /></el-icon></el-button><span class="small muted">最近更新 v1.1（2026-09-15）</span></div>
          </div>
        </div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="card-title"><span>接入约定速查</span></div>
        <dl class="kv" style="grid-template-columns:86px 1fr">
          <dt>鉴权</dt><dd>应用标识 + 密钥，HMAC-SHA256 签名</dd>
          <dt>防重放</dt><dd>时间戳偏差超过 5 分钟拒绝；随机串有效期内不可重复</dd>
          <dt>幂等</dt><dd>批量接口带 <span class="code">X-Idempotency-Key</span>，重复提交返回首次结果</dd>
          <dt>批量限制</dt><dd>单次不超过 1,000 行且报文不超过 5 MB</dd>
          <dt>处理方式</dt><dd>接入校验通过后返回 202 和批次号，逐行结果用批次查询接口获取</dd>
          <dt>字段最小化</dt><dd>客户名称、业务员、成本、毛利等禁止字段收到即丢弃，不落盘</dd>
        </dl>
      </div>
    </div>
  </div>

  <div class="card" id="debug-card">
    <el-tabs v-model="tab">
      <el-tab-pane label="在线调试（沙箱）" name="debug">
        <div class="grid c2" style="margin-bottom:0">
          <div>
            <el-form label-width="76px" size="small">
              <el-form-item label="接口">
                <el-select v-model="dbg.api" style="width:100%" @change="resetDbg">
                  <el-option v-for="a in apis" :key="a.k" :label="a.m + ' ' + a.p + '　' + a.t" :value="a.k" />
                </el-select>
              </el-form-item>
              <el-form-item label="调用应用">
                <el-select v-model="dbg.app" style="width:100%">
                  <el-option v-for="a in apps.sandbox" :key="a.appKey" :label="a.name + '（' + a.src + ' · ' + a.grain + '）'" :value="a.src" />
                </el-select>
              </el-form-item>
            </el-form>
            <table class="plain-table hdr-table mb8">
              <tbody>
                <tr><th style="width:140px">请求地址</th><td class="mono">{{ curApi.m }} {{ envs.sandbox.base }}{{ curApi.p }}</td></tr>
                <tr><th>X-App-Key</th><td class="mono">{{ dbgApp.appKey }}</td></tr>
                <tr><th>X-Timestamp / X-Nonce</th><td class="mono">1795501800000 / 9f2c41d7a6b84e03</td></tr>
                <tr><th>X-Signature</th><td class="mono">由沙箱密钥自动计算</td></tr>
                <tr v-if="curApi.m==='POST'"><th>X-Idempotency-Key</th><td class="mono">{{ dbgBatch }}</td></tr>
              </tbody>
            </table>
            <template v-if="curApi.m==='POST'">
              <div class="small muted mb8">示例请求报文（可修改后发送）</div>
              <el-input v-model="dbg.body" type="textarea" :rows="14" class="mono-input" spellcheck="false" />
            </template>
            <div v-else class="tip-box small">该接口为 GET 请求，无请求体。</div>
            <div class="row mt12">
              <el-button type="primary" :loading="dbg.loading" @click="send"><el-icon><Promotion /></el-icon>发送请求</el-button>
              <el-button @click="resetDbg">恢复示例报文</el-button>
              <span class="small muted">沙箱数据不进入正式库</span>
            </div>
          </div>
          <div>
            <div class="resp-head">
              <b>返回结果</b>
              <template v-if="dbg.resp">
                <el-tag :type="dbg.resp.http < 300 ? 'success' : 'danger'" size="small">HTTP {{ dbg.resp.http }} {{ dbg.resp.http===202 ? 'Accepted' : dbg.resp.http===200 ? 'OK' : 'Conflict' }}</el-tag>
                <span class="muted small">耗时 {{ dbg.resp.ms }} ms</span>
              </template>
            </div>
            <pre v-if="dbg.resp" class="codeblock" style="min-height:220px">{{ dbg.resp.text }}</pre>
            <div v-else class="empty-block" style="border:1px dashed var(--stp-border);border-radius:6px"><div class="big"><el-icon><Promotion /></el-icon></div>点击“发送请求”查看沙箱返回</div>
            <div v-if="dbg.resp && dbg.resp.note" class="tip-box small mt12" :class="dbg.resp.http < 300 ? 'green' : 'red'">{{ dbg.resp.note }}</div>
            <div v-if="dbg.resp && dbg.resp.batchId" class="small mt8">下一步：用 <span class="code">GET /batches/{{ dbg.resp.batchId }}</span> 查询逐行处理结果。<a href="javascript:;" @click="dbg.api='batch'; resetDbg()">切换到批次结果查询</a></div>
          </div>
        </div>
      </el-tab-pane>

      <el-tab-pane label="签名校验工具" name="sign">
        <div class="grid c2" style="margin-bottom:0">
          <el-form label-width="96px" size="small">
            <el-form-item label="请求方法"><el-radio-group v-model="sg.method"><el-radio-button value="POST">POST</el-radio-button><el-radio-button value="GET">GET</el-radio-button></el-radio-group></el-form-item>
            <el-form-item label="请求路径"><el-input v-model="sg.path" class="mono-input" /></el-form-item>
            <el-form-item label="X-Timestamp"><el-input v-model="sg.ts" class="mono-input" /></el-form-item>
            <el-form-item label="X-Nonce"><el-input v-model="sg.nonce" class="mono-input" /></el-form-item>
            <el-form-item label="请求体"><el-input v-model="sg.body" type="textarea" :rows="4" class="mono-input" placeholder="GET 请求留空" /></el-form-item>
            <el-form-item label="密钥"><el-input v-model="sg.secret" class="mono-input" placeholder="建议只使用沙箱密钥" /><div class="small muted">只在浏览器本地计算，不会发送到平台。请不要在此粘贴正式环境密钥。</div></el-form-item>
            <el-form-item label="ERP 端签名"><el-input v-model="sg.mine" class="mono-input" placeholder="粘贴 ERP 端算出的 X-Signature，用于比对（可选）" /></el-form-item>
            <el-form-item><el-button type="primary" @click="calcSign">计算签名</el-button></el-form-item>
          </el-form>
          <div>
            <div class="small muted mb8">签名串 = 请求方法 + 换行 + 路径 + 换行 + 时间戳 + 换行 + 随机串 + 换行 + 请求体摘要（SHA-256，十六进制小写）</div>
            <pre class="codeblock">{{ sg.out ? sg.out.str : signPreview }}</pre>
            <template v-if="sg.out">
              <div class="small muted mt12 mb8">X-Signature = HMAC-SHA256(密钥, 签名串)，十六进制小写</div>
              <pre class="codeblock">{{ sg.out.sig }}</pre>
              <div v-if="sg.mine" class="tip-box small mt12" :class="sg.out.match ? 'green' : 'red'">
                <template v-if="sg.out.match"><b>一致</b>：ERP 端签名与平台算法结果相同。</template>
                <template v-else><b>不一致</b>：请逐项核对签名串的拼接顺序、换行符、请求体是否与实际发送的字节完全相同（空格、换行、字段顺序），以及时间戳是否为毫秒。</template>
              </div>
            </template>
            <div v-else class="tip-box small mt12">填写左侧各项后点击“计算签名”。把这里的签名串与 ERP 端日志中的签名串逐行比对，可以快速定位 1002 签名错误的原因。</div>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>

  <div class="card">
    <div class="card-title">
      <span>接口调用日志<small>{{ E.name }} · 保留近 30 天</small></span>
      <span class="right">
        <el-select v-model="logSrc" size="small" style="width:150px"><el-option label="全部来源系统" value="all" /><el-option label="SRC-HQ" value="SRC-HQ" /><el-option label="SRC-WX" value="SRC-WX" /></el-select>
        <el-select v-model="logRes" size="small" style="width:120px"><el-option label="全部结果" value="all" /><el-option label="成功" value="ok" /><el-option label="失败" value="fail" /></el-select>
        <el-button size="small" @click="$demo('日志已刷新')"><el-icon><Refresh /></el-icon>刷新</el-button>
      </span>
    </div>
    <el-table :data="logRows" border size="small">
      <el-table-column label="调用时间" width="150"><template #default="{row}"><span class="num">{{ row.time }}</span></template></el-table-column>
      <el-table-column label="来源系统" width="88"><template #default="{row}"><span class="code">{{ row.src }}</span></template></el-table-column>
      <el-table-column label="接口" min-width="186"><template #default="{row}"><span class="mono">{{ row.api }}</span></template></el-table-column>
      <el-table-column label="批次号" min-width="168">
        <template #default="{row}"><a v-if="row.batch && row.detail" href="javascript:;" class="mono" @click="openBatch(row)">{{ row.batch }}</a><span v-else-if="row.batch" class="mono">{{ row.batch }}</span><span v-else class="muted">—</span></template>
      </el-table-column>
      <el-table-column label="条数" width="64" align="right"><template #default="{row}"><span class="num">{{ row.count == null ? '—' : row.count }}</span></template></el-table-column>
      <el-table-column label="结果" min-width="230"><template #default="{row}"><span class="dot" :class="row.ok ? 'ok' : 'err'"></span>HTTP {{ row.http }} · {{ row.result }}</template></el-table-column>
      <el-table-column label="提示" width="130">
        <template #default="{row}">
          <el-tooltip v-if="row.detail && row.detail.price && $state.dnPrice==='off'" content="PRICE_DROPPED：价格字段未接收（开关关闭）。销量照常入库" placement="top"><el-tag size="small" type="warning" effect="plain">PRICE_DROPPED</el-tag></el-tooltip>
          <el-tooltip v-else-if="row.detail && row.detail.priceOut" :content="'PRICE_DROPPED：' + row.detail.priceOut + ' 条的价格字段超出企业设定的上传范围，未接收。销量照常入库'" placement="top"><el-tag size="small" type="info" effect="plain">PRICE_DROPPED</el-tag></el-tooltip>
          <span v-else class="muted">—</span>
        </template>
      </el-table-column>
      <el-table-column label="耗时" width="74" align="right"><template #default="{row}"><span class="num">{{ row.ms }} ms</span></template></el-table-column>
    </el-table>
    <div v-if="!logRows.length" class="empty-block">当前筛选条件下没有调用记录</div>
    <div class="tbl-foot"><span>共 {{ logRows.length }} 条 · 点击批次号查看逐行处理结果统计</span><span>日志只记录调用元数据与处理状态，不含吨位等业务数值</span></div>
  </div>

  <!-- 创建应用 -->
  <el-dialog v-model="createDlg" title="创建应用" width="540px">
    <el-form label-width="96px">
      <el-form-item label="所属环境"><el-tag :type="env==='prod' ? 'primary' : 'warning'">{{ E.name }}</el-tag></el-form-item>
      <el-form-item label="应用名称"><el-input v-model="nf.name" placeholder="例如：上海分公司 ERP 上传" maxlength="20" show-word-limit /></el-form-item>
      <el-form-item label="来源系统">
        <el-select v-model="nf.src" style="width:100%">
          <el-option label="SRC-HQ 总部 ERP（行级模式）" value="SRC-HQ" /><el-option label="SRC-WX 无锡分公司进销存（日汇总模式）" value="SRC-WX" /><el-option label="登记新的来源系统 SRC-SH 上海分公司 ERP" value="SRC-SH" />
        </el-select>
        <div class="small muted">新来源系统的上传粒度在“上传设置”中选择，默认行级模式。</div>
      </el-form-item>
      <el-form-item label="密钥有效期"><el-radio-group v-model="nf.term"><el-radio value="1 年">1 年</el-radio><el-radio value="2 年">2 年</el-radio></el-radio-group></el-form-item>
    </el-form>
