<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>已上传数据自查 · 下游钢贸端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.dc-filter .el-form-item { margin-bottom: 10px; margin-right: 16px; }
.dc-table .cell { padding: 0 8px; }
.raw-val { color: #5b6778; }
.raw-val .l1 { font-family: "SFMono-Regular", Consolas, Menlo, var(--el-font-family); color: #3d4b5c; }
.std-val .l1 { font-weight: 500; }
.l2 { font-size: 12px; color: var(--stp-sub); line-height: 18px; }
.band-tag { display: inline-block; padding: 0 5px; border-radius: 3px; font-size: 11px; line-height: 17px; background: #eef4fb; color: #2b5d9b; border: 1px solid #d5e4f5; margin-left: 4px; font-weight: 400; white-space: nowrap; }
.hd-raw { color: #6b7787; } .hd-std { color: #2b5d9b; }
.ops a { margin-right: 8px; white-space: nowrap; }
.ops a.danger { color: #e5484d; }
.reason { font-size: 12px; color: #c9383d; line-height: 17px; margin-top: 3px; }
.reason.warn { color: #b26a00; }
.map-table td, .map-table th { padding: 7px 10px; }
.map-table tr.grp td { background: #f6f8fa; font-weight: 600; }
.map-table tr.grp td small { font-weight: 400; color: var(--stp-sub); margin-left: 8px; }
.conf { display: inline-flex; align-items: center; gap: 6px; }
.conf i { display: inline-block; width: 46px; height: 6px; border-radius: 3px; background: #e8ecf1; overflow: hidden; }
.conf i u { display: block; height: 100%; background: #f0a020; }
.conf.hi i u { background: #18a058; } .conf.lo i u { background: #e5484d; }
.cmp-table td, .cmp-table th { padding: 6px 8px; font-size: 12.5px; }
.el-descriptions__label { white-space: nowrap; }
.demo-param { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="downstream" active="data-check" title="已上传数据自查"
  desc="逐条核对本企业上传到平台的数据，以及平台是怎样理解这些数据的：ERP 原始值与平台标准化后的值并列展示。这些明细只有本企业的授权成员能看到。">
  <template #actions>
    <el-tooltip placement="bottom" content="原型演示用：模拟本企业在“上传设置”中的价格上传开关（默认关闭）。关闭时本页不出现任何价格、金额列。">
      <span class="proto-switch">原型状态 · 价格上传
        <el-switch :model-value="price" size="small" @change="v => $setState('dnPrice', v ? 'on' : 'off')" />
        <b :style="{color: price ? '#18a058' : '#8a94a3'}">{{ price ? '已开启' : '未开启' }}</b>
      </span>
    </el-tooltip>
    <el-button @click="$go('daily-summary.html')"><el-icon><Calendar /></el-icon>每日上传汇总</el-button>
    <el-button type="primary" @click="exportDlg = true"><el-icon><Download /></el-icon>导出本企业数据</el-button>
  </template>

  <div class="status-line">
    <b>来源系统</b>
    <el-radio-group v-model="src" @change="onSrc">
      <el-radio-button value="HQ">SRC-HQ 总部 ERP · 行级模式</el-radio-button>
      <el-radio-button value="WX">SRC-WX 无锡分公司进销存 · 日汇总模式</el-radio-button>
    </el-radio-group>
    <span v-if="src==='HQ'"><span class="dot info"></span>当前粒度 <b>行级模式</b>：每条是一行单据，有单据号和行号，可单条作废</span>
    <span v-else><span class="dot ok"></span>当前粒度 <b>日汇总模式</b>（自 2026-10-01 起）：每条是一条汇总记录，没有单据号</span>
    <a href="upload-settings.html" style="margin-left:auto">上传设置 ›</a>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <!-- ================= 销售明细 ================= -->
      <el-tab-pane name="sales">
        <template #label>销售明细</template>
        <el-form inline class="dc-filter" label-width="70px">
          <el-form-item label="业务日期"><el-date-picker v-model="f.biz" type="daterange" value-format="YYYY-MM-DD" range-separator="至" start-placeholder="开始" end-placeholder="结束" style="width:236px" :clearable="false" /></el-form-item>
          <el-form-item label="上传日期"><el-date-picker v-model="f.up" type="daterange" value-format="YYYY-MM-DD" range-separator="至" start-placeholder="不限" end-placeholder="不限" style="width:236px" /></el-form-item>
          <el-form-item label="单据号">
            <el-input v-model="f.doc" :disabled="src==='WX'" :placeholder="src==='WX' ? '日汇总模式无单据号' : '支持模糊匹配'" clearable style="width:170px" />
          </el-form-item>
          <el-form-item label="仓库"><el-select v-model="f.wh" clearable placeholder="全部" style="width:150px"><el-option v-for="w in whOpts" :key="w" :label="w" :value="w" /></el-select></el-form-item>
          <el-form-item label="品名"><el-select v-model="f.product" clearable placeholder="全部" style="width:150px"><el-option v-for="p in ['螺纹钢','盘螺','高线','热轧卷板','热轧带钢','未映射']" :key="p" :label="p" :value="p" /></el-select></el-form-item>
          <el-form-item label="材质"><el-select v-model="f.mat" clearable placeholder="全部" style="width:150px"><el-option v-for="p in ['HRB400E','HRB500E','HPB300','Q195','Q235B','Q355B','SPHC']" :key="p" :label="p" :value="p" /></el-select></el-form-item>
          <el-form-item label="规格"><el-input v-model="f.spec" placeholder="如 20" clearable style="width:150px" /></el-form-item>
          <el-form-item label="品牌"><el-select v-model="f.mill" clearable placeholder="全部" style="width:150px"><el-option v-for="p in ['东岳钢铁','金江钢铁','海川特钢','云岭钢铁']" :key="p" :label="p" :value="p" /></el-select></el-form-item>
          <el-form-item label-width="0">
            <el-button type="primary" :loading="loading" @click="query"><el-icon><Search /></el-icon>查询</el-button>
            <el-button @click="reset">重置</el-button>
          </el-form-item>
        </el-form>

        <div class="row between mb12">
          <div class="row">
            <span class="small muted">状态</span>
            <el-radio-group v-model="f.status" size="small">
              <el-radio-button v-for="s in statusOpts" :key="s.k" :value="s.k">{{ s.t }} {{ s.n }}</el-radio-button>
            </el-radio-group>
            <el-tag v-if="f.batch" closable size="small" @close="f.batch = ''">批次 {{ f.batch }}</el-tag>
          </div>
          <div class="row">
            <template v-if="src==='HQ'">
              <span v-if="picked.length" class="small muted">已选 {{ picked.length }} 条</span>
              <el-button size="small" type="danger" plain :disabled="!picked.length" @click="openVoid(picked)">批量作废</el-button>
            </template>
            <el-tooltip v-else placement="top" content="日汇总模式按日整批替换，没有单条更新和单条作废">
              <el-button size="small" disabled>批量作废（不支持）</el-button>
            </el-tooltip>
          </div>
        </div>

        <div v-if="src==='WX'" class="tip-box orange small mb12">
          日汇总模式：一条记录代表“某业务日期 × 一组维度取值”的销售净量，<b>没有单据号</b>，下表展示汇总批次号与所含单据行数。<b>不支持单条作废</b>，如需更正，请在 ERP 端<b>重传当日完整批次</b>，平台整批替换。
        </div>

        <el-table ref="tbl" class="dc-table" :data="pageRows" border size="small" row-key="id" v-loading="loading" @selection-change="s => picked = s" :empty-text="emptyText">
          <el-table-column v-if="src==='HQ'" type="selection" width="38" :selectable="r => r.status==='已入库'" reserve-selection />
          <el-table-column :label="src==='HQ' ? '单据号 · 行号' : '汇总批次号'" :width="src==='HQ' ? 150 : 162">
            <template #default="{row}">
              <div class="num" v-if="src==='HQ'">{{ row.docNo }}<span class="muted"> · {{ row.lineNo }}</span></div>
              <div class="num" v-else>{{ row.sumBatch }}</div>
              <div class="l2"><span :style="{color: row.badDate ? '#c9383d' : ''}">{{ row.bizDate }}</span><template v-if="src==='HQ'"> · {{ row.docType }}</template><template v-else> · 含 {{ row.lines }} 行单据</template></div>
            </template>
          </el-table-column>
          <el-table-column min-width="198">
            <template #header><span class="hd-raw">原始上传值（ERP 原文）</span></template>
            <template #default="{row}">
              <div class="raw-val"><div class="l1">{{ row.raw.name }}</div><div class="l2">{{ row.raw.mat }} · {{ row.raw.spec }} · {{ row.raw.mill }} · {{ row.raw.wh }}</div></div>
            </template>
          </el-table-column>
          <el-table-column min-width="228">
            <template #header><span class="hd-std">平台标准化后的值</span></template>
            <template #default="{row}">
              <div class="std-val" v-if="row.std.product">
                <div class="l1">{{ row.std.product }} {{ row.std.mat }} {{ row.std.spec }}</div>
                <div class="l2">{{ row.std.mill }} · {{ row.std.wh }}（{{ row.std.city }}）</div>
                <div class="l2" style="margin-top:2px"><template v-for="d in dims(row)" :key="d.name"><span class="band-tag" :style="d.miss ? 'background:#fff8eb;color:#9a6400;border-color:#f3dfb8;margin-left:0;margin-right:4px' : 'margin-left:0;margin-right:4px'">{{ d.name }} {{ d.miss ? '缺失 · 未分段' : d.val + ' → ' + d.band }}</span></template></div>
              </div>
              <div class="std-val" v-else>
                <div class="l1" style="color:#b26a00">品名、规格尚未对应标准值</div>
                <div class="l2">{{ row.std.mill }} · {{ row.std.wh }}（{{ row.std.city }}）</div>
              </div>
            </template>
          </el-table-column>
          <el-table-column width="92" align="right">
            <template #header>{{ src==='HQ' ? '重量' : '净重' }} / 单位<el-tooltip placement="top" content="钢材按吨位，非钢材按数量。计量类型由品名映射后的主数据决定"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template>
            <template #default="{row}"><div class="num" :style="{color: row.weight < 0 ? '#18a058' : ''}">{{ $fmt(row.weight, 3) }} 吨</div><div class="l2">{{ row.mode }}</div></template>
          </el-table-column>
          <el-table-column label="流向地 / 客户类型" width="88">
            <template #default="{row}"><div><span v-if="row.dest">{{ row.dest }}</span><span v-else class="muted">未填报</span></div><div class="l2">{{ row.ctype || '未填报' }}</div></template>
          </el-table-column>
          <el-table-column v-if="price" label="单价 / 金额 / 价格口径" width="132" align="right">
            <template #default="{row}">
              <template v-if="row.price">
                <div class="num">{{ $fmt(row.price.unit) }} <span class="muted small">元/吨</span></div>
                <div class="num l2" style="color:#3d4b5c">{{ $fmt(row.price.amount, 2) }} 元</div>
                <div class="l2">{{ row.price.term }}<span v-if="row.price.q" style="color:#b26a00"> · 价格隔离</span></div>
              </template>
              <span v-else class="muted small">{{ row.std.product ? '范围外，未接收' : '映射后判定' }}</span>
            </template>
          </el-table-column>
          <el-table-column label="状态 / 失败原因" :width="price ? 132 : 156">
            <template #default="{row}">
              <el-tag size="small" :type="tagOf(row.status)" effect="light">{{ row.status }}</el-tag>
              <div v-if="row.reason" class="reason" :class="{warn: row.status!=='校验失败'}">{{ row.reason }}</div>
              <div v-if="price && row.price && row.price.q" class="reason warn">单价低于该品名合理区间，价格字段已隔离；销量照常入库</div>
            </template>
          </el-table-column>
          <el-table-column label="操作" :width="price ? 88 : 96">
            <template #default="{row}">
              <div class="ops">
                <a href="javascript:;" @click="openDetail(row)">详情</a>
                <template v-if="row.status==='隔离待确认'"><a href="javascript:;" @click="confirmTrue(row)">属实</a><a href="javascript:;" @click="openFix(row)">更正</a></template>
                <a v-else-if="row.status==='待映射'" href="javascript:;" @click="tab = 'map'">去映射</a>
                <a v-else-if="row.status==='已入库' && src==='HQ'" href="javascript:;" class="danger" @click="openVoid([row])">作废</a>
              </div>
            </template>
          </el-table-column>
        </el-table>
        <div class="tbl-foot">
          <span>共 <b>{{ filtered.length }}</b> 条，合计{{ src==='HQ' ? '重量' : '净重' }} <b class="num">{{ $fmt(sumWeight, 3) }}</b> 吨<template v-if="src==='WX'">，所含单据行数 <b>{{ sumLines }}</b> 行</template>。被规则过滤的数据不落盘，不在此列表中。</span>
          <el-pagination small background layout="prev, pager, next" :total="filtered.length" :page-size="pageSize" v-model:current-page="page" />
        </div>
      </el-tab-pane>

      <!-- ================= 维度与计量 ================= -->
      <el-tab-pane name="dim">
        <template #label>维度填报与非钢材</template>
        <div class="grid c2" style="margin-bottom:0">
          <div>
            <div class="card-title" style="margin-bottom:8px"><span>维度填报情况<small>近 30 日已入库数据 · 按品类统计维度模板</small></span></div>
            <table class="plain-table">
              <thead><tr><th>品类模板</th><th>必填维度</th><th class="r">直接上传</th><th class="r">由规格原文解析</th><th class="r">缺失</th><th>缺失时的处理</th></tr></thead>
              <tbody>
                <tr v-for="d in dimFill" :key="d.t + d.dim"><td><b>{{ d.t }}</b><div class="l2">{{ d.prods }}</div></td><td>{{ d.dim }}<span class="band-tag">{{ d.lv }}</span></td><td class="r num">{{ d.direct }}%</td><td class="r num">{{ d.parsed }}%</td><td class="r num" :style="{color: d.miss >= 5 ? '#d48806' : ''}">{{ d.miss }}%</td><td class="small muted">{{ d.note }}</td></tr>
              </tbody>
            </table>
            <div class="tip-box orange small mt12"><b>宽度缺失 6.4%，这些数据只能参与更粗层级的聚合。</b>缺少第二维度的行照常入库（提示 DIM_UNBANDED），在该维度上归入“未分段”；钢厂按“厚度段 × 宽度段”查看时，它们只出现在“未分段”或上卷后的厚度段里。主要来自 SRC-WX 的热轧带钢（ERP 物料只有厚度）。可在 ERP 端补传 <span class="code">specAttrs.width</span>，或在“待映射物料”里为物料补充宽度（二期）。</div>
            <div class="small muted mt8">型材的第二维度按品名固定为公斤段或负差段之一（平台在品类主数据里配置），填报率按各品名配置的那一种统计；本企业当前没有型材在传。第一维度（规格、厚度）缺失且无法解析的行进入“待映射”，原因码 DIM_REQUIRED_MISSING。</div>
          </div>
          <div>
            <div class="card-title" style="margin-bottom:8px"><span>非钢材明细（按数量）<small>{{ f.biz[0] }} 至 {{ f.biz[1] }} · SRC-HQ 行级上传</small></span><span class="unit-pill ns">数量 · 个</span></div>
            <table class="plain-table">
              <thead><tr><th>单据号 · 行号</th><th>原始上传值</th><th>平台标准化后的值</th><th class="r">数量</th><th>单位</th><th>状态</th></tr></thead>
              <tbody>
                <tr v-for="r in nsRows" :key="r.doc"><td class="num">{{ r.doc }}<div class="l2">{{ r.date }}</div></td><td class="raw-val">{{ r.raw }}</td><td>钢筋连接套筒 {{ r.spec }}<span class="band-tag">规格段 {{ r.band }}</span></td><td class="r num">{{ $fmt(r.qty) }}</td><td><span class="unit-pill ns">个</span></td><td><el-tag size="small" type="success" effect="light">已入库</el-tag></td></tr>
                <tr v-if="!nsRows.length"><td colspan="6" class="muted" style="text-align:center">所选日期没有非钢材明细（原型仅模拟 2026-11-22、2026-11-23）</td></tr>
              </tbody>
            </table>
            <div class="small muted mt8" style="line-height:1.8">共 {{ nsRows.length }} 行，数量合计 <b class="num" style="color:#1f2d3d">{{ $fmt(nsRows.reduce((a, r) => a + r.qty, 0)) }}</b> 个。非钢材不与吨位合计；上传单位须与品名的标准数量单位一致（钢筋连接套筒为“个”），否则拒收（UNIT_MISMATCH）。非钢材不接收价格和金额字段。</div>
          </div>
        </div>
      </el-tab-pane>

      <!-- ================= 库存快照 ================= -->
      <el-tab-pane name="stock">
        <template #label>库存快照</template>
        <el-form inline class="dc-filter" label-width="70px">
          <el-form-item label="快照日期"><el-date-picker v-model="sf.date" type="date" value-format="YYYY-MM-DD" style="width:160px" :clearable="false" /></el-form-item>
          <el-form-item label="仓库"><el-select v-model="sf.wh" clearable placeholder="全部" style="width:150px"><el-option v-for="w in whOpts" :key="w" :label="w" :value="w" /></el-select></el-form-item>
          <el-form-item label="品名"><el-select v-model="sf.product" clearable placeholder="全部" style="width:150px"><el-option v-for="p in ['螺纹钢','盘螺','高线','热轧卷板','热轧带钢']" :key="p" :label="p" :value="p" /></el-select></el-form-item>
          <el-form-item label="品牌"><el-select v-model="sf.mill" clearable placeholder="全部" style="width:150px"><el-option v-for="p in ['东岳钢铁','金江钢铁','海川特钢','云岭钢铁']" :key="p" :label="p" :value="p" /></el-select></el-form-item>
          <el-form-item label-width="0"><el-button @click="sf = {date: '2026-11-23', wh: '', product: '', mill: ''}">重置</el-button></el-form-item>
        </el-form>
        <div class="tip-box small mb12">库存是日末全量快照，两种上传粒度的接口相同：同一快照日期以最新的完整批次为准。库存快照不设价格、金额、成本字段。</div>
        <el-table class="dc-table" :data="stockPage" border size="small" :empty-text="'所选快照日期没有数据（原型仅模拟 2026-11-23 的库存快照）'">
          <el-table-column label="快照批次" width="170"><template #default="{row}"><div class="num">{{ row.batch }}</div><div class="l2">{{ row.date }} 日末</div></template></el-table-column>
          <el-table-column min-width="200">
            <template #header><span class="hd-raw">原始上传值（ERP 原文）</span></template>
            <template #default="{row}"><div class="raw-val"><div class="l1">{{ row.raw.name }}</div><div class="l2">{{ row.raw.mat }} · {{ row.raw.spec }} · {{ row.raw.mill }} · {{ row.raw.wh }}</div></div></template>
          </el-table-column>
          <el-table-column min-width="240">
            <template #header><span class="hd-std">平台标准化后的值</span></template>
            <template #default="{row}"><div class="std-val"><div class="l1">{{ row.std.product }} {{ row.std.mat }} {{ row.std.spec }}<span class="band-tag">规格段 {{ row.std.band }}</span></div><div class="l2">{{ row.std.mill }} · {{ row.std.wh }}（{{ row.std.city }}）</div></div></template>
          </el-table-column>
          <el-table-column label="库存重量(吨)" width="116" align="right"><template #default="{row}"><span class="num">{{ $fmt(row.weight, 3) }}</span></template></el-table-column>
          <el-table-column label="件数" width="80" align="right"><template #default="{row}"><span class="num">{{ row.qty }} {{ row.unit }}</span></template></el-table-column>
          <el-table-column prop="type" label="库存类型" width="100" />
          <el-table-column prop="age" label="库龄段" width="100" />
          <el-table-column label="状态" width="90"><template #default><el-tag size="small" type="success" effect="light">已入库</el-tag></template></el-table-column>
        </el-table>
        <div class="tbl-foot">
          <span>共 <b>{{ stockFiltered.length }}</b> 条，合计库存 <b class="num">{{ $fmt(stockSum, 3) }}</b> 吨（货权属于本企业的账面实物库存，不含代管他人货物）</span>
          <el-pagination small background layout="prev, pager, next" :total="stockFiltered.length" :page-size="pageSize" v-model:current-page="spage" />
        </div>
      </el-tab-pane>

      <!-- ================= 上传批次 ================= -->
      <el-tab-pane name="batch">
        <template #label>上传批次</template>
        <el-table class="dc-table" :data="batchRows" border size="small">
          <el-table-column label="批次号" width="162"><template #default="{row}"><span class="num">{{ row.no }}</span></template></el-table-column>
          <el-table-column label="接口" min-width="130"><template #default="{row}"><div>{{ row.api }}</div><div class="l2">{{ row.path }}</div></template></el-table-column>
          <el-table-column label="业务日期 / 上传时间" width="132"><template #default="{row}"><div class="num">{{ row.day }}</div><div class="l2">{{ row.at }}</div></template></el-table-column>
          <el-table-column label="接收" width="56" align="right"><template #default="{row}"><span class="num">{{ row.recv }}</span></template></el-table-column>
          <el-table-column label="入库" width="56" align="right"><template #default="{row}"><span class="num">{{ row.in }}</span></template></el-table-column>
          <el-table-column label="过滤" width="56" align="right"><template #default="{row}"><span class="num">{{ row.filt }}</span></template></el-table-column>
          <el-table-column label="失败" width="56" align="right"><template #default="{row}"><span class="num" :style="{color: row.fail ? '#e5484d' : ''}">{{ row.fail }}</span></template></el-table-column>
          <el-table-column label="待映射" width="62" align="right"><template #default="{row}"><span class="num" :style="{color: row.pend ? '#b26a00' : ''}">{{ row.pend }}</span></template></el-table-column>
          <el-table-column label="隔离" width="52" align="right"><template #default="{row}"><span class="num">{{ row.quar }}</span></template></el-table-column>
          <el-table-column v-if="price" label="带价格" width="62" align="right"><template #default="{row}"><span class="num" v-if="row.priced !== null">{{ row.priced }}</span><span v-else class="muted small">不适用</span></template></el-table-column>
          <el-table-column label="状态" min-width="140">
            <template #default="{row}">
              <el-tag size="small" :type="row.fail ? 'warning' : 'success'" effect="light">{{ row.status }}</el-tag>

          <template v-if="src==='WX'">日汇总模式同一业务日期以最新的完整批次为准，旧批次整批失效。</template>
        </div>
      </el-tab-pane>

      <!-- ================= 待映射物料 ================= -->
      <el-tab-pane name="map">
        <template #label>待映射物料<el-badge v-if="pendAll.length" :value="pendAll.length" type="warning" style="margin-left:6px" /></template>
        <template v-if="pendAll.length">
          <div class="row between mb12">
            <span>共 <b>{{ pendAll.length }}</b> 个物料待映射，涉及近 30 日 <b>{{ pendStat.cnt }}</b> 条、<b>{{ $fmt(pendStat.ton, 1) }}</b> 吨，占本企业近 30 日销量 <b>{{ pendStat.share }}%</b><span class="muted small">（两个来源系统合计，按大类分组，销量占比高的排前）</span></span>
            <span class="row">
              <el-button size="small" @click="$info('原型演示：上传 ERP 物料档案后，平台批量给出映射推荐')"><el-icon><Upload /></el-icon>导入 ERP 物料档案</el-button>
              <el-button size="small" @click="mapSel = pendAll.filter(p => p.conf >= 80).map(p => p.key)">勾选置信度 ≥ 80% 的</el-button>
              <el-button size="small" type="primary" :disabled="!mapSel.length" @click="confirmMap(mapSel.slice())"><el-icon><Check /></el-icon>批量确认推荐（{{ mapSel.length }}）</el-button>
            </span>
          </div>
          <table class="plain-table map-table">
            <thead><tr><th style="width:36px"></th><th>原始值（ERP 原文）</th><th>来源系统</th><th class="r">近 30 日条数 / 吨位</th><th class="r">销量占比</th><th>系统推荐的标准值</th><th>置信度</th><th>操作</th></tr></thead>
            <tbody>
              <template v-for="g in pendGroups" :key="g.name">
                <tr class="grp"><td colspan="8">{{ g.name }}<small>{{ g.items.length }} 个物料 · 近 30 日 {{ $fmt(g.ton, 1) }} 吨</small></td></tr>
                <tr v-for="p in g.items" :key="p.key">
                  <td class="c"><el-checkbox :model-value="mapSel.indexOf(p.key) >= 0" @change="v => toggleMap(p.key, v)" /></td>
                  <td><div class="raw-val"><div class="l1">{{ p.raw.name }}</div><div class="l2">材质 {{ p.raw.mat }} · 规格 {{ p.raw.spec }}</div></div></td>
                  <td><span class="code">SRC-{{ p.src }}</span></td>
                  <td class="r num">{{ p.cnt }} 条 / {{ $fmt(p.ton, 1) }} 吨</td>
                  <td class="r num">{{ p.share.toFixed(2) }}%</td>
                  <td><div class="std-val"><div class="l1">{{ p.rec.product }}<template v-if="p.rec.mat"> · {{ p.rec.mat }} · {{ p.rec.spec }}</template><span v-if="p.rec.band" class="band-tag">规格段 {{ p.rec.band }}</span></div><div class="l2">{{ p.rec.cat }}<template v-if="!p.rec.mat"> · 长尾归口，参与大类级聚合，不开放下钻</template></div></div></td>
                  <td><span class="conf" :class="{hi: p.conf >= 80, lo: p.conf < 65}"><i><u :style="{width: p.conf + '%'}"></u></i><span class="num">{{ p.conf }}%</span></span></td>
                  <td><div class="ops"><a href="javascript:;" @click="confirmMap([p.key])">确认推荐</a><a href="javascript:;" @click="openManual(p)">手动选择</a></div></td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
        <el-empty v-else description="全部物料已映射，历史数据将在下一次聚合计算时自动回补" />
        <div class="tip-box blue small mt12">

        </div>
      </el-tab-pane>
    </el-tabs>
  </div>

  <div class="tip-box green">
    <el-icon style="vertical-align:-2px;margin-right:4px"><Lock /></el-icon><b>平台人员默认不可查看这些明细。</b>确需协助排查时，须由平台发起明细访问工单，经你授权后限时查看，每次访问都会留痕。经你授权的访问记录见 <a href="ledger.html">数据使用透明账本</a>。上游钢厂在任何情况下都看不到这些明细，只能看到多家企业聚合后的结果。

          <tr><td>钢厂</td><td class="raw-val">{{ cur.raw.mill }}</td><td>{{ cur.std.mill }}</td><td class="muted">别名库自动匹配</td></tr>
          <tr><td>仓库</td><td class="raw-val">{{ cur.raw.wh }}</td><td>{{ cur.std.wh }} · {{ cur.std.city }}</td><td class="muted">企业映射</td></tr>
          <tr><td>流向地</td><td class="raw-val">{{ cur.dest ? cur.destCode : '未传' }}</td><td>{{ cur.dest || '未填报' }}</td><td class="muted">{{ cur.dest ? '行政区划代码' : '—' }}</td></tr>
        </tbody>
      </table>

      <template v-if="dims(cur).length">
        <div class="card-title mt16" style="margin-bottom:8px"><span>统计维度<small>{{ tplName(cur) }}模板 · 计量单位：吨</small></span></div>
        <table class="plain-table cmp-table">
          <thead><tr><th>维度</th><th>原始上传值</th><th>平台解析后的值</th><th>所属段</th><th>来源</th></tr></thead>
          <tbody><tr v-for="d in dims(cur)" :key="d.name"><td>{{ d.name }}</td><td class="raw-val">{{ d.raw }}</td><td>{{ d.miss ? '—' : d.val }}</td><td><span v-if="d.miss" class="band-tag" style="background:#fff8eb;color:#9a6400;border-color:#f3dfb8;margin-left:0">未分段</span><span v-else class="band-tag" style="margin-left:0">{{ d.band }}</span></td><td class="muted">{{ d.miss ? '缺失（DIM_UNBANDED）：只参与更粗层级的聚合' : d.src }}</td></tr></tbody>
        </table>
        <div class="small muted mt8">对上游只按“段”披露，原始值和解析值不出平台。分段字典 {{ bandVer }}，分段数值为示例参数。</div>
      </template>

      <el-descriptions :column="2" border size="small" class="mt16">
        <el-descriptions-item :label="cur.src==='HQ' ? '结算重量' : '净销量'"><b class="num">{{ $fmt(cur.weight, 3) }}</b> 吨</el-descriptions-item>
        <el-descriptions-item label="计重方式">{{ cur.mode }}</el-descriptions-item>
        <el-descriptions-item label="客户类型">{{ cur.ctype || '未填报' }}</el-descriptions-item>
        <el-descriptions-item label="下游行业">{{ cur.industry || '未填报' }}</el-descriptions-item>
        <template v-if="price && cur.price">
          <el-descriptions-item :label="cur.src==='HQ' ? '成交单价' : '均价'"><b class="num">{{ $fmt(cur.price.unit) }}</b> 元/吨<span v-if="cur.src==='WX'" class="muted small">（金额 ÷ 净重）</span></el-descriptions-item>
          <el-descriptions-item label="金额"><b class="num">{{ $fmt(cur.price.amount, 2) }}</b> 元</el-descriptions-item>
          <el-descriptions-item label="价格口径">{{ cur.price.term }} · 非暂估</el-descriptions-item>
          <el-descriptions-item label="价格状态">{{ cur.price.q ? '价格字段隔离待确认（销量已入库）' : '已接收' }}</el-descriptions-item>
        </template>
      </el-descriptions>

      <el-alert v-if="cur.reason" :type="cur.status==='校验失败' ? 'error' : 'warning'" show-icon :closable="false" class="mt16" :title="cur.status + '：' + cur.reason" />
      <div v-if="cur.voidInfo" class="tip-box small mt12">{{ cur.voidInfo }}</div>

      <div class="card-title mt16" style="margin-bottom:8px"><span>处理过程</span></div>
      <el-timeline style="padding-left:4px">
        <el-timeline-item v-for="t in timeline" :key="t.t" :type="t.type" :timestamp="t.time" placement="top">{{ t.t }}</el-timeline-item>
      </el-timeline>
      <div class="tip-box small">接口不设客户名称、业务员、成本、毛利字段。ERP 若传了这些字段，平台在入口直接丢弃，不落盘。</div>
    </template>
  </el-drawer>

  <!-- 作废确认 -->
  <el-dialog v-model="voidDlg" title="作废确认" width="540px">
    <el-alert type="warning" show-icon :closable="false" :title="'将作废 ' + voidRows.length + ' 条已入库的单据行，合计 ' + $fmt(voidRows.reduce((a, r) => a + r.weight, 0), 3) + ' 吨'" />
    <ul style="margin:0 0 12px;padding-left:20px;line-height:1.9;font-size:13px">
      <li>作废后这些数据<b>不再参与后续聚合计算</b>，受影响日期的聚合结果自动重算。</li>
      <li>已生成并已披露的历史聚合结果不回溯修改。</li>
      <li>作废不可撤销。如需恢复，请在 ERP 端重新上传该单据行（同一单据号与行号，按最后修改时间取最新）。</li>
    </ul>
    <el-form label-width="84px">
      <el-form-item label="作废原因">
        <el-select v-model="voidReason" style="width:100%"><el-option v-for="r in ['ERP 录入错误，已重新开单','单据在 ERP 中已作废','不应上传的数据（规则设置遗漏）','其他']" :key="r" :label="r" :value="r" /></el-select>
      </el-form-item>
      <el-form-item label="单据行">
        <div class="small muted" style="line-height:1.8">{{ voidRows.slice(0, 4).map(r => r.docNo + '-' + r.lineNo).join('、') }}<template v-if="voidRows.length > 4"> 等 {{ voidRows.length }} 行</template></div>
      </el-form-item>
    </el-form>
    <template #footer><el-button @click="voidDlg = false">取消</el-button><el-button type="danger" @click="doVoid">确认作废</el-button></template>
  </el-dialog>

  <!-- 隔离更正 -->
  <el-dialog v-model="fixDlg" title="更正隔离数据" width="540px">
    <template v-if="cur">
      <el-descriptions :column="1" border size="small">
        <el-descriptions-item label="单据行">{{ cur.docNo }} · {{ cur.lineNo }}　{{ cur.raw.name }}　<b class="num">{{ $fmt(cur.weight, 3) }}</b> 吨</el-descriptions-item>
        <el-descriptions-item label="隔离原因">{{ cur.reason }}</el-descriptions-item>
      </el-descriptions>
      <el-radio-group v-model="fixMode" class="mt12" style="display:flex;flex-direction:column;align-items:flex-start;gap:6px">
        <el-radio value="reupload">在 ERP 中修正后重新上传该单据行（推荐）</el-radio>
        <el-radio value="void">直接作废该行，不再参与聚合</el-radio>
      </el-radio-group>
      <div class="tip-box small mt12">隔离中的数据不参与聚合。选择“重新上传”后，该行保持隔离，直到平台收到 ERP 的更新版本（同一单据号与行号，按最后修改时间取最新）。</div>
    </template>
    <template #footer><el-button @click="fixDlg = false">取消</el-button><el-button type="primary" @click="doFix">确定</el-button></template>
  </el-dialog>

  <!-- 手动映射 -->
  <el-dialog v-model="manualDlg" title="手动选择标准值" width="560px">
    <template v-if="manual.p">
      <el-descriptions :column="1" border size="small">
        <el-descriptions-item label="ERP 原始值">{{ manual.p.raw.name }}　材质 {{ manual.p.raw.mat }}　规格 {{ manual.p.raw.spec }}</el-descriptions-item>
        <el-descriptions-item label="系统推荐">{{ manual.p.rec.cat }} / {{ manual.p.rec.product }}（置信度 {{ manual.p.conf }}%）</el-descriptions-item>
      </el-descriptions>
      <el-form label-width="96px" class="mt16">
        <el-form-item label="标准品名"><el-cascader v-model="manual.path" :options="catOpts" style="width:100%" placeholder="大类 / 品名" /></el-form-item>
        <el-form-item label="标准材质"><el-select v-model="manual.mat" style="width:100%" placeholder="请选择" :disabled="!manualMats.length"><el-option v-for="m in manualMats" :key="m" :label="m" :value="m" /></el-select></el-form-item>
        <el-form-item label="规格"><el-input v-model="manual.spec" placeholder="可留空，由平台按规格文本解析" /></el-form-item>
      </el-form>
      <div class="tip-box small">确认后只影响本企业的映射；同时作为别名建议提交平台主数据管理员审核，通过后进入平台别名库。</div>
    </template>
    <template #footer><el-button @click="manualDlg = false">取消</el-button><el-button type="primary" :disabled="manual.path.length < 2" @click="doManual">确认映射</el-button></template>
  </el-dialog>

  <!-- 导出 -->
  <el-dialog v-model="exportDlg" title="导出本企业数据" width="560px">
    <el-form label-width="96px">
      <el-form-item label="导出内容">
        <el-radio-group v-model="exp.scope">
          <el-radio value="cur">当前筛选结果（{{ filtered.length }} 条销售明细）</el-radio>
          <el-radio value="stock">库存快照（{{ stockFiltered.length }} 条）</el-radio>
          <el-radio value="batch">上传批次清单</el-radio>
        </el-radio-group>
      </el-form-item>
      <el-form-item label="文件格式"><el-radio-group v-model="exp.fmt"><el-radio value="xlsx">Excel</el-radio><el-radio value="csv">CSV</el-radio></el-radio-group></el-form-item>
      <el-form-item label="包含列">
        <el-checkbox v-model="exp.raw">原始上传值</el-checkbox><el-checkbox v-model="exp.std">平台标准化值</el-checkbox>
        <el-checkbox v-if="price" v-model="exp.price">单价、金额、价格口径</el-checkbox>
      </el-form-item>
    </el-form>
    <div class="tip-box small">导出的是本企业自己上传的数据，仅企业管理员和被授权的“数据查看员”可操作。导出记录写入本企业的操作审计日志。</div>
    <template #footer><el-button @click="exportDlg = false">取消</el-button><el-button type="primary" @click="exportDlg = false; $demo('导出任务已提交，生成后通过站内信通知下载')">生成导出文件</el-button></template>
  </el-dialog>
</app-layout>

  const ITEMS = {

      { no: 'B-HQ-20261123-001', kind: 'sale', api: '销售出库批量上传', path: 'POST /sales/batch', day: D23, at: D23 + ' 12:05', recv: 108, in: 93, filt: 11, fail: 1, pend: 3, quar: 0, priced: 88, status: '部分失败' },
      { no: 'B-HQ-20261122-002', kind: 'sale', api: '销售出库批量上传', path: 'POST /sales/batch', day: D22, at: D22 + ' 23:41', recv: 87, in: 74, filt: 10, fail: 0, pend: 3, quar: 0, priced: 69, status: '处理完成' },
      { no: 'S-HQ-20261122-01', kind: 'inv', api: '库存快照上传', path: 'POST /inventory/snapshot', day: D22, at: D22 + ' 23:50', recv: 415, in: 415, filt: 0, fail: 0, pend: 0, quar: 0, priced: null, status: '处理完成', tip: '分片 1 / 1，已收到末片标记' },
      { no: 'B-HQ-20261122-001', kind: 'sale', api: '销售出库批量上传', path: 'POST /sales/batch', day: D22, at: D22 + ' 13:02', recv: 102, in: 88, filt: 12, fail: 0, pend: 2, quar: 0, priced: 76, status: '处理完成', tip: '其中 2 行已于 2026-11-23 由企业作废' }],
    WX: [
      { no: 'SB-WX-20261123-01', kind: 'sale', api: '销售日汇总上传', path: 'POST /sales/daily-summary', day: D23, at: D23 + ' 23:55', recv: 45, in: 41, filt: 0, fail: 0, pend: 4, quar: 0, priced: 38, status: '已生效', tip: '分片 1 / 1，整批替换；所含单据行数 203' },
      { no: 'S-WX-20261123-01', kind: 'inv', api: '库存快照上传', path: 'POST /inventory/snapshot', day: D23, at: D23 + ' 23:58', recv: 86, in: 86, filt: 0, fail: 0, pend: 0, quar: 0, priced: null, status: '处理完成', tip: '分片 1 / 1，已收到末片标记' },
      { no: 'SB-WX-20261122-01', kind: 'sale', api: '销售日汇总上传', path: 'POST /sales/daily-summary', day: D22, at: D22 + ' 23:55', recv: 27, in: 25, filt: 0, fail: 0, pend: 2, quar: 0, priced: 21, status: '已生效', tip: '分片 1 / 1，整批替换；所含单据行数 122' },
      { no: 'S-WX-20261122-01', kind: 'inv', api: '库存快照上传', path: 'POST /inventory/snapshot', day: D22, at: D22 + ' 23:57', recv: 86, in: 86, filt: 0, fail: 0, pend: 0, quar: 0, priced: null, status: '处理完成', tip: '分片 1 / 1，已收到末片标记' }],
  };
  const emptyF = () => ({ biz: [D23, D23], up: null, doc: '', wh: '', product: '', mat: '', spec: '', mill: '', status: '', batch: '' });

  /* 非钢材明细（按数量）：钢筋连接套筒，单位“个”。与“每日上传汇总”一致：2026-11-23 入库 6 行、1,680 个；2026-11-22 入库 4 行、1,040 个 */
  const NS_ROWS = [
    ['2026-11-23', 'XS2611230171 · 2', '套筒 25 直螺纹', 'Φ25', 'Φ25–32', 400], ['2026-11-23', 'XS2611230171 · 3', '套筒 32 直螺纹', 'Φ32', 'Φ25–32', 240],
    ['2026-11-23', 'XS2611230184 · 1', '套筒 20 直螺纹', 'Φ20', 'Φ16–22', 360], ['2026-11-23', 'XS2611230192 · 4', '套筒 25 直螺纹', 'Φ25', 'Φ25–32', 300],
    ['2026-11-23', 'XS2611230205 · 2', '套筒 22 直螺纹', 'Φ22', 'Φ16–22', 200], ['2026-11-23', 'XS2611230217 · 1', '套筒 36 直螺纹', 'Φ36', 'Φ36–40', 180],
    ['2026-11-22', 'XS2611220094 · 3', '套筒 25 直螺纹', 'Φ25', 'Φ25–32', 420], ['2026-11-22', 'XS2611220101 · 2', '套筒 20 直螺纹', 'Φ20', 'Φ16–22', 260],
    ['2026-11-22', 'XS2611220118 · 1', '套筒 28 直螺纹', 'Φ28', 'Φ25–32', 200], ['2026-11-22', 'XS2611220126 · 2', '套筒 40 直螺纹', 'Φ40', 'Φ36–40', 160],
  ].map((r) => ({ date: r[0], doc: r[1], raw: r[2], spec: r[3], band: r[4], qty: r[5] }));
  const WIDTH_BAND = (product, w) => { const d = M.DIM2[product]; if (!d) return ''; const cut = d[1].map((b) => parseFloat(b)); return w < cut[0] ? d[1][0] : (d[1].length === 3 && w < cut[2]) ? d[1][1] : d[1][d[1].length - 1]; };

  STP.mount({
    data() {
      let preset = null;
      try { preset = JSON.parse(sessionStorage.getItem('stp-dc-preset') || 'null'); sessionStorage.removeItem('stp-dc-preset'); } catch (e) { /* ignore */ }
      const f = emptyF();
      if (preset) { if (preset.date === D22 || preset.date === D23) f.biz = [preset.date, preset.date]; f.status = preset.status || ''; }
      return {
        src: 'HQ', tab: 'sales', f, sf: { date: D23, wh: '', product: '', mill: '' }, page: 1, spage: 1, pageSize: 15, loading: false, picked: [],
        rows: ROWS, pend: PEND.slice(), mapSel: [],
        bandVer: M.BAND_VER.ver,
        dimFill: [
          { t: '建材', prods: '螺纹钢、盘螺、高线', dim: '规格', lv: '第一维度', direct: 62.0, parsed: 37.4, miss: 0.6, note: '进入待映射，补齐后回补' },
          { t: '板材', prods: '热轧卷板、热轧带钢', dim: '厚度', lv: '第一维度', direct: 58.0, parsed: 41.2, miss: 0.8, note: '进入待映射，补齐后回补' },
          { t: '板材', prods: '热轧卷板、热轧带钢', dim: '宽度', lv: '第二维度', direct: 58.0, parsed: 35.6, miss: 6.4, note: '照常入库，归入“未分段”' },
          { t: '其他品类（非钢材）', prods: '钢筋连接套筒', dim: '规格', lv: '第一维度', direct: 71.0, parsed: 27.0, miss: 2.0, note: '进入待映射，补齐后回补' },
        ],
        detailDlg: false, cur: null, voidDlg: false, voidRows: [], voidReason: 'ERP 录入错误，已重新开单', fixDlg: false, fixMode: 'reupload',
        manualDlg: false, manual: { p: null, path: [], mat: '', spec: '' },
        exportDlg: false, exp: { scope: 'cur', fmt: 'xlsx', raw: true, std: true, price: false },
        presetOut: !!(preset && preset.date !== D22 && preset.date !== D23),
        catOpts: M.categories.map((c) => ({ value: c.name, label: c.name, children: c.products.map((p) => ({ value: p.name, label: p.name })).concat([{ value: '其他品名', label: '其他品名（长尾归口）' }]) })),
      };
    },
    mounted() { if (this.presetOut) this.$info('原型仅模拟 2026-11-22、2026-11-23 两天的明细，已为你显示 2026-11-23'); },
    computed: {
      price() { return this.$state.dnPrice === 'on'; },
      whOpts() { return this.src === 'HQ' ? ['苏州望亭库', '上海宝山库'] : ['无锡惠山库']; },
      base() {
        const f = this.f;
        return this.rows[this.src].filter((r) => r.day >= f.biz[0] && r.day <= f.biz[1]
          && (!f.up || !f.up.length || (r.at.slice(0, 10) >= f.up[0] && r.at.slice(0, 10) <= f.up[1]))
          && (!f.doc || r.docNo.indexOf(f.doc.trim().toUpperCase()) >= 0)
          && (!f.wh || r.std.wh === f.wh)
          && (!f.product || (f.product === '未映射' ? !r.std.product : r.std.product === f.product))
          && (!f.mat || r.std.mat === f.mat)
          && (!f.spec || (r.raw.spec + r.std.spec + r.raw.name).indexOf(f.spec.trim()) >= 0)
          && (!f.mill || r.std.mill === f.mill)
          && (!f.batch || r.batch === f.batch));
      },
      statusOpts() {
        const b = this.base, c = (s) => b.filter((r) => r.status === s).length;
        return [{ k: '', t: '全部', n: b.length }].concat(['已入库', '校验失败', '待映射', '隔离待确认', '已作废'].map((s) => ({ k: s, t: s, n: c(s) })));
      },
      filtered() { return this.f.status ? this.base.filter((r) => r.status === this.f.status) : this.base; },
      nsRows() { const b = this.f.biz; return NS_ROWS.filter((r) => r.date >= b[0] && r.date <= b[1]); },
      pageRows() { return this.filtered.slice((this.page - 1) * this.pageSize, this.page * this.pageSize); },
      sumWeight() { return this.filtered.reduce((a, r) => a + r.weight, 0); },
      sumLines() { return this.filtered.reduce((a, r) => a + (r.lines || 0), 0); },
      emptyText() { return '没有符合条件的记录。原型仅模拟 2026-11-22、2026-11-23 两天的明细；被规则过滤的数据不落盘，不会出现在这里'; },
      stockFiltered() { const f = this.sf; return STOCK[this.src].filter((r) => r.date === f.date && (!f.wh || r.std.wh === f.wh) && (!f.product || r.std.product === f.product) && (!f.mill || r.std.mill === f.mill)); },
      stockPage() { return this.stockFiltered.slice((this.spage - 1) * this.pageSize, this.spage * this.pageSize); },
      stockSum() { return this.stockFiltered.reduce((a, r) => a + r.weight, 0); },
      batchRows() { return BATCH[this.src]; },
      pendAll() { return this.pend; },
      pendGroups() {
        const g = {};
        this.pend.forEach((p) => { (g[p.rec.cat] = g[p.rec.cat] || []).push(p); });
        return Object.keys(g).map((k) => ({ name: k, items: g[k].slice().sort((a, b) => b.share - a.share), ton: g[k].reduce((a, p) => a + p.ton, 0) })).sort((a, b) => b.ton - a.ton);
      },
      pendStat() { const p = this.pend; return { cnt: p.reduce((a, x) => a + x.cnt, 0), ton: p.reduce((a, x) => a + x.ton, 0), share: p.reduce((a, x) => a + x.share, 0).toFixed(2) }; },
      manualMats() { const pa = this.manual.path; if (pa.length < 2) return []; const c = M.categories.find((x) => x.name === pa[0]); const p = c && c.products.find((x) => x.name === pa[1]); return p ? p.materials : []; },
      timeline() {
        const r = this.cur; if (!r) return [];
        const t = [{ t: '平台入口接收，签名与报文格式校验通过', time: r.at, type: 'success' }, { t: '按本企业上传条件规则二次过滤：符合规则，继续处理', time: r.at, type: 'success' }];
        if (r.status === '校验失败') t.push({ t: '字段校验未通过：' + r.reason, time: r.at, type: 'danger' });
        else {
          t.push({ t: '字段校验通过', time: r.at, type: 'success' });
          if (r.status === '待映射') t.push({ t: '映射校验：品名、规格未能对应标准值，进入待映射队列', time: r.at, type: 'warning' });
          else {
            t.push({ t: '映射到平台标准值', time: r.at, type: 'success' });
            if (r.status === '隔离待确认') t.push({ t: '业务校验：' + r.reason, time: STP.addDays(r.day, 1) + ' 02:10', type: 'warning' });
            else {
              t.push({ t: '入库，参与 ' + STP.addDays(r.day, 1) + ' 08:00 前发布的 T+1 聚合', time: STP.addDays(r.day, 1) + ' 02:30', type: 'success' });
              if (r.status === '已作废') t.push({ t: '企业作废，不再参与聚合', time: r.voidAt || '2026-11-23 09:14', type: 'info' });
            }
          }
        }
        return t;
      },
    },
    watch: {
      filtered() { this.page = 1; },
      stockFiltered() { this.spage = 1; },
      'manual.path'() { this.manual.mat = ''; },
    },
    methods: {
      tagOf(s) { return { 已入库: 'success', 校验失败: 'danger', 待映射: 'warning', 隔离待确认: 'warning', 已作废: 'info' }[s]; },
      onSrc() { this.f = emptyF(); this.sf = { date: D23, wh: '', product: '', mill: '' }; this.picked = []; if (this.$refs.tbl) this.$refs.tbl.clearSelection(); },
      query() { this.loading = true; setTimeout(() => { this.loading = false; }, 400); },
      reset() { this.f = emptyF(); },
      openDetail(row) { this.cur = row; this.detailDlg = true; },
      openVoid(rows) { this.voidRows = rows.slice(); this.voidDlg = true; },
      doVoid() {
        this.voidRows.forEach((r) => { r.status = '已作废'; r.voidAt = '2026-11-24 14:20'; r.voidInfo = '2026-11-24 14:20 由陈海峰作废。原因：' + this.voidReason + '。作废后不再参与聚合，' + r.day + ' 的聚合结果将自动重算。'; });
        const n = this.voidRows.length;
        this.voidDlg = false; this.picked = []; if (this.$refs.tbl) this.$refs.tbl.clearSelection();
        this.$demo('已作废 ' + n + ' 条，受影响日期的聚合将自动重算');
      },
      confirmTrue(row) {
        ElementPlus.ElMessageBox.confirm('确认该行数据属实（' + row.raw.name + '，' + STP.fmt(row.weight, 3) + ' 吨）？确认后解除隔离并入库，参与下一次聚合计算。', '确认属实', { confirmButtonText: '属实，解除隔离', cancelButtonText: '取消', type: 'warning' })
          .then(() => { row.status = '已入库'; row.reason = ''; this.$demo('已解除隔离并入库'); }).catch(() => {});
      },
      openFix(row) { this.cur = row; this.fixMode = 'reupload'; this.fixDlg = true; },
      doFix() {
        const r = this.cur;
        if (this.fixMode === 'void') { r.status = '已作废'; r.reason = ''; r.voidAt = '2026-11-24 14:20'; r.voidInfo = '2026-11-24 14:20 由陈海峰在隔离区作废。'; this.$demo('已作废该行'); }
        else { r.reason = '等待 ERP 重新上传该单据行；收到更新版本前保持隔离'; this.$demo('已标记为“等待重传”，收到 ERP 更新后自动重新校验'); }
        this.fixDlg = false;
      },
      viewBatch(b) { this.f = Object.assign(emptyF(), { biz: [b.day, b.day], batch: b.no }); this.tab = 'sales'; },
      toggleMap(k, v) { const i = this.mapSel.indexOf(k); if (v && i < 0) this.mapSel.push(k); if (!v && i >= 0) this.mapSel.splice(i, 1); },
      applyMap(keys, recOf) {
        let n = 0;
        keys.forEach((k) => {
          const p = this.pend.find((x) => x.key === k); if (!p) return;
          const rec = recOf(p);
          Object.keys(this.rows).forEach((s) => this.rows[s].forEach((r) => {
            if (r.pendKey === k && r.status === '待映射') { Object.assign(r.std, { product: rec.product, mat: rec.mat || '', spec: rec.spec || '', band: rec.band || '', cat: rec.cat }); r.status = '已入库'; r.reason = ''; n++; }
          }));
        });
        this.pend = this.pend.filter((p) => keys.indexOf(p.key) < 0);
        this.mapSel = this.mapSel.filter((k) => keys.indexOf(k) < 0);
        return n;
      },
      confirmMap(keys) {
        const hist = this.pend.filter((p) => keys.indexOf(p.key) >= 0).reduce((a, p) => a + p.cnt, 0);
        this.applyMap(keys, (p) => p.rec);
        this.$demo('已确认 ' + keys.length + ' 个物料的映射，近 30 日 ' + hist + ' 条历史数据将自动回补并参与聚合');
      },
      tplName(r) { return r && r.std.cat === '热轧板卷' ? '板材' : r && r.std.cat === '建筑钢材' ? '建材' : '其他品类'; },
      /* 按品名所属统计维度模板给出维度的原始值、解析值、所属段。建材：规格；板材：厚度 + 宽度 */
      dims(r) {
        if (!r || !r.std.product || r.std.product === '其他品名') return [];
        const src = r.src === 'HQ' && M.hash(r.id + 'dim') % 5 < 3 ? '直接上传（specAttrs）' : '由规格原文解析';
        if (r.std.cat !== '热轧板卷') return [{ name: '规格', raw: r.raw.spec, val: r.std.spec, band: r.std.band || r.std.spec, src }];
        const m = /^([\d.]+)(?:×(\d+))?/.exec(r.std.spec) || [], raw = r.raw.spec.split('*');
        const out = [{ name: '厚度', raw: raw[0] || '—', val: m[1] + 'mm', band: r.std.band, src }];
        out.push(m[2] ? { name: '宽度', raw: raw[1], val: m[2] + 'mm', band: WIDTH_BAND(r.std.product, +m[2]), src } : { name: '宽度', raw: '未传', miss: true });
        return out;
      },
      openManual(p) { this.manual = { p, path: [p.rec.cat, p.rec.product], mat: '', spec: p.rec.spec || '' }; this.$nextTick(() => { this.manual.mat = p.rec.mat || ''; }); this.manualDlg = true; },
      doManual() {
        const m = this.manual;
        this.applyMap([m.p.key], () => ({ cat: m.path[0], product: m.path[1], mat: m.mat, spec: m.spec, band: '' }));
        this.manualDlg = false;
        this.$demo('映射已保存，历史数据将自动回补');
      },
    },
  });
})();
</script>
