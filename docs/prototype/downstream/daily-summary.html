<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日上传汇总 · 下游钢贸端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.ds-top { display: grid; grid-template-columns: 456px minmax(0, 1fr); gap: 14px; margin-bottom: 14px; align-items: stretch; }
.ds-top > .card { margin-bottom: 0; }
.calendar-grid .day { min-height: 60px; padding: 5px 6px 4px; white-space: nowrap; overflow: hidden; }
.calendar-grid .day em { display: block; font-style: normal; font-size: 11px; line-height: 15px; }
.calendar-grid .day.part em { color: #b26a00; }
.calendar-grid .day.miss em { color: #c9383d; }
.calendar-grid .day.today { border-style: dashed; color: #8a94a3; cursor: default; }
.cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--stp-sub); margin-top: 10px; }
.cal-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; border: 1px solid transparent; }
.cal-legend .ok { background: #f0faf4; border-color: #cfe9da; } .cal-legend .part { background: #fff8eb; border-color: #f3dfb8; }
.cal-legend .miss { background: #fff3f3; border-color: #f3c9ca; } .cal-legend .future { background: #fff; border-color: #e6e9ef; }
.mini { border: 1px solid var(--stp-border); border-radius: 6px; padding: 10px 12px; background: #fff; position: relative; }
.mini .k { font-size: 12px; color: var(--stp-sub); display: flex; align-items: center; gap: 4px; }
.mini .v { font-size: 22px; font-weight: 600; margin-top: 4px; line-height: 1.2; }
.mini .v small { font-size: 12px; font-weight: 400; color: var(--stp-sub); margin: 0 6px 0 3px; }
.mini .f { font-size: 12px; color: var(--stp-sub); margin-top: 4px; line-height: 1.5; }
.eq { font-size: 12.5px; line-height: 1.9; }
.eq b { font-variant-numeric: tabular-nums; }
.src-table td, .src-table th { padding: 6px 8px; font-size: 12.5px; }
.recon { border: 1px solid var(--stp-border); border-radius: 6px; padding: 12px 14px; }
.recon.bad { border-color: #f3c9ca; background: #fffafa; }
.recon h4 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.recon h4 .res { margin-left: auto; }
.diff { color: #e5484d; font-weight: 600; }
.el-descriptions__label { white-space: nowrap; }
.rep-box { background: #fff; border: 1px solid var(--stp-border, #e6e9ef); border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
.rep-row { display: flex; align-items: center; gap: 14px; padding: 9px 16px; flex-wrap: wrap; }
.rep-row + .rep-row { border-top: 1px dashed #e6e9ef; }
.rep-k { width: 132px; flex: none; }
.rep-item { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 12px; background: #f7f8fa; }
.rep-item b { font-weight: 500; }
.rep-note { padding: 8px 16px; border-top: 1px solid #e6e9ef; background: #f5f9ff; border-radius: 0 0 8px 8px; color: #4a5568; font-size: 12px; line-height: 1.8; }
.demo-param { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="downstream" active="daily-summary" title="每日上传汇总"
  desc="按业务日期核对本企业每天传了什么：批次、条数、吨位，多少被规则过滤、多少校验失败，以及与 ERP 申报总数的对账结果。以下都是本企业自己上传的数据，仅本企业可见。">
  <template #actions>
    <el-tooltip placement="bottom" content="原型演示用：模拟本企业在“上传设置”中的价格上传开关（默认关闭）。关闭时本页不出现任何价格、金额内容。">
      <span class="proto-switch">原型状态 · 价格上传
        <el-switch :model-value="price" size="small" @change="v => $setState('dnPrice', v ? 'on' : 'off')" />
        <b :style="{color: price ? '#18a058' : '#8a94a3'}">{{ price ? '已开启' : '未开启' }}</b>
      </span>
    </el-tooltip>
    <el-button @click="reportDlg = true"><el-icon><Document /></el-icon>月度报告</el-button>
    <el-button type="primary" @click="pushDlg = true"><el-icon><Bell /></el-icon>每日推送设置</el-button>
  </template>

  <div class="status-line">
    <b>当前上传粒度</b>
    <span><span class="code">SRC-HQ</span> 总部 ERP <el-tag size="small" effect="plain">行级模式</el-tag></span>
    <span><span class="code">SRC-WX</span> 无锡分公司进销存 <el-tag size="small" type="success" effect="plain">日汇总模式</el-tag> <span class="muted small">自 2026-10-01 起</span></span>
    <span class="muted small">行级的“条数”是单据行数；日汇总的“条数”是汇总记录数，另展示所含单据行数</span>
    <a href="upload-settings.html" style="margin-left:auto">上传设置 ›</a>
  </div>

  <!-- 今日是否已计为报送（DN-104） -->
  <div v-if="nsOn" class="rep-box">
    <div class="rep-row">
      <b class="rep-k">报送达标</b>
      <el-tag size="small" type="info" effect="plain">不适用（无库存经营）</el-tag>
      <span><b>贵企业不参加报送达标评定，销售数据仍应照常上传。</b></span>
      <span class="muted small">标记生效期间不做缺报提醒；连续 {{ NS.breakDays }} 个自然日没有任何数据时，钢厂端会显示“报送中断”。</span>
      <span style="margin-left:auto;white-space:nowrap"><a href="mill-relations.html">查看标记状态 ›</a></span>
    </div>
    <div class="rep-note" style="background:#fffaf2"><b>已收到库存数据，与无库存经营的申报不一致，平台将复核。</b>本企业在标记生效期间仍有库存快照到达（示例企业每天上传库存快照，这里用来演示这条提示）。这是原型的演示状态，可在“带动关系与报送达标”页撤销标记后恢复。</div>
  </div>
  <div v-else class="rep-box">
    <div class="rep-row">
      <b class="rep-k">今日是否已计为报送</b>
      <span class="num muted">2026-11-24</span>
      <el-tag size="small" type="success">已计为报送</el-tag>
      <span class="rep-item"><el-icon style="color:#18a058"><CircleCheckFilled /></el-icon>销售数据　<b>已收到</b><span class="muted small">　首批 09:12 到达</span></span>
      <span class="rep-item"><el-icon style="color:#b0b7c3"><Clock /></el-icon>库存快照　<b style="color:#8b95a3">尚未收到</b><span class="muted small">　日末快照，夜间到达</span></span>
      <span style="margin-left:auto;display:flex;gap:12px;align-items:center;white-space:nowrap">
        <el-button size="small" type="primary" plain @click="ruleDlg = true">报送怎么算</el-button>
        <a href="mill-relations.html">我的报送达标 ›</a>
      </span>
    </div>
    <div class="rep-row">
      <b class="rep-k">所选日期</b>
      <span class="num muted">{{ sel }}</span>
      <template v-if="!selDue">
        <el-tag size="small" type="info" effect="plain">非应报送日</el-tag>
        <span class="rep-item"><el-icon style="color:#18a058"><CircleCheckFilled /></el-icon>销售数据　<b>已收到</b><span class="muted small">　首批 {{ firstAt.sales }} 到达</span></span>
        <span class="rep-item"><el-icon style="color:#18a058"><CircleCheckFilled /></el-icon>库存快照　<b>已收到</b><span class="muted small">　{{ firstAt.inv }} 到达</span></span>
        <span class="small muted">周末、法定节假日不是应报送日：数据照常接收和聚合，不计入达标评定</span>
      </template>
      <template v-else-if="day.status === 'miss'">
        <el-tag size="small" type="danger">缺报</el-tag>
        <span class="rep-item"><el-icon style="color:#d03050"><CircleCloseFilled /></el-icon>销售数据　<b>截止前未收到</b><span class="muted small">　2026-11-17 10:42 才到达</span></span>
        <span class="rep-item"><el-icon style="color:#d03050"><CircleCloseFilled /></el-icon>库存快照　<b>截止前未收到</b><span class="muted small">　2026-11-17 10:44 才到达</span></span>
        <span class="small" style="color:#b83a3e">缺报原因：超过截止时点（补传的数据照常入库，但当天仍计为缺报）</span>
      </template>
      <template v-else>
        <el-tag size="small" type="success" effect="plain">已计为报送</el-tag>
        <span class="rep-item"><el-icon style="color:#18a058"><CircleCheckFilled /></el-icon>销售数据　<b>已收到</b><span class="muted small">　首批 {{ firstAt.sales }} 到达</span></span>
        <span class="rep-item"><el-icon style="color:#18a058"><CircleCheckFilled /></el-icon>库存快照　<b>已收到</b><span class="muted small">　{{ firstAt.inv }} 到达</span></span>
      </template>
      <span class="muted small" style="margin-left:auto;white-space:nowrap">截止时点：业务日期的次日 08:00</span>
    </div>
    <div class="rep-note">
      <b>没有实际数据的日子不算报送，不能用申报代替。</b>应报送日为{{ std.dayType }}（{{ std.dayNote }}）。截止时点前收到该业务日期的库存快照或销售数据，任一即可；当天没有销售的，照常上传库存快照就算。对账申报、空批次、被上传条件全部过滤掉的数据都不算。
      <span v-if="push.cutAlert">截止前 {{ push.cutLead }} 小时仍没有收到任何实际数据时，平台会提醒接收人（<a href="javascript:;" @click="pushDlg = true">每日推送设置</a>）。</span>
      这两项状态只有本企业可见。
    </div>
  </div>

  <div class="ds-top">
    <!-- 日历 -->
    <div class="card">
      <div class="card-title">
        <span>2026 年 11 月<small>点击日期查看当日汇总</small></span>
        <span class="right">
          <el-button size="small" text @click="$info('原型仅提供 2026 年 11 月的示例数据')"><el-icon><ArrowLeft /></el-icon>10 月</el-button>
          <el-button size="small" text disabled>12 月<el-icon><ArrowRight /></el-icon></el-button>
        </span>
      </div>
      <div class="calendar-grid">
        <div class="wk" v-for="w in ['一','二','三','四','五','六','日']" :key="w">{{ w }}</div>
        <div v-for="(c, i) in cells" :key="i" class="day" :class="[c.cls, {sel: c.date && c.date===sel}]" @click="pick(c)">
          <template v-if="c.d">
            <b>{{ c.d }}</b>
            <span class="num">{{ c.text }}</span>
            <em v-if="c.flag">{{ c.flag }}</em>
          </template>
        </div>
      </div>
      <div class="cal-legend">
        <span><i class="ok"></i>正常 {{ month.ok }} 天</span>
        <span><i class="part"></i>部分失败 {{ month.part }} 天</span>
        <span><i class="miss"></i>未上传 {{ month.miss }} 天</span>
        <span><i class="future"></i>未来日期</span>
      </div>
      <div class="tip-box small mt12">
        格内数字为当日入库销量（吨）；11-16 为补传后的数量。<b>正常</b>：全部批次处理完成，失败率不超过告警阈值且对账一致；<b>部分失败</b>：失败率超过阈值或对账有差异；<b>未上传</b>：截至次日 08:00 未收到任何批次。
      </div>
      <div class="row between mt12">
        <span class="small muted">本月截至 {{ dataDate }}：有效上传 <b style="color:#1f2d3d">{{ month.valid }}</b> 天（按时 {{ month.valid - month.miss }} 天，补传 {{ month.miss }} 天）</span>
        <a href="javascript:;" @click="reportDlg = true">月度报告 ›</a>
      </div>
    </div>

    <!-- 当日摘要 -->
    <div class="card">
      <div class="card-title">
        <span>{{ sel }}（周{{ day.wk }}）上传摘要
          <el-tag v-if="day.status==='ok'" type="success" size="small" effect="light" style="margin-left:8px">正常</el-tag>
          <el-tag v-else-if="day.status==='part'" type="warning" size="small" effect="light" style="margin-left:8px">部分失败</el-tag>
          <el-tag v-else type="danger" size="small" effect="light" style="margin-left:8px">未按时上传 · 已补传</el-tag>
        </span>
        <span class="right">
          <el-button size="small" @click="toCheck('')">查看当日明细</el-button>
          <el-button size="small" type="danger" plain :disabled="!day.fail" @click="toCheck('校验失败')"><el-icon><Warning /></el-icon>查看失败明细</el-button>
        </span>
      </div>

      <el-alert v-if="day.alert" :type="day.status==='miss' ? 'error' : 'warning'" show-icon :closable="false" style="margin-bottom:12px">
        <template #title>{{ day.alert }}</template>
      </el-alert>

      <div class="grid c3" style="gap:10px;margin-bottom:10px">
        <div class="mini">
          <div class="k">上传批次数</div>
          <div class="v num">{{ day.batches }}<small>个</small></div>
          <div class="f">销售 {{ day.saleBatches }} 个 · 库存快照 {{ day.invBatches }} 个</div>
        </div>
        <div class="mini">
          <div class="k">接收条数<el-tooltip placement="top" content="平台入口收到的销售数据条数。行级模式为单据行数，日汇总模式为汇总记录数"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
          <div class="v num">{{ $fmt(day.recv) }}<small>条</small></div>
          <div class="f">行级 {{ day.hq.recv }} 行 · 日汇总 {{ day.wx.recv }} 条（含 {{ day.wx.lines }} 行单据）</div>
        </div>
        <div class="mini" style="background:#f7fbff;border-color:#cfe2f8">
          <div class="k">入库条数与吨位</div>
          <div class="v num">{{ $fmt(day.in) }}<small>条</small>{{ $fmt(day.sales) }}<small>吨</small></div>
          <div class="f">行级 {{ day.hq.in }} 行 · 日汇总 {{ day.wx.in }} 条（含 {{ day.wx.inLines }} 行单据）</div>
        </div>
        <div class="mini">
          <div class="k">规则过滤条数<el-tooltip placement="top" content="不符合本企业上传条件规则的数据，在平台入口被二次过滤。被过滤的数据不落盘，平台只记录条数，没有吨位和内容"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
          <div class="v num">{{ day.filt }}<small>条</small></div>
          <div class="f">不落盘，只记录条数　<a href="upload-rules.html">查看规则</a></div>
        </div>
        <div class="mini">
          <div class="k">校验失败条数</div>
          <div class="v num" :style="{color: day.fail ? '#e5484d' : ''}">{{ day.fail }}<small>条</small></div>
          <div class="f"><template v-if="day.fail">失败率 {{ day.failRate }}%　<a href="javascript:;" @click="toCheck('校验失败')">查看失败明细 ›</a></template><template v-else>全部通过字段校验</template></div>
        </div>
        <div class="mini">
          <div class="k">待映射条数<el-tooltip placement="top" content="品名、材质、钢厂或仓库暂时无法对应到平台标准值的数据。待映射数据不参与聚合，映射完成后自动回补"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
          <div class="v num" :style="{color: day.pend ? '#d48806' : ''}">{{ day.pend }}<small>条</small></div>
          <div class="f"><template v-if="day.pend">映射后自动回补　<a href="javascript:;" @click="toCheck('待映射')">去处理 ›</a></template><template v-else>无待映射数据</template></div>
        </div>
      </div>

      <div class="tip-box blue eq">
        销售数据：接收 <b>{{ day.recv }}</b> = 入库 <b>{{ day.in }}</b> + 规则过滤 <b>{{ day.filt }}</b> + 校验失败 <b>{{ day.fail }}</b> + 待映射 <b>{{ day.pend }}</b> + 隔离待确认 <b>{{ day.quar }}</b><template v-if="day.voided"> + 企业已作废 <b>{{ day.voided }}</b></template>。只有“入库”的数据参与聚合。<br>
        库存快照：{{ day.invBatches }} 个批次，入库 <b>{{ $fmt(day.hq.inv + day.wx.inv) }}</b> 条，日末库存 <b>{{ $fmt(day.stock) }}</b> 吨。
      </div>

      <template v-if="price">
        <div class="small muted mt12 mb8">价格与金额<span class="level-tag">仅有“查看价格与金额”权限的成员可见</span></div>
        <div class="grid c3" style="gap:10px;margin-bottom:0">
          <div class="mini">
            <div class="k">带价格的条数占比</div>
            <div class="v num">{{ day.priceRatio }}<small>%</small></div>
            <div class="f">入库 {{ day.in }} 条中 {{ day.priced }} 条带价格；范围外的价格字段不接收<template v-if="day.d === 23">；另有 1 条价格字段隔离待确认</template></div>
          </div>
          <div class="mini">
            <div class="k">金额合计</div>
            <div class="v num">{{ $fmt(day.amount) }}<small>元</small></div>
            <div class="f">带价格销量 {{ $fmt(day.pricedTon) }} 吨 · 含税</div>
          </div>
          <div class="mini">
            <div class="k">当日均价<el-tooltip placement="top" content="金额合计 ÷ 带价格的销量。按本企业默认口径：含税、仓库自提、非暂估"><el-icon><QuestionFilled /></el-icon></el-tooltip></div>
            <div class="v num">{{ $fmt(day.avg) }}<small>元/吨</small></div>
            <div class="f">含税 · 仓库自提 · 非暂估</div>
          </div>
        </div>
      </template>

      <table class="plain-table src-table mt12">
        <thead><tr><th>来源系统</th><th class="r">批次</th><th class="r">接收</th><th class="r">入库</th><th class="r">入库销量(吨)</th><th class="r">规则过滤</th><th class="r">校验失败</th><th class="r">待映射</th><th class="r">隔离</th><th class="r">日末库存(吨)</th></tr></thead>
        <tbody>
          <tr>
            <td><span class="code">SRC-HQ</span> 行级</td><td class="r num">{{ day.hq.saleB + 1 }}</td><td class="r num">{{ day.hq.recv }} 行</td><td class="r num">{{ day.hq.in }} 行</td><td class="r num">{{ $fmt(day.hq.t) }}</td>
            <td class="r num">{{ day.hq.filt }}</td><td class="r num">{{ day.hq.fail }}</td><td class="r num">{{ day.hq.pend }}</td><td class="r num">{{ day.hq.quar }}</td><td class="r num">{{ $fmt(day.hq.stock) }}</td>
          </tr>
          <tr>
            <td><span class="code">SRC-WX</span> 日汇总</td><td class="r num">2</td><td class="r num">{{ day.wx.recv }} 条</td><td class="r num">{{ day.wx.in }} 条</td><td class="r num">{{ $fmt(day.wx.t) }}</td>
            <td class="r num">{{ day.wx.filt }}</td><td class="r num">{{ day.wx.fail }}</td><td class="r num">{{ day.wx.pend }}</td><td class="r num">{{ day.wx.quar }}</td><td class="r num">{{ $fmt(day.wx.stock) }}</td>
          </tr>
          <tr class="total">
            <td>合计</td><td class="r num">{{ day.batches }}</td><td class="r num">{{ day.recv }}</td><td class="r num">{{ day.in }}</td><td class="r num">{{ $fmt(day.sales) }}</td>
            <td class="r num">{{ day.filt }}</td><td class="r num">{{ day.fail }}</td><td class="r num">{{ day.pend }}</td><td class="r num">{{ day.quar }}</td><td class="r num">{{ $fmt(day.stock) }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 对账 -->
  <div class="card">
    <div class="card-title">
      <span>对账：ERP 申报的控制总数 与 平台实际受理、入库<small>业务日期 {{ sel }}</small></span>
      <span class="right small muted">ERP 通过“每日对账申报”接口申报，两种粒度通用；对账申报只用于核对完整性，不算报送</span>
    </div>
    <div class="grid c2" style="margin-bottom:12px">
      <div class="recon" v-for="r in recon" :key="r.src" :class="{bad: !r.ok}">
        <h4>
          <span class="code">{{ r.src }}</span>{{ r.name }}

        for (let d = 1; d <= 30; d++) {
          const date = '2026-11-' + pad(d), x = DAYS[date];
          if (x) out.push({ d, date, cls: x.status, text: STP.fmt(x.sales), flag: x.status === 'part' ? '部分失败' : x.status === 'miss' ? '未上传' : '' });
          else if (d === 24) out.push({ d, cls: 'today', text: '今日' });
          else out.push({ d, cls: 'future', text: '' });
        }
        return out;
      },
      month() {
        const ds = Object.keys(DAYS).map((k) => DAYS[k]);
        const s = (k) => ds.reduce((a, x) => a + x[k], 0);
        return { valid: ds.length, ok: ds.filter((x) => x.status === 'ok').length, part: ds.filter((x) => x.status === 'part').length, miss: ds.filter((x) => x.status === 'miss').length,
          sales: s('sales'), stock: Math.round(s('stock') / ds.length), recv: s('recv'), in: s('in'), filt: s('filt'), fail: s('fail'), pend: s('pend'), quar: s('quar') };
      },
      recon() {
        const d = this.day, p = this.price;
        const hqN = d.hq.in + d.hq.fail + d.hq.pend + d.hq.quar + (d.hq.voided || 0), hqT = r3(d.hq.t + d.hq.exT);
        const wxN = d.wx.in + d.wx.pend, wxT = r3(d.wx.t + d.wx.exT);
        const hq = { src: 'SRC-HQ', name: '总部 ERP', mode: '行级模式', ok: true,
          rows: [{ k: '条数（单据行）', decl: hqN, plat: hqN, d: 0 }, { k: '吨位（吨）', decl: hqT, plat: hqT, d: 3 }],
          note: '平台受理 ' + hqN + ' 行 = 入库 ' + d.hq.in + ' + 校验失败 ' + d.hq.fail + ' + 待映射 ' + d.hq.pend + ' + 隔离待确认 ' + d.hq.quar + (d.hq.voided ? ' + 企业已作废 ' + d.hq.voided : '') + '；另有规则过滤 ' + d.hq.filt + ' 行不落盘，不参与对账。' };
        const wx = { src: 'SRC-WX', name: '无锡分公司进销存', mode: '日汇总模式', ok: !d.wxDiff,
          rows: [{ k: '条数（汇总记录）', decl: wxN + (d.wxDiff ? 1 : 0), plat: wxN, d: 0 }, { k: '吨位（吨）', decl: r3(wxT + (d.wxDiff ? 3.22 : 0)), plat: wxT, d: 3 }],
          note: '平台受理 ' + wxN + ' 条 = 入库 ' + d.wx.in + ' + 待映射 ' + d.wx.pend + '，所含单据行数 ' + d.wx.lines + ' 行（仅用于合理性校验）。' };
        if (p) {
          hq.rows.push({ k: '金额（元，带价格记录）', decl: d.hqAmt, plat: d.hqAmt, d: 2 });
          wx.rows.push({ k: '金额（元，带价格记录）', decl: d.wxAmt + (d.wxDiff ? 11205.6 : 0), plat: d.wxAmt, d: 2 });
        }
        return [hq, wx];
      },
      wxRecon() { return this.recon[1]; },
      group() {
        const g = this.day.groups, t = this.tab;
        if (t === 'cat') return { dim: '品名', sub: '大类', rows: g.cat, note: '品类为平台标准化后的品名。待映射的数据不在表内，映射完成后自动回补。' };
        if (t === 'wh') return { dim: '标准仓库', sub: '所在市 · 来源系统', rows: g.wh, note: '仓库为平台标准仓库。无锡惠山库的数据来自日汇总模式的 SRC-WX，其余来自行级模式的 SRC-HQ。' };
        if (t === 'brand') return { dim: '品牌', sub: '钢厂标准名', rows: g.brand, note: '这里按本企业上传的全部品牌展示。对上游钢厂：其本厂品牌实名展示，其余品牌合并为“其他品牌”，且只有聚合值。' };
        return this.regionMode === 'wh'
          ? { dim: '仓库所在地', sub: '所属省', rows: g.region, note: '销量默认按出库仓库所在地统计；库存按仓库所在地统计。' }
          : { dim: '流向地（收货地）', sub: '所属省', rows: g.dest, note: '流向地为选填字段，当日填报率 ' + ((1 - g.dest[g.dest.length - 1].sales / this.day.sales) * 100).toFixed(0) + '%（按销量），未填报的归入“未填报”；填报率计入质量评分。库存没有流向地口径。' };
      },
    },
    methods: {
      pick(c) { if (c.date) this.sel = c.date; else if (c.d) this.$info(c.cls === 'today' ? '今日数据尚在上传中（销售数据已收到，今日已计为报送），明日 08:00 前生成当日汇总' : '未来日期暂无数据'); },
      toCheck(status) {
        try { sessionStorage.setItem('stp-dc-preset', JSON.stringify({ date: this.sel, status })); } catch (e) { /* ignore */ }
        this.$go('data-check.html');
      },
      savePush() { this.push = JSON.parse(JSON.stringify(this.pushForm)); this.pushDlg = false; this.$demo('推送设置已保存，自明日起生效'); },
    },
  });
})();
</script>
