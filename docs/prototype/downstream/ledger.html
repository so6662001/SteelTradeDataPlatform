<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据使用透明账本 · 下游钢贸端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.sec-nav { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.sec-nav a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--stp-border); border-radius: 16px; background: #fff; font-size: 13px; color: #3d4b5c; text-decoration: none; }
.sec-nav a:hover { border-color: #a8d2ff; color: var(--el-color-primary); }
.sec-nav a i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: #eef4fb; color: #2b5d9b; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; }
.sec-no { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--el-color-primary); color: #fff; font-size: 13px; align-items: center; justify-content: center; margin-right: 8px; font-weight: 600; }
.big-sub { display: flex; align-items: baseline; gap: 8px; }
.big-sub b { font-size: 44px; line-height: 1; font-weight: 600; }
.demo-param { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; }
.rule-table td, .rule-table th { padding: 7px 10px; }
.rule-table td.v { font-weight: 600; white-space: nowrap; }
.preview { border: 1px solid #d9e7fb; border-radius: 8px; background: #fbfdff; padding: 14px; }
.preview-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b7787; margin-bottom: 10px; }
.preview-bar .tagx { padding: 1px 8px; border-radius: 10px; background: #eef4fb; color: #2b5d9b; }
.note-list { margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.7; }
.note-list li { display: flex; gap: 8px; padding: 5px 0; }
.note-list li i { font-style: normal; flex: 0 0 18px; height: 18px; border-radius: 50%; background: #409eff; color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
.see-list { margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.7; }
.see-list li { display: flex; gap: 8px; padding: 4px 0; align-items: flex-start; }
.see-list li .el-icon { margin-top: 4px; flex-shrink: 0; }
.see-list.no .el-icon { color: #e5484d; } .see-list.yes .el-icon { color: #18a058; }
.cert { border: 1px solid var(--stp-border); border-radius: 6px; padding: 14px; background: #fff; }
.cert h4 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.cert h4 .el-icon { color: var(--el-color-primary); font-size: 18px; }
.doc-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--stp-border); font-size: 13px; }
.doc-row:last-child { border-bottom: none; }
.doc-row .meta { color: var(--stp-sub); font-size: 12px; }
.doc-row a { margin-left: auto; white-space: nowrap; }
.el-descriptions__label { white-space: nowrap; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="downstream" active="ledger" title="数据使用透明账本"
  desc="数据安全中心：你的数据被多少家钢厂订阅、钢厂能看到什么、看不到什么、平台人员什么时候经你授权看过明细，都在这里公开。">
  <template #actions>
    <el-button @click="$go('visibility.html')"><el-icon><View /></el-icon>名称可见性设置</el-button>
    <el-button type="danger" plain @click="$go('pause-exit.html')"><el-icon><SwitchButton /></el-icon>暂停与退出</el-button>
  </template>

  <div class="grid c4">
    <stat-card label="当前订阅本企业的钢厂" :value="23" unit="家" icon="OfficeBuilding" tip="按已确认规则，只显示订阅的钢厂家数，不显示钢厂名称，也不按钢厂拆分"><span>较上月 <b class="up">+2</b> 家</span><span>只显示家数</span></stat-card>
    <div class="stat">
      <div class="label">披露门槛</div>
      <div class="value num">k = {{ $PV.k }}<span class="unit">每个数至少 {{ $PV.k }} 家企业</span></div>
      <div class="foot"><span>最小数据池 {{ $PV.nMin }} 家</span><span>优势度 {{ $PV.dom1 }}% / {{ $PV.dom2 }}%</span></div>
      <div class="ico"><el-icon><Lock /></el-icon></div>
    </div>
    <div class="stat">
      <div class="label">平台人员查看本企业明细</div>
      <div class="value num">{{ doneCount }}<span class="unit">次（近 12 个月）</span></div>
      <div class="foot"><span>全部经你授权、限时、留痕</span><b v-if="pendingCount" style="color:#d48806">{{ pendingCount }} 条待你授权</b></div>
      <div class="ico" style="background:#fff8eb;color:#d48806"><el-icon><Key /></el-icon></div>
    </div>
    <div class="stat">
      <div class="label">上传状态</div>
      <div class="value" style="font-size:20px;padding:5px 0 0"><span class="dot ok"></span>正常上传中</div>
      <div class="foot"><span>可随时暂停或退出</span><a href="pause-exit.html">暂停与退出 ›</a></div>
      <div class="ico" style="background:#e8f7ef;color:#18a058"><el-icon><SwitchButton /></el-icon></div>
    </div>
  </div>

  <div class="sec-nav">
    <a v-for="(s, i) in secs" :key="s" href="javascript:;" @click="jump(i)"><i>{{ i + 1 }}</i>{{ s }}</a>
  </div>

  <!-- 1 被订阅情况 -->
  <div class="card" id="sec0">
    <div class="card-title"><span><span class="sec-no">1</span>被订阅情况<small>只显示订阅的钢厂家数，不显示钢厂名称，也不按钢厂拆分</small></span></div>
    <div class="grid c-3-2" style="margin-bottom:0">
      <div>
        <div class="row between">
          <div class="big-sub"><b class="num">23</b><span>家钢厂正在订阅本企业的数据</span></div>
          <span class="small muted">近 12 个月订阅家数（月末）</span>
        </div>
        <ve-chart :option="subChart" height="250px"></ve-chart>
        <div class="tip-box blue small">
          订阅是指钢厂把本企业选入它的数据池。被订阅后，你的数据与池内其他企业的数据<b>加总</b>后才展示给该钢厂；钢厂的数据池不少于 {{ $PV.nMin }} 家企业。平台不向贸易商收费，也不发放现金分成；上传企业可免费使用 <a href="benchmark.html">行业对标数据</a>。
        </div>
      </div>
      <div>
        <div class="small muted mb8">订阅变化记录</div>
        <table class="plain-table rule-table">
          <thead><tr><th>日期</th><th>事件</th><th class="r">变化数</th><th class="r">变化后家数</th></tr></thead>
          <tbody>
            <tr v-for="c in changes" :key="c.d + c.e">
              <td class="num nowrap">{{ c.d }}</td>
              <td><el-tag size="small" effect="plain" :type="c.e==='新增订阅' ? 'success' : c.e==='到期未续' ? 'info' : 'primary'">{{ c.e }}</el-tag></td>
              <td class="r num"><b :class="c.n > 0 ? 'up' : c.n < 0 ? 'down' : ''">{{ c.t }}</b></td>
              <td class="r num">{{ c.a }}</td>
            </tr>
          </tbody>
        </table>
        <div class="small muted mt8" style="line-height:1.7">新增订阅：有钢厂新购名额并选入本企业。到期未续：订阅期满未续费。数据池周期调整：钢厂每自然月可调整一次数据池，下一周期生效。</div>
      </div>
    </div>
  </div>

  <!-- 2 披露规则公示 -->
  <div class="card" id="sec1">
    <div class="card-title">
      <span><span class="sec-no">2</span>披露规则公示<small>当前生效的参数，对所有钢厂一视同仁</small></span>
      <span class="right"><span class="demo-param">示例参数（建议默认值），待业务方确定</span><span class="small muted">现行版本自 2026-07-01 起生效</span></span>
    </div>
    <div class="grid c2" style="margin-bottom:12px">
      <div>
        <div class="small muted mb8">销量与库存</div>
        <table class="plain-table rule-table">
          <thead><tr><th>参数</th><th>当前值</th><th>对你意味着什么</th></tr></thead>
          <tbody>
            <tr><td>最小数据池规模</td><td class="v">{{ $PV.nMin }} 家</td><td>钢厂的数据池少于 {{ $PV.nMin }} 家企业时，不提供任何聚合数值</td></tr>
            <tr><td>最小贡献企业数 k</td><td class="v">{{ $PV.k }} 家</td><td>钢厂看到的每个数至少由 {{ $PV.k }} 家企业的数据加总而成，否则屏蔽</td></tr>
            <tr><td>优势度</td><td class="v">{{ $PV.dom1 }}% / {{ $PV.dom2 }}%</td><td>最大一家占比超过 {{ $PV.dom1 }}%，或前两家合计超过 {{ $PV.dom2 }}% 时同样屏蔽</td></tr>
            <tr><td>企业数展示</td><td class="v">只给区间</td><td>{{ $PV.bands.join('、') }} 家，钢厂看不到精确家数</td></tr>
            <tr><td>吨位修约</td><td class="v">取整到 {{ $PV.roundTon }} 吨</td><td>降低用多次查询做精确差分的可能</td></tr>
            <tr><td>最细粒度</td><td class="v">地级市、日</td><td>不提供区县、仓库、单据级别的数据</td></tr>
            <tr><td>数据时效</td><td class="v">T+1</td><td>当天的数据次日 8:00 前才发布</td></tr>
            <tr><td>数据池变更</td><td class="v">每月 1 次</td><td>下一周期生效，每次替换不超过 20%，防止靠频繁换企业做差分</td></tr>
          </tbody>
        </table>
      </div>
      <div>
        <div class="small muted mb8">价格类（门槛比销量、库存更严）</div>
        <table class="plain-table rule-table">
          <thead><tr><th>参数</th><th>当前值</th><th>对你意味着什么</th></tr></thead>
          <tbody>
            <tr><td class="nowrap">最小有价企业数 k<sub>价</sub></td><td class="v">{{ $PV.kPrice }} 家</td><td>一个均价至少由 {{ $PV.kPrice }} 家上传了价格的企业构成</td></tr>
            <tr><td>价格优势度</td><td class="v">{{ $PV.dom1 }}% / {{ $PV.dom2 }}%</td><td>按有价销量计算，单家或前两家占比过高时屏蔽</td></tr>
            <tr><td>“其他品牌”构成</td><td class="v">至少 {{ $PV.otherBrands }} 个</td><td>且单一品牌不超过 50%，避免合并价实为某一家竞品的价格</td></tr>
            <tr><td>均价修约</td><td class="v">取整到 {{ $PV.roundPrice }} 元/吨</td><td>只展示加权均价，不展示任何单笔成交价</td></tr>
            <tr><td>价格覆盖率</td><td class="v">只给区间</td><td>{{ $PV.coverBands.join('、') }}；不披露有价销量与金额合计</td></tr>
            <tr><td>价格粒度与时效</td><td class="v">日、T+1</td><td>不早于、不细于销量与库存的发布</td></tr>
            <tr><td>量价联动</td><td class="v">量屏蔽则价屏蔽</td><td>销量被屏蔽的单元格，价格一并屏蔽</td></tr>
          </tbody>
        </table>
        <div class="tip-box green small mt12">价格上传由你自愿开启，默认关闭。未开启时，你的数据不进入任何价格指标。</div>
      </div>
    </div>
    <el-alert type="info" show-icon :closable="false" style="margin-bottom:0">
      <template #title><b>参数调整前会通知全部下游企业</b>：通过站内信和短信提前公示调整内容与生效日期；你可以在生效前收紧上传规则、暂停或退出。现行参数上线以来未调整。</template>
    </el-alert>
  </div>

  <!-- 3 上游视角预览 -->
  <div class="card" id="sec2">
    <div class="card-title">
      <span><span class="sec-no">3</span>上游视角预览：钢厂能看到什么<small>以下为示例数据，用来说明展示形态，不是任何钢厂的真实页面</small></span>
    </div>
    <div class="grid c-3-2">
      <div class="preview">
        <div class="preview-bar"><el-icon><Monitor /></el-icon>钢厂看到的页面（示例）<span class="tagx">近 7 日</span><span class="tagx">江苏省 · 按地级市</span><span class="tagx">建筑钢材</span><span class="tagx">数据池 186 家</span></div>
        <table class="plain-table">
          <thead><tr><th>仓库所在地</th><th class="r">销量(吨)</th><th class="c">销量贡献企业数</th><th class="r">期末库存(吨)</th><th class="c">库存贡献企业数</th><th class="r">可销天数</th></tr></thead>
          <tbody>
            <tr v-for="r in sample" :key="r.name" :class="{merged: r.merged}">
              <td class="nowrap"><template v-if="r.merged">其他<span class="merged-row-tag">合并披露</span></template><template v-else>{{ r.name }}</template></td>
              <td class="r"><v-num :v="r.sales"></v-num></td>
              <td class="c"><contrib-tag :band="r.nb"></contrib-tag></td>
              <td class="r"><v-num :v="r.stock"></v-num></td>
              <td class="c"><contrib-tag v-if="r.stock !== null" :band="r.sb"></contrib-tag><mask-cell v-else></mask-cell></td>
              <td class="r"><v-num :v="r.days" :d="1" tip="分子或分母被屏蔽，比率类指标同步屏蔽"></v-num></td>
            </tr>
          </tbody>
        </table>
        <div class="small muted mt8"><span class="mask-cell" style="min-width:30px;height:18px">—</span> 表示样本不足，不予披露。厂家端页面不提供“企业”维度，也不能按企业筛选或排除。</div>
      </div>
      <div>
        <div class="small muted mb8">这张表说明了什么</div>
        <ul class="note-list">
          <li><i>1</i><span><b>只有加总后的数。</b>每个数值都是多家企业合计、并取整到 1 吨的结果，没有哪一行、哪一列对应某一家企业。</span></li>
          <li><i>2</i><span><b>企业数只给区间。</b>钢厂知道“这个数来自 5–9 家”，不知道具体是几家、是哪几家。</span></li>
          <li><i>3</i><span><b>样本不足就屏蔽。</b>贡献企业少于 {{ $PV.k }} 家或某一家占比过高时显示“—”，并且不说明是哪种原因。</span></li>
          <li><i>4</i><span><b>合并披露防倒推。</b>样本不足的城市与最小的可见城市合并成“其他”一行，钢厂无法用合计减去其余各行算出被屏蔽的数。</span></li>
          <li><i>5</i><span><b>品牌只分“本厂”与“其他品牌”。</b>钢厂只能看到自己品牌的数，其余品牌合并展示。</span></li>
        </ul>
      </div>
    </div>

    <div class="grid c-3-2">
      <div class="preview">
        <div class="preview-bar"><el-icon><Monitor /></el-icon>钢厂看到的价格（示例）<span class="tagx">近 7 日</span><span class="tagx">螺纹钢 HRB400E</span><span class="tagx">含税 · 自提 · 非暂估</span></div>
        <table class="plain-table">
          <thead><tr><th>仓库所在地</th><th class="r">加权均价(元/吨)</th><th class="r">较上周</th><th class="c">价格覆盖率</th><th class="c">有价企业数</th></tr></thead>
          <tbody>
            <tr v-for="r in priceSample" :key="r.name">
              <td>{{ r.name }}</td>
              <td class="r"><v-num :v="r.price" tip="上传价格的企业样本不足，不予披露"></v-num></td>
              <td class="r"><template v-if="r.price !== null"><v-num :v="r.d" signed></v-num> <span class="small muted">（{{ $pct(r.p) }}）</span></template><mask-cell v-else></mask-cell></td>
              <td class="c"><cover-tag v-if="r.price !== null" :band="r.cb"></cover-tag><mask-cell v-else></mask-cell></td>
              <td class="c"><contrib-tag v-if="r.price !== null" :band="r.nb"></contrib-tag><mask-cell v-else></mask-cell></td>
            </tr>
          </tbody>
        </table>
        <div class="small muted mt8">样本成交均价，不是市场报价。厂家端页面上<b>没有</b>销售金额合计、有价样本销量、最高价、最低价和价格分布。</div>
      </div>
      <div>
        <div class="small muted mb8">价格的保护比销量、库存更严</div>
        <ul class="note-list">
          <li><i>1</i><span>只出现<b>加权均价、涨跌、价格覆盖率区间、有价企业数区间</b>四项，均价取整到 {{ $PV.roundPrice }} 元/吨。</span></li>
          <li><i>2</i><span>有价企业少于 {{ $PV.kPrice }} 家即屏蔽；销量被屏蔽的地方，价格一并屏蔽。</span></li>
          <li><i>3</i><span>只统计自愿上传价格、且同意参与披露的企业。</span></li>
        </ul>
        <div class="tip-box small mt8" :class="$state.gate==='open' ? 'green' : 'orange'">
          上游价格功能受<b>平台法务闸口</b>控制，取得法务书面意见后才由平台开放。当前状态：<b>{{ $state.gate==='open' ? '已开放' : '未开放，厂家端没有任何价格入口' }}</b>。
        </div>
        <div class="tip-box small mt8">本企业价格上传：<b>{{ $state.dnPrice==='on' ? '已开启，范围内的成交价只以上述聚合形式参与' : '未开启，你的数据不进入任何价格指标' }}</b>。<a href="upload-settings.html">上传设置 ›</a></div>
      </div>
    </div>

    <div class="grid c2" style="margin-bottom:0">
      <div class="cert" style="border-color:#f3c9ca;background:#fffafa">
        <h4><el-icon style="color:#e5484d"><Hide /></el-icon>钢厂看不到的</h4>
        <ul class="see-list no">
          <li v-for="t in cannot" :key="t"><el-icon><CircleClose /></el-icon><span v-html="t"></span></li>
        </ul>
      </div>
      <div class="cert" style="border-color:#cfe9da;background:#fafdfb">
        <h4><el-icon style="color:#18a058"><View /></el-icon>钢厂能看到的（仅限你自主申报的企业画像）</h4>
        <ul class="see-list yes">
          <li v-for="t in can" :key="t"><el-icon><CircleCheck /></el-icon><span>{{ t }}</span></li>
        </ul>
        <div class="small muted mt8">画像由你申报并确认后才展示，修改需重新确认。<a href="visibility.html">去名称可见性设置 ›</a></div>
      </div>
    </div>
    <div class="tip-box blue small mt12" style="margin-bottom:0">
      <b>有带动关系的钢厂多看到两件事。</b>本企业与 <b>东岳钢铁集团有限公司</b> 有带动关系（2025-09-02 邀请，2025-09-05 由本企业确认）。除上面的内容外，它还能在“协议户邀请与接入”里看到本企业<b>是否已接入</b>和<b>各达标周期是达标还是未达标</b>（最近的 2026-10 周期：达标；接入后如出现报送中断、已暂停、已退出，它也能看到），仍然看不到你单家的销量、库存、价格，也看不到及时率数值、上传条数、上传时间、具体哪一天没报和缺报的原因。没有带动关系的钢厂看不到这两项。<a href="mill-relations.html">查看钢厂看到的样子 ›</a>
    </div>
  </div>

  <!-- 4 平台访问记录 -->
  <div class="card" id="sec3">
    <div class="card-title">
      <span><span class="sec-no">4</span>平台访问记录<small>平台人员经你授权查看本企业明细的每一次记录</small></span>
      <span class="right small muted"><el-icon style="vertical-align:-2px"><Lock /></el-icon> 平台人员默认不可查看本企业明细</span>
    </div>
    <el-table :data="tickets" border size="small">

      openAuth(row) { this.cur = row; this.auth = { hours: 2, price: false, notify: true }; this.authDlg = true; },
      doAuth() {
        const r = this.cur;
        r.st = 'active'; r.by = '陈海峰'; r.limit = this.auth.hours + ' 小时'; r.used = '2026-11-24 14:20 起，到期自动收回';
        this.authDlg = false;
        this.$demo('已授权 ' + r.who + ' 在 ' + this.auth.hours + ' 小时内查看指定范围的明细');
      },
      reject(row) { row.st = 'rejected'; row.by = '陈海峰'; row.used = '已拒绝，平台人员无法查看'; this.$demo('已拒绝该访问申请'); },
      revoke(row) { row.st = 'done'; row.used = '实际查看 0 分钟，已提前收回'; this.$demo('已提前收回查看权限'); },
      openDoc(d) { this.doc = d; this.docDlg = true; },
    },
  });
})();
</script>
</body>
</html>
