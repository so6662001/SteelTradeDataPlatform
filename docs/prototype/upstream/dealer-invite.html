<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>协议户邀请与接入 · 上游厂家端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.bound { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bound .box { border: 1px solid var(--stp-border); border-radius: 6px; padding: 12px 14px; background: #fff; }
.bound .box.yes { border-color: #cfe9da; background: #fafdfb; }
.bound .box.no { border-color: #f3c9ca; background: #fffafa; }
.bound h4 { margin: 0 0 8px; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.bound ul { margin: 0; padding: 0; list-style: none; font-size: 13px; line-height: 1.9; color: #4a5568; }
.bound li { display: flex; gap: 6px; align-items: flex-start; }
.bound li .el-icon { margin-top: 5px; flex-shrink: 0; }
.bound .yes .el-icon { color: #18a058; } .bound .no .el-icon { color: #e5484d; }
.no-data-bar { display: flex; align-items: center; gap: 8px; background: #f0f6ff; border: 1px solid #cfe0f7; border-radius: 6px; padding: 9px 14px; font-size: 13px; color: #24528f; margin-bottom: 14px; }
.funnel { display: flex; align-items: stretch; gap: 0; }
.funnel .st { flex: 1; padding: 10px 12px; background: #f4f8ff; border: 1px solid #d9e7fb; position: relative; margin-right: 18px; border-radius: 4px; }
.funnel .st:last-child { margin-right: 0; background: #f0faf4; border-color: #cfe9da; }
.funnel .st:not(:last-child)::after { content: "›"; position: absolute; right: -14px; top: 50%; transform: translateY(-50%); color: #a0a9b6; font-size: 18px; }
.funnel .k { font-size: 12px; color: var(--stp-sub); }
.funnel .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
.funnel .v small { font-size: 12px; font-weight: 400; color: var(--stp-sub); margin-left: 4px; }
.funnel .s { font-size: 12px; color: var(--stp-sub); margin-top: 4px; line-height: 1.5; }
.grade { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 12px; line-height: 20px; border: 1px solid #e1e5eb; background: #f5f6f8; color: #6b7787; white-space: nowrap; }
.grade.g { background: #f0faf4; color: #1b7a47; border-color: #cfe9da; }
.grade.r { background: #fff3f3; color: #b83a3e; border-color: #f3c9ca; }
.ex-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; white-space: nowrap; }
.ph-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #f4ecff; color: #7044c4; border: 1px solid #e0d1fb; font-weight: 400; white-space: nowrap; margin-left: 4px; }
.reward-big { font-size: 28px; font-weight: 600; color: #d46b08; line-height: 1.2; }
.reward-big small { font-size: 13px; font-weight: 400; color: var(--stp-sub); margin-left: 6px; }
.kv2 { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 0; }
.kv2 dt { color: var(--stp-sub); } .kv2 dd { margin: 0; text-align: right; }
.na-why { font-size: 11px; color: #9aa3af; line-height: 1.3; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips .chip { border: 1px solid var(--stp-border); border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--stp-sub); background: #fff; min-width: 96px; }
.chips .chip b { display: block; font-size: 18px; color: #1f2d3d; }
.clause { background: #fafbfc; border: 1px dashed #c8d0db; border-radius: 6px; padding: 12px 14px; font-size: 13px; line-height: 1.9; color: #3d4b5c; }
.steps-line { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #a0a9b6; flex-wrap: wrap; }
.steps-line .on { color: #1b7a47; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="upstream" active="dealer-invite" title="协议户邀请与接入"
  desc="由本厂批量邀请自己的协议户入驻并报送数据，把数据报送写进年度代理协议；查看每家的邀请状态、接入状态和各达标周期的结果。带动协议户入驻可获得带动奖励。由企业管理员和渠道管理员使用。">
  <template #actions>
    <el-button @click="clauseDlg = true"><el-icon><Document /></el-icon>协议报送条款模板</el-button>
    <el-button @click="codeDlg = true"><el-icon><Ticket /></el-icon>邀请码与二维码</el-button>
    <el-button type="primary" @click="openInvite"><el-icon><Promotion /></el-icon>导入协议户名单</el-button>
  </template>

  <div class="no-data-bar"><el-icon><Lock /></el-icon><span><b>本页不提供任何单家数据。</b>这里只有名单、邀请状态、接入状态、各达标周期的结果和带动奖励；没有任何一家协议户的销量、库存、价格、条数、上传时间或日级报送情况，也没有从这里跳到“按某家企业筛选的聚合数据”的入口。</span><a href="javascript:;" style="margin-left:auto;white-space:nowrap" @click="boundDlg = true">可见范围说明</a></div>

  <div class="grid c-2-1">
    <div class="card" style="margin-bottom:0">
      <div class="card-title"><span>带动进度<small>截至 2026-11-24 · 接入状态每日更新一次</small></span><span class="right small muted">接入率 = 已接入 ÷ 已确认；汇总达标率 = 达标 ÷ 参与评定的户数，是本厂全部协议户的汇总数，单家不出现任何百分比</span></div>
      <div class="funnel">
        <div class="st"><div class="k">已邀请</div><div class="v num">{{ D.invited }}<small>户</small></div><div class="s">待发送 {{ D.toSend }} · 已发送 {{ D.sent }} · 已拒绝 {{ D.refused }} · 已过期 {{ D.expired }}</div></div>
        <div class="st"><div class="k">已确认带动关系</div><div class="v num">{{ D.confirmed }}<small>户</small></div><div class="s">已注册认证 {{ D.certified }} · 已签署数据授权协议 {{ D.signed }}</div></div>
        <div class="st"><div class="k">已接入</div><div class="v num">{{ D.connected }}<small>户</small></div><div class="s">接入率 {{ D.accessRate }}% · 含报送中断 8、已暂停 5</div></div>
        <div class="st"><div class="k">达标（{{ S.last }} 周期）</div><div class="v num" style="color:#18a058">{{ D.ok }}<small>户</small></div><div class="s"><template v-if="rateShown">汇总达标率 {{ okRate }}%</template><template v-else>参与评定不足 {{ S.rateMinN }} 户，不显示汇总达标率</template> · 未达标 {{ D.fail }} · 不适用 {{ D.na }}（其中无库存经营 {{ D.naNoStock }}）</div></div>
      </div>
      <div class="small muted" style="margin-top:6px">汇总达标率 = 达标 ÷ 参与评定的户数（达标 + 未达标，本周期 {{ D.ok + D.fail }} 户）；不适用的户（含无库存经营）不计入分子和分母。参与评定不足 {{ S.rateMinN }} 户时不显示汇总达标率，只显示户数。<span class="ex-tag" style="margin-left:4px">示例参数</span></div>
      <div class="tip-box green small mt12" style="line-height:1.9">
        <b>协议户照常占用付费名额，带动奖励可抵用。</b>已接入的 {{ D.connected }} 户中：已选入本厂数据池 <b class="num">{{ D.seat.inPool }}</b> 户，各占 1 个付费名额（计入已购的 {{ D.seat.bought }} 个，含待生效）；已对本厂上架、尚未选入 <b class="num">{{ D.seat.listedOut }}</b> 户；未对本厂上架或匿名上架未确认对应关系 <b class="num">{{ D.seat.hidden }}</b> 户，不能选入。<br>
        把 {{ D.seat.listedOut }} 户全部选入需要 {{ D.seat.listedOut }} 个名额：已购名额没有未分配的，奖励名额可抵用 <b class="num">{{ D.seat.rewardFree }}</b> 个，其余 <b class="num">{{ D.seat.needBuy }}</b> 个须加购。　<a href="directory.html">去企业名录选入 ›</a>　<a href="quota-package.html" @click="presetAdd">加购试算 ›</a>
      </div>
      <div class="tip-box small mt8">
        <b>二级经销商<span class="ph-tag">二期</span>：</b>经一级代理带动接入的二级经销商，全厂合计 <b class="num">{{ D.subConnected }}</b> 户。二级经销商由一级代理自己邀请，名单只对一级代理可见；这里只有全厂汇总户数，不显示名单，不按一级代理拆分。二级经销商本人确认与本厂建立带动关系后，才进入逐户列表。
      </div>
    </div>

    <div class="card" style="margin-bottom:0">
      <div class="card-title"><span>我的带动奖励<small>规则 {{ R.ver }}</small></span><span class="ex-tag">示例参数，待业务方确定</span></div>
      <div class="reward-big num">{{ D.reward.quota }} 个<small>奖励名额，{{ D.reward.last }} 考核期发放</small></div>
      <dl class="kv2 mt12">
        <dt>{{ D.reward.last }} 计入奖励的带动户数</dt><dd><b class="num">{{ D.reward.counted }}</b> 户</dd>
        <dt>{{ D.reward.cur }} 考核期</dt><dd>核算中，考核期结束后公布</dd>
        <dt>奖励名额有效期</dt><dd class="num">至 {{ D.reward.validTo }}</dd>
        <dt>已使用</dt><dd><span class="num">{{ D.reward.used }}</span> 个　<a href="javascript:;" @click="tab = 'reward'">查看</a></dd>
      </dl>
      <div class="small muted mt8" style="line-height:1.7">只给计入奖励的汇总户数，不逐户标注哪一户计入。下游贸易商不获得现金奖励。</div>
    </div>
  </div>

  <div class="card">
    <el-tabs v-model="tab">
      <el-tab-pane name="list"><template #label>名单与邀请 <span class="muted small">&nbsp;{{ D.invited }}</span></template></el-tab-pane>
      <el-tab-pane name="access"><template #label>接入状态 <span class="muted small">&nbsp;{{ D.confirmed }}</span></template></el-tab-pane>
      <el-tab-pane name="std" label="报送达标"></el-tab-pane>
      <el-tab-pane name="reward" label="我的带动奖励"></el-tab-pane>
    </el-tabs>

    <!-- ① 名单与邀请 -->
    <template v-if="tab === 'list'">
      <el-alert type="info" show-icon :closable="false" style="margin-bottom:12px">
        <template #title><b>平台不会告知对方是否已入驻。</b>导入和发送邀请时，不提示对方是否已在平台、是否已上架、是否已与其他钢厂建立带动或订阅关系。对方确认带动关系之前，状态一律显示“已发送”；确认之后才显示后续节点。名单只对本厂可见，平台不向其他钢厂展示，也不用于推荐。</template>
      </el-alert>
      <div class="row between mb12">
        <div class="row">
          <el-input v-model="f.kw" placeholder="协议户名称" clearable style="width:190px"><template #prefix><el-icon><Search /></el-icon></template></el-input>
          <el-select v-model="f.inv" clearable placeholder="全部邀请状态" style="width:170px"><el-option v-for="s in invStates" :key="s" :label="s" :value="s" /></el-select>
          <el-select v-model="f.region" clearable placeholder="全部销售大区" style="width:140px"><el-option v-for="r in D.regions" :key="r[0]" :label="r[0]" :value="r[0]" /></el-select>
          <el-button @click="f.kw = ''; f.inv = ''; f.region = ''">重置</el-button>
        </div>
        <div class="row">
          <el-button @click="addDlg = true"><el-icon><Plus /></el-icon>逐条添加</el-button>
          <el-button @click="$demo('已导出协议户名单及邀请、接入、达标状态，含“无库存经营”标签和“不适用”的原因类别。文件不含任何数值和百分比，带水印并留痕')"><el-icon><Download /></el-icon>导出名单与状态<span class="ph-tag">二期</span></el-button>
        </div>
      </div>
      <el-table :data="filtered" size="default">
        <el-table-column label="协议户" min-width="220"><template #default="{row}"><b style="font-weight:500">{{ row.name }}</b><el-tag v-if="row.ns" size="small" type="info" effect="plain" style="margin-left:6px">无库存经营</el-tag><div class="muted small">{{ row.loc }}</div></template></el-table-column>
        <el-table-column label="销售大区" width="88" prop="region" />
        <el-table-column label="协议年度与报送条款" width="170"><template #default="{row}">{{ row.year }}<div class="muted small">{{ row.clause ? '已约定报送条款' : '未登记报送条款' }}</div></template></el-table-column>
        <el-table-column label="邀请方式与发送时间" width="170"><template #default="{row}">{{ row.way }}<div class="muted small num">{{ row.at || '尚未发送' }}</div></template></el-table-column>
        <el-table-column min-width="300">
          <template #header>邀请状态<el-tooltip placement="top" content="待发送 → 已发送 → 已确认带动关系 → 已注册认证 → 已签署数据授权协议；分支为已拒绝、已过期、已撤回。对方确认之前只显示到“已发送”"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template>
          <template #default="{row}">
            <div v-if="invStep(row.inv) >= 2" class="steps-line"><span v-for="(s, i) in ['已确认带动关系', '已注册认证', '已签署数据授权协议']" :key="s" :class="{on: invStep(row.inv) >= i + 2}">{{ i ? '›　' : '' }}<el-icon v-if="invStep(row.inv) >= i + 2" style="vertical-align:-2px"><CircleCheck /></el-icon> {{ s }}</span></div>
            <el-tag v-else size="small" :type="invType(row.inv)" effect="plain">{{ row.inv }}</el-tag>
          </template>
        </el-table-column>
        <el-table-column label="操作" width="190">
          <template #default="{row}">
            <template v-if="row.inv === '待发送'"><el-button link type="primary" @click="send(row)">发送邀请</el-button><el-button link type="danger" @click="drop(row, '作废')">作废</el-button></template>
            <template v-else-if="row.inv === '已发送'"><el-button link type="primary" @click="$demo('已按固定模板重发邀请')">重发</el-button><el-button link type="danger" @click="drop(row, '撤回')">撤回</el-button></template>
            <template v-else-if="row.inv === '已过期' || row.inv === '已撤回'"><el-button link type="primary" @click="send(row)">重新邀请</el-button></template>
            <template v-else-if="row.inv === '已拒绝'"><span class="muted small">对方已拒绝，不再发送</span></template>
            <template v-else><el-button link type="danger" @click="remove(row)">移除协议户</el-button></template>
          </template>
        </el-table-column>
      </el-table>
      <div class="tbl-foot">
        <span>共 {{ D.invited }} 户，原型展示 {{ rows.length }} 户示例　|　每户一个专属邀请链接（一次性令牌，有有效期）；短信、邮件用平台固定模板，含“钢厂能看到什么、看不到什么”的说明入口</span>
        <el-pagination layout="prev, pager, next" :total="D.invited" :page-size="16" small background />
      </div>
      <div class="card-title" style="margin-top:14px"><span>邀请批次<small>按批次汇总，只有户数</small></span></div>
      <el-table :data="batches" size="small">
        <el-table-column label="批次" min-width="170"><template #default="{row}"><span class="num">{{ row.id }}</span><span class="muted small">　{{ row.note }}</span></template></el-table-column>
        <el-table-column label="方式" width="120" prop="way" />
        <el-table-column label="发起时间" width="110"><template #default="{row}"><span class="num">{{ row.at }}</span></template></el-table-column>
        <el-table-column label="名单户数" width="90" align="right"><template #default="{row}"><span v-if="row.n" class="num">{{ row.n }}</span><el-tooltip v-else content="邀请码没有预设名单，以实际确认为准" placement="top"><span class="muted">—</span></el-tooltip></template></el-table-column>
        <el-table-column label="已确认带动关系" width="130" align="right"><template #default="{row}"><span class="num">{{ row.cf }}</span></template></el-table-column>
        <el-table-column label="发起人" width="150"><template #default="{row}">{{ row.by }}</template></el-table-column>
        <el-table-column label="链接有效期" width="130"><template #default="{row}"><span class="num">{{ row.exp }}</span></template></el-table-column>
      </el-table>
    </template>

    <!-- ② 接入状态 -->
    <template v-else-if="tab === 'access'">
      <div class="row between mb12" style="align-items:flex-start">
        <div class="chips">
          <div v-for="a in D.access" :key="a[0]" class="chip"><b class="num">{{ a[1] }}</b>{{ a[0] }}</div>
          <div v-for="a in D.left" :key="a[0]" class="chip" style="background:#fafbfc"><b class="num">{{ a[1] }}</b>{{ a[0] }}</div>
        </div>
        <div class="small muted" style="max-width:420px;line-height:1.7;text-align:right">前五项为已确认带动关系的 {{ D.confirmed }} 户的当前状态；已退出、已解除关联不再产生新状态。业务方已确认钢厂可见已接入、报送中断、已暂停、已退出；“未接入”是已接入的反面，“接入中”指已创建应用或联调中。“已接入”以首次有效报送为准，不显示首次报送的内容和规模；“报送中断”只表示连续 {{ S.breakDays }} 天没有收到任何实际数据（销售或库存快照）。</div>
      </div>
      <div class="grid c-3-2">
        <div>
          <el-table :data="accessRows" size="default">
            <el-table-column label="协议户" min-width="210"><template #default="{row}"><b style="font-weight:500">{{ row.name }}</b><el-tag v-if="row.ns" size="small" type="info" effect="plain" style="margin-left:6px">无库存经营</el-tag><div class="muted small">{{ row.region }} · {{ row.loc }}</div></template></el-table-column>
            <el-table-column label="接入状态" width="110"><template #default="{row}"><el-tag size="small" :type="accType(row.acc)" effect="plain">{{ row.acc }}</el-tag></template></el-table-column>
            <el-table-column width="120" align="center">
              <template #header>对本厂上架<el-tooltip placement="top" content="企业对本厂上架可见，才能选入本厂数据池。未对本厂上架，或为匿名上架且未确认与协议户身份对应的，这里不显示"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template>
              <template #default="{row}"><span v-if="row.listed" class="grade g">是</span><span v-else class="muted">—</span></template>
            </el-table-column>
            <el-table-column label="在我的数据池" width="120" align="center"><template #default="{row}"><span v-if="!row.listed" class="muted">—</span><span v-else-if="row.pool" class="grade g">是</span><span v-else class="grade">否</span></template></el-table-column>
            <el-table-column label="操作" width="150">
              <template #default="{row}">
                <el-button v-if="row.listed && !row.pool && row.acc === '已接入'" link type="primary" @click="$go('directory.html')">加入数据池</el-button>
                <el-button v-else-if="['未接入', '接入中', '报送中断'].indexOf(row.acc) >= 0" link type="primary" @click="urge(row)">{{ row.urged ? '已催办' : '催办' }}<span v-if="!row.urged" class="ph-tag">二期</span></el-button>
                <span v-else class="muted">—</span>
              </template>
            </el-table-column>
          </el-table>
          <div class="tbl-foot"><span>共 {{ D.confirmed }} 户，原型展示 {{ accessRows.length }} 户示例。催办用平台固定模板，有频率上限并保留记录</span><span></span></div>
        </div>
        <div>
          <div class="row between mb8"><b style="font-size:13px">分组汇总</b><el-radio-group v-model="groupBy" size="small"><el-radio-button label="销售大区" value="regions" /><el-radio-button label="协议年度" value="years" /></el-radio-group></div>
          <table class="plain-table">
            <thead><tr><th>{{ groupBy === 'regions' ? '销售大区' : '协议年度' }}</th><th class="r">已邀请</th><th class="r">已确认</th><th class="r">已接入</th><th class="r">接入率</th></tr></thead>
            <tbody>

      drop(row, word) {
        ElementPlus.ElMessageBox.confirm(word + '后 ' + row.name + ' 的专属邀请链接失效，可稍后重新邀请。', word + '邀请', { confirmButtonText: '确认' + word, cancelButtonText: '取消', type: 'warning' })
          .then(() => { if (word === '作废') this.rows.splice(this.rows.indexOf(row), 1); else row.inv = '已撤回'; this.$demo('已' + word); }).catch(() => {});
      },
      remove(row) {
        ElementPlus.ElMessageBox.confirm('移除后，本厂不再看到 ' + row.name + ' 的新状态；带动关系解除，对方会收到通知。已发布的历史周期结果的保留期限待业务方确定。对方也可以单方解除带动关系。', '移除协议户', { confirmButtonText: '确认移除', cancelButtonText: '取消', type: 'warning' })
          .then(() => { row.inv = '已撤回'; row.acc = '已解除关联'; this.$demo('已移除，带动关系已解除'); }).catch(() => {});
      },
      naWhy(row, i) {
        if (row.ns && S.cycles[i] >= row.ns) return '无库存经营';
        const first = row.cyc.findIndex((c) => c !== NA);
        if (first >= 0 ? i < first : (row.acc !== '已接入' || i < S.cycles.length - 1)) return '尚未接入';
        return '中途成立或天数不足';
      },
      urge(row) { if (row.urged) return; row.urged = true; this.$demo('已按固定模板向 ' + row.name + ' 的企业管理员发送提醒（每户每 7 天最多 1 次）。提醒内容不含任何数据'); },
      addOne() { this.rows.push(A(this.add.name, '—', this.add.region || '—', this.add.year, this.add.clause, '逐条添加', '', '待发送', '', null, 0)); this.addDlg = false; this.add.name = ''; this.$demo('已添加到名单，状态为“待发送”'); },
      sendInvite() { this.inv.show = false; this.tab = 'list'; this.batches.unshift({ id: 'INV-20261124-01', note: '本次导入', way: '名单导入', at: M.TODAY, n: 26, cf: 0, by: '周立明（企业管理员）', exp: '至 ' + STP.addDays(M.TODAY, +this.inv.exp) }); this.$demo('已向 26 户发送邀请，状态均为“已发送”'); },
    },
  });
})();
</script>
</body>
</html>
