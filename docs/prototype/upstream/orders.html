<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>订单与订阅 · 上游厂家端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.od-tbl .el-table .cell { padding: 0 8px; }
.od-no { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 12px; }
.two { line-height: 18px; font-size: 12.5px; }
.two span { display: block; color: var(--stp-sub); font-size: 12px; }
.ex-tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 11px; line-height: 18px; background: #fff8eb; color: #9a6400; border: 1px solid #f3dfb8; font-weight: 400; white-space: nowrap; }
.drawer-sec { font-size: 14px; font-weight: 600; margin: 18px 0 10px; display: flex; align-items: center; gap: 6px; }
.drawer-sec::before { content: ""; width: 3px; height: 14px; background: var(--el-color-primary); border-radius: 2px; }
.file-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--stp-border); border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
.file-row .el-icon { font-size: 20px; color: #409eff; }
.file-row .meta { flex: 1; min-width: 0; }
.file-row .meta span { display: block; color: var(--stp-sub); font-size: 12px; }
.el-descriptions__label { white-space: nowrap; }
.rule-ol { margin: 0; padding-left: 20px; line-height: 1.9; font-size: 13px; }
.sum-line { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; background: #f6f8fa; border-radius: 6px; margin-top: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="upstream" active="orders" title="订单与订阅" watermark
  desc="查看名额与订阅批次、订单与支付状态，下载合同与发票，办理续费与扩容。计费单位为名额：1 个名额 = 1 家下游企业 × 1 个计费周期。">
  <template #actions>
    <el-button @click="openInvoice()"><el-icon><Document /></el-icon>申请发票</el-button>
    <el-button @click="openRenew(batches[0])"><el-icon><Refresh /></el-icon>续费</el-button>
    <el-button type="primary" @click="$go('directory.html')"><el-icon><Plus /></el-icon>扩容（加购名额）</el-button>
  </template>

  <el-alert type="info" show-icon :closable="false">
    <template #title>
      到期提醒：当前订阅将于 <b>2027-03-31</b> 到期，剩余 <b>128</b> 天。平台会在到期前 30 天、7 天、1 天通过站内信、短信和邮件提醒；到期未续费，数据池失效并停止访问。
      <a href="javascript:;" @click="openRenew(batches[0])">提前续费 ›</a>
    </template>
  </el-alert>
  <el-alert v-if="unpaid" type="warning" show-icon :closable="false">
    <template #title>
      有 1 笔订单待支付：<b>{{ unpaid.id }}</b>（{{ unpaid.goods }}，{{ $fmt(unpaid.amount) }} 元）。
      <template v-if="!unpaid.proof">请上传转账凭证，平台财务核销后生效。<a href="javascript:;" @click="openProof(unpaid)">上传转账凭证 ›</a></template>
      <template v-else>转账凭证已上传，等待平台财务核销。</template>
    </template>
  </el-alert>

  <div class="grid c5">
    <stat-card label="已购名额" :value="200" unit="个" icon="Tickets" tip="当前生效批次的名额总数">
      <span>订阅期 2026-04-01 至 2027-03-31</span><span>年付</span>
    </stat-card>
    <stat-card label="已分配" :value="186" unit="个" icon="OfficeBuilding" tip="已分配给数据池内企业的名额。冻结名额可免费替换或顺延">
      <span>有效 <b>183</b></span><span>冻结 <b style="color:#e5484d">3</b></span><a href="pool.html">查看数据池 ›</a>
    </stat-card>
    <stat-card label="待生效" :value="14" unit="个" icon="Clock" tip="已分配（待生效）：已指定企业、等待下一个数据池调整周期生效的名额。生效前企业数据不进入聚合。这 14 个都是主批次内的未分配名额分配出去的（2026-11-19 数据池调整新增 1 家，2026-11-20 企业名录选购 13 家），不属于加购，不产生新费用；加购名额的计划生效日同时是计费起始日">
      <span>计划生效日 <b>2026-12-01</b></span><span>另有加购 <b>30</b> 个待核销</span>
    </stat-card>
    <stat-card label="未分配" :value="0" unit="个" icon="Box" tip="主批次 200 个名额已全部分配：在池 186 个、待生效 14 个。未分配名额在 2026-11-20 的选购中用完，再新增企业需要加购。分配未分配名额不属于加购，不产生新费用">
      <span>名额包已全部分配</span><a href="directory.html">去加购 ›</a>
    </stat-card>
    <div class="stat">
      <div class="label">最近到期</div>
      <div class="value num">2027-03-31</div>
      <div class="foot"><span>剩余 <b>128</b> 天</span><span>提前 30、7、1 天提醒</span></div>
      <div class="ico"><el-icon><Timer /></el-icon></div>
    </div>
  </div>

  <div class="card od-tbl">
    <div class="card-title"><span>订阅批次<small>各批次的名额数与到期日；周期内加购的名额并入主批次，到期日对齐，起始日为计划生效日（即计费起始日）</small></span></div>
    <el-table :data="batches" size="default">
      <el-table-column label="批次" min-width="200"><template #default="{row}"><b>{{ row.name }}</b><div class="muted small" style="line-height:18px"><span class="od-no">{{ row.id }}</span> · 来源订单 <a href="javascript:;" class="od-no" @click="openDetailById(row.order)">{{ row.order }}</a></div></template></el-table-column>
      <el-table-column label="名额数" width="230"><template #default="{row}"><b class="num">{{ row.qty }}</b> 个<span v-if="row.assigned" class="muted small">（已分配 {{ row.assigned }}<template v-if="row.wait">，待生效 {{ row.wait }}</template>）</span></template></el-table-column>
      <el-table-column label="起止" width="210"><template #default="{row}"><span class="num">{{ row.start }} 至 {{ row.end }}</span></template></el-table-column>
      <el-table-column label="剩余天数" width="110"><template #default="{row}"><span v-if="row.left" class="num">{{ row.left }} 天</span><span v-else class="muted">—</span></template></el-table-column>
      <el-table-column label="状态" width="190">
        <template #default="{row}"><el-tag size="small" :type="BST[row.status]">{{ row.status }}</el-tag><span v-if="row.note" class="muted small" style="margin-left:6px">{{ row.note }}</span></template>
      </el-table-column>
      <el-table-column label="操作" width="130">
        <template #default="{row}">
          <template v-if="row.status === '生效中'">
            <el-button link type="primary" @click="openRenew(row)">续费</el-button>
            <el-button link type="primary" @click="$go('directory.html')">扩容</el-button>
          </template>
          <el-button v-else-if="row.status === '待支付'" link type="primary" @click="openDetailById(row.order)">查看订单</el-button>
          <span v-else class="muted">—</span>
        </template>
      </el-table-column>
    </el-table>
  </div>

  <div class="card od-tbl">
    <div class="card-title" style="margin-bottom:4px"><span>我的订单</span><span class="ex-tag">金额按示例参数计算，待业务方确定</span></div>
    <el-tabs v-model="tab">
      <el-tab-pane v-for="t in tabs" :key="t.k" :name="t.k"><template #label>{{ t.t }} <span class="muted small">&nbsp;{{ countOf(t.k) }}</span></template></el-tab-pane>
    </el-tabs>
    <el-table :data="shown" size="default">
      <el-table-column label="订单号" width="146"><template #default="{row}"><a href="javascript:;" class="od-no" @click="openDetail(row)">{{ row.id }}</a><div class="muted small num" style="line-height:16px">{{ row.at }}</div></template></el-table-column>
      <el-table-column label="商品" min-width="140"><template #default="{row}">{{ row.goods }}<div class="muted small" style="line-height:16px">{{ row.sub }}</div></template></el-table-column>
      <el-table-column label="名额数" width="60" align="right"><template #default="{row}"><span class="num">{{ row.qty }}</span></template></el-table-column>
      <el-table-column label="周期" width="176"><template #default="{row}"><div class="two">{{ row.cycle }}<span class="num">{{ row.start }} 至 {{ row.end }}</span></div></template></el-table-column>
      <el-table-column label="金额（元）" width="92" align="right"><template #default="{row}"><b class="num">{{ $fmt(row.amount) }}</b></template></el-table-column>
      <el-table-column label="支付方式" width="130"><template #default="{row}"><div class="two">{{ row.pay }}<span :style="{color: row.status === '待支付' ? '#b26a00' : ''}">{{ row.payNote }}</span></div></template></el-table-column>
      <el-table-column label="状态" width="78"><template #default="{row}"><el-tag size="small" :type="OST[row.status]" :effect="row.status === '已取消' || row.status === '已到期' ? 'plain' : 'light'">{{ row.status }}</el-tag></template></el-table-column>
      <el-table-column label="合同" width="56">
        <template #default="{row}"><el-button v-if="row.contract" link type="primary" @click="$demo('已开始下载合同 ' + row.contract + '.pdf')">下载</el-button><span v-else class="muted">—</span></template>
      </el-table-column>
      <el-table-column label="发票" width="84">
        <template #default="{row}">
          <template v-if="row.invoice === '已开票'"><span class="dot ok"></span><a href="javascript:;" @click="$demo('已开始下载发票（' + row.id + '）')">已开票</a></template>
          <template v-else-if="row.invoice === '开票中'"><span class="dot info"></span>开票中</template>
          <el-button v-else-if="canInvoice(row)" link type="primary" @click="openInvoice(row)">申请开票</el-button>
          <el-tooltip v-else-if="row.status === '待支付'" content="订单支付并核销后可申请开票" placement="top"><span class="muted">待支付</span></el-tooltip>
          <span v-else class="muted">—</span>
        </template>
      </el-table-column>
      <el-table-column label="操作" width="172">
        <template #default="{row}">
          <template v-if="row.status === '待支付'">
            <el-button v-if="row.pay === '对公转账' && !row.proof" link type="primary" @click="openProof(row)">上传凭证</el-button>
            <el-tooltip v-else-if="row.pay === '对公转账'" content="原型演示：模拟平台财务核销通过" placement="top"><el-button link type="warning" @click="verify(row)">模拟核销</el-button></el-tooltip>
            <el-button link type="primary" @click="openDetail(row)">详情</el-button>
            <el-button link type="info" @click="cancel(row)">取消</el-button>
          </template>
          <template v-else>
            <el-button link type="primary" @click="openDetail(row)">详情</el-button>
            <el-button v-if="row.status === '生效中'" link type="primary" @click="openRenew(batches[0])">续费</el-button>
            <el-button v-if="row.status === '已到期' || row.status === '已取消'" link type="primary" @click="$go('quota-package.html')">再次购买</el-button>
          </template>
        </template>
      </el-table-column>
      <template #empty><el-empty :description="'暂无' + tabs.find(t => t.k === tab).t + '的订单'" :image-size="80"><el-button v-if="tab === 'wait'" size="small" @click="tab = 'unpaid'">查看待支付订单</el-button></el-empty></template>
    </el-table>
    <div class="tbl-foot">
      <span>订单状态：待支付 → 已支付（待生效）→ 生效中 → 已到期；未生效订单可全额退款，已生效订单的退款规则以合同约定为准</span>
      <span>共 {{ shown.length }} 笔</span>
    </div>
  </div>

  <!-- 订单详情 -->
  <el-drawer v-model="drawer" size="620px" :title="cur ? '订单详情 · ' + cur.id : '订单详情'">
    <template v-if="cur">
      <div class="row between">
        <div class="row"><el-tag :type="OST[cur.status]">{{ cur.status }}</el-tag><b>{{ cur.goods }}</b></div>
        <div>
          <el-button v-if="cur.status === '待支付' && cur.pay === '对公转账' && !cur.proof" type="primary" size="small" @click="openProof(cur)"><el-icon><Upload /></el-icon>上传转账凭证</el-button>
          <el-button v-if="cur.status === '待支付' && cur.proof" type="warning" plain size="small" @click="verify(cur)">原型演示：模拟财务核销</el-button>
          <el-button v-if="canInvoice(cur)" size="small" @click="openInvoice(cur)">申请发票</el-button>
        </div>
      </div>
      <div class="drawer-sec">订单信息</div>
      <el-descriptions :column="2" border size="small">
        <el-descriptions-item label="订单号"><span class="od-no">{{ cur.id }}</span></el-descriptions-item>
        <el-descriptions-item label="下单时间"><span class="num">{{ cur.at }}</span></el-descriptions-item>
        <el-descriptions-item label="购买主体" :span="2">东岳钢铁集团有限公司<span class="muted small">（集团关联企业归并为同一购买主体）</span></el-descriptions-item>
        <el-descriptions-item label="商品">{{ cur.goods }}</el-descriptions-item>
        <el-descriptions-item label="名额数"><span class="num">{{ cur.qty }}</span> 个</el-descriptions-item>
        <template v-if="cur.eff">
          <el-descriptions-item label="计划生效日"><b class="num">{{ cur.eff }}</b><span class="muted small">（即计费起始日）</span></el-descriptions-item>
          <el-descriptions-item label="指定新增企业">{{ cur.ents }}</el-descriptions-item>
          <el-descriptions-item v-if="cur.pick" label="本次选购" :span="2">{{ cur.pick }}</el-descriptions-item>
          <el-descriptions-item label="计费起止日"><span class="num">{{ cur.start }} 至 {{ cur.end }}</span></el-descriptions-item>
          <el-descriptions-item label="计费天数"><b class="num">{{ cur.billDays }}</b> 天（含首尾）</el-descriptions-item>
          <el-descriptions-item label="不收费期间" :span="2"><span class="num">{{ cur.freeSpan }}</span>（下单日至生效日前一日）</el-descriptions-item>
          <el-descriptions-item v-if="cur.cutoff && cur.status === '待支付'" label="截单时点" :span="2">{{ cur.cutoff }} <span class="ex-tag">截单时点与差额处理待确认（N-27）</span></el-descriptions-item>
        </template>
        <template v-else>
          <el-descriptions-item label="周期">{{ cur.cycle }}</el-descriptions-item>
          <el-descriptions-item label="有效期"><span class="num">{{ cur.start }} 至 {{ cur.end }}</span></el-descriptions-item>
        </template>
        <el-descriptions-item label="金额构成" :span="2">{{ cur.formula }} = <b class="num">{{ $fmt(cur.amount) }}</b> 元 <span class="ex-tag">示例参数，待业务方确定</span></el-descriptions-item>
        <el-descriptions-item v-if="cur.rule" label="计费规则" :span="2">{{ cur.rule }}</el-descriptions-item>
        <el-descriptions-item label="支付方式">{{ cur.pay }}</el-descriptions-item>
        <el-descriptions-item label="支付状态">{{ cur.payNote }}</el-descriptions-item>
        <el-descriptions-item label="发票">{{ cur.invoice || '—' }}<span v-if="cur.invoiceNote" class="muted small">（{{ cur.invoiceNote }}）</span></el-descriptions-item>
        <el-descriptions-item label="下单人">{{ cur.by }}</el-descriptions-item>
        <el-descriptions-item v-if="cur.remark" label="备注" :span="2">{{ cur.remark }}</el-descriptions-item>
      </el-descriptions>

      <div class="drawer-sec">状态流转</div>
      <el-timeline style="padding-left:2px">
        <el-timeline-item v-for="(s, i) in cur.flow" :key="i" :timestamp="s.at" :type="s.type || 'primary'" placement="top">
          <b>{{ s.t }}</b><span v-if="s.who" class="muted small">　{{ s.who }}</span>
          <div v-if="s.d" class="muted small">{{ s.d }}</div>
        </el-timeline-item>
        <el-timeline-item v-for="s in cur.next" :key="s" type="info" hollow placement="top"><span class="muted">{{ s }}</span></el-timeline-item>
      </el-timeline>

      <div class="drawer-sec">合同</div>
      <div v-if="cur.contract" class="file-row">
        <el-icon><Document /></el-icon>
        <div class="meta">《钢贸数据服务订单合同》<span>合同编号 {{ cur.contract }} · {{ cur.contractNote }} · 含禁止再识别条款</span></div>
        <el-button size="small" @click="$demo('已开始下载合同 ' + cur.contract + '.pdf')"><el-icon><Download /></el-icon>下载</el-button>
      </div>
      <div v-else class="muted small">订单未生效，合同未签署。</div>

      <div class="drawer-sec">支付凭证</div>
      <div v-if="cur.proof" class="file-row">
        <el-icon><Picture /></el-icon>
        <div class="meta">{{ cur.proof.file }}<span>上传人 {{ cur.proof.by }} · {{ cur.proof.at }} · {{ cur.proof.note }}</span></div>
        <el-button size="small" @click="$info('原型演示：预览转账凭证')">查看</el-button>
      </div>
      <div v-else-if="cur.pay === '在线支付'" class="muted small">在线支付订单无需上传凭证，支付流水可在货袋子账户中心查看。</div>
      <div v-else-if="cur.status === '待支付'" class="tip-box orange small">尚未上传转账凭证。请向平台收款账户转账并在附言中填写订单号，上传凭证后由平台财务核销。<a href="javascript:;" @click="openProof(cur)">上传转账凭证 ›</a></div>
      <div v-else class="muted small">未上传支付凭证。</div>
    </template>
  </el-drawer>

  <!-- 续费 -->
  <el-dialog v-model="renew.show" title="续费" width="640px" top="7vh">
    <div class="tip-box orange">
      <ol class="rule-ol">
        <li><b>保持数据池不变：</b>到期前续费，数据池成员与历史数据保持不变，新周期紧接当前到期日。</li>
        <li><b>到期未续费：</b>数据池失效，停止访问看板、查询与导出。</li>
        <li><b>降配：</b>减少名额只能在续费时进行，下一周期生效；周期内不能减少名额。</li>
      </ol>
    </div>
    <el-form label-width="96px" class="mt16">
      <el-form-item label="续费批次">主批次 · 200 个名额（已分配 186，待生效 14）· 当前到期日 <b class="num" style="margin-left:4px">2027-03-31</b></el-form-item>
      <el-form-item label="续费周期">
        <el-radio-group v-model="renew.cycle">
          <el-radio-button value="year">年付 · 八五折</el-radio-button>
          <el-radio-button value="quarter">季付 · 九五折</el-radio-button>
          <el-radio-button value="month">月付</el-radio-button>
        </el-radio-group>
      </el-form-item>
      <el-form-item label="名额数">
        <el-input-number v-model="renew.qty" :min="20" :max="200" :step="10" style="width:160px" />
        <span class="muted small" style="margin-left:12px">最多 200 个；需要更多名额请使用 <a href="directory.html">扩容</a></span>
      </el-form-item>
      <el-form-item label="新周期"><span class="num">2027-04-01 至 {{ renewCalc.end }}</span></el-form-item>
    </el-form>
    <el-alert v-if="renew.qty < 200" type="warning" show-icon :closable="false" style="margin-bottom:10px">
      <template #title>降配 {{ 200 - renew.qty }} 个名额，2027-04-01 起生效。<template v-if="renew.qty < 199">2026-12-01 调整生效后在池 199 家（现有 186 家，新增 14 家，移出 1 家），需在新周期生效前从数据池移出 {{ 199 - renew.qty }} 家企业。</template><template v-if="renew.qty < 200 && renewCalc.tier.off > 0.85">名额数降到 {{ renewCalc.tier.label }} 档，阶梯折扣随之变化。</template></template>
    </el-alert>
    <div class="sum-line">
      <span>{{ renew.qty }} × 400 × {{ renewCalc.months }} × {{ renewCalc.cOff }} × {{ renewCalc.tier.off }}<span class="muted small">（{{ renewCalc.tier.label }} 档）</span> <span class="ex-tag">示例参数，待业务方确定</span></span>
      <span>应付 <span class="price-big num" style="font-size:22px">¥ {{ $fmt(renewCalc.total) }}</span></span>
    </div>

        this.$demo('发票申请已提交，开具后发送到 ' + this.inv.mail);
      },
      openProof(o) { this.proof = { show: true, orderId: o.id, file: '', payer: '东岳钢铁集团有限公司', date: '2026-11-24', note: '' }; },
      submitProof() {
        const o = this.proofOrder, at = this.stamp();
        o.proof = { file: this.proof.file, by: '周立明', at, note: '待平台财务核销' };
        o.payNote = '凭证待核销';
        o.flow.push({ at, t: '上传转账凭证', who: '周立明', d: this.proof.file });
        o.next = o.next.filter((s) => s !== '上传转账凭证');
        const b = this.batches.find((x) => x.order === o.id); if (b) b.note = '凭证待核销';
        this.proof.show = false;
        this.$demo('转账凭证已提交，平台财务核销后订单生效');
      },
      verify(o) {
        const at = this.stamp();
        o.status = '待生效'; o.payNote = '已核销 ' + at.slice(0, 10); o.proof.note = '已核销';
        o.flow.push({ at, t: '平台财务核销通过，订单已支付（待生效）', who: '平台财务 何志远', type: 'success' });
        o.next = o.next.filter((s) => s !== '平台财务核销');
        const b = this.batches.find((x) => x.order === o.id); if (b) { b.status = '待生效'; b.note = o.start.slice(5) + ' 生效'; }
        this.$demo('原型演示：已模拟财务核销通过，订单进入“待生效”，现在可以申请发票');
      },
      cancel(o) {
        ElementPlus.ElMessageBox.confirm('取消后订单关闭，名额不会生效。' + (o.proof ? '已上传的转账凭证将作废，如已转账请联系平台财务办理退款。' : '') + '确认取消订单 ' + o.id + ' 吗？', '取消订单', { confirmButtonText: '确认取消', cancelButtonText: '再想想', type: 'warning' })
          .then(() => {
            o.status = '已取消'; o.payNote = '未支付'; o.sub = '未支付，已取消'; o.contract = ''; o.next = [];
            o.flow.push({ at: this.stamp(), t: '订单已取消', who: '周立明', type: 'info' });
            const i = this.batches.findIndex((x) => x.order === o.id); if (i >= 0) this.batches.splice(i, 1);
            this.$demo('订单已取消');
          }).catch(() => {});
      },
    },
  });
})();
</script>
