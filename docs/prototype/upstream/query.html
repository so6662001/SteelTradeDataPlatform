<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>多维查询 · 上游钢厂端 · 钢贸上下游数据平台</title>
<link rel="stylesheet" href="../assets/lib/element-plus.css">
<link rel="stylesheet" href="../assets/css/app.css">
<style>
.q-wrap { display: grid; grid-template-columns: 292px minmax(0, 1fr); gap: 14px; align-items: start; }
.q-side .el-form-item { margin-bottom: 10px; }
.q-side .el-form-item__label { font-size: 12px; color: #6b7787; line-height: 22px; height: 22px; }
.cross td, .cross th { padding: 6px 8px !important; font-size: 12.5px; }
.cross td.sec { background: #fbfbfd; }
.dim-box { background: #f7fafd; border: 1px solid #dfe9f5; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
.dim-box .el-form-item__label { color: #4a5568; }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="page">
<app-layout portal="upstream" active="query" title="多维查询" watermark
  desc="按时间、地区、品类、品牌等维度自由组合查询销量与库存；选定品名后，可按该品类的统计维度（管材为规格加壁厚，板材为厚度加宽度，建材为规格，型材为规格加公斤段或负差段，按品名固定其一）查看。钢材按吨、非钢材按数量，分表展示、不合计。所有结果均经聚合引擎做披露判定。">
  <template #actions>
    <el-select v-model="scheme" style="width:230px" @change="loadScheme">
      <template #prefix><el-icon><Collection /></el-icon></template>
      <el-option v-for="s in schemes" :key="s.k" :label="s.t" :value="s.k" />
    </el-select>
    <el-button @click="saveDlg = true"><el-icon><Star /></el-icon>保存方案</el-button>
    <el-button type="primary" @click="exportDlg = true"><el-icon><Download /></el-icon>导出结果</el-button>
  </template>

  <sample-note :region="q.regionMode" :price="hasPrice"></sample-note>
  <el-alert v-if="coarseSel.length" type="info" show-icon :closable="false" style="margin-bottom:12px">
    <template #title>所选品类中的 <b>{{ coarseSel.join('、') }}</b> 样本较稀疏，最细披露粒度为“地区到省、时间到旬”。这些品类不提供地级市下钻与日、周粒度；按日、周查询时，它们与其他品类合并披露，不单独成行、成列。<a href="javascript:;" @click="grainDlg = true">查看各品类可查粒度</a>。</template>
  </el-alert>

  <el-alert v-if="q.regionMode==='流向地'" type="info" show-icon :closable="false" style="margin-bottom:12px">
    <template #title>流向地为下游选填字段，当前数据池销量的流向地填报覆盖率为 <b>71.4%</b>。按地区展开时只统计已填报流向地的销量，各地区合计小于全口径销量；按品类、按时间展开且未筛选地区时仍为全口径。库存与可销天数始终按仓库所在地统计。</template>
  </el-alert>

  <div class="q-wrap">
    <!-- 左侧：维度与指标面板 -->
    <div class="card q-side" style="margin-bottom:0">
      <el-form label-position="top" size="small">
        <div class="side-panel-title" style="margin-top:0">时间</div>
        <el-form-item label="时间粒度">
          <el-radio-group v-model="f.grain"><el-radio-button v-for="g in ['日','周','旬','月']" :key="g" :label="g" :value="g" /></el-radio-group>
        </el-form-item>
        <el-form-item label="统计区间（最新可查：2026-11-23）">
          <el-date-picker v-model="f.range" type="daterange" value-format="YYYY-MM-DD" range-separator="至" style="width:100%" :clearable="false" />
        </el-form-item>

        <div class="side-panel-title">筛选（仅支持层级选择与多选包含）</div>
        <el-form-item label="销量地区口径">
          <el-radio-group v-model="f.regionMode"><el-radio-button label="仓库所在地" value="仓库所在地" /><el-radio-button label="流向地" value="流向地" /></el-radio-group>
        </el-form-item>
        <el-form-item label="地区（省 / 地级市）">
          <el-cascader v-model="f.regions" :options="regionOpts" :props="{multiple:true}" collapse-tags collapse-tags-tooltip clearable placeholder="全国" style="width:100%" />
        </el-form-item>
        <el-form-item>
          <template #label>品类（大类 / 品名）<a href="javascript:;" style="margin-left:8px;font-weight:400" @click="grainDlg = true">各品类可查粒度</a></template>
          <el-cascader v-model="f.cats" :options="catOpts" :props="{multiple:true}" collapse-tags collapse-tags-tooltip clearable placeholder="全部钢材品类" style="width:100%" />
          <div class="small muted" style="line-height:1.5;margin-top:4px">钢材按吨位统计，非钢材按数量统计。同时选中时分表展示，不出总计。</div>
        </el-form-item>
        <div v-if="fDim" class="dim-box">
          <div class="row" style="gap:6px;margin-bottom:6px"><b>{{ fDim.name }}</b><span class="dim-chip" style="margin:0">{{ fDim.tpl.name }}模板</span><span class="unit-pill" :class="{ns: !fDim.steel}">{{ fDim.steel ? '吨' : '数量 · ' + fDim.unit }}</span></div>
          <div class="small" style="line-height:1.6;color:#4a5568">统计维度：<b>{{ fDim.d1.name }}</b><template v-if="fDim.d2"> + <b>{{ fDim.d2.name }}{{ fDim.tplKey === '型材' ? '段（该品名固定用' + fDim.d2.segName + '）' : '' }}</b></template>　<a href="javascript:;" @click="bandDlg = true">查看分段</a></div>
          <template v-if="fDim.open">
            <el-form-item :label="fDim.d1.segName" style="margin:6px 0 6px">
              <el-select v-model="f.dimSeg" multiple collapse-tags collapse-tags-tooltip clearable placeholder="全部" style="width:100%"><el-option v-for="b in fDim.d1.bands" :key="b" :label="b" :value="b" /></el-select>
            </el-form-item>
            <el-form-item v-if="fDim.d2" :label="fDim.d2.segName" style="margin-bottom:6px">
              <el-select v-model="f.dimD2" multiple collapse-tags collapse-tags-tooltip clearable placeholder="全部" style="width:100%"><el-option v-for="b in fDim.d2.bands" :key="b" :label="b" :value="b" /></el-select>
            </el-form-item>
            <div class="small muted" style="line-height:1.5">维度筛选在“行维度 = 品类统计维度”时生效，只收窄展示范围，不改变划分方式。分段由平台统一定义，不能自定边界。</div>
          </template>
          <div v-else class="small" style="line-height:1.6;color:#9a6400">{{ fDim.cat.name }}的标准化深度尚未到规格段（L4），模板维度已随上传采集，暂不按该维度披露；达到后自动回补。</div>
        </div>
        <el-form-item label="品牌">
          <el-radio-group v-model="f.brand"><el-radio-button label="全部" value="全部" /><el-radio-button label="本厂（东岳）" value="本厂" /><el-radio-button label="其他品牌" value="其他" /></el-radio-group>
        </el-form-item>

        <div class="side-panel-title">行 / 列布局</div>
        <el-form-item label="行维度（可逐级下钻）">
          <el-select v-model="f.rowDim" style="width:100%">
            <el-option label="仓库所在地 / 流向地（省 → 市）" value="region" />
            <el-option label="品类（大类 → 品名 → 材质 / 规格段）" value="cat" />
            <el-option label="时间（按所选粒度）" value="time" />
            <el-option :label="fDim && fDim.open ? '品类统计维度（' + fDim.levels[0].t + '）' : '品类统计维度（需先选定单一品名）'" value="dim" :disabled="!fDim || !fDim.open" />
          </el-select>
        </el-form-item>
        <div v-if="secMix" class="small" style="line-height:1.6;margin:-6px 0 10px;color:#9a6400;background:#fff8eb;border:1px solid #f3dfb8;border-radius:4px;padding:6px 8px">所选型材品名的第二维度不同：{{ secMix.kg.join('、') }}用公斤段，{{ secMix.neg.join('、') }}用负差段。两种分段不合并展示，本次查询只提供公共维度；要看第二维度请逐个品名查询。</div>
        <template v-if="f.rowDim==='dim' && fDim && fDim.open">
          <el-form-item label="披露层级（只能沿固定路径由细到粗）">
            <el-radio-group v-model="f.dimLevel" style="display:grid;gap:2px"><el-radio v-for="l in fDim.levels" :key="l.k" :value="l.k">{{ l.t }}</el-radio></el-radio-group>
          </el-form-item>
          <el-form-item label="指标">
            <el-radio-group v-model="f.dimMetric"><el-radio-button label="销量" value="sales" /><el-radio-button label="期末库存" value="stock" /></el-radio-group>
          </el-form-item>
          <div v-if="fDim.tplKey==='型材'" class="small muted" style="line-height:1.5;margin-bottom:8px">型材的第二维度按品名固定：{{ fDim.name }}用<b>{{ fDim.d2.segName }}</b>。用公斤段还是负差段由平台在品类主数据里逐个品名配置，查询时不能切换。</div>
        </template>
        <el-form-item v-else label="列维度">
          <el-select v-model="f.colDim" style="width:100%">
            <el-option label="指标（多指标并列）" value="metric" />
            <el-option label="大类（交叉表，单指标）" value="cat" :disabled="f.rowDim!=='region'" />
          </el-select>
        </el-form-item>
        <el-form-item v-if="f.colDim==='metric' && f.rowDim!=='dim'" label="指标">
          <el-checkbox-group v-model="f.metrics" style="display:grid;grid-template-columns:1fr 1fr">
            <el-checkbox v-for="m in metricList" :key="m.k" :value="m.k" :disabled="m.price && !singleProduct">
              <el-tooltip v-if="m.price && !singleProduct" content="价格类指标需先在“品类”中选定单一品名（跨品名均价无意义）" placement="right"><span>{{ m.t }}</span></el-tooltip>
              <span v-else>{{ m.t }}</span>
            </el-checkbox>
          </el-checkbox-group>
          <div v-if="!priceOpen" class="small muted" style="line-height:1.5;margin-top:4px"><el-icon style="vertical-align:-2px"><Lock /></el-icon> 价格类指标暂未开放（平台法务闸口关闭）</div>
        </el-form-item>
        <el-form-item v-else-if="f.rowDim!=='dim'" label="交叉表指标">
          <el-radio-group v-model="f.crossMetric"><el-radio-button label="销量" value="sales" /><el-radio-button label="库存量" value="stock" /></el-radio-group>
        </el-form-item>

        <div class="side-panel-title">可用维度</div>
        <div class="row" style="gap:6px">
          <span class="pivot-chip row" v-for="d in ['时间','仓库所在地','流向地','大类','品名','材质','品牌（本厂 / 其他）','客户类型','下游行业']" :key="d">{{ d }}</span>
          <el-tooltip content="选定品名后按统计维度模板提供：管材为规格、壁厚段；板材为厚度段、宽度段；建材为规格；型材为规格加公斤段或负差段（按品名固定其一）；其他品类为规格" placement="top"><span class="pivot-chip row">品类统计维度（随品类变化）</span></el-tooltip>
          <el-tooltip content="分段由平台统一定义。自选边界等于提供了差分工具，两次查询的边界相差一点就能切出单家" placement="top"><span class="pivot-chip disabled">自定分段边界（不提供）</span></el-tooltip>
          <el-tooltip content="为防止反推，平台不提供“按企业”维度，也不支持按企业筛选或排除" placement="top"><span class="pivot-chip disabled">企业（不提供）</span></el-tooltip>
          <el-tooltip content="筛选不支持“排除某项”，避免用“全部 − 排除项”做差分" placement="top"><span class="pivot-chip disabled">排除筛选（不提供）</span></el-tooltip>
        </div>
        <div class="row mt16">
          <el-button type="primary" size="default" :loading="loading" @click="run" style="flex:1"><el-icon><Search /></el-icon>查询</el-button>
          <el-button size="default" @click="reset">重置</el-button>
        </div>
      </el-form>
    </div>

    <!-- 右侧：结果 -->
    <div>
      <el-alert v-if="res.excluded.length" type="warning" show-icon :closable="false">
        <template #title>所选 {{ res.selCount }} 个地区中有 <b>{{ res.excluded.length }}</b> 项（{{ res.excluded.join('、') }}）因样本不足未计入求和。只有完整选中上级地区时，才按上级地区整体计算。</template>
      </el-alert>
      <div v-if="!steelOff" class="card" v-loading="loading" :style="{minHeight: nsRes ? '260px' : '520px'}">
        <div class="card-title">
          <span>
            <span class="unit-pill" style="margin-right:8px">钢材 · 吨</span>
            <el-breadcrumb separator=">" style="display:inline-flex;font-size:14px">
              <el-breadcrumb-item><a href="javascript:;" @click="drillTo(0)">{{ rootName }}</a></el-breadcrumb-item>
              <el-breadcrumb-item v-for="(p,i) in path" :key="p"><a href="javascript:;" @click="drillTo(i+1)">{{ p }}</a></el-breadcrumb-item>
            </el-breadcrumb>
            <small>{{ res.range[0] }} 至 {{ res.range[1] }}（{{ res.days }} 天）· {{ q.grain }}粒度 · {{ q.brand==='全部' ? '全部品牌' : q.brand==='本厂' ? '本厂品牌（东岳）' : '其他品牌（合并）' }}</small>
          </span>
          <span class="right">
            <el-radio-group v-model="view" size="small"><el-radio-button value="table"><el-icon><Grid /></el-icon> 表格</el-radio-button><el-radio-button value="chart"><el-icon><Histogram /></el-icon> 图表</el-radio-button></el-radio-group>
          </span>
        </div>

        <!-- 品类统计维度 -->
        <template v-if="res.dim">
          <div class="row small" style="gap:6px;margin-bottom:8px;flex-wrap:wrap">
            <span class="dim-chip">{{ qDim.tpl.name }}模板</span>
            <span>披露层级路径：<b>{{ qDim.tpl.path.join(' → ') }}</b></span>
            <span class="muted">｜ 分段方案 {{ bandVer.ver }}（{{ bandVer.eff }} 生效，示例参数）</span>
            <a href="javascript:;" @click="bandDlg = true">查看分段</a>
          </div>
          <dim-table v-show="view==='table'" :name="res.dim.name" :total="q.dimMetric==='stock' ? res.dim.stock : res.dim.sales" :n="res.dim.n" :n-scale="res.dim.nScale" :seg-w="q.dimMetric==='stock' ? res.dim.stockW : undefined"
            :metric="q.dimMetric==='stock' ? '期末库存' : '销量'" :level="q.dimLevel" :seg-filter="q.dimSeg" :d2-filter="q.dimD2"></dim-table>
          <ve-chart v-if="view==='chart'" :option="dimChartOption" height="460px"></ve-chart>
          <div class="tbl-foot">
            <span>请求层级：<b>{{ dimTree.levelName }}</b>　|　{{ dimStatText }}</span>
            <span><el-icon style="vertical-align:-2px"><Lock /></el-icon> 本次查询条件、请求层级与上卷结果已记入审计日志</span>
          </div>
        </template>

        <!-- 多指标表 -->
        <template v-else-if="q.colDim==='metric'">
          <el-table v-show="view==='table'" :data="res.rows" border size="small" :row-class-name="rowCls">
            <el-table-column :label="res.dimName" min-width="150" fixed>
              <template #default="{row}">
                <template v-if="row.merged"><el-tooltip placement="top" :content="'合并成员：' + row.members.join('、') + '。这些成员单独不满足披露条件，为防止用合计倒推，合并为一行披露。'"><span>其他<span class="merged-row-tag">合并披露</span></span></el-tooltip></template>
                <template v-else-if="row.total"><b>合计</b></template>
                <a v-else-if="row.child" href="javascript:;" @click="drill(row)">{{ row.name }} <el-icon style="vertical-align:-2px"><ArrowRight /></el-icon></a>
                <el-tooltip v-else-if="row.lock" placement="top" content="该品类暂不提供此粒度"><span>{{ row.name }} <span class="level-tag lock">{{ row.lock }}</span></span></el-tooltip>
                <span v-else>{{ row.name }}</span>
              </template>
            </el-table-column>
            <el-table-column v-if="on('sales')" label="销量(吨)" align="right" min-width="96"><template #default="{row}"><v-num :v="row.sales" :tip="row.tip" /></template></el-table-column>
            <el-table-column v-if="on('nSales')" label="销量贡献企业数" align="center" width="118"><template #default="{row}"><span v-if="row.total" class="muted">—</span><contrib-tag v-else :n="row.sales===null ? 0 : row.nSales" /></template></el-table-column>
            <el-table-column v-if="on('share')" label="销量占比" align="right" width="82"><template #default="{row}"><v-num :v="row.share" :d="1" suffix="%" /></template></el-table-column>
            <el-table-column v-if="on('avg')" label="日均销量(吨)" align="right" min-width="100"><template #default="{row}"><v-num :v="row.avg" /></template></el-table-column>
            <el-table-column v-if="on('mom')" align="right" width="96"><template #header>销量环比<el-tooltip placement="top" content="与上一个等长区间比较：按日展开时为前一日，按周为前 7 天，按旬、月为上一旬、上月（当月未结束时与上月同样天数比较）。聚合看板的“昨日销量”为避开周内波动，按上周同日比较，两处数值不同属口径差异。合计行 = 各行本期销量合计 ÷ 各行上期销量合计 − 1，同比同理"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template><template #default="{row}"><v-num :v="row.mom" :d="1" suffix="%" signed tip="分子或分母被屏蔽，比率类指标同步屏蔽" /></template></el-table-column>
            <el-table-column v-if="on('yoy')" label="销量同比" align="right" width="86"><template #default="{row}"><v-num :v="row.yoy" :d="1" suffix="%" signed tip="分子或分母被屏蔽，比率类指标同步屏蔽" /></template></el-table-column>
            <el-table-column v-if="on('stock')" label="期末库存(吨)" align="right" min-width="104"><template #default="{row}"><v-num :v="row.stock" /></template></el-table-column>
            <el-table-column v-if="on('nStock')" label="库存贡献企业数" align="center" width="118"><template #default="{row}"><span v-if="row.total" class="muted">—</span><contrib-tag v-else :n="row.stock===null ? 0 : row.nStock" /></template></el-table-column>
            <el-table-column v-if="on('days')" align="right" width="92"><template #header>可销天数<el-tooltip placement="top" content="期末库存 ÷ 统计区间内的日均销量。期末库存为统计区间最后一天的日末库存；库存与这里用的销量都按仓库所在地统计，与聚合看板一致"><el-icon style="vertical-align:-2px;margin-left:2px"><QuestionFilled /></el-icon></el-tooltip></template><template #default="{row}"><v-num :v="row.days" :d="1" tip="分子或分母被屏蔽，比率类指标同步屏蔽" /></template></el-table-column>
            <el-table-column v-if="pOn('price')" label="加权均价(元/吨)" align="right" width="112"><template #default="{row}"><v-num :v="row.price" tip="有价企业样本不足，或该行销量已屏蔽，价格不予披露" /></template></el-table-column>
            <el-table-column v-if="pOn('pchg')" label="均价涨跌" align="right" width="82"><template #default="{row}"><v-num :v="row.pchg" signed tip="任一期被屏蔽，涨跌不予展示" /></template></el-table-column>
            <el-table-column v-if="pOn('cover')" label="价格覆盖率" align="center" width="128"><template #default="{row}"><cover-tag :r="row.price===null ? null : row.cover" /></template></el-table-column>
            <el-table-column v-if="pOn('nPrice')" label="有价企业数" align="center" width="104"><template #default="{row}"><span v-if="row.total" class="muted">—</span><contrib-tag v-else :n="row.price===null ? 0 : row.nPrice" /></template></el-table-column>
          </el-table>
          <ve-chart v-if="view==='chart'" :option="chartOption" height="460px"></ve-chart>
        </template>

        <!-- 交叉表 -->
        <template v-else>
          <table v-show="view==='table'" class="plain-table cross">
            <thead><tr><th>{{ q.regionMode }} ＼ 大类</th><th class="r" v-for="c in res.cols" :key="c">{{ c }}</th><th class="r">行合计</th></tr></thead>
            <tbody>
              <tr v-for="r in res.cross" :key="r.name" :class="{merged: r.merged, total: r.total}">
                <td class="nowrap"><template v-if="r.merged"><el-tooltip :content="'合并成员：' + r.members.join('、')" placement="top"><span>其他<span class="merged-row-tag">合并披露</span></span></el-tooltip></template><template v-else>{{ r.name }}</template></td>
                <td class="r" v-for="(c,i) in r.cells" :key="i" :class="{sec: c.sec}">

                  <el-tooltip v-else-if="!r.total" placement="top" :content="'贡献企业数：' + $band(c.n) + ' 家'"><span class="num">{{ $fmt(c.v) }}</span></el-tooltip>
                  <span v-else class="num">{{ $fmt(c.v) }}</span>
                </td>
                <td class="r"><mask-cell v-if="r.hide" tip="样本不足，不予披露"></mask-cell><b v-else class="num">{{ $fmt(r.sum) }}</b></td>

            </tbody>
          </table>
          <ve-chart v-if="view==='chart'" :option="crossChartOption" height="460px"></ve-chart>

        </template>

        <div v-if="hasPrice" class="tip-box orange small mt12"><b>样本成交均价，不是市场报价。</b>口径：含税、自提、非暂估；只统计自愿上传价格的在池企业。价格门槛比销量更严（有价企业数 ≥ {{ $PV.kPrice }} 家，按有价销量计算优势度）；销量被屏蔽的行，价格一并屏蔽。不提供金额合计、有价销量、最高最低价。更多见 <a href="price.html">量价视图</a>。</div>
        <div v-if="!res.dim" class="tbl-foot">
          <span>共 {{ res.rowCount }} 行（页面最多展示 1,000 行，超出请使用导出）　|　命中单元格 <b>{{ res.cellCount }}</b> 个，其中屏蔽 <b>{{ res.maskCount }}</b> 个（{{ (res.maskCount / res.cellCount * 100).toFixed(1) }}%）</span>

      <!-- 非钢材：按数量，分表展示 -->
      <div v-if="nsRes" class="card" v-loading="loading" :style="{marginTop: steelOff ? '0' : '14px', marginBottom: 0}">
        <div class="card-title">
          <span><span class="unit-pill ns" style="margin-right:8px">非钢材 · 数量</span>{{ nsRes.dim ? nsRes.dim.name + ' › 品类统计维度' : '配套辅材（按品名）' }}<small>{{ nsRes.range[0] }} 至 {{ nsRes.range[1] }}（{{ nsRes.days }} 天）· 与钢材分表展示，不出总计</small></span>

        <el-alert v-if="nsRes.partial.length" type="info" show-icon :closable="false" style="margin-bottom:10px"><template #title>非钢材最细地区为省。所选的 {{ nsRes.partial.join('、') }} 只选了部分地级市，未计入；完整选中该省后按省统计。</template></el-alert>
        <template v-if="nsRes.dim">
          <div class="row small" style="gap:6px;margin-bottom:8px"><span class="dim-chip">{{ qDim.tpl.name }}模板</span><span>披露层级路径：<b>{{ qDim.tpl.path.join(' → ') }}</b></span><span class="muted">｜ 数量单位：{{ nsRes.dim.unit }}</span><a href="javascript:;" @click="bandDlg = true">查看分段</a></div>
          <dim-table :name="nsRes.dim.name" :total="q.dimMetric==='stock' ? nsRes.dim.rawStock : nsRes.dim.rawSales" :n="nsRes.dim.n" :metric="q.dimMetric==='stock' ? '期末库存' : '销量'" :level="q.dimLevel" :seg-filter="q.dimSeg"></dim-table>
        </template>
        <table v-else class="plain-table">
          <thead><tr><th>品名</th><th class="c">数量单位</th><th class="r">销量</th><th class="r">日均销量</th><th class="r">期末库存</th><th class="r">可销天数</th><th class="c">贡献企业数</th><th>统计维度</th></tr></thead>
          <tbody><tr v-for="r in nsRes.rows" :key="r.name">
            <td><b>{{ r.name }}</b></td><td class="c"><span class="unit-pill ns">{{ r.unit }}</span></td>
            <td class="r"><v-num :v="r.sales" /></td><td class="r"><v-num :v="r.avg" /></td><td class="r"><v-num :v="r.stock" /></td><td class="r"><v-num :v="r.days" :d="1" /></td>
            <td class="c"><contrib-tag :n="r.sales===null ? 0 : r.n" /></td>
            <td><a href="javascript:;" @click="loadDim(r.name)">按规格查看 ›</a></td>
          </tr></tbody>
        </table>
        <div class="tip-box small mt12">非钢材按数量统计，每个品名一个标准数量单位（示例：个、套、片）。<b>不同数量单位之间不相加</b>，因此没有合计行，也没有占比；数量与钢材的吨位不换算、不合计。<template v-if="nsRes.brand">非钢材不区分钢厂品牌，品牌筛选对本表不生效。</template>非钢材暂不提供价格指标；地区最细到省。披露门槛与钢材相同，按数量分别判定贡献企业数与优势度。</div>
      </div>
    </div>
  </div>

  <el-dialog v-model="bandDlg" :title="'分段方案 · ' + (bandDim ? bandDim.name : '')" width="720px">
    <template v-if="bandDim">
      <dl class="kv" style="grid-template-columns:96px 1fr">
        <dt>统计维度模板</dt><dd><b>{{ bandDim.tpl.name }}</b>（{{ bandDim.tpl.dims.map((x) => x.name).join(' + ') }}）　计量：{{ bandDim.steel ? '吨位（吨）' : '数量（' + bandDim.unit + '）' }}</dd>
        <dt>披露层级路径</dt><dd>{{ bandDim.tpl.path.join(' → ') }}</dd>
        <dt>分段方案版本</dt><dd>{{ bandVer.ver }}，{{ bandVer.eff }} 起生效（上一版 {{ bandVer.prev }}）<el-tag size="small" type="warning" effect="plain" style="margin-left:6px">示例参数</el-tag></dd>
      </dl>
      <table class="plain-table mt12">
        <thead><tr><th style="width:150px">维度</th><th style="width:90px">取值类型</th><th>当前生效的分段</th><th style="width:150px">可披露到</th></tr></thead>
        <tbody>
          <tr><td><b>{{ bandDim.d1.name }}</b></td><td>{{ bandDim.tpl.dims[0].type }}</td><td><el-tag v-for="b in bandDim.d1.bands" :key="b" size="small" effect="plain" style="margin:2px 4px 2px 0">{{ b }}</el-tag></td><td>{{ bandDim.d1.fine ? '单规格（满足门槛时）' : bandDim.tplKey === '板材' ? '段' : '规格段（单规格待主数据配置）' }}</td></tr>
          <tr v-if="bandDim.d2"><td><b>{{ bandDim.d2.name }}{{ bandDim.d2.name === '公斤' ? '数' : '' }}</b><div v-if="bandDim.tplKey === '型材'" class="small muted">按品名固定</div></td><td>连续</td><td>
            <el-tag v-for="(b, i) in bandDim.d2.bands" :key="b" size="small" effect="plain" :type="b === '未分段' ? 'info' : 'primary'" style="margin:2px 4px 2px 0">{{ b }}</el-tag>
            <div v-if="bandDim.d2.name === '公斤' && kgEg" class="small muted" style="margin-top:4px">各型号的每米公斤数不同，公斤段按“实际每米重量 ÷ 理论每米重量”归段。例：{{ kgEg.model }} 理重 {{ kgEg.w }} kg/m，四段依次为 {{ kgEg.r.join('、') }} kg/m。</div>
          </td><td>段，不披露原始取值</td></tr>
        </tbody>
      </table>
      <div class="tip-box small mt12">连续型维度的段为左闭右开区间，首段和末段为开口区间，各段互不重叠并覆盖全部取值。上传时缺少第二维度的数据归入“未分段”，它与其他段一样参与披露判定。<template v-if="bandDim.tplKey === '型材'">型材的第二维度按品名固定：有的品名用公斤段，有的用负差段，由平台在品类主数据里逐个品名配置；{{ bandDim.name }}用{{ bandDim.d2.segName }}。</template>分段由平台统一定义并带版本；分段调整日会在趋势图上标注“口径变更”，历史数据按当时生效的分段展示。</div>
    </template>
    <template #footer><el-button type="primary" @click="bandDlg=false">知道了</el-button></template>
  </el-dialog>

  <el-dialog v-model="exportDlg" title="导出查询结果" width="560px">
    <el-descriptions :column="1" border size="small">
      <el-descriptions-item label="导出范围">当前查询结果{{ res.dim ? '（按品类统计维度）' : '，共 ' + res.rowCount + ' 行' }}</el-descriptions-item>
      <el-descriptions-item label="工作表">{{ steelOff ? '非钢材（数量）' : nsRes ? '钢材（吨）、非钢材（数量）两个工作表，不合计' : '钢材（吨）' }}；含维度列、单位列、披露层级列（单规格、段、已上卷）</el-descriptions-item>
      <el-descriptions-item label="文件格式"><el-radio-group v-model="expFmt"><el-radio value="xlsx">Excel</el-radio><el-radio value="csv">CSV</el-radio></el-radio-group></el-descriptions-item>
      <el-descriptions-item label="今日导出配额">已用 3 / 20 次，已导出 1,286 / 200,000 行</el-descriptions-item>
    </el-descriptions>
    <div class="tip-box orange small mt12">导出内容与页面展示<b>完全一致</b>：同样的屏蔽、合并披露、追加屏蔽、自动上卷、取整与口径说明。文件带水印（企业、账号、时间、导出编号）与使用条款页；导出记录写入审计日志（查询条件、行数、文件指纹）。</div>
    <el-checkbox v-model="agree" class="mt12">我已阅读并同意使用条款：禁止再识别单家企业数据，禁止转售</el-checkbox>
    <template #footer><el-button @click="exportDlg=false">取消</el-button><el-button type="primary" :disabled="!agree" @click="exportDlg=false; $demo('导出任务已提交，可在导出中心下载')">生成导出任务</el-button></template>
  </el-dialog>

  <el-dialog v-model="grainDlg" title="各品类可查粒度" width="900px">
    <div class="small muted" style="margin-bottom:10px">平台按品类分批完成主数据标准化。标准化越深、样本越密的品类，可查询的粒度越细；超出的粒度不展示数值，界面提示“该品类暂不提供此粒度”。</div>
    <table class="plain-table">
      <thead><tr><th>大类</th><th>计量</th><th>统计维度模板</th><th>品类最细可查</th><th>地区最细</th><th>时间最细</th><th>品名</th></tr></thead>
      <tbody><tr v-for="c in cats" :key="c.name">
        <td><b>{{ c.name }}</b></td>
        <td><span class="unit-pill" :class="{ns: c.steel === false}">{{ c.steel === false ? '数量' : '吨' }}</span></td>
        <td class="small">{{ tplOf(c).name }}<div class="muted">{{ tplOf(c).dims.map((x) => x.name).join(' + ') }}</div></td>
        <td><span class="level-tag" :class="{lock: c.depth < 'L3'}">{{ c.depth >= 'L4' ? '统计维度' : c.depth === 'L3' ? '材质' : '品名' }}</span></td>
        <td>{{ c.geo === '市' ? '地级市' : '省' }}</td><td>{{ c.time }}</td>
        <td class="muted small">{{ c.products.map((p) => p.name).join('、') }}</td>
      </tr></tbody>
    </table>
    <div class="small muted mt12">“统计维度”指按该大类的统计维度模板查看（第二维度按段）；标准化深度未到规格段的大类，模板维度已采集、暂不披露。粒度随标准化进度与样本量扩大而放开，由运营后台“全品类主数据工作台”统一配置，调整前公告。</div>
    <template #footer><el-button type="primary" @click="grainDlg=false">知道了</el-button></template>
  </el-dialog>

  <el-dialog v-model="saveDlg" title="保存查询方案" width="480px">
    <el-form label-width="96px">
      <el-form-item label="方案名称"><el-input v-model="saveName" /></el-form-item>
      <el-form-item label="其他"><el-checkbox>设为看板卡片</el-checkbox><el-checkbox>每周一 8:30 发送到邮箱</el-checkbox></el-form-item>
    </el-form>
    <div class="small muted">定时发送的内容同样经过聚合引擎，屏蔽与修约规则和页面一致。</div>
    <template #footer><el-button @click="saveDlg=false">取消</el-button><el-button type="primary" @click="saveDlg=false; $demo('方案已保存')">保存</el-button></template>
  </el-dialog>
</app-layout>
</script>

<script src="../assets/lib/element-plus-icons.iife.min.js"></script>

<script src="../assets/js/app.js"></script>
<script>
(function () {
  const { hash, disclose, PV, chart, fmt } = STP;
  const K = M.KPI;
  const isSteel = (s) => M.categories.some((c) => c.name === s[0]);
  const defaults = () => ({ grain: '日', range: ['2026-11-17', '2026-11-23'], regionMode: '仓库所在地', regions: [], cats: [], brand: '全部', rowDim: 'region', colDim: 'metric', crossMetric: 'sales', dimSeg: [], dimD2: [], dimLevel: '', dimMetric: 'sales', metrics: ['sales', 'nSales', 'share', 'avg', 'mom', 'stock', 'nStock', 'days'] });
  const PRICE_KEYS = ['price', 'pchg', 'cover', 'nPrice'];
  const jsCities = (names) => names.map((n) => ['江苏', n]);
  const SCHEMES = {
    default: { t: '分省销量与库存（默认）', f: {} },
    east: { t: '华东重点城市 · 螺纹钢周报', f: { regions: jsCities(['苏州市', '无锡市', '南京市', '常州市', '宿迁市']).concat([['浙江', '杭州市'], ['浙江', '宁波市'], ['浙江', '金华市'], ['上海', '上海市']]), cats: [['建筑钢材', '螺纹钢']], metrics: ['sales', 'nSales', 'avg', 'mom', 'stock', 'days'] } },
    cross: { t: '省 × 大类交叉表（近 7 日销量）', f: { colDim: 'cat' } },
    spec: { t: '东岳品牌分规格动销', f: { rowDim: 'cat', brand: '本厂' } },
    pipe: { t: '焊管 规格 × 壁厚段（管材模板）', f: { cats: [['管材', '焊管']], rowDim: 'dim' } },
    plate: { t: '热轧卷板 厚度段 × 宽度段（板材模板）', f: { cats: [['热轧板卷', '热轧卷板']], rowDim: 'dim' } },
    rebar: { t: '江苏螺纹钢分规格（建材模板）', f: { cats: [['建筑钢材', '螺纹钢']], rowDim: 'dim', regions: [['江苏', '苏州市'], ['江苏', '无锡市'], ['江苏', '南京市'], ['江苏', '常州市'], ['江苏', '徐州市'], ['江苏', '南通市'], ['江苏', '扬州市'], ['江苏', '连云港市'], ['江苏', '宿迁市']] } },
    hbeam: { t: 'H 型钢 规格 × 负差段（型材模板）', f: { cats: [['型钢', 'H 型钢']], rowDim: 'dim' } },
    angle: { t: '角钢 规格 × 公斤段（型材模板）', f: { cats: [['型钢', '角钢']], rowDim: 'dim' } },
    mix: { t: '钢材 + 非钢材分表（螺纹钢与配套辅材）', f: { cats: [['建筑钢材', '螺纹钢'], ['配套辅材', '钢筋连接套筒'], ['配套辅材', '脚手架扣件'], ['配套辅材', '法兰']], rowDim: 'cat', metrics: ['sales', 'nSales', 'avg', 'stock', 'days'] } },
    price: { t: '分省螺纹钢量价', price: true, f: { cats: [['建筑钢材', '螺纹钢']], metrics: ['sales', 'nSales', 'avg', 'price', 'pchg', 'cover', 'nPrice'] } },
  };

  STP.mount({
    data() {
      const f = defaults();
      return {
        f, q: JSON.parse(JSON.stringify(f)), path: [], view: 'table', loading: false, scheme: 'default',
        cats: M.allCats, grainDlg: false, bandDlg: false, bandVer: M.BAND_VER,
        exportDlg: false, saveDlg: false, agree: false, expFmt: 'xlsx', saveName: '华东螺纹钢周报',
        metricDefs: [
          { k: 'sales', t: '销量' }, { k: 'stock', t: '期末库存' }, { k: 'avg', t: '日均销量' }, { k: 'days', t: '可销天数' },
          { k: 'mom', t: '销量环比' }, { k: 'yoy', t: '销量同比' }, { k: 'share', t: '销量占比' }, { k: 'nSales', t: '销量企业数' },
          { k: 'nStock', t: '库存企业数' }, { k: 'price', t: '加权均价', price: true }, { k: 'pchg', t: '均价涨跌', price: true }, { k: 'cover', t: '价格覆盖率', price: true }, { k: 'nPrice', t: '有价企业数', price: true }],
        regionOpts: M.provinces.map((p) => ({ value: p.name, label: p.name, children: p.cities.map((c) => ({ value: c[0], label: c[0] })) })),
        catOpts: M.allCats.map((c) => ({ value: c.name, label: c.steel === false ? c.name + '（非钢材 · 按数量）' : c.name, children: c.products.map((p) => ({ value: p.name, label: p.unit ? p.name + '（' + p.unit + '）' : p.name })) })),
      };
    },
    computed: {
      singleProduct() { return this.f.cats.filter(isSteel).length === 1; },
      /* 钢材与非钢材分开处理：qc 为所选的钢材品名，nsNames 为所选的非钢材品名 */
      qc() { return this.q.cats.filter(isSteel); },
      nsNames() { return this.q.cats.filter((s) => !isSteel(s)).map((s) => s[1]); },
      steelOff() { return this.q.cats.length > 0 && this.qc.length === 0; },
      singleProductQ() { return this.qc.length === 1; },
      fDim() { return this.f.cats.length === 1 ? M.dimsOf(this.f.cats[0][1]) : null; },
      /* PV-92：一次查询同时选了公斤段品名和负差段品名时，第二维度不合并展示。选中“型钢”整个大类（只有一级）也算 */
      secMix() {
        const names = [];
        this.f.cats.forEach((c) => { if (c[0] !== '型钢') return; if (c[1]) names.push(c[1]); else Object.keys(M.SEC_DIM2).forEach((n) => names.push(n)); });
        const kg = names.filter((n) => M.SEC_DIM2[n] === '公斤'), neg = names.filter((n) => M.SEC_DIM2[n] === '负差');
        return kg.length && neg.length ? { kg, neg } : null;
      },
      qDim() { return this.q.cats.length === 1 ? M.dimsOf(this.q.cats[0][1]) : null; },
      bandDim() { return this.fDim || this.qDim; },
      kgEg() {
        const d = this.bandDim; if (!d || !d.d2 || d.d2.name !== '公斤') return null;
        const all = d.d1.fine ? [].concat.apply([], d.d1.fine) : [], model = all.find((m) => M.THEO_KG[m]) || Object.keys(M.THEO_KG).find((m) => m.indexOf(d.name) >= 0);
        return model ? { model, w: M.THEO_KG[model], r: M.kgRange(model) } : null;
      },
      dimTree() { const d = this.res.dim; return d ? M.dimTree(d.name, this.q.dimMetric === 'stock' ? d.stock : d.sales, d.n, { level: this.q.dimLevel, nScale: d.nScale, segW: this.q.dimMetric === 'stock' ? d.stockW : undefined }) : null; },
      dimStatText() {
        const t = this.dimTree, s = t.stat, d = t.d;
        if (t.prodRolled) return '本次范围内只到品名';
        const a = [];
        if (s.specAll) a.push('单规格 ' + s.specAll + ' 个，可单独披露 ' + s.specOk + ' 个');
        if (s.rowAll) a.push(d.rowName + ' × ' + d.d2.segName + '可拆分 ' + s.rowSplit + ' / ' + s.rowAll + ' 行');
        if (s.segRolled) a.push(d.d1.segName + '整段上卷 ' + s.segRolled + ' 个');
        return a.join('，') || '各' + d.d1.segName + '均可披露';
      },

          }
          cols = groups.map((g) => g.name);
          const wOf = (c) => (key === 'sales' ? sum(selProducts.filter((s) => s.c === c).map((s) => ST.prods(c)[c.products.indexOf(s.p)])) : sum(selProducts.filter((s) => s.c === c).map(prodSt)));
          const shOf = (g) => sum(selProducts.filter((s) => g.cats.indexOf(s.c) >= 0).map((s) => s.sh));
          const src = rows.filter((r) => !r.total);
          const rowTot = src.map((r) => (key === 'sales' ? Math.round(raw.filter((x) => (r.merged ? r.members.indexOf(x.name) >= 0 : x.name === r.name)).reduce((a, x) => a + x.sales, 0)) : r.stock));
          const colTot = M.split(sum(rowTot), groups.map((g) => sum(g.cats.map(wOf))));
          const grid = M.split2(rowTot, colTot);
          const lines = src.map((r, i) => ({ name: r.name, merged: r.merged, members: r.members, hide: key === 'sales' && r.sales === null, cells: groups.map((g, j) => { const n = Math.round(r.n * Math.pow(shOf(g) / catF, 0.3) * 0.95); return { v: grid[i][j], n, raw: grid[i][j] }; }), sum: rowTot[i] }));
          lines.forEach((l) => l.cells.forEach((c) => { if (c.n < PV.k || l.hide) c.v = null; }));
          // 追加屏蔽：行或列中只有 1 个屏蔽单元格时，再屏蔽最小的可见单元格
          for (let it = 0; it < 6; it++) {
            let changed = false;
            lines.forEach((l) => { const m = l.cells.filter((c) => c.v === null); if (m.length === 1) { const v = l.cells.filter((c) => c.v !== null).sort((a, b) => a.raw - b.raw)[0]; if (v) { v.v = null; v.sec = true; changed = true; } } });
            groups.forEach((c, j) => { const col = lines.map((l) => l.cells[j]); const m = col.filter((x) => x.v === null); if (m.length === 1) { const v = col.filter((x) => x.v !== null).sort((a, b) => a.raw - b.raw)[0]; if (v) { v.v = null; v.sec = true; changed = true; } } });
            if (!changed) break;
          }
          cross = lines.concat([{ name: '列合计', total: true, cells: colTot.map((v) => ({ v })), sum: sum(rowTot) }]);
        }
        const isCross = cross.length > 0;
        const cellCount = isCross ? (cross.length - 1) * cols.length : rows.length * q.metrics.filter((m) => ['sales', 'stock', 'avg', 'days', 'mom', 'yoy', 'share', 'price', 'pchg'].indexOf(m) >= 0 && ((m !== 'price' && m !== 'pchg') || (one && this.priceOpen))).length;
        const maskCount = isCross ? cross.reduce((a, l) => a + l.cells.filter((c) => c.v === null).length, 0) : rows.reduce((a, r) => a + q.metrics.filter((m) => ['sales', 'stock', 'avg', 'days', 'mom', 'yoy', 'share', 'price', 'pchg'].indexOf(m) >= 0 && ((m !== 'price' && m !== 'pchg') || (one && this.priceOpen)) && r[m] === null).length, 0);
        const dim = byDim && one ? { name: one.p.name, sales: Math.round(gSales), stock: Math.round(gStock), n: Math.round(M.nOf(one.sh) * regN * brN), nScale: regN * brN, stockW: tree.leaf(one.c, one.p, one.p.bands, one.p.bandShare) } : null;
        return { dim, rows: out, dimName, days, range: [r0, r1], excluded, selCount: q.regions.length, cross, cols, rowCount: isCross ? cross.length - 1 : rows.length, cellCount: Math.max(1, cellCount), maskCount };
      },
      chartOption() {
        const rows = this.res.rows.filter((r) => !r.total);
        const isTime = this.q.rowDim === 'time';
        const o = chart.line({
          x: rows.map((r) => (r.merged ? '其他(合并)' : r.name)), yName: '销量（吨）', y2: '期末库存（吨）',
          series: [{ name: '销量', type: 'bar', data: rows.map((r) => r.sales), unit: '吨', barMaxWidth: 26, itemStyle: { borderRadius: [3, 3, 0, 0] } }, { name: '期末库存', data: rows.map((r) => r.stock), yAxisIndex: 1, unit: '吨', color: '#ff7a45', showSymbol: true, smooth: isTime }],
        });
        o.xAxis.axisLabel = { color: '#6b7787', rotate: rows.length > 12 ? 40 : 0, interval: 0 };
        o.yAxis.forEach((y) => { y.scale = false; });
        return o;
      },
      crossChartOption() {
        const lines = this.res.cross.filter((l) => !l.total);
        const o = chart.bar({ x: lines.map((l) => (l.merged ? '其他(合并)' : l.name)), stack: true, unit: '吨', series: this.res.cols.map((c, j) => ({ name: c, data: lines.map((l) => l.cells[j].v) })) });
        o.xAxis.axisLabel = { color: '#6b7787', rotate: 40, interval: 0 };
        return o;
      },
    },
    methods: {
      on(k) { return this.q.metrics.indexOf(k) >= 0; },
      tplOf(c) { return M.DIM_TPL[c.tpl]; },
      pOn(k) { return this.priceOpen && this.singleProductQ && this.on(k); },
      rowCls({ row }) { return row.total ? 'total-row' : row.merged ? 'merged-row' : ''; },
      run() {
        this.loading = true;
        if (this.f.rowDim !== 'region' && this.f.colDim === 'cat') this.f.colDim = 'metric';
        if (this.f.rowDim === 'dim' && !(this.fDim && this.fDim.open)) this.f.rowDim = 'cat';
        if (this.fDim) { const d = this.fDim; this.f.dimSeg = this.f.dimSeg.filter((b) => d.d1.bands.indexOf(b) >= 0); this.f.dimD2 = d.d2 ? this.f.dimD2.filter((b) => d.d2.bands.indexOf(b) >= 0) : []; if (!d.levels.some((l) => l.k === this.f.dimLevel)) this.f.dimLevel = d.levels[0].k; } else { this.f.dimSeg = []; this.f.dimD2 = []; }
        if (this.f.cats.filter(isSteel).length !== 1 || !this.priceOpen) this.f.metrics = this.f.metrics.filter((m) => PRICE_KEYS.indexOf(m) < 0);
        const fc = this.f.cats.filter(isSteel);
        if (fc.length && fc.every((c) => M.categories.find((x) => x.name === c[0]).geo === '省') && (this.f.grain === '日' || this.f.grain === '周')) { this.f.grain = '旬'; this.$info('所选品类最细时间粒度为旬，已按旬查询'); }
        setTimeout(() => { this.q = JSON.parse(JSON.stringify(this.f)); this.path = []; this.loading = false; }, 500);
      },
      reset() { this.f = defaults(); this.scheme = 'default'; this.run(); },
      loadScheme(k) { this.f = Object.assign(defaults(), JSON.parse(JSON.stringify(SCHEMES[k].f))); this.run(); },
      loadDim(name) { const h = M.findProd(name); this.f.cats = [[h.c.name, name]]; this.f.rowDim = 'dim'; this.f.dimLevel = ''; this.run(); },
      drill(row) { this.path = this.path.concat([row.name]); },
      drillTo(i) { this.path = this.path.slice(0, i); },
    },
  });
})();
</script>
